body:
  text: 五代會要卷七宋王溥撰論樂下周顯德六年正月樞密使王朴上疏曰臣聞禮以檢形樂以治心禮樂者聖王之大教也形體順於外心氣和於內而不治者未之有也故治定必制禮功成必作樂一人作之於上萬國化之於下政令不嚴功力不勞而天下理者禮樂也行政者禮也成禮者樂也故聖人盡心焉夫樂作於人心成聲於物聲氣既和反感於人心者也所假之物大小有數九者成數也是以黃帝吹九寸之管得黃鐘之聲為樂之端也平之清聲也倍之緩聲也三分其一以損益之相生之聲也十三變而復黃鐘聲之總數也乃命之曰十二律旋迭為均均有七調合八十四調播之於八音著之於歌頌將以奉天地事祖宗和君臣接賔客恢政教厚風俗以其功德之形容告於神明俾百代之後知邦國之所由行者也宗周而上率由斯道自秦而下旋宫聲廢洎東漢雖有太子丞鮑鄴興之亦人亡而音息無嗣續之者自漢之隋垂十代凡數百年所存者黃鐘之宫一調而已十二律中惟用七聲其餘五律謂之啞鐘蓋不用故也唐太宗有知人之明善復古道乃用祖孝孫張文收考正雅樂而旋宫八十四調復見于時在懸之器方無啞者所以知太宗之道與三五同功焉安史之亂京都為墟器之與工十不存一所用歌奏漸多紕繆逮乎黃巢之餘工器都盡購募不獲文記亦亡集官酌詳終不知其制度時有太常博士殷盈孫按周官考工記之文鑄鎛鐘十二鑄編鐘二百四十處士蕭承訓校定石磬今之在懸者是也雖有樂器之狀殊無相應之和逮夫偽梁後唐歷晉與漢皆享國不逺未暇及於禮樂至十二鎛鐘不問聲律宫商但循環而擊之編鐘編磬徒懸而已絲竹匏土僅有七聲作黃鐘之宫一調亦不和備其餘八十三調於是乎泯絶樂之缺壞無甚於今陛下天縱文武奄宅中區思復三代之風臨視樂懸親自考聼知其亡失深動上心乃命中書舍人竇儼參詳太常樂事不踰月調品八音粗加和會以臣曽學厯律宣示古今樂録令臣計論臣雖不敏敢不奉詔還依周法以秬黍校定尺度長九寸虛徑三分為黃鐘之管與見在黃鐘之聲相應以上下相生之法推之得十二律管以為象管互吹用聲不便乃作律準十三絃宫聲長九尺張絃各如黃鐘之聲以第八絃六尺設柱為林鐘第三絃八尺設柱為太簇第十絃五尺三寸四分設柱為南吕第五絃七尺一寸二分設柱為姑洗第十二絃四尺七寸五分設柱為應鐘第七絃六尺三寸三分設柱為㽔賔第二弦八尺四寸四分設柱為大吕第九絃五尺六寸三分設柱為夷則第四絃七尺五寸一分設柱為夾鐘第十一絃五尺一分設柱為無射第六絃六尺六寸六分設柱為仲吕第十二絃四尺五寸設柱為黃鐘之清聲十二聲中旋用七聲為均為均云者惟宫徴商羽角變宫變徵次焉發其均主之聲歸乎本音之律七聲迭應而不亂乃成其調均有七調聲有十二均合八十四調歌奏之曲由之出焉旋宫之聲久絶一日而補出臣獨見恐未詳悉望下中書門下集百官及內外知音者較其得失然後依調製曲八十四調曲有數百見今有者九曲而已皆謂之黃鐘之宫聲其餘六曲錯雜諸調蓋傳習之誤也唐初雖有旋宫之樂至於用曲多與禮文相違既不敢用唐為則臣又懵學獨力未能備究古今亦望集多聞知禮之士上本古典下順常道定其義理於何月行何禮合用何調曲聲數長短幾變幾成議定而製方可久長行用所補雅樂旋宫八十四調並所定尺寸所吹黃鐘管所作律凖謹並上進乃詔尚書省集百官詳議六部尚書張昭等議曰昔帝鴻氏之製樂也將以範圍天地叶和人神候八節之風聲測四時之正氣氣之清濁不可以筆授聲之善否不可以口傳故鳬氏鑄鐘伶倫截竹為律吕相生之管宫商正和之音乃備之於管絃宣之於鐘石然後覆載之情欣合隂陽之氣和同八風從律而不姦五聲成文而不亂空桑枯竹之韻足以禮神雲門大夏之容無虧觀德然月律有旋宫之法備於太師之職經秦滅學雅道凌夷漢初制氏所調唯存鼓舞旋宫十二均更用之法世莫得傳漢元帝時京房善易别音探求古義以周官均法每月更用五音乃立準調旋相為宫成六十調又以日法析為三百六十傳於樂府而編懸復舊律吕無差遭漢中微雅樂淪缺京房準法屢有言者事終不成錢樂空舉其名沈重但條其説六十律法寂寥不嗣梁武帝素精音律自造四通十二笛以敘八音又引古五正二變之音旋相為宫得八十四調與律凖所調音同數異侯景之亂其音又絶隋朝初定雅樂羣黨沮議歷載不成而沛公鄭譯因龜兹琵琶之音以應月律五正二變七調克諧旋相為宫復為八十四調工人萬寶長又減其絲數稍令古淡隋髙祖不重雅樂令儒官集議博士何妥駮奏其鄭萬所奏八十四調並廢隋代郊廟所奏唯黃鐘一均與五郊迎氣雜用㽔賔但七調而已其餘五鐘懸而不作三朝宴樂用縵樂九部迄於革命未能改更唐太宗爰命舊工祖孝孫張文收整比鄭譯寶常所均七音八十四調方得絲管並施鐘石俱奏七始之音復振四廂之韻皆調自安史亂離咸秦蕩覆崇牙樹羽之器掃地無餘戞擊搏拊之工窮年不嗣郊廟所奏何異南箕波蕩不還知音殆絶臣等竊以音之所起出自人心夔曠不能常存人事不能常泰人亡則音息世亂則樂崩若不深知禮樂之情安明制作之本臣等據樞密使王朴條奏採京房之準法練梁武之通音考鄭譯寶常之七均較孝孫文收之九變積纍黍以審其度聼音詩以測其情依權衡嘉量之前文得備數和聲之大旨施於鐘簴足洽簫韶臣等今月十九日於太常寺又命大樂令賈峻奏王朴新法教習以備禮寺施用其五郊天地宗廟社稷三廟大禮合用十三管諸調並載唐史開元禮近代常行廣順中太常卿邊蔚奉敕定前件祠祭朝會舞名樂曲歌詞寺司合有簿籍伏恐所定與新曲法調聲韻不叶請下太常寺檢詳校試若或乖舛請本寺依新法聲調别撰樂章舞曲令歌者誦習從之雅樂梁開平二年五月太常奏皇帝南郊奏慶和之樂舞崇德之舞皇帝行奏慶順之曲奠玉帛登歌奏慶平之曲太廟迎神舞開平之舞迎祖奏慶肅之曲酌獻奏慶熙之曲飲福奏慶隆之曲送文迎武舞奏慶融之曲亞獻奏慶休之曲晉天福四年十二月太常禮院奏正至王公上壽皇帝舉酒奏元同之樂飲訖殿中監受虛爵羣臣就坐再拜受酒皇帝三飲皆奏文同樂上舉食文舞奏昭德之舞武舞奏成功之舞三飲訖虛爵復於坫侍中奏禮畢羣臣再拜奏大同㽔賔之鐘皇帝降坐百僚旋退其月又奏宫懸歌舞未全請雜用九部雅歌教坊法曲從之漢髙受命之年九月吏部侍郎判守太常寺張昭奏昔周公相成王制禮作樂殿庭遍奏六代之舞所謂雲門大咸大韶大夏大濩大武也周室既衰諸樂皆廢惟大韶大武二曲存焉秦漢已來名為二舞文舞韶也武舞武也漢時改為文始五行之舞歷代因而不改正觀作樂之時祖孝孫改隋文舞為治康之舞武舞為凱安之舞又有秦王破陳樂功成慶善樂二舞樂府亦用為二舞是舞有四焉前朝行用年深不可遽廢今且改其名如左祖孝孫所定二舞名文舞曰治康之舞今改為治安之舞武舞曰凱安之舞今改為報德之舞正觀中二舞名文舞㓛成慶善樂前朝名為九㓛舞今改為觀象之舞秦王破陳樂前朝名為七德舞今改為講功之舞其治安報德二舞請依舊郊廟行用以文舞降神武舞逆神其觀象講㓛二舞依舊宴會行用昔周奏六代之樂即今二舞是也賓祭常用别有九夏之樂即肆夏皇夏等是也梁武帝改九夏為十二雅前朝祖孝孫改雅為和示不相沿也今改和為成取韶樂九成之意也十二成樂曲名祭天神奏豫和今改為禋成之樂祭地祗奏順和今改為順成之樂祭宗廟奏永和今改為裕成之樂祭天地宗廟登歌奏肅和今改為肅成之樂皇帝臨軒奏太和今改為政成之樂王公出入奏舒和今改為弼成之樂皇帝食舉及飲燕奏舒和今改為德成之樂皇帝受朝皇后入宫奏正和今改為扆成之樂皇太子軒懸出入奏承和今改為允成之樂正至皇帝禮會登歌奏昭和今改為慶成之樂郊廟爼入奏雍和今改為騂成之樂皇帝祭享酌獻讀祝文及飲福受胙奏壽和今改為壽成之樂祖孝孫元奏十二和曲開元中又曲奏三和遂有十五和之名梁置十二律蓋取十二天之成數契八音十二律之變輒益三和有乖稽古又緣祠祭所用不可盡去今取其一焉祭孔宣父齊太公廟降神奏宣和今改為師雅之樂三公升殿會訖降階履行奏諴和今廢同用弼成之樂享先農藉田奏豐和今廢同用順成之樂已上四舞十二成雅樂名皇帝正至受朝賀用樂次第冬仗公卿入奏弼成之曲皇帝坐奏政成之曲正仗與冬同公卿獻奏夀成之曲正仗與冬同皇帝舉爵奏德成之曲正仗與冬同皇帝興奏政成之曲正仗與冬同羣臣會畢降階奏弼成之曲正仗與冬同公卿出奏弼成之曲正仗與冬同皇帝享太廟用樂次第降神用文舞奏裕成之樂九變亦黃鐘宫二變太再變大吕角應鐘再變應原闕羽再變皇帝行奏政成之曲用黃鐘羽登歌酌獻奏肅成之曲用黃鐘羽迎爼奏騂成之曲用黃鐘羽皇帝飲福奏夀成之樂三舞送文舞出迎武舞入奏弼成之曲武舞奏報德之曲徹爼送神奏裕成之曲皇帝南郊用樂次第降神用文舞奏禋成之樂六變皇帝行奏政成之曲登歌奠玉帛奏肅成之曲迎爼奏騂成之曲皇帝初獻奏夀成之曲亞獻終獻同奏夀成之曲皇帝飲福奏夀成之曲送文舞出迎武舞入奏弼成之曲武舞奏報德之曲送神奏裕成之曲皇帝祫享太廟用樂次第降神用文舞奏裕成之樂九變黃鐘奏大吕宫三奏再奏大吕㽔徽再奏應鐘羽奏再原闕酌獻奏肅成之曲爼入奏騂成之曲奠獻饋食奏本室之曲用本室之祠同太廟奠獻次第皇帝飲福奏夀成之曲送文舞出迎武舞入奏弼成之曲武舞奏報德之曲送神奏裕成之曲皇帝祀地祇用樂次第降神用文舞奏順成之樂八變皇帝行奏政成之曲登歌奠玉幣奏肅成之曲爼入奏騂成之曲武舞奏報德之舞送神奏順成之曲皇帝用禪用樂次第降神用文舞奏禋成之曲皇帝行奏政成之曲俎入奏騂成之曲登歌奠玉幣奏肅成之曲酌獻飲福同奏夀成之曲送文舞出迎武舞入奏弼成之曲武舞奏報德之舞送神奏禋成之曲皇帝祭太社用樂次第祭先農藉田蠟百神用樂同降神用文舞奏順成之樂八變皇帝行奏政成之曲登歌奠玉幣奏肅成之曲爼入奏騂成之曲酌獻飲福同奏夀成之曲送文舞出迎武舞入奏弼成之曲武舞奏報德之曲迎神奏順成之曲皇帝孟夏雩祀於南郊迎氣祭五常朝日夕月用樂次第降神奏禋成之曲皇帝行奏政成之曲登歌奠玉幣奏肅成之曲爼入奏騂成之曲酌獻飲福同奏夀成之曲送文舞出迎武舞入奏弼成之曲武舞奏報德之舞送神奏禋成之曲皇后季夏祀先蠶躬桑用樂次第降神奏裕成之曲三變皇后行奏扆成之曲皇后酌獻奠幣登歌奏肅成之曲送神奏裕成之曲皇后採桑奏扆成之曲皇太子釋奠孔宣父廟用樂次第降神用文舞奏師雅之樂三變太子行奏允成之曲登歌奠玉幣奏肅成之曲爼入奏騂成之曲送文舞出迎武舞入奏弼成之曲武舞奏報德之舞送神奏師雅之曲周廣順元年八月太常卿邉蔚奏前朝改祖孝孫所定二舞文舞曰治安之舞武舞曰報德之舞今改治安為政和之舞報德為善勝之舞前朝改正觀中二舞文舞曰觀象之舞武舞曰講功之舞今改觀象為崇德之舞講功為象成之舞又議改十二成為十二順樂曲祭天神奏禋成今改為昭順之樂祭地祇奏順成今改為寧順之樂祭宗廟奏裕成今改為肅順之樂祭天地宗廟奏肅成今改為感順之樂皇帝臨軒奏政成今改為治順之樂王公出入奏弼成今改為忠順之樂皇帝食舉奏德成今改為康順之樂皇帝受朝皇后入宫奏扆成今改為雍順之樂皇太子軒懸出入奏允成今改為溫順之樂正至皇帝禮會登歌奏慶成今改為禮順之樂郊廟俎入奏騂成今改為禋順之樂皇帝祭享酌獻讀祝文及飲福受胙奏夀成今改為福順之樂梁武帝改九夏為十二雅以協陽律隂吕十二管旋宫之義祖孝孫改為十二和開元中乃益三和前朝去和改一雅今名既異時作宜稽古當去雅只用十二順之曲祭孔宣父齊太公廟降神奏師雅今同用禮順之樂三公升殿會訖降階履行同用弼成今同用忠順之樂享先農及藉田同用順成今同用寧順之樂皇帝正至受朝賀用樂冬仗同公卿入奏忠順之曲冬仗同皇帝坐奏治順之曲冬仗同公卿獻夀奏福順之曲冬仗同皇帝舉爵奏康順之曲冬仗同羣臣會畢降階奏忠順之曲冬仗同公卿出奏忠順之曲冬仗同皇帝謁太廟用文舞奏肅順之曲皇帝行奏治順之曲登歌酌獻奏感順之曲迎俎奏禋順之曲皇帝飲福奏福順之曲送文舞出迎武舞入文舞奏忠順之曲武舞奏善勝之曲徹俎奏肅順之曲皇帝南郊大禮降神用文舞奏昭順之曲皇帝行奏治順之曲登歌奠玉幣奏感順之曲迎俎奏禋順之曲皇帝初獻奏福順之曲亞獻終獻同奏禮順之曲皇帝飲福奏福順之曲送文舞出迎武舞入文舞奏忠順之曲武舞奏善勝之曲送神奏昭順之曲廟樂梁肅祖宣元皇帝廟室酌獻舞大合之舞敬祖光獻皇帝廟室酌獻舞象功之舞憲祖昭武皇帝廟室酌獻舞來儀之舞烈祖文穆皇帝廟室酌獻舞昭德之舞登歌樂章各一首太常少卿楊煥撰後唐莊宗光聖神閔孝皇帝廟室酌獻舞武成之舞登歌樂章各一首尚書兵部侍郎崔居儉撰明宗聖德和武欽孝皇帝廟室酌獻舞雍熙之舞登歌樂章一首太常卿盧文紀撰晉髙祖聖文章武明德孝皇帝廟室酌獻舞咸和之舞登歌樂章一首太子賓客判太常寺事趙光輔撰漢文祖明皇帝廟室酌獻舞靈長之舞德祖恭僖皇帝廟室酌獻舞積善之舞翼祖昭憲皇帝廟室酌獻舞顯仁之舞顯祖章聖皇帝廟室酌獻舞章慶之舞登歌樂章共四首太常卿張昭撰漢髙祖睿文聖武昭肅孝皇帝廟室酌獻舞觀德之舞登歌樂章一首周信祖睿和皇帝廟室酌獻舞肅雍之舞僖祖明憲皇帝廟室酌獻舞章德之舞義祖翼順皇帝廟室酌獻舞善慶之舞慶祖章肅皇帝廟室酌獻舞觀成之舞登歌樂章各一首太祖神聖恭肅文武孝皇帝廟室酌獻舞明德之舞登歌樂章一首太常卿田敏撰世宗睿武孝文皇帝廟室酌獻舞定功之舞登歌樂章一首翰林學士中書舍人判太常寺事竇儼撰雜録後唐長興三年九月宴于長春殿教坊進新曲賜名長興樂晉開運二年八月中書舍人陶穀奏臣前任太常少卿伏見本寺見管教坊二舞大户州縣居士若不盡免差徭無緣投名鼓舞况正殿會朝已久停廢其見管人數等每有淪亡皆擬填補既不曽教習但虛免差徭伏乞且議停廢飭樂工宜令教習舞節權且停廢其年十一月太常丞劉渙奏當寺全少樂工或正冬朝會郊廟行禮徒差京府衙門首樂官權充雖曽教習未免生疏兼又改業胡部音聲不間太常歌曲伏乞宣下所司量支請給據見闕樂師添召令在寺習樂敕太常見管兩京雅樂節級樂工共四十人外更添六十人內三十八人宜抽教坊貼部樂官兼先餘二十二人宜令本寺照名充填仍令三司定支春冬衣糧月報聞奏其舊管四十人亦量添請五代會要卷七
