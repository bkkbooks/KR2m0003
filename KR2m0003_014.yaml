body:
  text: 五代㑹要卷十四宋王溥撰尚書省後唐天成元年七月二十七日尚書省准堂帖應內外帶職除官自三公至郎官合納禮錢送尚書省都司具舊例如左檢校師太尉舊例各合納錢四十千准蠲減外今各合納錢二十千檢校太傅太保舊例各納三十千减外今納十五千檢校司徒司空舊例各納二十千减外今納錢一十千檢校僕射尚書舊例各納一十五千减外今納七千檢校郎中員外郎舊例各納錢一十千减外今納三千四百敕㑹府華資皇朝寵秩凡霑新命合納禮錢爰自近年全隳舊例方當提舉宜振規繩其間除翊衛勛庸藩垣將佐自軍功遷陟外其餘自不帶平章事節度使及防禦團練刺史諸道副使判官以下三司職掌監院官縣令録事參軍判官等凡關此例並可徴納其檢校官自員外郎至左僕射祗取初轉一任納錢若未改呼不更徴納仍委尚書省都司逐月具數申中書門下尚書令梁開平三年三月升為正一品左右僕射後唐天成二年八月中書門下奏據新授尚書左僕射李琪狀准舊例上事日合有恩賜百官酒食具載開元禮文者尋下太常禮院檢開元禮祇有從太師已下至六部尚書太常卿太子詹事諸衛大將軍京兆河南牧上州刺史受册拜廟各就本司禮上無中書門下送上之文亦無恩賜酒食之事又檢禮閣新儀並不載諸品大臣上事禮例唯僕射初上見羣寮輕重之禮惟元和六年御史中丞竇易直奏七年尚書左丞段平仲奏太和四年中書奏覆下太常禮院並尚書省詳議終未能定大凡禮上為領本司公事及與官寮相㑹並受人吏參賀內外無異前後皆同李琪尋㑹羣僚不稱新授已領公事已請料錢更引上儀即非通制今請李琪任便赴省發遣公事今後文武兩班受恩命者不計髙卑未領事不得擅落新授字及便請料錢內廷學士中書舍人不在此限從之長興四年十一月新授尚書右僕射盧質奏臣忝除官合赴省上若准舊例左右僕射上事儀注所費極多欲從權務簡祗取尚書丞郎上事例止集南省屬僚及兩省官送上亦不敢輒援往例有費官中自量力排比兼不敢自臣隳廢舊規他時任行舊制從之左右丞梁開平二年四月改為左右司侍郎避廟諱也至後唐同光元年十一月復舊為左右丞後唐長興元年九月升尚書右丞官品與尚書左丞並為正四品吏部後唐同光二年正月中書門下奏准本朝故事如封建諸王內命婦及宰相翰林學士中書舍人諸道節度觀察團練防禦留後即中書帖吏部官告院索綾紙褾軸下所司修寫印署畢進入內宣賜其文武兩班並諸道官員及奏薦將校敕下後並合呈本道進奏院或本人自於所司送納朱膠綾紙價錢各請出給今後請除內司大官並侍衛及賞軍功將校轉官外並請官中不給告敕從之三年正月敕吏部今後特恩授官侍衛軍功改轉內庭諸司帶職外來進奏受官綾紙並宜官給舊例朱膠一切停廢禮錢亦不徴取又慮所司人吏不辦食直糧課逐月兩司各支錢四十千至於臺省禮錢宜特蠲减比舊數五分許徴一分其特恩已下不得徴納禮錢仍令中書門下條流敕畫經過諸司不得停滯其官告若是宣㫖除授及品秩合進呈者准例進內餘並送納中書門下勘檢給付敕畫到本司十道已上官告限三日內即署三十通已上限五日五十通已上中書門下與限催促如臨時緩急宣賜不拘此限天成元年七月中書奏近奉宣㫖使府判官州縣官告身敕牒今後據通數進納仍令祇候宣賜者舊例朝廷命官除將相外並不宣賜官告因僞朝條流凡准宣授官即特恩頒賜今使府判官皆許本道奏請或聞多在京師至於令録悉是放敕後本官自於吏部出給告赤中書不便管係臣等商量自兩使判官州縣令録在京除授即望令於內殿謝官便辭赴任不更進納官告其判司主簿不合更許朝對敕下後望准舊例處分從之二年四月二十四日敕兵吏部應出給書寫印署官告其本曹郎中令自今後於本官幕次當直候知印宰相當制舍人出後即歸人吏並勒隨本官祗候仍下度支逐日量破食料其本行尚書侍郎左右丞等每日赴朝遇行敕旋即印署發遣免至公事淹延三年十一月吏部奏流外官今後祗考年勞乞不試判從之四年十一月敕今後應是官告除准宣破外其陳乞除官並追封追贈叙封進封官告及舉人各集綾紙羅褾軸錦袋等宜令並與官破仍勒各隨色樣尺寸如法裝修疾速書寫印署進納其月敕應諸道州府令録等官告敕牒元是中書進納入內令閣門宣賜其判司主簿官告舊是所司發遣受恩後令赴本任地理遠近各有程限比候進納恐有停滯况綾紙褾軸價錢近已官破今後所除州縣官告身敕牒宜令中書門下指揮不要進納並委宰臣當面給付長興二年閏五月十九日吏部狀奏當司制敕甲庫專知官一例近停廢者伏緑當司主掌制敕甲庫與三庫不同常日檢尋諸司取證稍有差謬所失非輕無人主持必虞敗闕今欲於吏部令史內選差一員勾當又緣公事至重仍遣别不執行他事兼乞除本役外特與减二年勞考者奉敕宜依其中書省門下省兵部甲庫公事亦准此司封後唐同光二年九月二十八日奏當司奉今年三月二十八日敕內外文武官母妻可據品秩髙卑封邑號者當司檢㑹舊起請叙封條貫如後一准舊條應內外文武及致仕官母妻叙封進封邑號者或遇特敕别加奬封外其餘官據官階齊五品母為縣太君妻為縣君官階齊四品進封母為郡太君妻為郡君官階齊三品母進封為郡太夫人妻為郡夫人如未經封邑雖位至三品亦以從初而叙近年多於所司陳狀便請依官品叙封既非特敕恐失舊規其所謂准例封並請依格條施行一准舊例應外任其上州刺史或帶使額抑督府在京諸軍衛將軍小將軍已上初任聽准例各與母妻依品第叙封其東宮雜五品初任升朝並中下州刺史並許至第二任叙封如自班行及遙郡除授中下州刺史者已同兩郡許聽叙其他並請准例一諸道節度副使節察兩使判官先准起請節文如曾任五品已上升朝官聽叙封緣帶使職不合與諸色帶職官同列自今後如全未經封者許與母妻一度封叙邑號仍須官階合格如更除授歸班官領郡符即許進封如守職就加官階不在進封之限今又伏見諸道有奏置行軍司馬並參謀者其職位實在副倅之上自此是曾任升朝官並刺史者亦請節度副使兩使判官例處分一前資官請與母妻封進邑號或多積歲或曾經殿纍停替皆妄有申請當司請各立年限其邑號得替後一年內聽叙一年外並殿纍未改頭銜並不在申請之限一應諸色官請與母妻叙封邑號者竊緣先有文武官授官敕申並先封邑號敕申纍經散失無慿檢詳近者多是身在他處守官於所司投下公狀則削去見在頭銜却稱前任官品若當司便與申奏則敕下後所給告牒年月不同自此請准前後起請節文如省司失墜敕申者京官引驗本官告身敕牒及母妻前封邑號告身敕牒如因失墜即磨勘歷任如官序顯著參詳並封不虛即取登朝官三員充保仍須結罪使印方與進封如是曾任節度觀察團練經略防禦刺史等則責本道進奏知後院狀入案刺史無知後院即取使府進奏官狀並准京官例取登朝官三員充保其五府少尹左右司馬外道帶職官等若自班行除授即准京官例檢勘若自本道奏薦即准節度使已下至刺史取進奏官狀詳驗如無保狀具歷任經堂陳述候裁下㸃檢訖即却勒從初封叙如進擬後再勘及有人糾告稱官階及前封邑號謬妄並在官雜帶職官違礙條格亦自落職名請叙封者其本官具名銜申奏其陳狀勾當人申堂取裁其諸色官並各守條限指揮其勾當人如與外州府刺史諸色官勾當者即須係外州府職名其所通狀仍須具鄉貫兼取本道進奏官連署識認使本道進奏院印方可施行如是京官下勾當人不係見任前資並須是本任官司局人吏勾當仍於狀內分明豎出某司印兼委本行令史署保如違格條不在施行之限一應升朝並諸州刺史左右司馬五府少尹凡與母妻封邑號事其中或有進奏官勾當人才敕下便經省陳乞封叙當司若便施行又慮却有追改稍或逗撓即緣恩命已行官階合格前後起請節文未曾條制自今後京官或身在京除授外官者並在外除授或帶職或諸道奏薦受官階品職銜合格者不係四品五品已上候印給告身畢日將至當司引驗方許據狀封叙一應諸色官階合格後却授陵臺令州縣官或帶諸雜散職或授場監職銜有礙格條者却即引前任階銜論若一例施行恐紊條式自此後須待再授官階相當即許叙使不在以見任不合格例官銜請論進擬之限一准舊例應諸衛小將軍上中下等州刺史都督使額母妻封至郡君若止檢校官或階爵至三品亦不在論請進封之限如是防禦團練經略等使已上階至三品許至郡夫人郡太夫人其餘諸色官並請各循元格階品一准舊條應外任除五府少尹諸州刺史封叙外其左右司馬與長史别駕一例釐革不許封叙自後諸道論請不絶今勘㑹大都督左右司馬與五府少尹資序不殊自今後請准五府少尹例特許叙封仍須檢勘出身不礙正條方與聞奏餘並依元起請條流一准往例諸道上州司馬陵臺令率府諸衛郎將中郎將司天五官正雖是五品並不在封叙之限其大理正先有起請不許緣是次對官即與五正不同今請同諸五品例施行一諸色官請與母妻進封邑號准舊例若遇改官加階爵或加檢校官者勒勾當人於狀內豎出所加官轉階年月當司檢勘不虛即與進封如不遇改官轉階不在進封之限一文武官封王爵邑加實封准舊例合司封印給敕牒告身自離亂已來兵吏部多錯誤印給若是因檢校官加階或因除正官便封爵邑加實封者便以文為首即合兵吏部印給如回封爵邑實封或封王事在司封印給請准例處分一文武常朝官初請與母妻封邑經都省發狀後當司驗本官告身敕牒伏緣近日多不便出告身遂致無慿引證自此除當司檢兵吏部申庫勘授官年月日敕頭外請許通納前任告身或兩司料錢厯子分明不虛并子案牒送門下省許驗申奏一當司所給公王封爵承襲告身如帶同中書門下使色背金花綾紙如節察不帶使相者白背金花綾羅紙已下諸官並使白綾紙其追封并邑號則不係品位髙卑並使色背金花羅紙其紙面除內出翰林修寫告身外不得輒畫龍鳳又除堂封送到書及國夫人已下叙封告身外當司所給諸色官員告牒焚黃等諸選定書寫吏人並所供綾羅紙三人各録姓名入案及給牒知使省號印子為驗責免參雜敕宜依長興二年十月敕在朝臣寮及藩侯郡守據禮例合追贈者新授命後便於所司投狀旋與施行自中興以來外官曽任朝班據在朝時品秩格例合得封贈叙封未霑恩命者並與施行其叙封妻室品廕子孫仍令所司一一具格式申奏其或應得而不與應不得而與之罪在所司晉天福二年四月中書門下奏准二月二十六日敕內外臣寮亡父母祖父母據品秩未封贈者與封贈已封贈三代更加恩命按舊制一品官亡父已上三代約其子官品約降一等亡母追封國號祖母已上第降一等敕其內外准敕合與三代已下封贈者並以現居官品比擬不得第降付中書門下准此其年十二月𠡠應內外文武臣寮父母在如子品秩及格各與加恩若在朝列者父與致仕官母與叙封郡邑號其外四品已上節度團練防禦使刺史父與致仕官其餘與同正官母與叙封郡邑封如內外官父已有致仕官及同正官母已曽叙封子品髙者更與加進如父有職官者不在此限餘准格文處分漢天福十二年九月尚書司封奏當司合行事件如後皇太后三代祖母並追封國太夫人皇太子三代外祖母宗室郡國王曽亡母亦追封國太夫人中書門下二品及平章事在朝正一品官使相曽祖母祖母亡並追封國太夫人如母在叙母為國太夫人妻為國夫人已上並在中書施行東宫一品尚書省二品不帶平章事留守節度使祖母並許追封郡太夫人止如母在叙封母為郡太夫人妻為郡夫人止如曽任皇朝將相已經追封三代祖父母及已封國太夫人者依舊施行東宫二品西班二品尚書省三品御史大夫中書門下侍郎太常卿亡母並追封郡太夫人止如母在叙封為郡太夫人妻為夫人止如任皇朝將相已經追封三代兩代祖父母及已封國太夫人者依舊施行母應致仕官如未致仕日曽任五品以上正官原闕封者與據品秩施行嫡母正室即許封叙如非嫡及正室不在論請封叙之限應諸色官請與母妻叙封須候官階齊即得如官及所封官階並許施行敕從之乾祐元年二月二十九日敕應文武內外官員有父母見在合得加恩叙封者不在官階品齊但見居官品合與父加恩母叙封進封者便與施行餘准前𠡠其年七月三日尚書省奏准赦書節文在朝文武臣僚父母在者並與追封內有父在見任官母合叙封否中書帖吏部廢置司令具新舊𠡠例父在見守官得承子廕加恩及父在母叙封追封合加太字事例申上吏部廢置司以前後格敕內祗言父母許與加恩即不說父在見守官及前任得承子廕加恩例司封以檢詳前後敕例凡母皆加太字存沒並同即不說父在不加太字近例有中書舍人艾穎於天福五年十二月任殿中侍御史父在繼母李封縣君不加太字尚書司門郎中尹拙天福八年三月任尚書倉部貟外郎父在母宋封縣君不加太字奉敕應內外臣寮如父准恩𠡠合承子廕加恩者父未曽有官即量與致仕官見任亦自該恩赦又難用子廕如已去任願授致仕官者亦可施行即不得就加恩命其父在母承子廕叙封追封合加太字與不合加雖有艾穎尹拙近例恐是一時特恩别無𠡠例宜令尚書省集議奏聞永為常式尚書省奏議曰臣等詳本司前後敕條凡母皆加太字存沒並同此即是父沒母存即叙封追封內加太字母沒追封亦加太字故云存沒並同若是父在據敕格不載為母加太字之文若以近敕因子貴與父命官父自有官即妻從夫品可以封妻父在不合以其子廕加母太字若雖有因子之官其品尚卑未得廕妻叙封亦不合用子廕之限從之司勛後唐天成三年五月十九日敕近代已來文武官階稍髙便授柱國嵗月未深便轉上柱國武資初官便授上柱國官爵非無次第階勛備有等差宜自此時重循舊制今後加勛先自武騎尉絰十二轉仍永為常式清泰元年八月尚書司勛郎李盈休奏近日朝廷凡初叙勛便至柱國臣伏見本朝位至宰輔藩鎮其勛皆從初叙蓋欲承人揚歷功用之重也勛格自武騎尉七品至柱國正二品凡十二轉令從羣官得叙封者並請自武騎尉依次從之五代㑹要卷十四
