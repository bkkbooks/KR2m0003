body:
  text: 五代㑹要卷六宋王溥撰開延英儀内中有公事商量即降宣頭付閤門開延英閤門翻宣由中書并牓正衙門如中書有公事敷奏即宰臣入牓子奏請開延英祇是宰臣赴對閤門使奏宰臣某已下延英候對宣徽使殿上宣通次閤門使奏中書門下到次宣徽使喚次閤門使傳聲喚次通事舍人引宰臣當殿立班贊兩拜搢笏舞蹈又三拜奏聖躬萬福又両拜金口宣上來又兩拜通事舍人引上殿至御座前又両拜問聖體皇帝宣安又两拜三呼萬嵗各分班案前立兩樞密使在御榻両面祇候其餘臣僚並約近外次奏事訖宣賜茶又兩拜三呼萬嵗賜座喫茶對訖下殿兩拜宣賜酒食舞蹈謝恩訖宣徽使喝好去就中書喫食延英畢次両省官轉對閤門使當殿奏某已下轉對宣徽使殿上宣通次閤門使奏某已下到次宣徽使喚次閣門使傳聲喚次通事舍人引當殿立定贊両拜搢笏舞蹈又三拜奏聖躬萬福又兩拜殿下奏事訖宣賜酒食又両拜舞蹈謝訖閤門使喝好去南班揖殿出於客省就食次對官御史中丞三司使京兆尹並各奏所司公事次閤門使奏某祗候次對宣徽使殿上宣通次閤門使奏某到次宣徽使喚次閤門使傳聲喚次通事舍人引當殿立定贊両拜搢笏舞蹈三呼萬嵗又三拜訖奏聖躬萬福又兩拜奏所司公事宣賜酒食又両拜舞蹈謝訖閤門使喝好去南班揖殿出於客省就食合赴延英中謝官文武兩班三品及御史中丞左右丞諸行侍郎諫議給事中書舍人並諸道節度觀察防禦團練使刺使兩縣令皆入謝並通喚文武四品以下及諸道行軍司馬節度副使兩使判官書記支使推巡令錄等舊例並不對敭申謝祇於正衙朝謝常朝梁正明中中書門下奏文武常叅官自今月日連三日常朝訖先准宣㫖每三日後放一日朝叅者右臣等商量望准進止放今月日朝叅已便宣行訖檢年月日不獲後唐同光元年十二月中書門下奏毎日常拜百官皆拜獨兩省官不拜准本朝故事朝退於廊下賜食謂之廊餐百官遂有謝食拜唯两省官本省有厨不赴廊餐故不拜伏自僖宗幸蜀迴以多事之後遂廢廊餐百官拜儀至今未改将四十載禮恐難停惟兩省官獨尚不拜豈可終日趨朝曾不一拜獨於班列有所異同若言官是近臣於禮尤宜肅謹起今後逐日常朝宣不坐除職事官押班不拜外其両省官與東西班並齊拜從之天成元年正一作五月十九日𠡠夲朝舊日趨朝官置待漏院候子城門開便入立班如遇不坐前一日晩便宣來日兩衙不坐其日纔明閤門立班便宣不坐百官各退歸司近年以來雖遇不坐正殿或是延英對宰臣或是内殿親决機務所司不循舊制往往及辰已之時尚未放班既日色已髙致人心咸倦今後若遇不坐日未御内殿前便令閤門使宣不坐放朝退班三年十二月中書門下奏逐日常朝宣奉勅不坐兩省官與東西兩班並拜押官宰臣不拜或聞班行所論承前日有廊餐百官謝食兩省即各有常厨從來不拜或云侍臣不拜檢尋故實不見明規百寮拜為有廊餐即承㫖合宣有𠡠賜食供奉官不拜亦恐非儀且左右前後之臣日面天顔豈可不拜臣等商量今後朝臣押班宰臣亦拜通事舍人亦拜閣門外放仗亦拜從之晉開運元年十一月尚書吏部侍郎張昭逺奏文武常参官日於正衙立班閤門使宣不坐後百僚俱拜舊制惟押班宰相押班御史通事舍人各縁提舉賛揚所以不隨庶官俱拜自唐天成末議者不悉朝儀遽違舊制遂令押班之職一例折腰此則深忽禮文殊乖故實且宰臣居庶僚之首御史持百職之綱嚴肅禁庭糾繩班列慮於拜揖之際或爽進退之儀於是凝立静觀檢其去就若令旅拜旅揖實恐非宜况事宜酌中恭須近禮人臣愛主不在於斯其通事舍人職司贊導比者両班進退皆相其儀今則在文班武班之前居一品二品之上端笏齊拜禮實未聞其押班宰相押班御史通事舍人並請依天成三年以前禮例施行殿中侍御史賈元珪奏除押班御史通事舍人請依張昭逺奏其宰臣押班請依舊設拜從之廊下餐後唐天成元年正月詔每月朔望日賜百官廊下餐唐室升平日常叅官每月朝退賜食謂之廊下餐自乾符亂離之後祇遇月旦朔日入閤日賜上初即位命百官五日一起居李琪以為非故事請罷之惟每月朔望日入閤賜食至是宣㫖朔望入閤外依舊五日一起居遂為定式二年四月御史臺奏今月三日廊下餐百官並坐兩省方來自五品以下輒起𠡠每赴廊餐如對御宴若行私禮是失朝儀宜各罰半月俸長興三年五月詔文武兩班每遇入閤賜食從前御史臺省及諸朝官皆在敷政門外両廊食唯北省官於敷政門内别坐既為隔門各不相見致行坐不齊難於肅整今後每遇入閤賜食北省官亦宜令於敷政門外東廊下設席以北首為首待班齊就坐晉天福二年正月御史臺奏唐朝令式南衙常叅官文武百官每日朝退於廊下賜食自唐末亂離常食漸廢仍於入閤起居日賜食每入閤禮畢閤門宣放仗羣官俱拜謂之謝食至清泰年中入閤禮畢更差中使至正衙門口宣賜食百官並立班重謝交失本根今後入閣賜食望不差中使口宣從之其年四月御史臺奏文武百官每月朔望入閤禮畢賜廊下食在京時祇於廟堂幕次兩廊下今在行朝於正衙門外權為幕次房廊隘狭伏恐五日一朝㑹禮畢准例賜食於幕次難為排比伏見唐明宗時兩省官於文明殿前廊下賜食今未審入閣日權於正衙門内兩廊下排比賜食為復别有處分𠡠宜依明宗時舊規廊下賜食周顯徳四年正月詔曰文武百僚起今後每遇入閤日賜食廊下輟朝梁中書門下奏請輟朝牓子檢年月不獲某官薨㳄日入状賜官右臣等商量請輟今月某日朝已便宣行謹錄奏聞謹奏如是輟朝兼放宣勅並下御史臺乾化元年正一作五月清海軍節度使守侍中兼中書令劉隐薨輟朝三日百僚請閣門奉慰後唐天成元年十二月中書門下奏太常禮院状追冊四廟雖不載文請輟三日朝叅從之晉天福三年正月前興元節度使張筠薨太常禮院申准故事前節度使無禮例輟朝𠡠宜特輟一日朝叅雜錄後唐同光二年正月四日四方館奏常朝諸職員多有參雜今後除隨駕将校外凡進奉使文武兩班三品已上官可於内殿對見其餘並詣正衙以申常禮從之天成元年八月御史臺奏凡新除官及差使者合於正衙謝辭每遇正殿起居日百官不於正衙序班致差使及新除官辭謝不得或恐差使者已定發日除宣催發以一日無班便妨辭謝臣今叅詳每内殿起居日百僚先序班於文明殿庭候辭謝官退則班入内殿從之其年十二月三日御史臺奏為論每日常朝及五日起居事件如後一常朝辭謝官合在南班候閤門宣放朝叅與百官同拜若遇入閤敷政門外序班百官雖不拜亦因傳宣喚仗南班以此節奏便展拜儀今伏見每遇内殿起居日先於常殿前序班百官雖不設拜祗候宰臣到便依次第入閣門祇候起居固不便傳宣命若有南班辭謝稍似非宜伏請自今後其日不許辭謝皆令次日便有常朝班即得辭謝若遇急切公務即請准舊例令隔門辭或於祇候宣放其文武兩班不更於文明殿前序立祇於中興殿門外序立祇候宰臣到便依次第入起居伏准故事常叅官每日趨朝非准格令不得無故請假如或實有疾病為衆所知損後未朝叅閤不得私行人事若是除轉新官𠡠下後未正衙謝間並不得行私禮及先到宰臣家如違准故事舉勘如更有臨公事託故請假必申中書門下取裁此後如有小小事故請假一月内不得過三度若過三度一日両日即書罰三日不到即申中書門下請具聞奏已條流知班驅使官兩巡仍不得輒受囑託句班若遇祁寒暑雨特放即繫在聖恩伏准故事吏部選限自貞觀八年唐皎為吏部侍郎以選人稍衆奏請以冬初大集季春而畢今縁選人未多免朝合約新定條格伏請南曹郎官自鏁曺前五日免朝三日銓自鏁銓前五日免朝至三月三十日若遇入閤及起居内宴横行叅假追朝御樓御殿謝賀行香閣門班中書班城外班衆集並須准例祇候如或一度兩度不到書罰三度不到申中書門下請具奏聞其餘並不得無故入班一應免朝官三司繫職并両縣徴科内除免常朝外並請官吏部銓曹免朝官例祇候如或不到准前書罰奉𠡠盧文紀自領憲綱頗思振舉備觀條奏皆叶通規李琪以内殿起居不廢辭謝並恐留滯乃是權宜盧文紀以正衙序班恐隳故事請候次日亦可允依所請三銓免朝事繫䌓省選人既少公務非多宜且依請奏銓鏁前五日免朝将來人數漸多湏容㸃檢即許開曹後免朝永以為例三年十一月十一日中書舍人劉贊奏往例應諸道節度使兩班大僚凡對明庭例合通喚近日全廢此儀伏乞特詔所司重定向來格例若合通喚准舊施行中書帖四方館令具事例分析申上據状稱舊例節度使新除中謝及罷任赴闕朝見合得通喚文班三品已上官武班二品已上官新除中謝及使回朝見亦合得通喚從之四年正月十七日中書門下奏准往例起居補闕拾遺御史郎中員外郎少卿監國子司業已下每加新命祇於正衙謝後便常朝竊見邊逺令錄尚自對敡班行臣寮並宜中謝今後凡升朝官望並令中謝從之長興二年十二月七日𠡠前任節度防禦團練使刺使今後免逐日常朝宜令五日隨例起居四年四月九日𠡠御史臺刑部大理寺官員遇有公事推勘詳㫁時宜與免朝叅兼不得私行人事若無公事即依㝷常赴朝清泰三年三月閤門奏列内外官吏對見例應諸州差判官軍将貢奉到闕無例朝見以名銜奏放門見賜酒食得迴詔進牓子放門辭臣今後欲祇令朝見餘依舊規應諸道兩使判官推官巡官無例中謝奏遇放辭謝如得替歸京無例朝見臣欲今後除兩使判官許中謝門辭其書記已下新除授及得替並依舊規應文武朝官除授文五品武四品已上並中謝已下無例對謝次天成四年正月勅凡升朝官新授並中謝欲准此例應諸道節度使差判官軍將進奉到闕朝見得迴詔下牓子奏過令門辭應諸道都押衙馬歩都虞侯鎮将得替到京無例見或在京授任無例中謝進牓子放辭謝應諸道商税鹽麵諸色務官在京差補亦放辭謝得替歸京亦無見例在京商稅鹽麴兩軍巡使即許中謝應新除令錄並中謝次日放門辭兼有只宣誡勵應文武兩班差弔祭使及告廟祠祭祇於正衙辭見不赴内殿諸道差進奏官到闕得見後請假得替進牓子放門辭已前六件望准舊例施行從之晉天福五年正月宰臣馮道奏宰臣朝見辭謝在廟堂横衙之南及至餘官即悉於崇元殿門内此葢事因偶爾習以為常又入閤禮畢之時羣官退於門外定班如初候宣放伏惟翰林學士前任郡守等不隨百官即時直入直出此二者禮僭序失伏乞改正勅官爵之班即分髙下見謝之位豈有異同立通規以為定例今後宰臣使相朝見並辭謝於崇元門内與諸官重行異位一時列拜假内横行即從舊例又入閤之儀其餘翰林學士前任郡守等今後入閤宜依百官班列不得先出七年五月中書門下奏時屬炎蒸事宜簡省應五日百官起居即令押班宰臣一員押百官班其轉對官兩員封事付閤門使引進本官起居後隨百官退不用别出謝恩其文武内外官寮乞假寧親婚𦵏病損並門見門辭諸道奉進物等不用殿前排列引進使引至殿前奏云某等進奉物便出進奉使朝見日一人致詞都付起居刺史並諸道行軍副使馬歩軍都指揮使已下差人到闕門見並門辭州縣官謝恩日申頭一人都致詞不用逐人告官其供奉官殿直等如是當直及合於殿前排立者即入起居如當直者不用每月起居委宣徽院專切㸃檢尚須齊整從之時帝不豫難於朝見故權有此奏開運元年八月尚書倉部郎中知制誥陶穀奏内外臣寮正衙辭謝欲望除宰臣使相依舊押班其郡牧藩侯臺省寺監長史等不得令部内本司卑冗官員同班辭謝從之周廣順三年三月御史臺奏應除授節度使防禦團練使刺史行軍副使等近日不到正衙辭謝多稱别奉宣㫖𠡠今後此色除授宜令閤門告報勒正衙辭謝如有宣㫖放辭謝閤門具姓名分明投御史臺四方館其年十月十二日𠡠今後起更有受官不赴衙謝人宜令門下省御史臺檢舉追勘聞奏其授官後違程不赴任並准元𠡠殿選如選未滿便來乞官者除外别行降黜施行顯徳五年閏七月一日御史臺奏文武百官每日赴朝叅不到如是常朝不到於本官料錢上每貫罰二十五文如是内殿起居入閤行香出城衆集及非時慶賀御殿横行叅不到並是倍罰臺司先牓幕次曉示百官限三日外即牒三司尅折如有故曽陳牒即将領由呈騐又十六年條准元和三年十二月内御史臺奏文武常叅官准乾元元年三月𠡠如有朝堂相弔慰相跪拜待漏行立失序談笑諠譁入衙内執笏不端行立遲慢至班列行立不正趨拜失儀拜跪不俯伏舒脚穿班仗出門不即就班無故離位廊餐行坐失儀拜起低掖退朝不從正衙門出非公事入中書每犯者奪一月俸今商量此舊條各減一半如所由指揮尚或抵拒即准舊例錄奏貶降從之諸侯入朝後唐長興元年七月勅諸道得替防禦團練等使及刺史到京朝見後並宜班行比擬如未有員闕可令隨常叅官遂立班二年十二月諫議大夫盧損奏請前任節度防禦團練使刺史每五日隨例起居從之清泰元年十一月御史臺奏前任節度防禦團練使刺史行軍副使近儀五月一日内殿起居皆綴班序立元係班簿雖曰便殿起居其遇全班起居時亦合綴班從之百官奏事晉天福二年五月勅宜令在朝文武官臣僚每人各進封事一件仍須實封通進親王與朝臣行立位後唐長興三年正月中書門下奏見任宰臣四外其餘諸使兼侍中中書令平章事並是使相向東班序皆在見任宰臣之下今縁秦王從榮是親王新加兼中書令與諸使相不同每遇排班及到中書位次未定今後望諸親王官至兼侍中中書令則與見任宰臣分班定位宰臣居左親王兼侍中中書令居右如親王及諸使守侍中中書令亦並是使相既不知印不署勑亦分行居右其餘使相依舊規從之四年九月𠡠天下兵馬大元帥秦王從榮位隆將相望重磐維委任既崇等威合異班位宜在宰臣之上文武百官朝謁班序後唐清泰二年十一月知彈御史奏今月二日班入遇雨移班廊下移班臺吏董瑾引僕射在中丞三院御史之下僕射詰問董瑾稱准常例臺司㝷刺都省請檢討舊儀都省稱國朝以端揆之重師長百僚雖在列司皆為統屬且左右僕射常朝不在中丞之下赴晏廊下餐並在中丞之上况中丞有公叅之禮進路之儀詳其道理自有等降臺司又堅稱李琪盧質任僕射日班亦如此又引通事舍人在一品班上㝷申中書門下奏宰臣判令廊下便重定班位廊下使言今後遇雨移班廊下欲請依殿前磚位次第二品在三品前一品後如中丞大夫俱置即大夫在中丞前其西班准此謹具奏聞勅宜令置一品二品三品磚位晉開運二年八月御史臺奏宰臣和凝新除右僕射入朝就列儀注責得臺吏喬德威状稱新除僕射正衙朝謝後次日中丞率三院御史到僕射㕔公叅相次文武百官公叅趨朝時不序班入在中丞之前兼舊例除拜御史大夫趨朝退出在兩省之前僕射出在大夫之前近年已來入朝祇在中丞之前朝退僕射出却在兩省之後銀臺司遂檢唐朝舊儀伏見元和七年二月七日𠡠所定僕射趨朝出入儀注甚重今後欲請常朝序班候御史中丞羣官先入以次東宫保傅入次両省入次僕射入及朝退僕射先以次出兩省官出東宫保傅出次御史中丞百官出從之周廣順三年十一月中書省奏新除起居舍人邊珝任徹其邊珝已謝任徹奉便未回任徹自左補闕除授邊珝自右補闕除授任徹舊官已在邊珝之上今任徹是𠡠頭近日同制受官多以先謝為上伏慮任徹使迴行立班次難定𠡠同制授官但以𠡠命已定班次不可輒移謝日或有先後豈得便為升降今後同授制官宜准元和十五年勑行立班次以勅内先後為定其考満月數以朝謝月日計數内外官章服周顯徳元年正月一日勅節文今後升朝官兩任以上者著緑十五周年者與賜緋凡州縣官歴任内曽經五度叅選者雖未及十六考與授朝散大夫階年七十以上合授優散官者並賜緋非時特恩不拘此例雜錄梁開平二年七月勅車服以庸古之制也貴賤無别罪莫大焉應内外将相許以銀飾鞍𠡠其刺史都将内諸司使以下祇許用銅飾仍永為定式四年五月勅竒衺亂正假偽奪真既典刑之不容宜犯違而莫赦應東西兩京及諸州府製造假犀玉真珠腰帶簪珥並諸色售用者等一切禁㫁應公私人家先已有者所在送納長吏靣前毁棄後唐天成二年正月𠡠今後三京及諸道州使職員名目是押衙兵馬使指揮使已上騎馬得有暖坐諸都將衙官使下係名目者祇得衣紫皂衣庶人商旅祇著白衣庶人有富户或投名於勢要以求影庇或希假攝貴兒丁徭如此色人仰所在禁勘以肅姦欺㦸晉天福三年五月詔應中外臣寮帶平章事侍中中書令及諸道節度使並許私門立㦸仍並官給及據官品依令式論樂上晉天福五年七月詳定院奏先奉勅正冬二節朝㑹舊儀禮節樂章二舞行列等事宜差太常卿崔棁御史中丞竇貞固刑部侍郎吕𤦺禮部侍郎張允與太常寺官一一詳定令檢討典經具述制度按禮云天子以徳為車以樂為御大樂與天地同和又曰安上治民莫善於禮移風易俗莫善於樂樂書云夫樂在耳曰聲在目曰容聲應乎耳可以聼知容藏於心難以貎睹故聖人􅖍干戚羽旄以表其容發揚蹈厲以見其意聲容和合則大樂備矣又按義鏡問鼔吹十二按合於何處荅曰周禮鼔人掌六鼔四金漢朝乃有黄門鼔吹崔豹古今注云因張騫使西域得摩訶兜勒一曲李延年增之分為二十八曲梁置鼔吹清商令二人唐又有揺鼔金鉦大鼔長鳴歌嘯笳笛合為鼓吹十二按大享㑹則設於縣外此乃是設二舞及鼔吹十二按之由也今議一從令式排列教習文舞即六十四人分為八佾佾八人左手執籥禮云葦籥伊耆氏之樂也周禮有籥師教國子爾雅曰籥如笛三孔而短大者七孔謂之産歴代以來文舞所用凡用籥六十有四右手執翟周禮所謂羽舞也書曰舞干羽於兩階翟山雉也以雉羽分析連攢而為之二人執纛前引數於舞人之外文舞冠進賢冠服黄紗袍白紗巾單皂領褾白練􅜵襠白布大口袴革帶烏皮履白布襪武舞郎六十四人分為八佾左手執干干楯也今之旁牌所以翳身也其色赤中畫獸形故謂之朱干周禮所謂兵舞取其武象用楯六十有四右手執戚戚斧也上飾以玉故謂之玉戚二人執旌前引旌似旗而小絳色畫升龍二人執鼗鼓二人執鐸周禮有四金之奏其三曰金鐸以通鼓形如大鈴仰而振之金錞二每錞二人舉之一人奏之周禮四金之奏其一曰金錞以和鼓鑄銅為之其形圜若椎上大下小髙三尺六寸有六分圍二尺四寸上有伏虎之状旁有耳獸形啣環二人執鐃以次之周禮四金之奏其二曰金鐃以止鼓如鈴無舌揺柄以鳴之二人掌相在左禮云理亂以相狀如小鼓用皮為表實之以糠撫之以節樂二人掌雅在右禮云訊疾以雅以木為之狀如漆筩揜口大二圍長五尺六寸以羖皮鞔之旁有二紐髹畫賔辭而出以器築地明行不失節武舞人服弁平巾幘金支排絲布大袖緋絲裲襠甲金飾白練􅜵襠錦騰蛇起梁帶豹文大口布袴烏皮靴工二十數於舞人之外武弁朱褠韋帶烏皮履白練􅜵襠白布襪殿廷加鼓吹十二按義鏡云帝設氊案以氊為牀也今請制大牀十二牀容九人振作歌樂其牀為熊羆虎豹騰倚之狀以承之象百獸率舞之意分置於建鼓之外各三案每案羽葆鼓一大鼓一金錞一歌二人簫一人十二案樂工一百有八人舞一百三十有二人取年十五已上弱冠已下容止端正者充其歌曲名號樂章詞句請中書條奏差官修撰從之其月宴羣臣于永福殿奏黄鍾之樂司封郎中王仁裕曰音不純肅聲不和展其將有争者或問之奚知其然對曰天有天地辰宿有軌數形色有隂陽順逆有離合隠見天數五地數六六五相合十一月而生黄鍾者同律之主五音之元宫也子寅夘己未酉戌謂之羽子寅辰午未酉亥謂之宫子酉夘己未申戌謂之角子夘辰己未酉戌謂之商四者靡靡成章峻而且厲鄭衛之音此之謂也雖髙有兩忽微中有所闕漏與夫推厯主律命吕九六之偶旋相為宫三正合天地之美四宗固隂陽之序者於其通人神宣嵗功主成執傳之徳統協長短之筭則精粗異矣在乎審治亂察盛衰原性情應形兆則殊途而同歸者也三正者一為天二為地三為人七宗者黄鍾為宫太簇為商姑洗為角林鍾為徴南吕為羽應鍾為變宫蕤賓為變徴角為木商為金宫為土變徴為日變宫為月徴為火羽為水龍角元龜天承井俟主乎角平亢河鼓婁聚輿鬼主乎商天根湏女庖爼烏喙主乎宫辰馬隂虚旌頭大都主乎變徴大火丘封天髙烏䎍主乎變宫尤尾𤣥室四兵天福主乎徴天津東壁參伐輹車主乎羽角之數六十有四商之數七十有二宫之數八十有一變徴之數五十有六變宫之數四十有二徴之數五十有四羽之數四十有八極商之數九十陽之數一百一十有八隂之數一百一十有二五音之數畢矣神無形而有化處乎隂數之間故昭之以音合之以筭音以定筭以求象觸乎而激於心由是而知也夫何疑哉俄而有軍校鬪毆於升龍門外厲聲稱反有司執之以聞五代㑹要卷六
