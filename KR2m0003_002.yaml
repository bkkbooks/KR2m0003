body:
  text: 五代會要卷二宋王溥撰諸王梁太祖長子友裕郴王開平三年十月追封第二子友文博王開平元年五月九日封册第三子友圭郢王開平元年五月九日封至乾化二年六月三日篡位偽改鳯厯元年三月十七日京城軍亂侍衛都將袁象先率兵入宫友圭自殺少帝即位追削為庶人第五子友璋福王開平元年五月九日封第六子友雍賀王開平元年五月九口封第七子友徽建王開平元年五月九日封第八子友孜康王乾化三年三月十二日封後唐太祖第二子存美雍王第三子存霸永王第四子存禮薛王第五子存渥申王第六子存乂睦王第七子存確通王第八子存紀雅王並同光三年閏十二月封莊宗長子繼岌魏王同光元年四月中書門下奏皇子準故事合𢃄宫使請以繼岌為興聖宫使從之至三年九月二十三日封為魏王繼潼繼蟾繼嵩繼嶢皆皇子也同光三年二月敕並可光祿大夫檢校司徒明宗第二子從璟為元行欽所殺天成三年六月追贈太保未封王第三子從榮秦王長興元年八月封至四年十一月謀逆伏誅追削為庶人清泰元年十月敕故庶人從榮獲罪先帝貽禍厥身已歷嵗時未營窀兆雖軫在原之念宜從有國之規且令中書門下商量葬禮尋據太常禮院伏奏請準唐貞觀中庶人承乾流死黔州仍葬以公禮從之第四子從璨為安重誨所陷天成四年三月責授房州司戶參軍尋殺之至長興四年七月追贈太保未封王第五子從益許王長興四年五月封至晉天福四年封郇國公為二王後奉唐帝祀至開運三年契丹犯京師復封為許王尋為畨將蕭翰偽立為帝知南朝軍國事漢髙祖入洛遇害末帝長子重吉為愍帝所害未封王清泰元年七月追册為太尉立廟於萊州第二子重美雍王清泰三年正月封晉髙祖長子重英虢王第二子重義壽王權洛京留守為張從賔所害第三子重允剡王第四子重信沂王權河南節度使為張從賔所害第五子重進夔王並天福七年四月追封第六子重杲陳王天福七年五月追封第七子重睿許州節度使未封王少帝長子延煦遙領陜西節度使第二子延寶遙領曹州節度使按實録皆帝之從子養為己子漢髙祖長子承訓魏王天福十二年二月追封第三子承勳陳王周廣順元年三月追封周太祖第二子侗郯王第三子信杞王並漢末遇害顯德四年四月追封世宗長子宗誼越王並漢末遇害顯德四年四月追封第三子宗讓曹王改名熙讓第四子熙謹紀王第五子熙誨蘄王並顯德六年追封雜録後唐同光四年三月內人郡主景姹奏唐昭宗諸王及皇子弟宗屬千餘人當朱梁弒逆之時同時遇害為三坑瘞於內西右龍興寺北請合為一冢改葬敕宜令太常禮院以故濮王一人為首一品禮葬仍委河南府監護喪事長興元年九月太常禮院奏草定册秦王儀注博士段顒議曰據開元禮臨軒册命諸王大臣其日受册者朝服從第鹵簿與百官俱集朝堂就次受册訖通事舍人引不載謁廟還第之儀自開元以後册拜諸王皆正衙命使詣延英門進册皇帝御內殿髙品引王入立於位髙品宣制讀册王受册訖歸院亦無乘輅謁廟之禮臣按五禮精義云古者皆因禘嘗而發爵祿所以示無自専稟之祖宗也今雖册命不在蒸嘗然拜大官封大邑必至殿廷敬順之道也今當司欲準開元禮其日秦王服朝服自治所乘輅車備鹵簿與羣臣俱集朝堂就次受册訖至應天門外奉册置於載册之車秦王升輅出謁太廟訖歸理所儀仗鹵簿如來時之儀從之公主梁太祖長女安陽公主降羅延規早卒開平三年八月追封長樂公主降趙巗開平九年五月十一日封普寧公主降王昭祚開平元年五月十一日封金華公主開平二年十月封真寧公主乾化三年十月五日封少帝長女夀春公主乾化三年四月五日封第二女壽昌公主正明九年九月二十五日封後唐武皇長女瓊華長公主降孟知祥同光三年十二月封第二女瑶英長公主降張延釗同光三年十二月封明宗長女永寧公主降晉髙祖天成三年四月封至長興四年正月改封魏國公主清泰二年三月追封晉國長公主第十三女興平公主降趙延夀天成三年四月封至長興四年九月改封齊國公主至清泰三年三月追封燕國長公主第十四女夀安公主長興四年六月封第十五女永樂公主長興四年六月封晉髙祖長女長安公主降楊承祚天福二年五月封至六年五月卒追封秦國公主至七年九月又追封梁國長公主從長女髙平縣主第二女新平縣主第三女千乘縣主孫女永慶縣主並天福七年五月封漢髙祖長女永寧公主降宋延渥天福十二年四月封至乾祐二年十二月追封秦國長公主周太祖第三女樂安公主為漢室所害廣順元年二月追封至顯德四年四月又追封莒國長公主第四女夀安公主降張永德廣順元年四月封至顯德元年四月封晉國長公主第五女永寧公主廣順元年九月追封至顯德四年四月又追封梁國長公主婚禮後唐同光元年七月太常禮院奏按本朝舊儀自一品至三品婚姻得服衮冕劍佩衣九章今皇子興聖宫使繼岌雖未封建官是檢校太尉合準一品婚姻施行其妃凖禮婦人從夫之爵亦準一品命婦禮至親迎日太常鹵簿鼓吹前導乘輅車其妃花叉九枝博鬢褕翟衣九等其日平明皇帝差官告親廟一室宗正卿攝婚主行禮其夕親迎興聖宫使乘輅車鹵簿鼓吹前導至女氏之門以結綵車御輪交率一作車從之晉天福四年八月中書門下奏據太常禮院定來年長安公主出降儀太僕寺供厭翟二馬車殿中省備團方編扇各十六行障三座障三傘一大扇一團大扇二今車障傘扇是同光元年皇后法物欲備飾牙仗厭翟車后以四馬今權去二馬從之五年二月太常禮院奏長安公主以三月出降按唐德宗朝禮儀使顔真卿議婚用誕馬在禮無文周禮諸侯以璋䀻女禮云玉以比德今請駙馬都尉加以璋郡主之壻加玄纁以代用馬書函之禮出自近代事無正經請廢之勿用詔曰納采之時主人再拜使者不答雖開元禮具載其儀今宜答拜仍令鄭王重貴主其婚禮中外不賀餘依所奏親拜郊梁太祖南郊二開平三年五月二十四日其年十一月二日後唐莊宗南郊一同光二年二月一日明宗南郊一長興元年二月二十一日其夜微雨上召司天官問之奏曰聖德動天百靈斯會故也夜至半雨止天色晴明如晝皆以為聖德所感周太祖南郊一顯德元年正月一日雜録梁開平二年十一日南郊禮儀使奏今檢詳禮文皇帝赴南郊服通天冠絳紗袍登玉輅法駕鹵簿自清遊隊已下諸衛將軍平巾幘緋兩襠大口袴錦螣蛇銀隱起金帶刀弓箭以飛執旗人引駕三衛並武辨緋兩襠大口袴供奉官並武辨服色各一人步從餘文武官及導駕士絳衣平巾幘餘並戎服準式近侍導駕官自三引車從本縣令州府御史大夫即朝服各乘輅車前導其引駕官員不總備車輅自中書令侍中已下則公服內諸司使並常服內人服色禮文不載其年自東都赴洛都行郊天禮自石橋備前件儀仗至郊壇三年正月以河南尹張宗奭為南郊大禮使故事皆以宰相為之今以河南尹充非常例也後唐同光二年正月禮儀使奏南郊朝饗太廟合祭天地於圜丘舊制以親王充亞獻行事乃以皇子繼岌為亞獻皇弟存紀為終獻天成四年九月太常禮院奏來年二月十八日致齋於明堂準舊儀皇帝服通天冠絳紗袍文武五品以上著袴褶陪臣近例祇著朝服從之周廣順三年九月太常禮院奏準敕定郊廟制度洛陽郊壇在城南七里丙巳之地圜丘四成各髙八尺一寸下廣二十丈再成廣十五丈三成廣十丈四成廣五丈十有二陛無節十二等燎壇在泰壇之丙地方一丈髙一丈二尺闊上南出戶方六尺請下所司修奉從之時太祖將拜南郊故修奉之親饗廟梁太祖二饗廟開平三年正月二十二日其年十月三十日後唐莊宗一饗廟同光二年正月二十九日明宗一饗廟長興元年二月十九日周太祖一饗廟廣順三年十二月十九日廟儀梁開平元年夏四月太祖初受禪乃立四廟於西京從近古之制也後唐同光二年六月十日太常禮院奏國家興建之初已於北都置廟今尅復天下遷都洛陽固宜建置宗廟按禮無二廟之文其北都宗廟請廢下尚書王正言等奏議曰伏以宫室之制宗廟為先今卜洛居尊開基御宇事當師古神必依人北都先置宗廟不宜並設况每年朝享禮有常規時日既同神何所據竊聞近例亦有從權如神主已修迎之藏於夾室若廟宇已崇虛之以為常制若齊桓公之廟二主禮無明文古者師行亦無遷於廟主昔天后之崇鞏洛禮謂非宜漢王之戀豐滕事無所法况本朝故事禮院具明洛邑舊都髙丘正位豈宜逺宫闕之居建祖宗之廟事非可久理在從長其北都宗廟請準太常禮院申奏宜從廢停從之天成元年中書舍人馬縞奏曰伏見漢晉已來以諸侯王宗室承襲帝統除七廟之外皆别追尊私親漢光武皇帝立先四代於南陽其後桓帝已下亦皆上考前修追崇先代乞依兩漢故事别立親廟詔下尚書省集百官定議禮部尚書蕭頃等議曰伏見方册所載聖概斯存將達蘋藻之誠宜新楶梲之制臣等集議其追尊位號及建廟都邑乞依馬縞所議二年中書門下又奏伏以兩漢以諸侯王入繼帝統則必易名上議廣孝稱皇載於諸史故事孝德皇孝仁皇孝元皇是也伏乞聖慈俯從人願幸追王而薦號兼上諡以尊名改置園陵仍增兵衛遂詔太常禮院定其儀制太常博士王丕等引漢桓帝入嗣尊其祖河間孝王曰孝穆皇父蠡吾侯曰孝崇皇為例請付太常卿定諡刑部侍郎權判太常卿馬縞復議曰依準兩漢故事以諸侯王宗室入承帝統亦必追尊父祖修樹園陵西漢宣帝東漢光武孝享之道故事具在自安帝入嗣遂有皇太后令别崇諡法追曰某皇所謂孝德孝穆之類是也前代惟孫皓自烏程侯繼嗣追父和為文皇帝事出非常不堪垂訓今據禮院狀漢安帝已下若據本紀又不見有帝字伏以諡法德象天地曰帝伏緣禮院已曽奏聞難將兩漢故事便述尊名請詔百官集議右僕射李琪等議曰伏睹歷代已來宗廟成制繼襲無異沿革或殊馬縞所奏誠有經據乞下制命令馬縞據依典册以述尊名乃下詔曰朕聞開國承家得以制禮作樂故三王不相襲五帝不相沿隨代創制於理無爽矧或情關祖禰事係蒸嘗且追諡追尊稱皇與帝既有減增之字合陳褒貶之辭大約二名俱為尊稱若三王之代不可加帝五帝之代不可言皇爰自秦朝便兼其號至若玄元皇帝事隔千祀宗追一源猶顯册於鴻名豈須遵於漢典况朕居九五之位為億兆之尊不可總二名於眇躬惜一字於先代茍隨執議何表孝誠可委宰臣與百官詳定集兩班於中書各陳所見惟李琪等請於祖禰二室先加帝字宰臣合衆議奏曰恭以朝廷之重宗廟為先事係承祧義符致美且聖朝追尊之日即引漢氏舊儀在漢代封崇之時復依何代故事理關凝滯未叶聖謀道合變通方為民則且王者功成治定制禮作樂正朔服色尚有改更尊祖奉先何妨沿革若應州必立别廟即地逺上都今據開元中追尊臯陶為德明皇帝涼武昭王為興聖皇帝皆立廟於京都臣等商量所議追尊四廟望依御札並加皇帝之號兼請於洛京立廟敕宜於應州舊宅立廟餘依所奏其年八月太常禮院奏莊宗神主以此月十日祔廟七室之內合有祧遷中書門下奏議議祧懿祖一室後下百僚集議禮部尚書蕭頃等奏議請從中書所議從之應順元年正月中書門下奏太常以太行山陵畢祔廟今太廟見享七室髙祖太宗懿祖昭宗獻祖太祖莊宗大行升祔禮合祧遷獻祖請下尚書省集議太子太傅盧質等議曰臣等以親盡從祧垂於舊典疑事無質素有明文頃莊宗皇帝再造寰區復隆宗廟追三祖於先代復四室於本朝式遇祧遷旋成沿革及莊宗升祔以懿祖從祧蓋非嗣立之君所以先遷其室光武滅新之後始有追尊之儀比祗在於南陽元不歸於太廟引事既疏於故實此時須稟於新規將來升祔先廟次合祧遷懿祖既叶隨時之義又符變體之文從之時議者以懿祖賜姓于懿宗以支庶繫大宗例宜以懿祖為始祖次昭宗可也不必祖神堯而宗太宗若依漢光武則宜於代州立獻祖而下親廟其唐廟依舊禮行之可也而議諡者忌咸通之懿宗又稱懿祖父子俱懿於理可乎將朱邪三世與唐室四廟連序昭穆非禮也議祧者不知受氏於唐懿宗而祧之今又及獻祖以禮始祧昭宗次祧獻祖可也而懿祖如唐景皇帝豈可祧乎晉天福三年正月中書門下奏皇帝到京未立宗廟望令所司速具制度典禮以聞從之二月太常博士段顒議曰夫宗廟之制歷代為難爰考禮經以求故事謹按尚書舜典曰正月上日受終於文祖此是堯之廟也然猶未載其數又按郊祀録夏立五廟商立六廟周立七廟漢初立祖宗廟於郡國共計一百六十七所至後漢光武中興後别立六廟魏明帝初立親廟四後重議依周法立七廟晉武受禪初立六廟後却立七廟宋武帝初立六廟齊朝亦立六廟隋文帝初受命立親廟四至大業元年煬帝欲遵周法議立七廟次屬傳禪於唐武德元年六月四日始立四廟於長安至貞觀九年命有司詳議廟制遂立七廟至開元十一年後創立九廟又按禮記喪服小記曰王者禘其祖之所自出以其祖配之而立四廟鄭玄注云髙祖以下至禰四世即親盡也更立始祖為不遷之廟其五廟也又按禮記祭法及王制孔子家語春秋榖梁傳並云天子七廟諸侯五廟大夫三廟士一廟此是降殺以兩之義又按尚書咸有一德曰七世之廟可以觀德又按疑義云天子立七廟或四廟蓋有其義也如四廟者從禰至髙祖已上親盡故有四廟之禮又立七廟者緣自古聖王祖有功宗有德更封一本封下有立字始祖即於四親廟之外或祖功宗德不拘定數所以有五廟六廟或七廟要後代子孫觀其功德故尚書云七世之廟可以觀德矣又按周捨論云自江左以來晉宋齊梁陳相承多立七廟今顒等參詳惟立七廟四廟即並通其理伏緣宗廟事大不敢執以一理定之故檢四廟七廟之文參酌厥理俱得其宜他所論者並皆勿取伏請下三省集百官詳議敕從之左僕射劉昫等議曰臣等今月八日伏奉敕命於尚書省集議太常博士段顒所奏宗廟事伏以將敷至化以達萬方克致平和必先宗廟故禮記王制云天子七廟諸侯五廟大夫三廟疏云周制之七者太祖廟及文王武王之祧與親廟四太祖后稷也殷六廟契及湯與二昭二穆夏則五廟不立太祖禹與二昭二穆而已自夏及周少不減五多不過七又云天子七廟皆據周也有其人則七無其人則五者諸侯廟制雖有其人則不過五此天子諸侯五七之異明矣至於三代以後魏晉宋齊隋及唐初多立六廟蓋於建國之始不盈七廟之數也今欲請自立髙祖已下四親廟其始祖一廟未敢輕議伏候聖裁御史中丞張昭奏議曰臣前月中預都省集議宗廟事伏見議狀於親廟之外請别立始祖一廟近奉中書門下牒再令百官於都省議定聞奏者臣讀十四代史書見二千年故事觀諸家宗廟都無始祖之稱惟殷周二代以稷契為太祖禮記曰天子七廟三昭三穆與太祖之廟而七鄭玄注云此周制也七者太祖后稷及文王武王與四親廟又曰殷人六廟契及湯與二昭二穆也夏后氏立五廟不立太祖惟禹與二昭二穆而已據王制鄭玄所釋即殷周以契后稷為太祖夏后無太祖亦無追諡之廟自殷周以來時更十代皆於親廟之中以有功者為太祖無追崇始祖之例具引今古即恐詞繁事要證明須陳梗槩漢以髙祖父太上皇執嘉無社稷功不立廟號髙祖自為髙祖魏以曹公相漢垂三十年始封於魏故為太祖晉以宣王輔魏有功立為髙祖以景帝始封於晉故為太祖宋氏先世官閥卑微雖追崇帝號劉裕自為髙祖南齊髙帝之父位至右將軍生無封爵不得為太祖髙帝自為太祖梁武帝之父順之左右齊室封侯位至領軍丹陽尹雖不受封於梁亦為太祖陳文帝父文瓉生無名位以武帝有功梁室贈侍中封義興公及武帝即位亦追為太祖周閔帝以父泰相西魏經營王業始封於周故為太祖隋文帝輔周室有大功始封於隋故為太祖唐髙祖神堯祖父虎為周八柱國隋代追封唐公故為太祖唐末梁室朱氏有帝位亦立四廟朱氏先世無名位雖追册四廟不立太祖朱公自為太祖此則前代追册太祖不出親廟之成例也王者祖有功而宗有德漢魏之制非有功德不得立為祖宗殷周受命以稷契有大功於唐虞之際故追尊為太祖自秦漢之後其禮不然雖祖有功仍須親廟今亦粗言往例以取證明秦稱造父之後不以造父為始祖漢稱唐堯劉纍之後不以堯纍為始祖魏稱曹參之後不以參為始祖晉稱趙將司馬卬之後不以卬為始祖宋稱漢楚元王之後不以元王為始祖齊梁皆稱蕭何之後不以蕭何為始祖陳稱太丘長陳實之後不以實為始祖元魏稱李陵之後不以陵為始祖後周稱神農之後不以神農為始祖隋稱楊震之後不以震為始祖唐稱臯陶老子之後不以臯陶老子為始祖唯唐髙宗則天武后臨朝革唐稱周更立七廟仍追册周文王昌為始祖此蓋當時附麗之徒不諳故實武立姬廟乖越已甚曲臺之人到今嗤誚臣逺觀秦漢至於周隋禮樂衣冠聲名文物未有如唐室之盛武德議廟之初英才間出如溫魏顔虞通今古封蕭薛杜達禮儀制度憲章必有師法夫追先王先母之儀起於周代據史記及禮經云武王纘太王王季文王之緒一戎衣而有天下尊為天子宗廟享之周公成文武之德追王太王王季祀先公以天子之禮又曰郊祀后稷以配天據此言之周武雖祀七世追為王號者但四世而已故自東漢以來有國之初多崇四廟從周制也况殷因夏禮漢習秦儀無勞博訪之文宜約已成之制請依隋唐有國之初創立四廟推四世之中名位髙者為太祖謹議以聞敕宜令尚書省集議奏聞左僕射劉昫等再奏議曰臣等今月十三日再於尚書省集百官詳議夫王者祖武宗文郊天祀地故有追崇之典以申配享之儀竊詳太常禮院議狀惟立七廟四廟即並通其理其它所論並皆勿取七廟者按禮記王制曰天子七廟三昭三穆與太祖之廟而七鄭玄注云此周制也詳其禮經即周家七廟之定數四廟者謂髙曾祖禰四世也按周本紀及禮經大傳皆曰武王即位追王太王王季以后稷為堯稷官故追尊為天子此則即周武王初有天下追尊四廟之明文也故自漢魏以降迄於周隋創業之君追尊不過四世約周制也此禮行之已久事在不疑今參詳都省前議狀請立四廟外别引始祖取裁未為定議續準敕據御史中丞張昭奏請創立四廟之外無封始祖之文况國家禮樂刑名皆依唐典宗廟之制須約舊章請依唐朝追尊懿祖宣皇帝獻祖光皇帝太祖景皇帝代祖元皇帝故事追尊四廟為定從之七年七月太常禮院奏國朝見饗四廟靖祖肅祖睿祖憲祖今大行皇帝將行升祔按會要唐武德元年立四廟於長安至貞觀九年髙祖神堯皇帝崩命有司詳議廟制議者以髙祖神主併舊四室祔廟今先皇帝神主請同唐髙祖升祔從之漢天福十二年閏七月太常博士段顒奏議曰伏以宗廟之制歷代為難須按禮經旁求故實又緣禮貴隨時損益不定今參詳歷代故事請立髙曾祖禰四廟更上追逺祖光武皇帝為始祖百代不遷之廟居東向之位共為五廟庶符往例又合禮經詔尚書省集議吏部尚書竇正固等議曰按禮記王制云天子七廟諸侯五廟大夫三廟疏云周制之七廟者太祖及文王武王之祧與親廟太祖后稷也又云天子七廟皆據周制也有其人則七無其人則五至於光武中興及歷代多立六廟或四廟蓋建國之始未盈七廟之數又按郊祀録王肅云德厚者流澤廣天子可以事六代之義也今欲請立髙祖以下四親廟又自古聖王祖有功宗有德即於四廟之外祖功宗德不拘定數今除四親廟外更請上追髙皇帝光武皇帝共六廟從之周廣順元年正月中書門下奏太常禮院議曰合立太廟室數若守文繼體則魏晉有七廟之文若創業開基則隋唐有四廟之議聖朝請通依近禮追諡四廟伏恐所議未同請下百官集議太子太傅和凝等議曰恭以肇啓洪圖維新黃屋左宗廟右社稷率由舊章崇祖禰辨尊卑載於前史雖質文互變義取各殊或觀損益之規或係興隆之始陛下體元立極本義祖仁開變家成國之基遵奉先思孝之道據禮官議立四親廟允叶前文從之五代會要卷二
