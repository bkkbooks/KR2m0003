body:
  text: 五代㑹要卷二十八宋王溥撰諸色料錢下後唐同光三年二月十五日租庸院奏諸道州縣官并防禦團練副使判官等俸料各據逐處具到事例文帳內㸃檢舊來支遣則例錢數不等所請折支物色又加錢數不定難為勘㑹今除東京管內州縣官見支折支課錢且依舊外其三京并諸州於舊日支遣錢數等第重定則例兼切循本朝事體防禦團練副使判官外其餘推巡以下職員皆是本處自要辟請圓融月俸贍給亦乞依舊規繩省司更不支給錢物謹具如後防禦團練副使判官副使逐月料錢三十千貫判官逐月二十千貫刺史州元無副使有者請廢其軍事判官所有月俸亦是刺史已俸內支贍三京少尹支料錢逐月三十千貫赤縣令每月正受支料錢二十五千貫考滿并攝比正官支一半主簿每月正授支料錢一十二貫考滿并攝比正官支一半畿縣令每月正授支料錢二十千貫考滿并攝比正官支一半主簿每月支料錢一十千貫考滿并攝比正官支一半司録參軍每月正授支料錢三十千貫考滿并差攝比正官支一半諸曹判司官每月正授支料錢一十二千貫考滿并差攝比正官支一半文學每月正授支料錢五千貫考滿并差攝比正官支一半參軍每月正授支料錢五千貫考滿并差攝比正官支一半諸州府録事參軍各依逐州上縣令支州判司各依上縣主簿支一萬户以上縣令每月正授支料錢二十三千貫考滿并差攝比正官支一半主簿每月正授支料錢一十三千五百貫考滿并差攝比正官支一半九千户以上縣令每月正授支料錢二十二千貫考滿并差攝比正官支一半主簿每月正授支料錢一十二千貫考滿并差攝比正官支一半八千户以上縣令每月正授支二十一千貫考滿并差攝比正官支一半主簿每月正授支一十一千五百貫考滿並差攝比正官支一半七千户以上縣令每月正授支二十千貫考滿并差攝比正官支一半主簿每月正授支一十一千貫考滿并差攝比正官支一半六千户以上縣令每月正授支一十九千貫考滿并差攝比正官支一半主簿每月正授支一千五貫考滿并差攝比正官支一半五千户以上縣令每月正授支一十八千貫考滿并差攝比正官支一半主簿每月正授支一十千貫考滿并差攝比正官支一半四千户以上縣令每月正授支一十七千貫考滿并差攝比正官支一半主簿每月支九千五百貫考滿并差攝比正官支一半三千户以上縣令每月正授支一十六千貫考滿并差攝比正官支一半主簿每月正授支九千貫考滿并差攝比正官支一半二千五百户以上縣令每月正授支一十五千貫考滿并差攝比正官支一半主簿每月正授支八千五百貫考滿并差攝比正官支一半二千户以上縣令每月正授支一十四千貫考滿并差攝比正官支一半主簿每月正授支八千貫考滿并差攝比正官支一半一千五百户以上縣令每月正授支一十三千貫考滿并差攝比正官支一半主簿每月正授支七千五百貫考滿并差攝比正官支一半一千户以上縣令每月正授支一十二千貫考滿并差攝比正官支一半主簿每月正授支七千貫考滿并差攝比正官支一半五百户以上縣令每月正授支一十一千貫考滿并差攝比正官支一半主簿每月正授支六千五百貫考滿并差攝比正官支一半五百户以下縣令每月正授支一十千貫考滿并差攝比正官支一半主簿每月正授支六千貫考滿并差攝比正官支一半右租庸使奏重定料錢州例如前如諸道舊有取用處今後不得占留開破並依百姓例輸稅奉敕宜依長興二年閏五月起居郎曹琛奏文武兩班或請假歸寧或卧疾未頓才住班簿便住料錢伏乞特降敕命者敕今後文武官請准式歸寧給假及疾病者并許支給本官料錢其月二十四日敕諸道行軍司馬副使判官以下賔寮等考滿未有替人宜令並全支俸料元不在省司給俸者不在此例清泰元年七月敕洋王從璋涇王從敏每月各給料錢一百千米麥各五十石傔人衣糧各五十分馬五十五匹草粟二王自方鎮入朝洛陽私第故冇是給賜二年十月將作監丞襲封介國公宇文頡奏䝉恩襲封除官無襲爵俸給詔特給本官俸晉天福六年二月敕諸衛上將軍逐月加俸錢二萬漢乾祐三年七月十六日敕節文諸道州府令録判官主簿宜令等第支與俸户逐户每月納錢五百與除二稅外免放諸雜差遣不得更種職所定俸户於中等無色役人户內置不得差令當直及赴衙參如有闕額及不逮明申州府差填不得衷私替換若是令録判司主簿除本分人數外剩占俸户及令當直手力更納料錢並許百姓陳告其陳告人與免户下諸雜差徭所犯人追毁告身更加力役如令佐録事參軍內有員闕州府差攝亦依例支與俸錢差攝曹官不得一例供破定例如後三千户以上縣令逐月一十二千主簿六千二千户以上至三千户以下縣令九千主簿五千一千户以下縣令六千主簿四千録事參軍判司依本部內户口取最多縣令例支破其録事參軍依奏縣令例判司依主簿例周廣順元年四月敕牧守之任委遇非輕分憂之務既同制祿之數宜等自前有富庶之郡請給則優或邊逺之州俸料素簿以至遷除之際擬議亦難既論資序之高卑更患祿秩之升降宜分多益寡均利同思冀無黨偏以勸勳效今重定則例諸州防禦使料錢二百千祿粟百石食鹽五石馬十匹草粟元隨三十人衣糧團練使料錢一百五十千祿粟七十石食鹽五石馬十匹草粟元隨三十人衣糧刺史料錢一百千祿粟五十石食鹽五石馬五匹草粟元隨二十人衣糧仍取今年五月一日後到任者依前定例支其以前在任者所請如故顯德五年十二月中書奏諸道州府縣官及軍事判官一例逐月各據逐處主户等第依下項則例所定料錢及米麥等取顯德六年三月一日後起支其俸户並停廢一萬户以上縣令逐月料錢二十千米麥共五石主簿料錢一十二千米麥共三石七千户以上縣令逐月料錢一十八千米麥共五石主簿料錢一十千米麥共三石五千户以上縣令逐月料錢一十五千米麥共四石主簿料錢八千米麥共三石三千户以上縣令逐月料錢一十二千米麥共四石主簿料錢七千米麥共三石不滿三千户縣令逐月料錢一十千米麥共三石主簿料錢六千米麥共二石五萬户以上州司録事參軍及兩京司録每月料錢二十千米麥共五石司户司法每月料錢一十千米麥共三石三萬户以上州司録事參軍每月料錢一十八千米麥共五石司户司法每月料錢八千米麥共三石一萬户以上州司録事參軍每月料錢一十五千米麥共四石司户司法每月料錢七千米麥共三石五千户以上州司録事參軍每月料錢一十二千米麥共四石司户司法每月料錢六千米麥共二石不滿五千户州司録事參軍每月料錢一十千米麥共三石司户司法每月料錢五千米麥共三石諸司軍事判官一例每月料錢一十千米麥共三石右諸州府京百司內諸司州縣官課户莊户俸户柴炭紙筆户等望令本州及檢田使臣依前項指揮勒歸州縣候施行畢具户數奉聞仍差本州判官精細㸃數後差使臣覆視及有人論訴稱有漏落抵罪在本州判官及干繫官與如今後更有人户願充此等户者便仰本州勒死軍户配本州牢城服役從之六年十二月詔諸道州府攝官起今後支給本所諸官俸錢之半回鶻回鶻本牙在天德西北娑陵水上距長安六千九百里唐天寶中安祿山犯闕有助國討賊之功纍朝尚主自天驕㑹昌初其國為黠戛斯所侵部族擾亂乃移帳至天德振武間又為石雄劉沔所襲破之後為幽州節度使張仲武所攻餘衆西奔歸于吐畨吐畨處之甘州其後時通中國世以中國為舅朝廷每賜書詔亦嘗以甥呼之梁乾化元年十一月遣都督周易言等入朝進貢太祖御朝元殿引對以易言為右監門衛大將軍同正弟略麥之石論思並為左千牛衛將軍同正李屋珠安鹽上並為右千牛衛將軍同正仍以左監門衛上將軍楊治為左驍衛上將軍充押領回鶻還畨使通事舍人仇元通為判官厚錫繒帛押領歸國又賜其入朝僧凝盧宜季思宜延錢等紫衣後唐同光二年四月其本國權知可汗仁美遣都督李引釋迦副使田鐵林都監楊福安等共六十六人來貢方物并獻善馬九匹莊宗召對於文明殿乃命司農卿鄭質將作少監何延嗣持節冊仁美為英義可汗至其年十一月仁美卒其弟狄銀嗣立遣都督安千想等來貢狄銀卒呵咄欲立亦遣使來貢名馬天成三年二月其權知可汗仁裕遣都督李阿山等一百二十人入貢明宗召對於崇元殿賜物有差其年三月命使冊仁裕為順化可汗四年又遣都督製撥等二人來朝授製撥等懷化司戈遣令還長興元年十二月遣使翟米思三十餘人進馬八十匹玉一團四年七月復遣都督李末等三十人入朝進白鶻一聨明宗召對於廣夀殿厚加錫賚仍命解放其鶻清泰二年七月遣都督陳福海以下七十人進馬三百六十匹玉二十團至八月敕回鶻朝貢使密録都陳福海可懷化郎將副使達奚相溫可懷化司階監使屈密録阿撥可歸德司戈判官安均可懷化司戈晉天福三年十月遣使都督李萬全等朝貢以萬全為歸義大將軍監使常福德為順化將軍四年三月又遣都督拽里敦來朝兼貢方物其月命衛尉卿邢德昭持節就冊為奉化可汗貢良馬一百匹并白玉團白玉鞍轡等謝其封冊漢乾祐元年五月遣使李屋等入朝貢物并白玉藥物等七月以入朝使李屋為歸德大將軍副使安鐵山監使未相溫並為歸德將軍判官翟毛歌為懷化將軍周廣順元年正月遣使并摩尼貢玉七十七團白㲲豹㲠牛尾藥等物先是晉漢以來回鶻每至京師禁民勿私相易其所有寶貨皆中賣入官私下市易者罪之至是太祖命除去舊法每回鶻來者私下交易官中更不禁詰由是玉之價直十損八七顯德六年二月又遣使朝貢獻玉并硇砂等物皆不納所入馬量給價錢時上以玉雖寶珍無益國用故因而却之吐渾吐渾本吐谷渾也唐咸通中其長有赫連鐸者從太原節度使康承訓平徐方有功朝廷授振武節度使復盜據雲中後唐太祖逐之乃歸幽州李儔其部族散居蔚州界立為部長其民不常有白承福者自同光初代為都督依中山地石門為柵莊宗賜其額為寧朔奉化兩府以都督為節度使仍賜承福姓李名紹魯其畜牧就善水草丁壯常數千人羊馬生息入市中土朝廷常存恤之後唐天成三年二月其都督李紹魯等遣使進馬一百二十匹明宗嘉之賜紹魯竭忠建策興復功臣金紫光祿大夫檢校太保至四年八月其首領念公山來朝貢其年十月别部首領薛冀堆進狀乞授嵐州刺史明宗在藩時常與冀堆有舊欲許之樞密使安重誨力諫乃止至長興元年三月竟以冀堆為嵐州刺史仍賜名萬通清泰三年五月以寧朔奉化兩府留後白可久起授檢校司徒副使赫連海龍檢校尚書左僕射兩府大夫李鐵匱檢校尚書右僕射晉天福元年高祖以契丹冊立之功割雁門以北及幽州之地以賂之繇是吐渾部族皆𨽻於契丹其後苦契丹之虐政部族皆怨之後為鎮州節度安重榮所誘乃背契丹率車帳羊馬取其臺路歸國契丹大怒以朝廷招納叛亡遣使責讓六年正月晉高祖命供奉官張澄各率兵二千搜索并鎮欣代四州山谷吐渾還其舊地然亦以契丹誅求無厭心不平之命漢高祖出鎮太原潛加慰撫其年五月其大首領白承福及麾里念虎里赫連功經等來朝九月又遣首領白可久來朝少主嗣位絶契丹之好數召其部長入朝厚加錫每大宴㑹皆命列賜坐於勛臣之次至開運中捍敵於澶州召承福等率其部衆從行屬嵗多暑熱部下多死復遣歸太原移帳於嵐石州界然承福馭下無法多干軍令其族子以白可久名在承福之亞因牧馬率本帳北遁契丹授以官爵復遣潛誘承福承福亦思叛去事未果漢祖知之乃以兵環其部族擒承福與族白鐵匱赫連海龍等五家共四百餘人伏誅籍其牛馬命别部長王義宗統其餘屬奚奚本胸奴别種即東徼之地人物風俗與突厥同族有五姓一曰約羅部管縣六二曰伯特部管縣四三曰敖拉部管縣六四曰美嘉部管縣四五曰綽羅部所管縣三每部有刺史每縣有令首長號奚王唐制兼饒樂府都督居隂凉州東去營府五百里南去幽州九百里幽州置饒樂府長史一人監之人馬約二萬後徙居琵琶川在幽州東北數百里出古北口地宜羊馬羊則純墨馬則前蹄堅善走以馳獵為務逐獸高山自下而上其勢若飛語與契丹小異㸑以平底瓦鼎煮穄為粥既飪以寒水解之而食每春借邊民之荒田種穄秋熟方來持穫畢則窖於山下人莫知其處所以木為碓斷椽為臼所受不過一斗自天祐初契丹兵力漸盛室韋奚霫皆受制焉故奚之部族為契丹代守邊土甚慮其虐其首領竒珠怨之以别部內附徙於媯州依北山而居漸至數千帳故有東西奚之號竒珠卒其子薩喇代立後唐莊宗破幽州賜薩喇姓李名紹威後唐同光元年十二月遣使朝貢三年九月以莊宗誕節至遣使表貢方物天成四年薩喇因剪爪傷乃卒其子蘇庫代立亦時遣使入朝清泰三年七月其首領逹爾罕遣都爾嘉奏其王蘇庫謀叛欲附契丹已處置訖權知部落廢帝降詔以慰撫之晉天福元年高祖以契丹有助立之功割雁門以北及幽州之地以賂之繇是奚之部族復𨽻於契丹自後常為契丹之所役屬開運三年十二月契丹犯闕其王伊喇以所部兵屯於洛陽及虜主死隨衆北遁五代㑹要卷二十八
