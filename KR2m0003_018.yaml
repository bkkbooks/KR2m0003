body:
  text: 五代會要卷十八宋王溥撰史館移置周廣順三年九月敕入厚載門內向東橫街東地房宇宜令𢎞文館集賢院于此分擘廨署諸司送史館事例後唐同光二年四月史館奏本朝舊制中書并起居院諸司及諸道州府合録事件報館如右時政記中書門下録送起居注左右起居郎録送兩省轉對入閣待制刑曹法官文武兩班上封章者各録一本送館天文祥變占候徴驗司天臺逐月録報並每月供送厯日一本祥瑞禮部逐季録報並諸道合畫圖申送藩客朝貢使至鴻臚寺勘風俗衣服貢獻物色道里逺近並具本國王名録報四裔入冦來降表狀中書録報露布兵部録報軍還時并主將姓名具攻陷虜殺級數并所因由録報變改音律及新造曲調太常寺具録所因并樂詞牒報法令變革斷獄新議赦書德音刑部逐季具有無牒報詳斷刑獄昭雪寃濫大理寺逐季牒報州縣廢置及孝子順孫義夫節婦有旌表門閭者户部録報有水旱蟲蝗雷風霜雹户部録報封建天下祠廟敘封進封邑號祠司封録報京百長官刺史以上除授文官吏部録報武官兵部録報諸色宣敕門下中書兩省逐月録報公主百官定諡考功録行狀並諡議逐月具有無牒報宗室任官課績并公主出降儀制宗正寺録報刺史縣令有灼然政績者本州官録申奏仍具牒報應碩德殊能高人逸士久在山野著述文章者本州縣不以官秩勘問的實申奏仍具録報應中外官薨已請諡許本家各録行狀一本申送右乞宣下有司條件施行從之長興三年司天臺奏奉中書門下牒令逐年申送史館十一曜細行厯并周天行度祥變等當司舊祇申星曜事件不載占言敕宜令司天臺密奏留中外其餘凡奏厯象雲物水旱等事及諸州府或奏災祥一一並申送史館前代史晉天福六年二月敕有唐逺自髙祖下暨明宗紀傳未分書志咸闕今耳目相接尚可詢求若歲月寖深何由尋討宜令户部侍郎張昭起居郎賈緯祕書少監趙熙吏部郎中鄭受益左司員外郎李為先等修撰唐史仍令宰臣趙瑩監修其年四月監修國史趙瑩奏敕同撰唐史起居郎賈緯丁憂請以刑部侍郎吕琦侍御史尹拙同修從之尋改吕琦為户部侍郎尹拙為户部員外郎令與張昭等修唐史其年四月監修國史趙瑩奏自李朝喪亂逮五十年四海沸騰兩都淪覆今之書府百無二三臣等近一作虔奉綸言俾令撰述褒貶或從于新意纂修須按于舊章既闕簡編先虞漏略今據史館所闕唐書實録請下敕命購求況咸通中宰臣韋保衡與蔣伸皇甫煥一作燠撰武宗宣宗兩朝實録又光化初宰臣裴贄撰僖宗懿宗兩朝實録皆遇國朝多事或值鑾輿播越雖聞撰定未見流傳其韋保衡裴贄合有子孫見居職任或門生故吏曽記纂修聞此撰論諒多欣愜請下三京諸道及中外臣寮凡有將此數朝實録詣闕進納請量其文武才能不拘資地除一官如卷帙不足據數進納亦請不次奬酬以勸來者自會昌至天福垂六十年其初李德裕平上黨著武宗伐叛之書其後康承訓定徐方有武寧本末之傳如此事類記述頗多請下中外臣寮及名儒宿學有於此六十年內撰述得傳記及中書銀臺史館日厯制敕册書等不限年月多少並許詣闕進納如年月稍多記録詳備請特行簡拔不限資序臣與張昭等所撰唐史祇敘本紀以綱帝業列傳以述功臣十志以書刑政本紀以綱帝業者本紀之法始於春秋以事繫日以日繫月以月繫時以時繫年刑政無遺綱條必舉須憑長厯以編甲子請下司天臺自唐髙祖武德元年戊寅至天祐元年為甲子轉年長厯一道以憑編述本紀列傳以述功臣者古者衣冠之家書於圖籍中正清議以定品流故有家史家傳族譜族圖江左百家軒裳綴軌山東四姓簮組盈朝隋唐以來勳書王府故士族子弟多自紀世功貴載簡編以光祖考請下文武兩班及藩侯郡牧各敘兩代官婚名諱行業功勳狀一本如有家譜家牒亦仰送官以憑纂修列傳十志以書刑政者五禮之書代有沿革至開元刋定方始備儀洎寶應以來典章漸缺其謁欵郊廟册拜王公攝事相儀之文車輅服章之數請下太常禮院自天寶以後至明宗朝以來五禮儀注朝廷行事或異舊章出增損節文一一備録以憑撰述禮志四縣之樂不異前文八佾之容或殊往代隋唐以來樂無中外乃有文舞武舞之制立部坐部之名天寶之初雲韶大備天寶之後音律漸衰郊廟殿庭舊章斯缺及咸秦蕩覆鍾石淪亡龍紀反正之年有司特鑄懸樂旋宫之義徒有其文請下太常寺其四縣二舞增損始自何朝及諸廟樂章舞名開元十部興廢本末一一按録以憑撰述樂志刑名之制代有輕重隋唐以來疏為律令纍朝繼有制敕相次增益舊條格律之文未能畫一請下大理寺自著律令以來後敕入格條者及會昌以來所斷疑獄一一關報以憑撰述刑法志律厯五行天文災異史書實録前代具書自唐季亂離簡編淪落太史所奏不載册書請下司天臺自會昌以來天文變異五行休咎厯法更改更據朝代年月一一條録以憑撰述天文律厯五行等志唐初定官品令三公三師為第一品尚書令僕射為第二品兩省御史臺寺監長官六尚書為第三品自定令以後官品繼升比諸令文前後同異又有兼攝撿校之例資授册拜之文軍容或盛於朝儀使務漸侵於省局以此官無定令位以賞功臺府之權隨時輕重求諸官志前代無聞請下御史臺自定令以後文武兩班品秩升降及府名使額寺署廢官名色更改一一具析以憑撰述職官志唐初守邊則有都督總管之號開元命將則有節度按察之名故四塞之內刺史多沒于遐荒九牧之中乘寵遂邀於旄鉞山河異制名額實繁請下兵部職方自開元以來山河地里使名軍額州縣之廢置一一條列以憑撰述郡國志唐初以降迄于開元圖書大備歷朝纂述卷帙實繁若不統而論之何彰文雅之盛請下祕書省自唐以來古今典籍經史子集元撰人名氏四部大數報館以憑撰述經籍志右所陳條例如前請下所司從之其月起居郎賈緯奏曰伏以唐高祖至代宗已有紀傳德宗亦存實録武宗至濟陰廢帝凡六代惟有武宗實録一卷餘皆缺略臣今搜訪遺文及耆舊傳説編成六十五卷目為唐朝補遺録以備將來史官條述至開運二年六月史館上新修前朝李氏書紀志列傳共二百二十卷並目録一卷都計二十帙賜監修宰臣劉昫修史官張昭逺直館王伸等繒綵銀器各有差修國史後唐天成三年十二月史館奏據左補闕張昭狀嘗讀國書伏見懿祖昭烈皇帝自元和之初獻祖文皇帝於太和之際立功王室陳力國朝太祖武皇自咸通後來勤王戮力剪平多難頻立大功三換節旄再安京國莊宗皇帝親平大憝奄有中原倘闕編修遂成湮墜伏請與當館修撰參序條綱撰太祖莊宗實録者伏見前代史館歸于著作國初分撰五代史方委大臣監修自大厯後來始奏兩員修撰當時選任皆取良能一代之書使成於手其後源流失緒波蕩不還冒當修撰之名曷揚褒貶之職及乎編修大典即云别訪通才況當館職在編修合令撰述敕宜依四年七月監修國史趙鳯奏當館奉敕修懿祖獻祖太祖莊宗四帝實録自今年六月一日起手旋具進呈次伏以凡關纂述務合品題承乾御宇之君行事方云實録追尊册號之帝約文祇可紀年所修前件史書今欲自莊宗一朝名為實録其太祖以上並自為紀年從之其年十一月史館上新修懿祖太祖紀年録共二十卷莊宗實録三十卷監修宰臣趙鳳修撰張昭逺吕咸休各賜繒綵銀器等應順元年閏正月平章事監修國史李愚與修撰判館事張昭逺等進新修後唐功臣列傳三十卷清泰三年二月門下侍郎平章事監修國史姚顗上明宗實録三十卷同修撰官中書舍人張昭逺李祥直館左拾遺吳承範右拾遺楊昭儉等各頒賫有差漢乾祐二年二月敕左諌議大夫史館修撰賈緯左拾遺直史館王伸宜令同修高祖實録仍令宰臣蘇逢吉監修至其年十月修成實録二十卷上之其年十二月敕宜令監修國史蘇逢吉與史館賈緯并竇儼王伸等修晉朝實録呈進從宰臣竇正固奏請也周廣順元年七月史館新修晉高祖實録三十卷少帝實録二十卷上之顯德三年十二月敕太祖實録並梁均帝唐清泰二主實録宜差兵部尚書張昭修其同修撰官委張昭定名奏請至四年正月兵部尚書張昭奏奉敕編修太祖實録及唐梁二末主實録今請國子祭酒尹拙太子詹事劉溫叟同編修伏緣漢隱帝君臨太祖之前其歷試之績並在漢隱帝朝內請先修隱帝實録又梁末主之上有郢王友圭篡弒居位未有紀録請依宋書劉劭例書為元凶友圭其末主請依古義書曰後梁實録又唐末主之前有應順帝在位四月出奔亦未編紀請書為前廢帝清泰主為後廢帝其書並為實録從之五年六月兵部尚書張昭逺等修太祖實録三十卷上之修史官後唐長興四年正月十一日史館奏當館承前修史事例應合編録文書分配在館修撰直館官員逐人紀述內修撰一員充判館事自除修撰外應館中著述及諸色公事都專主掌監修宰臣通判前修撰直館等其間勤恪者著述不間怠惰者因循度日祇藉館中揚歷以資身事進趨或别除官或因出使便將自己分合撰史籍送付後人後人效尤依前懈墮積疊不了公事為弊滋多須設規程庶無曠敗謹具起請如左自判館修撰以下見充職及此後充館請以二周年為限據在職館中文書繁簡逐季分配纂修如月未滿公事未闕即當館給與公憑仍旋申中書門下請别商量其職限內遇本官本省署有遞遷請不妨其序進即請令依前充職終其月限並請不許未終職限特更除官如職限滿有公事未了不許給月請不别與除官及差使並與遞遷本官其曠職甚者仍請量事殿罰如據所分配文書修撰外别能採訪得無後功臣事實及諸色合編集事著撰得史傳堪入國史者請量其課績别加酬奬如當館於職限滿官員中藉令充職者則旋具聞奏乞就加升陟應此日已前曽充館職配過文書除丁憂官員則請與均分代修撰其未了别除官者所欠文書不計多少並與令本官修撰速須了畢其今日已前曠墮之過特乞矜容起今後若更將已前未了公事遷延不速修撰了者則别具奏聞仰候聖裁右奉敕宜依仍付所司其年七月以著作佐郎尹拙為左拾遺直史館王慎徽為右拾遺直史館從監修宰臣李愚奏也故事以本官直館者皆為畿縣尉今諫官直館自拙等始也史館雜録後唐同光二年四月史館奏四庫書自廣明年後散失伏乞許人進納仍中書門下降敕條件敕進書官納到四百卷已下皆成部帙不是重疊及紙墨書寫精細已在選門未合格人每一百卷與減一選無選減者注官日優與處分無官者納書及三百卷特授試銜天成二年八月起居郎趙熙奏今後凡公事及詔書奏對應不到中書者伏乞委內臣一人旋具抄録月終關送史館敕宜令樞密院學士月終録送長興二年三月二十八日史館奏當館應諸處及諸關送到合編録公事外伏準舊例國朝有時政記並起居注並合送館以備纂修近代以來缺行此事祇以每遇入閣兼內殿起居朝臣待制轉對公事逐人抄送當館如是顯有頒行逐司關報到者旋逐件於日厯一一收竪其有直下所司並不行之事當館無由得知若祇憑本官供到所奏本未免簡編不備本末難窮者前件待制轉對公事等除顯有頒行關送到館外應有直下所司及不行未行之事伏乞宣付當館旋依次第編録其時政記起居注並內庭逐日合書日厯亦乞相次施行奉敕朝臣起居入閣奏對公事奏覆後宣付史館宜依其時政起居注候别敕處分其年四月四日史館奏當館昨為大中以來迄于天祐四朝實録尚未纂修尋具奏聞謹行購分募敕命雖頒於數月圖書未貢於一編蓋以北土州城久罹兵火遂成滅絶難可訪求竊恐歲月漸深耳目不接長為闕典過在攸司伏念江表列藩湖南奧壤至於閩越方屬勳賢戈鋋自擾於中原屏翰悉全於外府固多奇士富有羣書其兩浙福建湖廣伏乞特降詔旨委各於本道採訪宣宗懿宗僖宗昭宗以上四朝野史及逐朝日厯除目銀臺事宜內外制詞百司沿革簿籍不限卷數據有者抄録進上若民間收得或隱士撰成即令各列姓名請議爵賞從之四年正月十一日史館奏當館先奉敕修撰功臣列傳元奏數九十二人館司分配見在館官員修撰其間亦有不是中興以來功臣但據姓名便且分配修撰將求允當須在品量其間若實是功臣中興社稷者須校其功勳大小德業輕重次第纂修排列先後今請應不是中興以來功臣汛將行狀送館者若其間事有與正史實録列傳內事相連絡者則請令附在紀傳內簡略書出其無功于國無德于人但述履行身名或録小才末技倘無可以垂訓者並請不在編修之限伏自有史傳以來歷代咸有著述皆存定制不可更張如前漢止述蕭曹絳灌之流後漢但書冦鄧耿賈之列並同翼戴咸共匡扶爵號功臣先為列傳其餘宗室外戚文苑儒林遊俠逸人循吏酷吏之屬名目甚衆各有篇題並隨具次第撰述其大惡大善之人有善若周孔夷齊惡若敦元莽卓亦各特為著撰不附傳紀編修或為世家或為列傳蓋欲取監前代垂則後人不可雷同請令區别其功臣未納到行狀者館司見更催促候到即更分配修撰大凡行狀皆是門人故吏敘述多有虛飾文華今請此後所納行狀並須直書功業不得虛紀文詞其已納到行狀合著撰者仍請委修撰官略其浮詞採其實事從之應順元年正月敕今後三館所闕書並訪本添寫其進書官權宜停罷晉天福四年十一月史館奏按唐長壽二年右丞姚璹奏帝王謨訓不可闕文其仗下所言軍國政事令宰臣一人撰録號時政紀唐明宗朝又委端明殿學士撰録逐季送付史館伏乞遵行者宜令宰臣一員撰述周顯德元年十月監修宰臣李榖奏今之左右起居郎即古之左右史也唐文宗朝命其官執筆立於殿階螭頭之下以紀政事後則明宗朝命端明殿及樞密院直學士皆輪修日厯旋送史館以備纂修降及近朝此事皆廢今後欲望以咨詢之事裁制之規别命近臣旋具抄録每當修撰日厯即奉封送史臣從之因命樞密院直學士起今後于樞密使處逐月抄録事件送付史館二年十二月詔曰史館所少書籍宜令本館諸處求訪補填如有收得書籍之家並許進納其進書人據部帙多少等第各與恩澤如卷帙少者量給資帛如館內已有之書不在進納之限仍委中書門下于朝官中選差三十人據現在書各求真本校勘刋正舛誤仍於逐卷後署校勘官名宜令館司逐月具功課申中書門下𢎞文館後唐同光三年七月𢎞文館奏請依六典故事改𢎞文館為崇文館敕崇文館比與𢎞文館並置今請改稱頗協舊典從之時樞密院郭崇韜父名𢎞豆盧之言革希意奏改之故有𢎞文並置集賢院唐應順元年閏正月集賢院奏準敕書創修凌煙閣又奉正月一十二日詔問閣髙下等級凌煙閣都長安時元在西內三清殿側畫像皆北向閣有隔隔內西北寫功髙宰輔南面寫功髙諸侯王隔外面次第圖畫功臣題贊自西京傾陷四十餘年舊日主掌官吏及畫像工人淪喪集賢院元管寫真官畫真官人數不少自遷都洛京並皆省廢今特起閣時請先定佐命功臣人數下翰林院預令寫真本及下將作大匠與畫工相度門架修蓋緣院內有寫真官沈居隱畫真官王武瓊二人身死即日無人應用伏候敕旨敕集賢御書院復置寫真官畫真官各一員餘依所奏五代會要卷十八
