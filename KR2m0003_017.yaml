body:
  text: 五代會要卷十七宋王溥撰王府官後唐長興四年四月以祕書監劉贊為秦王傅前忠武軍節度判官蘇瓉為秦王友前襄州觀察支使魚崇逺為秦王府記室參軍時言事者請為秦王置師傅上顧問近臣皆以秦王名勢隆盛不敢置制請自選擇方降是命致仕官後唐長興三年八月敕應內外致仕官自此凡要出入不在拘束之限雜録後唐同光三年八月敕諸寺監人吏授官從來祇計勞考年滿起選方許離司近日以來頗隳舊制到司曽無考課公事尚未諳詳便求薦論深為僥幸遂使故事都廢蓋由舊人不存豈惟勞逸不均兼致司局曠敗自今除年勞考滿三銓官即許赴任非時不得奏薦如有主掌重勞績可稱許赴司奏聞當與減選或是顯然事迹在司年深祇役不任即許解職赴任餘依格條處分天成四年九月敕諸司寺監凡有文簿施行奏覆司長須與逐司官員同簽署申發不得司長獨有指揮其主印官或請假差使其印須依倫次主簿不得踰越長興二年八月敕應諸司職掌人吏前後選授州縣官考滿日委本處申奏各追還司職依舊職執行公事四年六月十日敕起今後諸司初除官勒留職人吏等並於省員州縣判司簿尉內除授免侵使見親公事正員及不支料錢周顯德三年十月敕應諸司寺監今後收補職役人等並須人材俊敏言行可採書禮分明履行清謹敕本司關送吏部引驗人材校考筆札其中選者具引驗可否連所試書迹並驗本州府不係色役回文及正身引送中書後吏部具夾名聞奏候敕下勒本司收補餘從前後格敕處分每年祇得一度奏補其諸司寺監舊額人數仍令所司量公事繁省於未奏補人數內酌詳增損别為定額試攝官後唐天成元年十月十六日敕朕以削平區宇撫育蒸黎頃當災歉之餘未絶瘡痍之苦緬維邦本實係官常茍未致於雍熙則曷寧於宵旰必在求之良吏委以親人倘或因循遂成勞擾先朝以選闕攝官既無尤多闕近年以來銓注無幾遂至諸道州縣悉是攝官既無考課之規豈守亷勤之節而況多因薦託茍徇請求替罷不常迎送為弊殘民害物熾然成風言念所深焦勞何已宜令三司及諸道州府據見任攝官如未有正官具差攝月日録名申奏如已後或為公事及月限已滿乞行替移即須具月日并選差將來攝官歷代職任姓名聞奏替免無故頻有替換如有內外臣僚輒行薦託當舉憲章四年正月敕大理寺近為陵臺令冒稱試銜按法以詐假論又據長定格選人無出身未曽任正員官使虛銜散試官奏受正員官及權知權判等官未得資自以諸事故解官並立選集限敕天下州府例是攝官或因勘窮遂為詐假法書中雖云不可選條內其奈不無今日以前或有稱試銜者一切不問此後並宜禁止晉開運元年十二月中書門下奏諸司寺監若無私不合一例差署攝官況目前元無敕命指揮又不曽具名奏聞其太常寺太祝奉禮逐年祇應祠祭行事不可缺人其太常寺已差攝官滿五年者宜比三傳出身其餘諸司寺監今日已差攝官滿五年者宜比明經出身今既稍已年滿者各委本司一月內具所差年月鄉貫三代申奏下中書追引本司差攝文牒及親公事文書點檢不虛奏覆敕下後方理選數仍給與優牒候合格日赴選如攝太常寺太祝奉禮有已滿三年已上者亦許一齊奏請候滿五周年準前事例施行其餘諸寺監攝未滿五年者不在施行兼今後諸司寺監不得更差攝官其太常寺除正官數少宜許差前資判司主簿及黃衣選人充仍先具姓名申奏取裁不得充原額人數所攝一任限三周年為滿每年與減一選候罷攝日準前給與優牒候本選合格日執優牒赴選從之三年五月敕有司差攝官員今日已前任攝滿五年者宜追驗本司差攝文牒及親公事文書並鄉貫三代點檢與授初官起今後所司如更有闕須差攝官者可具所攝鄉貫三代奏聞周顯德元年正月一日赦節文其諸寺監官奴滿七周年已上應奉公事無遺闕文書灼然者並與同明經出身如不滿七周年者任逐便穩今後寺監不得以白身署攝如違本司官文並行朝典其年十一月二十二日敕節文起今後諸處州縣官考限已滿替人未到間宜令且守本官執行公事仍令依舊請俸不得擅離任所州府亦不得差署攝官替下如有遭憂停任身故假滿百日及非時闕官之所祇可差人承攝六年七月二十三日敕攝官承乏或久廢於公勤因時側揚宜特行於旌録諸處自前應有攝官曽經五度者與一時出身仍先令所司磨勘須得任親公事文書解由分明每攝須及半年已上方得充為任數仍令所司引驗人材及考試書判灼然堪録用者方得施行偽官後唐同光三年閏十二月敕初平偽蜀應偽署官員等官至太師太傅及三少並太尉司徒司空侍中中書令左右僕射已上並宜降至六尚書臨時更酌高下為六行次第階至開府特進金紫者文班降至朝議大夫武班降至銀青爵如是舊偽署將相已上與開國男三百户餘並不許有封爵其有功臣名號並須削去如檢校官至郎中員外郎兼侍御史已下如是偽署節鎮率先向化及立功效者委行營都統緣事迹授任如刺史除停罷外有見任政績可稱者但許稱使君不得更有檢校及兼官其偽署班行正官四品已上依此降絀五品已上如不曽經本朝授官又無族望可稱者材智有聞即許於府縣官中量材任使如無材智可録者並宜放歸田里若西班有稱統軍上將軍者若本是功臣子孫及將相之後並據人材高下與諸衛小將軍率府副率中郎將次第授任如是小將軍以下堪任使者委西川節度使補衙前押衙已下職所有歸降官除軍前任使下並稱前銜續據才行任使應順元年三月二十日敕節文如有賣官買官人等並準長興四年三月二十七日斷魏欽緒犯買官罪決重杖一頓處死敕處分其詐假官及冒名接腳等並準律文及天成元年九月十六日敕指揮漢乾祐二年四月中書門下奏準吏部南曹鎖宿內選人中有契丹會同年號厯子解由考牒未審合各令改就天福年號為復别有指揮奉敕應是偽命文書不在施行之限者今有緣晉朝授官契丹年給解由厯子若執格敕又慮有廢身名凡州縣幕府曽授契丹偽命者追毁文書祇取唐晉朝出身文書參選本選外仍殿五選降三資注擬凡唐晉朝諸科及第人於契丹年號內出給文集許追毁換給仍自新給年月日理選從之御史臺後唐同光二年三月二十日御史臺奏所除勘諸道節度觀察防禦經略等使刺史縣令及諸道幕府兼諸司帶憲銜兼官合納光臺錢謹具本朝元納及減落錢數如後兼御史大夫元納三十千減外納一十五千兼御史中丞元納二十千減外納一十千兼侍御史元納八千三百減外納四千一百五十兼殿中侍御史元納一十一千三百減外納五千六百五十兼監察御史元納一十三千三百減外納六千六百五十以前臺司準本朝例及減落後所徴錢數分析如前應有諸道節度觀察使經略防禦等使及諸道幕府上佐官並諸司班行新受兼官者並合送納前件光臺憲銜禮錢今欲準例勒辭謝樞使官申報兼牒兵部敕告身案除在宣取外準例候送納光臺禮錢畢朱鈔到方可給付仍轉帖諸道進奏及諸州使後院等準前事例申報催徴無致有隳舊規從之周顯德五年閏七月一日御史臺申見行事件應新除節度防禦團練刺史賓幕州縣官兼帶五院憲銜合徴光臺禮錢如是已曽納過準舊例不徴兼御史大夫元徴三十千今徴六千兼御史中丞元徴二十千今徴四千兼侍御史元徴八千三百今徴一千六百六十兼殿中侍御史元徴一十一千三百今徴二千二百六十兼監察御史元徴一十三千三百今徴二千六百六十天成元年十二月十一日御史臺奏本朝舊例合行公事如後應諸道進奏院準本朝例各合置臺巡驅使官一員凡有公事並合申臺巡逐日在臺應奏公事應諸道進奏官每四季月初及五月一日冬至並新除大夫中丞並合臺參伏自偽朝以來全隳舊制今準敕命條疏請準舊例施行應諸道節度觀察防禦經略團練使及諸州刺史新除赴任及幕僚上佐官等得替及準由進奉到闕及歸本道並合廊參正衙謝見辭如遇大夫中丞入臺並合臺參凡有公事及到發日並合申報如違追勘進奏官右典偽朝以來全隳往制罕成倫理頗失規繩伏乞特降明敕指揮不令隳紊從之長興三年三月敕近月纍據御史臺奏陳狀訴屈人據狀內皆是訊鞫多時却曉示陳狀人送道依次第論對及州府追到本支證本人又不到彼處恐紊規繩須行條理宜令御史臺今後諸色人論訟稱已經州府斷遣後抑屈更不在牒本道勘逐便可據狀施行若未經州府論訴驀越陳狀可具事由勒本道進奏官差人齎牒監送本處就關連人勘斷訖奏四年五月二十五日御史中丞龍敏等奏陳事如後一臺司除御史中丞隨行印及左右巡使監察使並出使印等外其御史臺印一面先準令式即是主簿監臨近年以來緣無主簿遂至內殿御史權時主持又常隨官出入不定伏緣臺中公事不同諸司動繫重難常虞留滯當申奏申堂之際及牒州府之時事無輕重並使此印今準令式逐日有御史一員臺直承受制敕公文其御史臺印今後欲勒留臺中不令在外選差令史一人帖司一人同知此印凡有諸色大案印發之時準指揮諸司各置印厯一道具其事節件數書在厯中即於直官面前點檢印發其印至夜封閉俟交直轉付下次直官共議執行一御史臺前總朝綱執事天憲所管人吏色役最多上至朝堂次及班列或在京勾檢公事或外地推勘稽遲監守狴牢行遣案牘或隨從出使或祠祭監臨凡有係於臺司皆須藉其人吏俾無闕事以贊國容近年以來人數極少及月限者授官出外為官滿者追召未來人力不充公事停滯今欲于諸州使院內量事差取十人據臺中諸司闕人臨時量材填補者一其臺中令史今欲條流凡出官考滿却來歸司者便具到日申所司繫其選限如有經年不到追召不來即具申堂便乞除落姓名奉敕宜依凡京百司人吏考滿歸司繫其選限亦宜令準此周廣順二年十月敕今後凡有百姓訴論及言災沴先訴於縣縣如不治即訴於州州治不平訴於觀察使斷遣不當即可詣臺省申訴如或越次論訴所司不得承接如有詆犯準律科懲御史大夫後唐天成元年六月以李琪為特進行御史大夫自後不除御史中丞後唐天成元年十一月諸道進奏官等狀臣等今月四日中丞上事禮合至臺比期不越前規依舊傳語忽蒙處分通出尋則再取指揮要明審的又蒙問大夫相公上事日如何臣等云大夫曽為宰相進奏官伏事中書事體之同實為舊例若以别官除受合云傳語又兼傳指揮便令通出臣等出身藩府罕習朝儀拒命即恐有奏陳遵稟則全隳儀矩伏恐此後到臺參賀規則不定者敕御史臺是中朝執憲之司乃四海繩違之地凡居中外皆俟整齊藩侯尚展於公參邸吏豈宜於抗禮據觀論列可驗輕誣但以喪亂𢎞多紀綱隳紊霜威掃地風憲銷聲今則景運維新皇圗重整宜加振舉漸止澆訛宜令御史臺凡關舊例並須舉行稍不稟承當行朝典時盧文紀初授中丞領事於御史府諸道進奏官來賀文紀曰事例如何臺吏喬德威等言朝廷在長安日進奏官見大夫中丞如胥吏見長官之禮及偽梁將革命本朝微弱諸藩強據人主大臣皆且姑息邸吏時中丞上事邸吏雖至皆於客舍傳語竟不相見自經兵亂便以為常文紀令臺司諭以舊儀相見據案端簡通名贊拜邸吏輩既出怒不自勝相率於閣門求見騰口喧訴上謂趙鳳曰進奏官比外何官鳳對曰府縣發遞祇候之流上曰乃吏卒耳安得慢吾法官乃下此敕晉天福五年二月以御史中丞為清望正四品侍御史晉天福四年三月御史臺按六典侍御史掌糾舉百寮推鞫獄訟居上者判臺知公廨雜事次知西推贓贖三司受事次知東推理匭伏乞今後準故事施行敕宜依舊制尋以尚書駕部員外郎兼侍御史知雜事劉皞為河南少尹自是無尚書郎知雜事者其年五月御史臺奏尚書郎知雜事之時赴臺禮上軍巡邸吏咸集公參府司兩縣皆呈印杖今御史判雜上事欲準前例從之開運二年八月敕御史臺準前朝故事以郎中員外郎一員兼侍御史知雜事近年停罷獨委年深御史知雜振舉之司紀綱未峻宜遵故事庶協通規宜於郎署中選清慎強幹者兼御史知雜事殿中侍御史後唐天成二年九月二日御史臺奏每遇入閣日祇一員侍御史在龍墀邊祇候彈奏公事或有南班參雜失儀點檢不及難於舉奏者今欲依常朝例差殿中侍御史二員於鐘鼓樓會位各綴供奉官班出入所在共為糾察從之監察御史後唐同光二年五月御史臺準本朝故事六察合行職事如後吏察應吏部南北兩曺磨勘選人各具駁放判成人名銜牒報分察使及三銓應鎖銓注官後具前銜名擬報分察使點檢若有踰盜即察使舉追本行人推鞫户察應户部司諸州户帳貢物出給蠲符具事件合報察使兵察應兵部公事一一合報察使刑察應刑部法律赦書德音流貶量移斷罪輕重合報察使禮察應禮部司補轉鑄印諸祠祭料法物合報察使工察應工部司工役合報察使右御史臺六員監察謂之分察使但緣曠廢久不舉行今欲依條貫施行從之御史臺主簿後唐天成四年八月御史臺孔目官閭圭狀分析每大夫中丞奏請雜端主事等官承前隨廳罷任其主簿朱頴見任伏候敕裁敕諸道賓從即隨府罷臺主簿既為正秩沈入選門顯自敕恩須終考限朱頴宜仍舊官知班周廣順三年三月十四日殿中侍御史賈玭殿中侍御史劉載狀申自漢朝次每遇內殿起居臺司定左右巡使先入起居後於殿庭左右立定百官始入起居有失官儀便宜彈奏者今後欲依入閣彈奏儀折署奏後宣徽使言所奏知通事舍人喝拜再拜訖便退如兩巡使自有失儀亦候班退互相彈奏推事周顯德五年閏七月一日御史臺申臺司見管四推臺一推臺二推殿一推殿二推臺或準敕命宣頭堂帖指揮送到公事並諸道州府論訴準例一人以上三院御史從上輪次配推兼具差定推官名銜申奏申中書門下如是三人以上即本彈推勘若四推皆有公事外更有刑獄即差以次官推勘兼逐日輪差官吏臺直點檢刑獄出使周顯德五年閏七月一日御史臺申臺司或準敕命宣頭委臺司差官出外推勘刑獄舊例於監察御史內從下差定如是特敕定名不拘此例雜録後唐天成四年三月二十日御史臺奏臺中舊有格杖近年不行每有決遣公事皆於河南洛陽兩縣追借人杖今臺中常有囚徒勘責若一一於兩縣追借又緣地里遙逺及候差人往來各有妨滯今臺請置常行人杖免有住滯公事從之晉開運二年八月敕今後諸御史宜令除準式請假外不得以私故小事請假離京並除奉制命差勘公事及案察外不得以瑣瑣細事差使出外漢乾祐三年五月殿中侍御史竇文靖奏臺中糾彈過失舊有十六愆事節次不舉明臣訪聞朝官有便服徒步城市者既通閨籍實汚朝風敕宜令御史臺常加察訪具以名聞當行譴逐隱而不言與之同罪周顯德二年四月三日敕起今後應有自外新除御史未經朝謝者經過州府不得受館驛供給及所在公禮時有庾元晟居秦雍間拜殿中侍御史遽入秦州驛受軍州禮上知之故有是敕五代會要卷十七
