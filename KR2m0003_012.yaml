body:
  text: 五代㑹要卷十二宋王溥撰寺後唐天成元年十一月勅應今日已前修葢得寺院無令毁廢自此後不得輒有建造如有願在僧門亦宜准佛法格例官壇受戒不得衷私剃度二年六月七日勅應天下大寺及勅賜名額院宇兼有功徳堂殿樓閣已成就者各勒住持其餘小小占射或舎施及置買目下屋宇雖多未有佛像者並須量事估價一時任公私收買其住持僧便委功徳使及隨處長吏均配於大寺安止如院在僻靜之處舎宇無多不堪人承買者便仰毁拆其材木給付本僧田地任人請射仍限勅到後十日内並須通勘騰併了絶如敢遷延及有故違其所犯僧徒二年尼杖七十並勒還俗若有形勢借庇當移不移誑惑官中更求院額旣達聽聞所之人不係官位髙低並行朝典如要增修福利則任於合留寺院内興功晉天福四年十二月勅今後諸道州府城郭村坊不得剏造寺宇所有自前葢者聽依舊住持開運二年七月左諫議大夫李元龜奏天下寺宇房屋近日多開元住僧轉與相典貼伏乞明行止絶從之周顯徳二年五月六日勅條流僧尼畫一如後一諸道州府縣鎮村坊應有勅額者一切仍舊其無勅額者並仰停廢所有功徳神像及僧尼與限一月騰併於逐處州軍縣鎮合留寺院内安置所有殿堂屋宇仰封鎖收管所有資財衣鉢斛斗孶畜什物並仰分付本主一天下諸縣城郭内若無勅額寺院只於停廢寺院内選功徳屋宇最多者或寺或院僧尼各留一所若無尼處只留僧寺院一所其在軍鎮及偏鎮坊郭户及二百户已上者亦依諸縣例指揮所違邉逺郡無勅額寺院處於停廢寺院内僧尼各留兩所一両京諸道州府除見留寺院外今後不限城郭村坊山林勝境古迹之地並不得剏造寺院蘭若如有僧尼俗士輒違勅命者其主首及同勾當人並徒三年仍配役其僧尼勒還族本州府録事叅軍本判官本縣令佐並除名配流地分廂鎮職員所由當並嚴斷長吏奏請進止一王公戚里諸道節刺已上今後不得奏請剏造寺院及請開置戒壇如違仰御史臺彈奏四年九月賜京城内新修四寺額以天清顯靜顯寧聖壽爲名燃燈梁開平三年正月勅兵革方偃久廢燃燈屬在上春務達陽氣宜於正月上元前後三晝夜開坊市門一任公私燃燈祈福周廣順三年七月京城民晁諸殷等爲永壽節請各於門首齋僧燃燈三晝夜從之雜録後唐天成元年十月十一日勅上國兩街僧道自前賜師號不數人而已至於賜紫並係特恩近日諸道州府因應聖節表薦僧道頗多宜令中書門下此後凡有諸處不係應聖節及横薦僧道不得等閒申發章表請行命服師號切思正統二年六月七日勅應條流三京諸道州府縣鎮寺院僧尼事一訪聞近日僧尼等或因援請託以参尋旣徃來以爲常致奸訛之有倖自此後如有官中齋㑹行香顯有告援及大段齋供請命即行依時赴㑹除此外不計齋前齋後僧尼不得輒有相過如敢故違仰逐處坊界所由及廵司節級畫時擒捉並准姦匪例處斷其所犯人衣物資財便充捉事人優賞如有人上告不虛准此酬賞一此後如有修補寺宇功徳要開講求化須至斷屠之日方得於大寺院開啟仍許每寺只開一坐兼不得僧於尼寺内開講尼亦不得將功徳事請僧於諸寺開講如敢故違法師兼功徳至僧徒三年尼並逐出城其坊界及諸營士女不因三塲齋月俗講亦不得過僧舎如公然通同許捉獲所犯人並加極法今後僧不因道塲及齋㑹不得公然於俗舎安下住止如違准上科斷一訪聞僧尼寺院多有故違條法衷私度人此後有志願出家准舊例經官陳狀比試所念經文則容剃削仍不因官壇不得私受戒法如違所犯僧及本師等各徒二年配於重處色役如是尼女及年老者杖之勒還俗若有童子出家亦須顯有分據一訪聞近日有矯僞之徒依慿佛教誑誘人情或傷割形骸或負擔鉗索或書經於都肆或賣藥於街衢悉是乖訛須行斷絶此後如有此色之人並委所在街坊廵司糾察准上决配一此後應是僧尼不計髙低於街衢逢見呵殿官寮並須廻避如有故意違犯者便可收送法司若在身有章服師號者便委長吏舉奏當行剝奪如無章服者仰所在擯逐出城若有房院便許别人請射一州城之内村落之中或有多慕邪宗妄稱聖教或僧尼不辨或男女混居合黨連羣夜聚明散託宣傳於法㑹潛縱恣於淫風若不却除實爲弊惡此後委所在州府縣鎮及地界所由司節級嚴加搜刺有此色人便仰收捉勘實開連黨徒並决重杖處死右宜徧降勅三京諸道州府長吏分明曉示逐處管界各令遵守清泰二年三月兩街功徳使奏毎年誕聖節諸道州府奏薦僧尼紫衣師號今欲量立條試講論科試講經表白各三科文章應制十三科持念一科禪科聲讚科並於本技能中條貫從之晉天福二年十二月二日勅節文祠部奏請不置官壇剃度但於皇帝降聖之辰即於本住處州府陳狀便比試本業勘詳事行不虛則容剃削及取本鄉里五人已上耆宿保明文狀具言已前實是良善兼須結罪如爲僧之後别行惡事即罪甘連坐如是外來百姓不得輒有容許候剃訖仍具鄉貫姓號申祠部請告牒者當司欲依前勅再舉條流如此後遇皇帝降聖之辰即於逐州府投狀剃落仍騐所習經業不虛即具出家因依本居鄉里俗姓法名年幾申省請給告牒始永爲公據若有不遵條理衷私剃度者便委逐州府本判官追收勘責事由不虛其新剃度之人並請重行决斷發遣歸本鄉里收管色役其元招引師生及保人等先具勘責違犯條流愆罪亦請痛行决斷常住所在仍具流號寺院因由申省如是州府不遵勅命衷私剃度不申請祠部告牒其原行官吏請行朝典奉勅宜依周廣順二年四月勅永壽節每年諸道節度防禦團練使刺史奏薦僧尼道士紫衣師號今後見任帶使相共奏二人見任防禦團練刺史只許奏一人在朝文武臣寮及前任官今後更不得奏薦顯徳二年五月六日勅條流僧尼畫一如後一今後僧尼不得私剃頭應有人志願出家者並許父母祖父母處分已孤者取同居伯叔兄處分候聽許得出家其師生須得本人家長聽許文字得容受男十五已上念得經文一百紙或讀得經文三百紙方得經本州陳狀乞剃頭委録事叅軍本判官試騐經文合勅條者只仰聞奏其來剃頭間留髪髻如有私剃頭者却勒還俗其本師主徒三年勒還俗役三年其本寺院三綱知事僧尼杖八十並勒還俗一僧尼今後不得私受戒只於兩京大名府京兆府青州府戒壇候受戒時兩京委祠部差官引試前項所習經業其大名府等三處戒壇只委本判官録事叅軍引試合勅條者分析聞奏如有私受戒者其本人本師主臨壇三綱知事僧尼並同私剃頭例科罪如引試經業不精輒與剃頭受戒者本試官當行朝典一應合剃頭受戒人等仰逐處於天清節一月前具姓名鄉貫寺院年㡬及所習經業申奏候勅下委祠部給付慿由方得剃頭受戒不得非時施行起今後應有僧尼剃頭受戒無祠部慿由者所由並還俗一應男子有父母祖父母在别無兒侍養不聽出家如違其本師主重行科斷一應曾有犯遭官司刑責之人及棄背祖父母父母逃亡如奴婢姦人細作惡逆徒黨山林亡命未獲賊徒負罪潛竄人等並不得出家剃頭如有寺院輒容受者其本人及師主三綱知事僧尼鄰房同住僧仰收捉禁勘申奏取裁其地方廵司官吏不能覺察者仰曁申奏一自前多有逃遁軍人投寺院出家在所僧徒不畏官方便與剃削起今後有向曾在軍門面帶瑕痕逐處寺院輒敢容受者其本人及師主三綱知事鄰房同住僧等仰密切收捉禁勘申奏地方官所由不能覺察重行科斷一應有僧尼衷私剏置院舎私與人剃頭受戒及容賊盗惡逆徒黨姦細背軍之人輒披剃者其僧俗中有能告官及地方分所由節級自收捉到者以本犯僧尼衣鉢貲財給充優賞一應有僧尼俗士自前多有捨身燒臂鍊指釘截手足帶鈐燃燈諸般毁壞肢體戲弄符篆左道妖惑之類今後一切止絶如此色人仰所在嚴斷遣配邉逺仍勒歸俗其所犯罪重者准格律處分所有居停寺院知事僧尼地方廂鎮職員所由公然容縱者重行科斷一應有懷才抱器或武或文寄跡空門莫遂展志其中有願出仕宦者仰逐處長吏發遣赴闕少壯驍勇之人願在軍門者亦仰申奏必當量材録用若僧尼中有情願歸俗者一切聽許所在不得攪擾觀梁開平元年五月六日勅廢雍州太清宫改西都太微宫亳州太清宫皆爲觀諸道州紫極宫並為老君廟後唐同光元年十月西都太微宫亳州太清宫諸州紫極宫皆復本名後唐天成四年十二月勅崇聖祖修飾道州旣復其名固難無額宜令所司依舊造上清宫牌額兼京城内金真觀改為崇道宫亦准上給換牌額以上清宫乆無牌額故也雜錄後唐同光元年十二月亳州太清宫奏聖祖𤣥元皇帝殿枯檜再生枝葉畫圖以進按賴卿記唐髙祖神堯皇帝武徳二年枯檜重華至禄山僣號萎瘁𤣥宗自蜀歸京枝葉復盛至是再生一枝長二尺餘天成三年正月中書門下奏准假寕令𤣥元皇帝降聖節依假三日據績㑹要准㑹昌元年二月勘休假一日伏請准近勅從之清㤗二年三月兩淮功徳使奏毎年聖誕節諸道州府奏薦道士紫衣師號今欲量立條試經法科試義十道講論科試經論文章應制試詩表白科試聲喉聲讚科試歩虚三啟焚修科試齋醮從之晉天福四年三月遣中書使趙處玭以板詔徴少華山隱士鄭雲叟玉笥山道士羅隱之為拾遺不至四月以雲叟為右諫議大夫隱之錫號命希夷先生雲叟稱疾不起賜號逍遥先生仍給致仕宮俸禄金吾衛後唐天成三年六月勅金吾毎奏左右廂内並平安有類藩方宜改云軍國内外並平安屯衛周廣順二年十二月御史臺奏唐景雲二年改左右屯衛為威衛唐髙宗名治改治書侍御史為御史中丞諸州治中為司馬盖臣子避君父名也請諸衛中書舊是屯衛者復舊名從之京城諸軍梁開平元年四月改左右長直為左右龍虎軍左右内衙為左右羽林軍左右堅鋭夾馬突將為左右神武軍左右親隨軍將馬軍為左右龍驤軍其年九月置左右天興左右廣勝軍仍以親王為軍使二年十月置左右神㨗軍十二月改左右天武為左右龍虎軍左右龍虎為左右天武軍左右天威為左右羽林軍左右羽林為左右天威軍左右英武為左右神武軍左右神武為左右英武軍前朝置龍虎六軍謂之衛士至是以天武神武英武等六軍易其軍號而任勲舊焉後唐長興三年三月勅應軍神威雄威及魏府廣㨗以下指揮宜改為左右羽林置四十指揮毎十指揮立為一軍置都指揮使一人兼分為左右廂應順元年三月改左右羽林四十指揮為嚴衛左右軍龍武神武四十指揮為奉聖左右軍清㤗元年六月改捧聖馬軍為彰聖左右軍嚴衛歩軍為寕衛左右軍晉天福六年七月改拱宸威和内直軍並為興順至八月改奉徳兩軍為䕶聖左右軍周廣順元年四月改侍衛馬軍曰龍㨗左右軍歩軍曰虎㨗左右軍御撰其名顯徳元年十月上謂侍臣曰侍衛兵士累朝以來老少相半强懦不分盖徇人情不能選練今春髙平與劉崇及蕃軍相遇臨敵有指使不前者茍非朕親當堅陣幾至喪敗况百户農夫未能贍一甲士且兵在精不在衆宜令一一㸃選精鋭者升在上軍怯懦者任從安便庶期可用又不虚費先是上按于髙平觀其退縮慨然有懲革之意又以驍勇之士多為外諸侯所占于是召募天下豪傑不以草澤為阻進于闕下躬親試選武藝超絶及有身首者分署為殿前諸班因有㪚員散指揮使内殿前直散都頭鐵騎控鶴之類二年十二月改東西小卒為東西班承㫖其月以新收復秦鳯州所擒獲川軍署為懐恩軍四年四月以先降到江南兵士分為六軍共三十指揮賜號懐徳軍雜録後唐同光二年二月勅隨駕收復汴州並扈從到洛京南郊立仗都将官員自檢校司空以下宜並賜恊謀定亂靖國功臣自檢校僕射尚書常侍至大夫中丞宜並賜忠勇拱衛功臣其初帯憲銜並賜忠烈功臣已有功臣名者不在此限其節級長行軍將並賜扈蹕功臣唐𤣥宗平内難賜衛士葛福順等為唐元功臣不過十數人徳宗駐蹕奉天賜從駕立功將校為奉天定難功臣及僖宗西京頻年播遷功臣差多至是徧及戎卒非賞典也其年九月勅近聞蕃方入奏之人多於京内私買衣甲宜令總管司宻加覺察晉天福二年二月勅京及諸道馬歩諸軍若長行違犯便委副將據罪處理如副將十將違犯即委本指揮使科㫁指揮有罪若不出軍即委都指揮使具録申奏若行營在外即委行營統領依軍法施行其諸道軍都在本處者即委本處節度使防禦團練使刺史據罪科㫁其年十月勅禁諸道不得擅造器甲開運元年二月命諸道州府縣㸃集鄉軍率以税户七家共出一卒兵仗器械共力營之至五月勅諸道新㸃鄉兵宜以武定為名至三年正月改武定為天威軍尋命放散其年十月勅作坊及諸道造作器械衣甲今後並不得用金銀裝飾馬梁開平四年十月頒奪馬令冒禁者罪之先是梁師攻戰得敵人之馬必納官故出令命獲者有之後唐同光三年六月下河南河北諸州和市戰馬官吏除一匹外匿者坐罪時將討蜀故也長興元年七月分飛龍院為左右以小馬坊為右飛龍院四年十月勅沿邉藩鎮或有藩部賣馬可擇其良壯給券具數以聞先是上問見管馬數樞宻使范延光奏天下常交草粟者近五萬匹見今西北諸蕃賣馬者徃來如市其郵傳之費中估之直日四十五貫以臣計之國力十耗其七馬無所使財賦漸銷朝廷甚非所利上善之乃降是勅清泰三年十月勅諸道州府縣鎮賔佐至録事参軍都押衙教練使以上各留馬一匹乘騎及鄉射士庶有馬者無問形勢馬不以牝牡皆抄借但勝衣甲並仰印記差人管押送納其小弱病患者即退字本道收管節度防禦團練等使刺史除自己馬外不得因便影占管軍都將除出軍及隨駕外見逐處屯駐者都指揮使舊有馬許留五匹小指揮使兩匹都頭一匹其餘凡五匹取兩匹十匹取五匹更多者並依此例抽取在京文武百官主軍將校内諸司使以下隨駕職員舊有馬者任令隨意進納不得影占人私馬各下諸道准此晉天福九年正月發使於諸道州府括取公私之馬時契丹入冦上駐軍澶州以禦之故冇是命漢天福十二年九月詔天下州府和買戰馬諡徳靖梁贈尚書令廣王全昱文穆故天下兵馬都元帥吳越王錢元瓘勅所司諡曰荘穆勅改諡曰文穆文昭故天䇿上將軍湖南節度使守尚書令贈太師馬希範文懿贈尚書令瀛王馮道文恵太子太保盧質漢乾祐元年九月其子尚書兵部員外郎盧授上請諡故下太常議諡曰文恵武穆故天䇿上將軍湖南節度使馬殷武懿贈尚書令秦王髙行周武安贈太師康福忠敬故秦王李茂正贈太傅馮行襲忠肅贈太師王處存贈太師張全義忠懿故福建節度使閩王王審知太師安元信忠武贈太師晉國公霍彦威故成徳軍節度使馬全節忠正贈中書令鄭仁誨忠恵贈中書令劉詞恭靖贈尚書左僕射崔恊恭慧贈中書令李從敏正懿贈尚書令羅紹威正憲贈左武衛上將軍張承業正恵贈太子少傅朱漢賔太常博士林鼎議曰漢賔散已俸代逋欠缺荒俗儕富庶所莅之地綽有政聲知進退存亡之理得善始善終之道謹按諡法中道不撓保節揚名曰正愛民好學寛裕慈仁曰恵請諡曰正恵從之成穆贈侍中安元信雜録漢乾祐二年十二月勅故荆南節度使髙平王髙從誨宜令太常定諡故事臣下請諡故吏陳行状考功司覆奏下乃議諡今降勅之新例也當直梁開平四年二月勅其逐日當中書舍人及吏部兵部司勅知印郎官少府監及篆印文兼書寫告身人吏等並宜輪次於中書側近止宿休假後唐天成四年五月四日度支奏准勅中書門下奏朝臣時有乞假覲省者欲量賜茶藥奉勅宜依者切縁諸班官班省司不見品秩髙低兼未則例難議施行各令據官品等第指揮文班左右常侍諫議給事舍人諸行尚書太子賔客諸寺太卿國子監祭酒詹事左右丞諸行侍郎宜各賜蜀茶三斤起居拾遺補闕侍御史殿中監察御史左右庶子諸寺少卿國子業司業河南少尹左右諭徳諸行郎中員外郎太常博士宜各賜蜀茶二斤蠟面茶一斤草豆榖百枝肉豆榖五十枝青木香一斤半國子博士五經博士兩縣令著作郎太常宗正殿中丞諸局奉御大理正太子中允洗馬左右賛善太子中舍司天五官正宜各賜蜀茶二斤蠟面茶一斤草豆榖五十枝肉豆榖五十枝青木香一斤武班左右金吾上将軍左右諸衛上将軍宜各賜蜀茶三斤蠟面茶二斤草豆榖一百枝肉豆榖一百枝青木香二斤左右諸将大将軍左右諸衛将軍宜各賜蜀茶二斤蠟面茶一斤草豆榖一百枝肉豆榖五十枝青木香一斤半左右率府副率宜各賜蜀茶二斤蠟面茶一斤草豆榖五十枝肉豆榖五十枝青木香一斤奉勅今後或有臣僚請假覲省其所賜藥候辭朝之日於閤門宣賜至晉天福二年九月度支奏朝臣請假覲省出入皆有支賜茶藥今縁諸庫無見在伏乞權罷從之至五年三月勅朝臣請假覲省依天成四年勅支賜茶藥晉天福二年十一月中書門下奏按六典尚書吏部凡職事官應覲省及稱病不得過程謂身有疾病滿百日若所親疾病滿二百日及當侍解官申省以聞其應侍人材用灼然要藉驅使者得𢃄官侍食又准雜令諸外官授給裝束假去所授官一千里内者四十日二千里内者五十日三千里内者六十日四千里内者七十日過四千里八十日並除程其假内欲赴任者聴之若有事須早還者不用此令若京官身先在外者裝束假减外官之半勅准令典處分醫術後唐清泰三年三月翰林學士和凝奏天下諸屯駐兵士望令太醫署合傷寒時氣瘧痢等藥量事給付本軍主掌以給患病士卒之家百姓亦准醫疾令和合藥物拯貧民兼請依本朝故事諸道署藥博士合考尋醫方合和藥物以濟部人其御製廣濟廣利等方書亦請翰林醫官重校頒行天下勅所奏醫博士諸道合有軍醫許及諸道補署不在奏聞餘依所奏五代㑹要卷十二
