body:
  text: 五代㑹要政書類一通制之屬提要臣等謹案五代㑹要三十卷宋王溥撰五代干戈俶攘百度凌夷故府遺規多未暇修舉然五十年間法制典章尚略具於累朝實錄溥因檢尋舊史條分件繫類輯成編於建隆二年與唐㑹要並進詔藏史館後歐陽修作五代史僅列司天職方二考其他均未之及如晉段顒劉昫等之議廟制周王朴之議樂皆事闗鉅典亦略而不詳又如經籍鏤板昉自長興千古官書肇端於是崇文善政豈宜削而不書乃一概刋除尤為漏略頼溥是編得以收放失之舊聞厥功甚偉至於租税類中載周世宗讀長慶集見元微之所上均田表因令製素成圖頒賜諸道而歐史乃云世宗見元微之均田圖是直以圖為元微之作乖舛尤甚微溥是編亦無由訂歐史之謬也葢歐史務談褒貶為春秋之遺法是編務核典章為周官之舊例各明一義相輔而行讀五代史者又何可無此一書哉乾隆四十六年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:9681625d7cd025dfb4942fe6f3e82527b9a8ebbb18a9f0ad6807a1479f47cdc4
