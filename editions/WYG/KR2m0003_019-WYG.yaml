body:
  text: 五代㑹要卷十九宋王溥撰留守晉天福七年九月勅留守之任委寄非輕凡降絲綸宜同將相今後除留守宜降麻制留守降麻自安彥威始也開封府梁開平元年四月二十三日勅升汴州為東京置開封府以開封浚儀兩縣為赤縣其餘屬縣為畿縣是月勅東京諸城門宜賜名額宋門為觀化門尉氏門為髙明門鄭門為開明門梁門為乾象門酸棗門為興和門丘門為含曜門曹門為建陽門後唐同光元年十二月復降開封為宣武軍節度至天成四年五月勅汴州宫殿並去鴟吻賜本道節度使為治所其衙署諸門園亭名額並廢晉天福三年十月勅汴州宜升為東京置開封府以開封浚儀兩縣復為赤縣其餘屬縣為畿縣應舊制開封府時管屬縣分並可仍舊其月勅東京諸城門宜署名額南面尉氏門為薫風門西面鄭門為金銀一作義門梁門為乾明門北面酸棗門為元化門丘門為宣陽門東面曹門為迎春門宋門為仁和門其牌額宜令翰林院書勒呈進周顯徳五年五月賜東京城門名南面三門曰朱明門景風門畏景門西南二門曰迎秋門肅政門北面三門曰元徳門長景門愛景門東面二門曰寅賓門延春門又以大内舊扁賓天門為通苑門河南府後唐同光三年詳定院奏近升魏州為東京臣檢故事須先定兩府未審依舊以京兆及河南為兩府太原興唐為次府惟復以興王之地别定府名勅故事雍州為西京洛為東都太原府在兩府之次近以中興大業以魏州為東京興唐府權名東都為洛京今後依舊以洛京為東都魏州改為鄴都興唐府興北都太原府並為次府長興三年四月中書門下奏本朝都長安以京北府為上都洛陽以河陽府為上從之晉天福三年十月勅改東都為西京京兆府梁開平元年四月改京兆府為大安府長安縣為大安縣萬年縣為大年縣仍置佑國軍節度使額始命韓建為佑國軍節度使至三年五月改佑國軍為永平軍後唐同光元年十二月廢永平軍額復為西京兆府大安縣為長安縣大年縣為萬年縣晉天福七年十月勅改西京為晉昌軍留守為節度觀察使仍依舊為京兆府在七府之上漢乾祐元年三月改晉昌軍為永興軍周廣順元年六月降京兆府同五府長安萬年縣為次赤縣大名府後唐同光元年四月升魏州為東京都督府曰興唐府元城縣為興唐縣貴鄉縣為廣晉縣至三年三月改為鄴都興唐為次府天成四年五月勅先升魏州為鄴都有留守王城使及宫殿諸門園亭名額並廢晉天福二年九月改興唐府為廣晋府興唐縣為廣晉縣三年十一月勅魏州廣晋府復升為鄴都置留守廣晉元城兩縣為赤縣其餘屬縣為畿縣七年四月勅鄴都諸門宜賜名額羅城南塼門為廣運門觀音門為金明門橙糟門為清景門冠氏門為永芳門朝城門為景風門大城南門為昭明門觀音門為廣義門北河門為靖安門魏縣門為膺福門冠氏門為迎春門朝城門為興仁門上斗門為延清門下斗門為通逺門開運二年四月勅鄴都依舊為天雄軍節度管内觀察處置等使鄴都留守廣晉尹漢乾祐元年三月改廣晉府為大名府廣晉縣為大名縣周廣順元年六月以大名府元城縣為赤縣顯徳元年正月廢鄴都依舊為大雄軍大名府在京兆府之下其屬縣地望官吏品秩並同京兆府諸府後唐長興三年四月中書門下奏案十道圖以闗内道為上遂以鳳翔為首河中成都江陵興元為次中興初升魏州為興唐府鎮州為真定府皆是創業興王之地請升此二府於五府之上合為七府仍以興唐為首真定鳳翔成都江陵興元為次從之都督府梁正明六年閏六月勅宋州為大都督府其年八月勅升福州為大都督府後唐長興三年四月中書門下奏天下舊有八大都府按十道圖以靈州為首陜幽揚潞鎮徐等州為次其魏鎮已升為七府兼具員内越杭福潭等州亦相次升為都督府望以十大都督為額仍據升降次第以民為首餘依舊制從之周廣順三年正月四日勅頃者淮海陸梁舉干戈而入冦湖湘覆没致黎庶之倒懸惟彼武陵素稱雄鎮連營比屋皆懷勇烈之心戮力協謀盡復江山之境宜降褒崇之命以升忠義之邦俾列大藩永率南夏其朗州宜升為大都督府在潭桂之上刺史後唐同光二年中書門下奏刺史縣令有政績尤異為衆所知或招復户口能増加賦税者或辨雪寃獄能全人命者或去害物之積弊立利世之新規有益時政為衆所推者即仰本處逐件分明聞奏當議奨擢或在任貪猥誅戮生靈公事不治為政怠墮亦加懲罰其州縣官滿三考即具闗申送吏部格式候勅除銓注其本道不得差攝官替正授者從之天成元年十二月十九日勅尚書吏部侍郎裴皥所請刺史三考方可替移免有行送之勞若非歳月積深無以彰明臧否自此到任後政績有聞即當就加渥澤如或為理乖謬不計月限便議替除三年五月􅃯刺史以二十五月為限仍以到任日為數四年六月左散騎常侍蕭希甫奏請條流縣令凡死罪以下得専之刺史部内有犯死罪一人得専之觀察使部内有犯死罪五人以下得専之勅刺史既為屬部安可自専案牘既成須申廉使餘依所奏應順元年三月二十日勅刺史縣令丞尉得替自今後如是見任官將已分錢物資送得替人即勿論其或率斂吏民以受所監臨財物論加一等如以威刑率斂以枉法論其去任受財人減二等周廣順二年八月勅今後刺史縣令顯有政能觀察使審詳事狀聞奏朝廷當議奬擢百姓僧道不得舉請一切止絶縣令梁開平四年四月勅天下諸州鎮使官秩無髙卑在縣令之下乾化二年三月詔曰夫隆興邦國必本於人民恵養疲羸尤資於令長茍選求之踰濫固撫理之乖違如聞吏部擬官中書降授或縁親舊所請或為勢要所干姑徇私情靡求才實念兹蠧弊宜舉條章今後應中書用人及吏部注擬並宜省藩身之才業驗為政之臧否必有可觀方可任用如或尚請託猶假貨財其所司人吏必當推窮重加懲斷後唐天成元年八月勅中書先條奏州縣令録正衙謝後合趨内殿謝辭者如令録是除授宜令給事中引對如是指授者准舊例委三銓尚書侍郎各自引對仍須前一日閤門送狀二年九月十九日勅近聞藩鎮幕職内或有帶録事㕘軍兼鄴都管内諸州録事㕘軍從前並兼防禦判官設官分職激濁揚清若網在綱各司其局督郵從事兼處尤難没階則賓主之道虧下榻則軍州之禮失須從改革式振紀綱宜令今後諸州府録事㕘軍不得兼職如或才堪佐幕節度使須具聞奏不得兼録事㕘軍鄴都管内刺史州不合有防禦判官之職今後改為軍事判官如刺史帶防禦團練使額即得奏署防禦團練判官仍不得兼録事㕘軍如此則珠履玳簮全歸客禮提綱振領不紊公途仍付所司三年二月一十三日中書奏應天下縣令逐年夏秋兩税徴科公事伏以縣令之職徴賦為先若違限逋懸自有罰責如及期了畢不謂功勞況今無彊名之科徭絶虚係之税額百姓據見苗輸納官中有指限程期盖縁每及徴科事歸煩擾未容輸納已切催驅州郡則推勘吏人縣邑則禁繫人户雖云提舉貴在徴求動涉旬時固須妨事縱及期限倍困黎民自今後請祇委主簿縣令勾當不得更置監徴每一州之中止限畢日委録事㕘軍磨勘取最後逋欠縣分具本佐名銜申三司使舉奏明行責罰其所欠稅額如是本道長吏及判官衙門節級並形勢莊田不伏縣司徴督者縣令即須自經本州論列如依前不納便可直申三司責罰之時以定輕重其縣令到官之初須准近勅交割户口帳籍至受替之時比較多少如或増多即量加酬奬致逋竄則别示科刑所冀賞罰不涉於過差公務率歸於修舉其本判官都孔目官糧料使等職固不在親人公事止於提舉每至徴科之日皆須一例奬勸或有徴督逋懸令佐獨當得黜伏請今後凡是徴科畢日比較功過只歸令佐如是一郡之内諸縣皆及期程公事修舉其録事㕘軍亦請量加甄奬如管内諸縣並有闕遺其録事㕘軍亦請量加責罰從之其年八月二十五日及十月十五日勅條流公事數内一件縣令化洽一同位居百里固在専勤課撫育疲羸茍或因循是孤委任宜令隨處州府長吏逐縣每年考課如増添得户税最多者具名申奏與加章服酬奬如稍酷虐輒恣誅求減落税額者並具奏聞當行朝典其縣令仍勒州司批給解由厯子之時具初到任所交得户口至得替増減數額分時批鑿將來除官及㕘選委中書門下並銓曹磨勘宜令三京及諸道州府准此四年五月五日户部奏三京鄴都諸州府逐年所徴夏秋稅租兼鹽麴折徴諸般錢榖先定格流如後一若限滿後十分中係欠三分以上者本判官罰五十直録事㕘軍罰七十直本曹官罰五十直縣令罰一百直勒停簿尉罰七十直移攝閒官州縣押司録事本典及鄉里正孔目書手各徒二年仍配重役本孔目勾押官典杖七十都孔目官勾押官杖六十並退職衙前收管一若限滿後十分中係欠二分者本判官罰三十直録事㕘軍罰五十直本曹官罰四十直縣令罰七十直移攝閒官簿尉罰五十直州縣押司録事本典鄉里正孔目書手等杖八十孔目官勾押官典等杖六十孔目官勾押官笞五十一限滿後十分中只欠一分以下者本判官罰二十直録事㕘軍罰三十直本曹官罰二十直縣令罰五十直簿尉罰四十直州縣押司録事本典及鄉里正孔目書手等杖七十本孔目勾押官典笞五十都孔目勾押官各罰五十直以上所立條件若是本判官録事㕘軍本曹官孔目勾押官典等即取一州都徴額上比較其縣令簿尉及典押以下即將本縣欠數比較一所徴夏秋兩税依省限了絶者本判官典申奏改轉官資録事㕘軍縣令申奏與量留一年或界分已滿去即轉兼官如一任之内税賦不牽即奏加章服若是攝官亦委本處長吏更令攝任一年如更立勞能具狀申省以憑申奏必降真命本曹判司簿尉即申奏請減兩選或一任之内税租總了絶或是攝官委逐處申省㸃勘聞奏别行奬酬州府都孔目官勾押官本孔目勾押官典等以軍職轉選其都孔目官勾押官如已至押衙職名或舊有官資亦議申奏奬酬州司並逐縣徴科典押每處與賞錢三十貫均匀分俵長興元年七月􅃯訪聞諸道州府縣官自徇虚名不惜人户皆於省限前行帖催驅須令人户貴買充納此後徴科事辦亦不酬勞本處不得申奏如違限稽慢即准條流責罰如添得廨宇招得流民無害于公私者當以名聞特行恩奬二年八月二十三日諸道奏薦州縣官前銜内有賜紫金魚袋者奉長興元年九月十七日勅州縣官若循常例十六考方得叙緋倘或已佩金章固難却為令録必若藉其才器則可别任職資須協通規免踰定制宜令今後諸道州府不得以著紫宜身奏薦為縣官者奉勅文資官階銜内已有金紫尚不許却為州縣官其武職銀青階銜亦宜條理宜令諸道州府自此詳文資賜紫例不得更以帶武職銀青階銜奏薦為州縣官員仍付所司五代㑹要卷十九
