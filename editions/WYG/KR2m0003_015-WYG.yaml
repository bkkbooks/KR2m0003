body:
  text: 五代會要卷十五宋王溥撰考功後唐天成元年十月三日尚書考功條奏格例如後一准考功令諸司外文武官九品已上每年當司長官考其屬官應考者皆具録一年功過行能議其優劣定九等考第京官九月三十日已前校定外官去京一千五百里内八月三十日已前校定三千里内七月三十日已前校定五千里五月三十日已前校定七千里内三月三十日已前校定萬里内正月三十日已前校定本州定訖京官十一月一日送簿外官朝集使送簿限十月二十五日已前到京考後功過並入來年無長官次官考縣已下及闗鎮庶官嶽瀆令並州考津非𨽻監者亦州考一准考課令諸毎年考簿集日考司校勘訖别為簿具言功過京官三品已上及同中書門下三品並平章事奏裁親王及五大都督府六同四品以下及餘外官並使人量定聞奏單數仍備狀進中考並單名録奏一准考課令諸毎年尚書省諸司府州牧刺使縣令政有殊功異行及祥瑞災蝗户口賦役増减當界豐儉盗賊多少並録考司一准考課令諸官人治績功過應附考者皆須實録其前任有犯私罪斷在今任者同見任法即改任應計前任日為考者功過並附其狀不得過兩紙州縣長官須言户口田宅者不得過三紙註考証之最一最已上有四善為上上一最已上有三善或無最而有四善為上中一最以上有二善或無最而有三善為上下一最已上有一善或無最而有二善為中上一最已上或無最而有一善為中中職事粗理善最不聞為中下受憎任情處斷􅆾理為下上背公向私職務廢闕為下中居官諂詐及貪濁有狀之類為下下若於善最之外别有可嘉及罪雖成殿而情狀可矜或雖不成殿而情狀可責者省校之日皆聽考官臨時詳定一准考課令諸官人因加户口及勸課田農幷縁餘功進考者於後事若不實縱經恩赦皆從追改一准式校京官考限來年正月内外官考限二月内者所司至三月内申奏了畢伏以書校内外官考課逐年申送考簿各有程期近年已來諸道州府及在京諸司所送考解多是稽違自今後所申考簿如違格限二十日不到其本判官幷録事參軍伏請各罰一百直本典勾官請委本道科責如違一月日已上不申到本判官伏請罰二百直録事參軍量殿一選本直句官請委本道重加懲斷在京諸司如違格限不闗牒到者其本司人吏牒報御史臺請行追勘一准格應所闕縣令計日成四考餘官計日成三考闕今後州縣官等並許終三十个月成三考自上官後至年終但滿一百八十日便與頭考次二年即須両考滿足如頭考滿足第二考全足即許計日成末考方與三十个月事理合同如過月限無替人到准上條處分者伏以每年書校官員考課格限則顯有舊條授上則雖為定制但以每月之内皆有除移今准格且以六月内上為凖一應申校内外六品已下赴選官員考課准格自上任後但滿一百八十日便與成頭考年終非書考時須至來年准格書校時倂申兩考如六月已前直至正月到任者自上任日至校考時頭考日足即考後功過並入來年如至書校時頭考欠日未成資考亦至來年准格書校時倂申兩考如六月以後至年終上者並至准格日収計一考有剩日不在重使之限一應經考後合収次年以一周嵗為限如未滿一年停替者但及三百四十日與成如欠日不在収計之限一應収未考但經考後去任時得及二百日與成如欠日不在収計之限如過月限無替人並准上條處分一應申校内外官員赴選考課頭須具經考已後課績不得重叠計功其末考須具得替年月日比類升降一應申校内外六品已下官員考第以去京地里逺近逐年書校申送考解各有程期今後應内外赴選官員考第既准格依限逐年比校即不合更将州府及本司考牒為據其有已前罷任官員不計年限考第未經省校者如有州府及本司考詞考牒全備者欲據在任年月日檢勘省司給與牒知如在任之時州府及本司向來元不曾書校給牒祇於解由歴子内批出考數者欲與檢勘解日厯子内不豎過犯稱在任日並無公事遺闕証驗分明亦據在官年月日給與牒知如檢勘無凴者不在給牒之限其今年各准格赴集選人便合請給省校考牒直至南曹受納告赤已前並許經所司投状檢勘出給其考牒又准格須奏下當年内出給如隔年者不在行使之限如或實有事故次年内請給自今後當年奏下校考許至來年内請給如更違格限請一年與殿一選如至三年外不請給者所司不在出給之限其已前校奏下内外赴選官員考課其間有未曾請給考牒者並合投状請給以備選曹磨勘如将來選人今在考第依前固違格條不經省司勘校給牒及已曾奏較下勅考不請給考牒者南曹不在檢勘判成之限一應申投内外官員考課文解須依格限到省如申發後其間或有非時事故停任所司無以得知請委本判官並録事參軍專切提舉事由申省以憑㸃校録奏一准故事校考舊條内外官員並校考之時諸道差朝集使應内考即差中書舎人給事中監考伏自校勘不行往例全廢自今後省校之時伏請中書門下選差清望官兩員監校内外官員考課便同㸃校申奏其合經由中書門下兩省准例各供宣黃清守舊規以為永制一應申校内外官寮考課如有過犯便降書下考如在任之日於常課之外别有異績可稱比之上下考如諸道州府及在京諸司固違格例不具録在任事績功過依限比較申牒到省其本判官幷録事參軍及在京諸司並請准前殿罰一應諸司諸流外職掌人等准令本司量其行能功過立四等考第而勉進之今伏請准新定格内條件内逐年依限投狀各具在職功過書校考第檢勘録奏一應諸司令史及勒留官丁憂不計有官無官並一百日後舉送如願終䘮不在舉限除丁憂年一考不附奏次年便許計選數赴集其丁憂人仍牒考功及南曹終䘮者計三年憂一諸色選人使上考减選其下考並合殿選幷注令録銓曹勘驗祇憑考功報檢多有差錯令請每年考功申校上考及下考勅下後請具單名牒門下省及申三銓闗報南曹以慿勘㑹並須九月以前報畢從之清泰二年五月尚書考功奏奉去年五月勅中外官員宰臣節度使已下並逐年書考僅千餘員當司人吏貧乏乞依三銓例當司歸司官逐月支賜紙筆糧錢勅考功司人吏依三銓例給與糧錢春冬衣賜諸司不得援例從之周廣順二年十二月二十八日勅節文其省校考牒如是奏下後滿三年不請給考牒者宜令考功准先降勅文不在出給之限三年三月十四日勅節文起今後諸州府更有功中考簿違格限申到者本判官並録事參軍各罰五十直其録事參軍仍殿一選本句押官典委本州各行科斷如違限一月已上不申到者仍令尚書考功催促候供申到考帳依例施行所有科罰准前處分若是校考過時即與次年依格奏校又勅州縣官或特勅除授或非時省故員闕除官到任者縁赴任不拘期限申發考帳之時但滿一周年便與依例書校一考中省如書校時少欠月日即與次年附帳申校不得滿落考第姓名如或有違罪本道書考官吏顯德五年閏七月尚書考功奏奉新勅起今年正月一日後授官並以三周年為限閏月不在其内著當司所書校内外六品以下赴選官員考第今後以一周年校成一考如次日不計限滿三周年校成三考如考滿後未有替人在任更一周年與成第四考欠日不在計限兼逐年月日自上已來課績功過第二考須具經考後課績不在重叠計功其末考須是具得替年月日比期降自今年正月一日已前授官到任者准格例三十個月書校三考今年正月一日後來授官到任者准新勅三周年為限每一周年書校一考閏月不在其内所有諸道州府校考申發考帳及當司校奏各依前後格勅施行應諸司諸色流外出身人等准格並須待附甲下然後與申考近年不經奏考便至參選頗啓倖門應在司見投人等自今後逐年起六月一日後正身於所司投狀請申校勞考省司具狀却牒本司勘㑹補奏年月日勅甲頭姓名見主掌案分公事牒報省司将元狀檢勘同即與准例申校仍自此後須逐年九月以前校奏了畢不在更與隔年併書之限其考牒本無紙書寫勅例今後毎年奏下逐人給省牒一紙使大張紙書及併年都給限據省校勘勅下考牒方許計考如書校之日有公事在外差出即本司雜事須具在職功過及出外事由牒報考功不得有妨逐年考校如不與申牒其雜事令史量情科决罰殿一選如無故自不經省投狀請奏校不在論訴之限者當司緣勅勅促期限慮恐校考遲違今後應合校考人請起自五月一日投狀限十日畢至七月三十日已前校奏餘依元格施行從之兵部後唐同光二年五月二十五日尚書兵部奏重制置收補千牛進馬事如後一進馬准舊例八員殿中省進馬四員太僕寺進馬四員千牛一十二左仗六員右仗六員准例取十三已上收補十五已上出仗各守三十五月限一准六典千牛備身及太子千牛皆取三品已上諸司官四品清官子孫儀容端正武藝可稱者補充今請使二品三品四品清官䕃補左右僕射太子少師少傅少保御史大夫六行尚書左右常侍門下侍郎中書侍郎太子賓客太常卿宗正卿左右丞諸行侍郎秘書監國子祭酒節度統軍上将軍金吾大將軍已上並許補子為太子千牛諸使東宫三品四品清官䕃補詹事庶子請使北省二品南省一品正官䕃補侍中中書令太師太傅太保太尉司徒司空太子太師太子太傅太子太保已上並許補孫一見任兵部尚書侍郎並不得收補子孫凡請使廕一官祇許考一員二十年二品三品四品不得過十年如過年限所司不在收補若是身有殘疾不在收補之限一准舊例每入閣皆須赴仗祇候如三度不到便除落名姓一應所請補千牛進馬先具廕序品第於都省投狀俟都發状到當司即引過本行尚書侍郎郎中員外郎㸃檢年貌及勘㑹廕序引問習試合格方得收補呈引過堂候過堂了始可申奏餘請准格施行從之晉天福五年三月勅兵部禮部引人過堂之日幕次酒食㑹客悉宜停廢職方後唐天成三年閏八月勅諸道州府每於閏年合送圗經地圗今後權罷長興三年五月二十三日尚書吏部侍郎王權奏伏見諸道州府每遇閏年准例送尚書省職方地圗者頃因多事之後諸道州府舊本雖存其間郡邑或遷館逓曽改添増鎮戍剏造城池竊恐尚以舊規錄為正本未専詳勘必有差殊伏請頒下諸州其所送職方地圗各令按目下郡縣鎮戍城池水陸道路或經新舊移易者並須載之於圗其有山嶺溪湖步騎舟楫各得便於登涉者亦須備載奉勅宜令諸道州府據所管州縣先各進圗經一本並須㸃勘文字勿令差悞所有装冩工價並以州縣雜罰錢充子得配率人户其間或有古今事迹地里山川土地所宜風俗所尚皆須備載不得漏畧限至年終進納其畫圗候紙到圗經别勅處分户部後唐天成三年閏八月廢户部蠲紙四年五月尚書户部狀申伏縁當司蠲符近奉勅令有事功可著者即户部奏聞又不開逐年及第進士及諸科舉人事例今據前進士趙彖乞蠲符者奉勅凡登科第皆充差徭如或雷同慮傷風化兼縁近有勅命不合更乞蠲符所宜特示明規務在勸人為學除新勅前已給蠲符外應禮部貢院每年諸道及第人等宜令逐道審騐春闗冬集不得一例差徭其及第人亦不得虚影占户名長興二年九月二日勅凡置營田必召浮客若取編户實紊常規如有繋税之人宜令却還本縣供應三京諸道管田祇耕佃無主荒田禁召浮客此後若敢違越某官吏及投名稅户當行重斷三年五月二十九日尚書户部奏當司所管天下合貢方物於長興三年三月定到七十餘州舊例冬至後齊到正仗前㸃檢至元日殿前排列當司引進昨㸃檢今年正仗前内六十七州至其餘二十州自正月至三月方到京師其江陵府所貢胎白魚勘問本道進奏官狀稱毎年臘月浥造至正仗未堪供進其餘州府未曾嚴加告諭請行勅命約束如來年正仗前貢物不齊其本州官典量定殿罰又棣州合進蘿蘑子本州稱無本色折進價錢絹一疋任土作貢豈合折錢其絹價停勅江陵府胎白魚許於限内伏進餘依奏應順元年正月勅諸州府籍没田宅並屬户部除賜功臣外禁請射晉天福四年閏七月尚書户部奏李自倫義居六世准勅旌表門閭當司元無令式秖先有登州義門王仲昭六代同居其旌表有㕔事歩欄前列屏樹烏頭正門閥閲一丈二尺一柱相去一丈柱頭安瓦桷黒漆號烏頭築雙闕一丈柱烏頭之南三丈七尺夾街十有五歩槐柳成列今舉此為例又不載令文勅王仲昭正㕔烏頭門等事既非故實恐紊彝章宜從令式祇表門閭於李自倫所居之前量地之宜髙其外門安綽楔門外左右各建一臺髙一丈二尺廣狹方正稱臺之形圬以白泥四隅染赤行列樹植隨其事力同籍課役一准令文周廣順三年正月勅應諸處户部營田人户租稅課利除京兆府莊宅務贍國軍𣙜鹽人户兩京行從莊外其餘並割屬州縣所征租稅課利官中秖管户部營田舊徴課額其户部管田職員一切停廢一應有客户元佃繋省莊田桑土舍宇使令充為永業自立户名仍其元佃桑土舍宇牛具動用實數經縣陳狀縣司給與憑由仍放户下三年差遣若不願立户名許召主卸佃不得有失元額租課其車牛動用屋舍樹木亦各宣賜官中更不管繫一諸處營田户部院及繫賜人户所納租牛課利其牛毎頭具上率納苗課逐年都納夏秋斛斗二萬一千餘石更納錢鞋布稈草等其租牛縁官中繫帳不管死損嵗月既深轉益貧困所徵牛租起今年後並與除放所有見在牛犢並賜本户官中永不收繫一諸州鎭郭下及草市見管屬省店宅水磑委本處常切管句其徴納課利不得虧失若有人收買具見值價例申省仍仰本户承認元本稅錢如是元本税錢重大即減價出賣如無稅錢亦仰量事出稅管認輸納其空閒倒塌店宅及空地亦准此指揮所有貨賣宅舍仍先問見居人若不買次問四鄰不買方許衆人收買其元隨宅舍諸班物色亦仰隨本物業貨賣其兩京城内及草市屋宅店舍不在此例宜令諸道州府准此其年九月勅京兆府耀州莊宅三白渠使所管莊宅宜並屬州縣其本務職員節級一切停廢除見管水磑及州縣鎭郭下店宅外應有繫官桑土屋宇園林車牛動用並賜見佃人充本業如已有莊田自來被本務或形勢影占令出課利者並􅃯見佃人為主依例納租條例未盡委三司區分仍差尚書刑部員外郎曹匪躬専往㸃檢割屬州縣度支周顯徳五年閏七月度支奏當司漕運水陸行程制陸行馬日七千里步及驢五十里車三十里水行泝流舟之重者汴河日三十里江四十里餘水五十里空舟汴河日四十里江五十里餘水六十里沿流之舟輕重同制河日一百五十里江一百里餘水七十里其三峽砥柱之類不拘此限若遇風水淺不得行者聴折半功河南河北河東關内等四道諸州運租庸雜物等脚毎馱一百斤一百里一百文山阪處一百二十文車載一千斤九百文從黃河及潞河自幽州運至平州毎十斤泝流十六文沿流六文餘水泝流十五文沿流五文從灃荆等州至揚州四文其山阪險難驢少處毎馱不得過一百五十文平易處不下八十文有人員處兩人分一馱其運向播黙等及涉海各在本處量定延資庫使梁開平三年九月以門下侍郎平章事薛貽矩兼延資庫使至乾化二年八月以門下侍郎平章事于兢兼延資庫使五代會要卷十五
