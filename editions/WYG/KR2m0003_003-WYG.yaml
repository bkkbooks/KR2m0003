body:
  text: 五代㑹要卷三宋王溥撰廟制度後唐天成三年十一月太常定奏少帝為昭宣光烈孝皇帝廟號景宗博士吕明龜奏謹按禮經臣不誄君稱天以諡之是以本朝故事命太尉率百寮奉諡册告天於圜丘迴讀於靈前並布七月之内諡册入陵若追尊定諡命太尉讀諡册於太廟藏册於本廟伏以景宗皇帝頃負沉寃嵗月深逺園陵已脩不祔於廟則景皇帝親在七廟之外今聖朝申寃追尊定諡重新帝號須撰禮儀又禮云君不逾年不入宗廟且漢之殤冲質君臣已成晉之恵懐愍俱負艱難皆不列廟食止祀於園寢臣等竊詳故實欲請立景宗皇帝廟於園所命使奉册書寶綬上諡於廟便奉大牢祀之其四時委守令奉薦請下尚書省集三省官詳議禮制施行左散騎常侍蕭希甫等請依禮院所奏勅宜令本州城内選地起廟哀帝崩於曹州立廟四年五月中書門下奏先據太常寺定少帝諡昭宣光烈孝皇帝廟號景宗生曽為帝享乃承祧既號景宗合入宗廟如不入廟難以言宗於理而論祧一逺廟安少帝神主於太廟即昭穆序而宗祧正今或安居别廟即請不言景宗但云昭宣光烈孝皇帝兼册文内有基字是𤣥宗廟諱雖尋常勅詔皆不迴避少帝是繼世之孫不敢斥列聖之諱今改基為宗字從之按風俗通陳孔璋曰尊卑有殺䘮祭哀敬各有攸殊欲令言著而可遵事施而不犯禮云卒哭之後宰執木鐸徇於官曰捨故而諱新故謂毁廟之主也恩逺屬絶名不可諱今昭宣上去𤣥宗十四世奏改册文非典故也晉天福四年十一月太常禮院奏議立唐廟引武徳年故事祀隋三帝今請立近朝莊宗明宗閔帝三廟庶合前規詔曰徳莫盛於繼絶禮莫重於敬先莊宗立興復之功明宗重光大之業建乎閔帝實繼本枝然則丕緒洪源皆遵唐室繼周者須崇后稷嗣漢者必奉髙皇將啟嚴祠當崇茂典宜立髙祖太宗及莊宗明宗閔帝五廟其月太常禮院又奏唐廟制度請以至徳宫正殿隔為五室三分之南去地四尺以石為埳中容二至廟之南一屋三門門㦸二十有四東西一屋一門門無棨㦸廟中牀鑪盤帳燭亭香寶粢盛酒爵罍洗罇坫位席祭服率如常制四仲之祭一羊一豚具如中祠幣帛牲牢之類光禄主之祠祝之文不進不署神厨之具鴻臚督之五帝五后凡十主未遷者六未立者四未諡者三髙祖太宗與其后暨荘宗明宗凡六主在青化里之寢宫祭前二日以殿中繖扇二十迎置新廟以行享禮閔帝荘宗明宗三后及魯國孔夫人神主四座請修製祔廟及三后請定諡法從之周廣順元年二月太常禮院上言准勅遷漢廟入昇平宫其唐晉兩朝皆五廟遷移今漢七廟未審總移為復祇移五廟勅宜准前勅並移於昇平宫其法物神厨齋院祭器祭服饌料皆依中祠例用少牢光禄等寺給其讀文太祝及奉禮郎太常寺差毎仲享以漢宗子為三獻從之三年九月太常禮院言准洛京廟室一十五間中分為四室兩頭有夾室四神門毎門屋三别有齋宫神厨屋宇准禮左宗廟右社稷在國城内請下有司修奉從之時太祖將行郊禮遷宗廟於東京故有是議顯徳六年七月詔以大行皇帝山陵有期神主將祔太廟其廟屋宇舍添修否國子司業兼太常博士聶崇義奏曰奉勅為大行皇帝山陵有期神主祔廟恐殿室鈌少合重添修今詣廟内相度若是添修廟殿一間至五間並須移動諸神門及角樓宫墻仗舍及當殿正面檐袱階道亦須近東省牲立班位直至齋宫漸更迫窄今檢到古今禮文伏縁太廟東西各有夾室伏請遷易請室安大行皇帝神主以合禮文者一按唐禮太廟惟有六室至開元元年加至九廟遂有九室至大厯十四年十二月十一日代宗神主将祔太廟太常奏縁遷祔須加夾室中幍室又元和三年十月九日重修太廟先是宗正奏下所司卜擇起修日聞奏太常院詳定禮料其合遍告九室奏移神主權於廟南門内殿庭少西設行廟幕殿一十二問置丹牀幕屋五間告前二日有司陳設畢告料准常禮有司供備其行廟外令左右金吾差兵守衞如式今重坼廟殿續更添修不惟重勞兼恐未便竊見廟殿見虚東西二夾室况有未祧遷之主欲請不坼廟殿更添間數即将夾室安排六室位次所有動移神主若准舊禮於廟庭權設行廟幕殿即恐雨水猶多難於陳設請權於太廟齋宫内奉安神主至脩奉畢日庶為宜稱一按禮記云廟成則於中屋刲羊以釁之夾室則用鷄又大戴禮及通典亦有夾室察文觀象乃是備廟之制况新主祔廟諸經有遷易之名考古沿今庶合通理伏請逓遷諸室安大行皇帝神主以符禮意勅從之禘祫後唐長興元年九月太常禮院奏來年四月孟夏禘享於太廟謹按禮經三年一禘以孟夏五年一祫以孟冬已毁未毁之主並合食於太祖之廟逐廟功臣之名配享於本廟之庭寶應元年定禮奉景皇帝為始封之祖廟號太祖百代不遷毎遇禘祫位居東南之尊自代祖元皇帝髙祖太宗已下列聖子孫各序昭穆南北相向合食於前聖朝中興重脩宗廟見享髙祖太宗懿宗昭宗獻祖太祖荘宗七廟太祖景皇帝在祧之數不列廟享將來禘祫若奉髙祖居東向之尊則禘享不及於太祖若以祧廟太祖居東向之位則又違於禮意今所脩奉祧廟神主及諸色法物已備合預請參詳事須具狀申奏勅下尚書省集議户部尚書韓彦暉等奏議伏以本朝尊受命之祖景皇帝為始封之君百代不遷長居廟食自貞觀至於天祐無所改更聖子神孫左昭右穆自中興國祚再議宗祊以太祖景皇帝在祧廟之數不列祖宗欲尊太祖之位将行東向之議爰命羣臣同議可否伏覩本朝列聖之舊典明皇定禮之新規開元十年特立九廟子孫遵守歴代無虧今既行七廟之規又已祧太祖之室昔徳宗朝將行禘祫之禮顔真卿議請奉獻祖神主居東向之位景皇帝暫居昭穆之列考之於正元則以為誤行之於今日正得其禮今欲請毎遇禘祫之嵗暫奉景皇帝居東向之尊自元皇帝以下序列昭穆從之周顯徳五年六月禘於太廟先是言事者以皇家宗廟無祧廟之主不當行禘祫之禮國子司業聶崇義以為前代備廟累遷及追尊未毁者皆有禘祫援引故事九條以為其證曰魏明帝以景初三年崩至五年二月祫祭明年又禘自兹已後五年為常且魏以武帝為太祖至明帝始三帝而己未有毁主而行禘祫其證一也宋文帝元嘉六年祠部定十月三日殷祀其太學博士議禘云按禘祫之禮三年一五年再宋自髙祖至文帝纔亦三帝未有毁主而行禘祫其證二也梁武帝用謝廣議三年一禘五年一祫故謂之殷祭禘祭以夏祫祭以冬且梁武乃受命之君僅追尊四廟而行禘祫則知祭者是追奉之道以時移節變孝子感而思親故薦以首時祭以仲月間以禘祫序以昭穆乃禮之經也非闗宗廟備與不備其證三也唐禮貞觀九年將祔髙祖於太廟國子司業朱子奢請准禮立七廟是時乃立六廟而行禘祫今檢㑹要及通典并禮閣新儀皆載此禮並與實錄符同此乃廟亦未備而行禘祫其證四也貞觀十六年四月己酉光禄大夫宗正卿紀國公綸卒太宗甚傷悼為不視朝将出臨之太常奏禘祫祭致齋不得哭乃止此明太宗之時宗廟未備實行禘祫其證五也貞觀二十三年自九嵕𦵏回迎神主於太極殿之西階日中行虞祭之祧有司請依典禮以神主祔廟髙祖欲留神主於内寢旦夕供養申在生之敬詔停祔禮英國公李勣等抗表固請曰竊惟祖功宗徳飾終之明典文昭武穆嚴配之明訓今停祔廟奉徇哀情即據典章乖替為甚又國哀已白而廟時停祭逾月之後須申大祫以唐禮九廟觀之自太宗以上纔足七廟未有毁主将申大祫其證六也貞觀十六年四月癸丑有司言將行禘祫依今禮祫享功臣並得配享於廟庭禘享則不配請命禮官學士等議太常卿韋挺等議曰其禘及時享功臣皆應不預故周禮六功之官皆大蒸而已大蒸即祫祭也梁初誤禘功臣左丞駮議武帝允而依行降及周隋俱遵此禮竊以五年再祫合諸天道一大一小通人雅論小則人臣不預大則兼及有功今禮禘無功臣誠謂理不可易太宗改令從禮載詳此論該曉歴代援據甚明又貞觀年中累陳禘祫其證七也髙宗上元三年有司祫享於太廟止有七室未有遷主通典㑹要及禮閣新儀俱明此禮其證八也中宗景龍三年八月帝将祠南郊欲以韋皇后助行郊禮國子司業郭山等議云皇朝舊禮圜丘分祭天地唯有皇帝親拜更無皇后􅂇祭之文及時享并禘祫亦無助祭之事今據中宗之代國子祭酒等舉禘祫之文稱是皇朝舊禮及明太宗髙宗之朝皆行禘祫其證九也疏奏從之配享功臣後唐荘宗廟故昭義節度使李嗣昭故幽州節度使周徳威故汴州節度使符存審並長興二年四月勅縁廟裁製周廣順元年四月中書門下奏太常禮院申七月一日皇帝御崇元殿命使奉册四廟准舊儀服衮冕即座太尉引册案入皇帝降座引立於御座前向南中書令舉冊案進皇帝搢珪璋授册使跪受轉授舁册官其進寳授寳儀如册案臣等參詳至時請皇帝降階授冊從之三年九月太常禮院奏奉迎太廟神主到京其日未審皇帝親出郊外迎奉否檢討故事元無禮例伏請召三省集議勅宜令尚書省四品已上中書門下五品以上同參議司徒竇貞固司空蘇禹珪等議案吳主孫休即帝位迎其祖父於吳郡入祔太廟前一日出城野次明日常服奉迎此其例也遂署狀言以車駕出城奉迎為是請下禮儀使草定儀注至十月禮儀使奏太廟神主将至前一日儀仗出城掌次於西御荘東北設神主行廟幄幕面南其日放朝羣臣早出西門皇帝常服出城詣行宫羣臣起居畢就次神主將至羣臣班定皇帝立於班前神主至太常卿請皇帝再拜羣臣俱拜神主就行廟幄幕坐設常饌羣臣班於神幄前侍中就次請皇帝謁神主既至羣臣再拜皇帝進酒畢再拜羣臣俱拜皇帝還幄羣臣先赴太廟門外立班俟皇帝至起居候神主至羣臣班於廟門外皇帝立於班前太常卿請皇帝再拜羣臣俱拜皇帝還幄羣臣就次宫闈令安神主於本室訖羣臣班於廟庭太常卿請皇帝於四室奠享逐室皇帝再拜羣臣俱拜四室祔享畢皇帝還宫前件儀注望付中書門下宣下從之社稷周廣順三年九月太常禮院奏社稷制度社壇廣五丈髙五尺五色土築之稷壇制度如社壇之制度社壇石主長五尺方二尺剡其上方其下半根在土中四垣華飾毎神門屋三間一門門二十四㦸四隅連飾罘罳如廟之制中可樹槐准禮左宗廟右社稷在國城内請下所司修奉從之時太祖将行郊禮故遷社稷於東京脩之嶽瀆梁開平三年八月詔曰封嶽告功前王重事祭天肆覲有國常規朕以𦕈身恭臨大寳既功徳未敷於天下而灾祥互降於域中慮於告謝之儀有缺齋䖍之禮爰修昭報用契幽通宜令中書侍郎平章事于兢往東嶽祭告訖晉天福六年正月勅嶽鎮司方海瀆配地載於祀典咸福蒸民将保豐穰宜申䖍敬其嶽鎮海瀆廟宇宜各令修葺仍禁樵採開運三年二月詔令復祭中嶽宜差河南少尹往彼行禮故事五嶽皆本處觀察使親齎御降祝文行禮頃因張全義為河南尹以年徳俱髙遂令賓從攝祭近日兼差府屬卑官至是因左輔闕盧夏奏故有是勅周顯徳七年十月詔今年冬祭海宜就差登州刺史張順起今後逐年就差更不差使寒食拜掃漢乾佑三年三月寒食隠帝奉皇后幸南御園家祭樞密使三司使從之人君奉先之道無寒食野祭近代荘宗毎年寒食出祭謂之破散故襲而行之周廣順元年二月寒食太祖出元化門至蒲池設御帳遥拜諸陵非人君之禮也武成王廟後唐長興三年五月七日國子博士蔡同文奏伏見武成王廟中毎上代釋奠漢留侯張良配坐武安君吳起等為十哲當排祭之時祇於武成王張良十哲面前其范蠡等六十四人圖形於四壁面前並無酒醢自今後乞准本朝舊制例武成王廟四壁諸賢畫像面前各宜設一豆一爵祀享中書帖太常禮院檢討禮例分析申者禮院檢郊祀録釋奠武成廟中祀例祭以少牢其配座十哲見今行釋奠之禮伏自䘮亂已來廢四壁英賢之祭今准帖為國子博士蔡同文奏武成王廟四壁英賢請各設一豆一爵祀享者當司今詳郊祀録武成王從祀諸英賢各籩二實以栗黄牛脯豆二實以菜葅鹿醢簠簋各一實以黍稷飯酒爵一禮文所設祭器無一豆一爵之儀奉勅武成王廟四壁英賢自此每祀至釋奠准郊祀録各陳脯醢諸物以祭周顯徳五年閏七月兵部申春秋上戊釋奠武成王廟毎祭差獻官三員初獻官上將軍充亞獻官上将軍充終獻官将軍充於漢乾祐三年奉中書門下指揮帶使相上將軍不差自後祇差大将軍行事仍改亞獻為再獻官終獻為三獻官祭器周廣順三年九月南郊禮儀使奏用珪璧制度准禮祀上帝以蒼璧地祗以黄琮祀五帝以珪璋琮琥璜其玉各依本方正色祀日月以珪璋祀神州以兩珪有邸其用幣天以蒼色地以黄色配帝以白色日月五帝各從本方之色皆長一丈八尺其珪璧之状璧圎而琮方珪上鋭而下方半珪曰璋琥為虎形半璧曰璜其珪璧琮璜皆長一尺二寸四珪有邸邸本也珪著於璧而四出也日月星辰以珪璧五寸前件珪璧有圗様而長短之説或殊按唐開元中𤣥宗詔曰禮神以玉取其精㓗比來用珉不可行也如或以玉難辦寧小其制度以取其真今郊廟所修珪璧量玉大小不必皆從古制伏請下所司修製從之顯徳四年四月禮官博士等准詔議祭器祭玉制度國子祭酒尹拙引崔靈恩三禮義宗云蒼璧所以禮天其長十有二寸盖法天之十二時又引江都集禮白虎通諸書所説云璧皆外圎内方又云黄琮所以禮地其長一尺以法地之數其琮外方内圎八角而有好國子博士聶崇義以為璧内外皆圎其徑九寸按阮氏鄭𤣥圖皆云九寸周禮玉人職又有九寸之璧及引爾雅云肉倍好謂之璧好倍肉謂之瑗肉好若一謂之環郭璞注云好孔也肉邊也而不載尺寸之數崇義又引冬官玉人云璧好三寸爾雅云肉倍好謂之璧盖兩邊肉各三寸通好共九寸則其璧九寸明矣崇義又云黄琮八方以象地毎各剡出一方六寸共長八寸厚一寸按周禮疏及阮氏圖並無好又引冬官玉人云琮八角而無好崇義又云琮璜珪璧俱是禮天地之器而爾雅唯言璧環瑗三者有好其餘諸噐若琮璜等者並不言之則琮璜八角而無好明矣時太常卿田敏以下以崇義援引周禮正文為是乃從之牲牢梁開平二年七月勅祭祀之典有國大事如聞官吏慢於恪敬禮容牲選有異精䖍宜令御史臺疏具條件聞奏周顯徳二年八月兵部尚書張昭等奏今月十二日奉聖㫖以毎年祭祀多用太牢念其耕稼之勤更備犧牲之用比諸豢養特可愍傷令臣尋討故事可以他牲代否臣仰稟綸言退尋禮籍其三牲八簋之用五禮六樂之文著在典彞乆相沿襲累經朝代無所改更臣聞古者燔黍捭豚尚多質畧近則梁武麵牲竹脯不可宗師雖好生之徳則然於奉先之儀太劣葢禮主於信孝本因心黍稷非馨鬼神享徳不必牲牢之巨細籩豆之方圎茍血祀常保於宗祧而犧牲何須於繭栗但以國之大事儒者乆行易以他牢恐未為便以臣愚管見其南北郊宗廟社稷朝日夕月等大祠如皇帝親行事備用三牲如有司攝行事則用少牢已下雖非舊典貴減犧牛其月太常少卿田敏乂奏臣奉㫖為祠祭用犢事令太僕寺供犢一年四季多用犢二十二頭唐武徳九年十月九日詔祭圜丘方澤宗廟已外並可止用少牢用少牢者用特牲時和年豐然後克修常禮又天寶六年正月十三日赦文今後毎大祭祀應用騂犢宜令所司量减其數仍永為常式其年起請以舊料毎年用犢二百一十二頭今請減七十三頭止用三十九頭餘祀享並宜停用犢至上元二年九月二十一日赦文圜丘方澤竝依常式宗廟諸祠臨時獻熟其年起請昊天上帝太廟各太牢一餘祭則隨事而供若據天寳六載自二百一十二頭减用三十九頭據武徳九年每年用犢十頭圜丘四方澤一宗廟五據上元二年起請惟昊天上帝太廟又無方澤祇九頭矣今國家用牛比開元天寶則不多比武徳上元則過其大半按㑹要太僕寺有牧監掌孳課之事乞今後太僕寺養孳課牛其犢遇祭昊天前三月養之滌官取其蕩滌清㓗餘祭則否若臨時買牛恐非典故奉勅今後祭圜丘方澤社稷並依舊用犢其太廟及諸祠宜准上元二年九月二十一日制並不用犢如皇帝親行事則依常式其日又詔曰今後諸祠祭應有牲牢香幣饌料供具等仰本司官吏躬親檢校務在精至行事儀式依附禮經大祠祭合用樂音仍須依前教習凡闗祀事宜令太常博士及監察御史用心㸃檢稍有因循必行朝典五代會要卷三
