body:
  text: 五代㑹要卷八宋王溥撰褒崇先聖後唐長興元年八月六日尚書比部員外郎知制誥崔税奏臣伏見開元五年每年貢舉人見訖宜令引就國子監謁先聖先師學者謂之開講質疑義所司設食其監内得舉人亦准此例其日清資官五品已上并朝集使並徃觀禮永為常式自經多故其禮乆廢請再舉行從之周廣順二年六月以文宣王四十三代孫前曲阜縣令孔仁玉復為曲阜縣令仍賜緋魚袋以亞聖顔淵裔孫顔渉為曲阜縣主簿仍敕兖州修葺祠宇墓側禁樵採時車駕親征兖州初平遂幸曲阜縣謁孔子祠既奠將致敬左右曰仲尼臣也無致敬之禮工曰文宣百代帝王師得無拜之即拜奠祠前釋奠後唐長興三年五月七日國子博士蔡同文奏伏見每年春秋二仲月上丁釋奠於文宣王以兖公顔子配坐以閔子騫等為十哲安排祭奠其有七十二賢圖形於四壁靣前皆無酒脯自今後乞准本朝舊規文宣王四壁諸英賢畫像面請各設一豆一爵祠饗中書帖太常禮院檢討禮例分析申者今禮院檢郊祀錄釋奠文宣王并中祠例祭以少牢其配座十哲見今行釋奠之禮伏自喪亂以來廢祭四壁英賢今准帖為國子博士蔡同文所奏文宣王四壁諸英賢各設一豆一爵祠享當司詳郊祀錄文宣王從祀諸座各籩二實以栗黄牛脯豆二實菜葅鹿醢簠簋各一實以黍稷飲酒爵一禮文所設祭噐無一豆一爵之儀者奉敇其文宣王四壁英賢自此每釋奠宜准郊祀錄各陳脯醢等物以祭經籍後唐長興三年二月中書門下奏請依石經文字刻九經印板勅令國子監集博士儒徒將西京石經本各以所業本經句度抄寫注出仔細看讀然後顧召能雕字匠人各部隨秩刻印板廣頒天下如諸色人要寫經書並須依所印敕本不得更使襍本交錯其年四月勅差太子賓客馬縞太常丞陳觀太常博士段顒路船尚書屯田員外郎田敏充詳勘官兼委國子監於諸色選人中召能書人端楷寫出旋付匠人雕刻每日五紙與减一選如無選可减等第據與改轉官資漢乾祐元年閏五月國子監奏在雕印板九經内有九經儀禮公羊榖梁四經未有印板今欲集學官校勘四經文字鏤板從之周廣順三年六月尚書左丞兼判國子監事田敏進印板九經書五經文字九經字様各二部一百三十冊顯徳二年二月中書門下奏國子監祭酒尹拙状稱准勅校勘經典釋文三十卷雕造印板欲請兵部尚書張昭太常卿田敏同校勘勅其經典釋文已經本監官員校勘外宜差張昭田敏詳校服紀後唐同光三年七月正簡皇太后遺令曰皇帝以萬幾至重八表所尊勿衣粗縗勿居諒闇三年之制以日易月過三日便親朝政皇后諸妃及諸王公主並制齊縗衣服以日易月十三日除中書門下翰林院學士在朝文武百官内諸司使及諸道節度觀察防禦使刺史監軍及前資官并僚佐官吏士庶僧道百姓並准本朝政事降服施行勿使過制皇帝釋服後未御八音勿廢羣祀勿斷屠宰勿禁宴遊園􅁜喪制皆從簡省故申遺令奉而行之其月太常禮院奏案故事中書門下翰林學士在朝文武百官内諸司使供奉官已下從成服三日每日赴長夀宫朝臨自後不臨其服以日易月十三日除至小祥合釋服每至月􅃋月望小祥大祥釋服日未除服者縗服臨已除服者則素服不臨並赴長夀宫先拜靈訖移班近東進名奉慰又奏准故事文武前資官及六品已下未升朝官并士庶等各於本家素服一臨禁衛諸軍使已下各於本軍㕔事素服一臨僧尼道士各於本寺觀一臨外命婦各於本家素服朝臨三日諸道節度觀察防禦團練刺史及僚佐等聞哀後當日成服三日改素十三日除從之清泰三年二月太常禮院奏據尚書兵部侍郎馬縞上疏言古禮嫂叔無服盖推而逺之案五禮精義正觀十四年魏徴等議親兄弟之妻請服小功五月今所司給假差謬為大功九月太常博士段顒稱自來給假元依令式若云違古不獨嫂叔一條舊為親姨服小功令式今服大功為親舅舊服小功今服大功為妻父母緦麻今服小功為女壻為外甥緦麻今兼服小功此五條在令式與古不同未審依馬縞所奏為復且依令式右贊善大夫趙咸又議曰臣聞三代之制禮無降减之名五服之容喪有寜戚之義此葢聖人随時設教稱情立文沿革不同吉凶相反或服由恩制或喪以禮加太宗文皇帝宏被至仁推大其義因覧同爨有恩之義遂制嫂叔小功之服列尊聖賢已為故事傳於令式加為大功今馬縞奏論以為錯謬况縞昔事本朝曁至梁室曾為博士累歴嵗年今始奏陳未為允當謹按儀禮凡制五服或以名加或以尊制或推恩而有服或别義而當喪故嫂叔大功良有以也其如叔以嫂之子為猶子為猶子之妻叔服大功今嫂氏猶子之母安可却服小功若以名加嫂豈疎於猶子之婦若以尊制嫂豈卑於猶子之妻論恩則有生同骨肉之情引義則有死同宅兆之理若以推而逺之為是即令式兼無小功既有稱情制宜之文何止大功九月請依式令永作􅂜倫勅下尚書省集議尚書左僕射劉昫等議曰伏以嫂叔服小功五月開元禮㑹要皆同其令式正文内元無喪服制度只一本編在假寕令後又不言奉勅編附年月除此一條又檢七八條令式與開元禮相違者所司行已多年固難輕改凡當議事須按舊章今若鄙宣父之前經紊周公之往制隳太宗之故事廢開元之禮文而欲取差誤之近規行編附之新意稱制度且為大典言令式又非正文若便改更恐難經久臣等集議嫂叔服并諸服紀請依開元禮為定如要給假即請下太常依開元禮内五服制度錄出本編附令文從之周廣順元年正月勅漢髙祖為義帝舉喪魏眀帝正禪陵尊號一時達禮千古所稱况朕乆事前朝常叅大政雖遷虞事夏見奪於羣情而四海九州咸知予宿志宜令所司擇日為故主舉喪仍備山陵塟禮有司上言皇帝為故主舉喪日服縞素直領深衣腰絰等成服畢祭奠不視朝七日防禁音樂文武内外臣僚成服後每日赴太平宫臨三日止七日釋服至山􅁜啟攅塗日服軘車出城班辭釋服從之喪𦵏上後唐天成元年十二月二十七日御史䑓奏應在京兩街司及坊市士庶人家及諸道經商客旅或有投井自縊及婢僕諸色人等非理歿故伏據近年以来凡是死亡之家並是䑓司左右廵使舉勘差驅使官與諸司人同行檢騐指揮如此施行相承已久臺司若不差人舉勘即非理幽魂無由申雪若一一檢騐即事故之家多稱騷擾况䑓司亦常憂両廵驅使官與諸司同廵檢節級等於有事人家妄有所求今詢訪故事准當司京兆按往例凡京城應有百姓死亡之家祇勒府縣差人檢驗如是軍人祇委兩軍檢勘如是諸道經商客旅即地界申户部使差人檢勘仍逐司各具事由及同檢勘行人等姓名申䑓及本廵察其間或有事涉寃誣曲直不分察訪得知及有人論訐䑓司並行追勘如是両班官吏之家即合是䑓司檢勘伏請自今已後並准故事施行除百司外䑓中不更差人海例檢勘如是則軍人百姓各有區分事渉寃誣即行追勘合具舉明庶遵故事者兼得左右廵使状抄録到喪葬格例所設車轝儀注物色祗為官品髙下無官秩者若陳儀注具供應故犯典型今則凡是葬儀動踰格物但官中只行檢察在人情各盡孝思徇彼稱家之心許便送終之禮臺司又難将孝子盡決嚴刑祇以供人例行書罰以添助本司支費兼緣設此防禁此為權豪之家當有違禮厚葬若貧窮下里尚猶不便送終必無僭禮可以書罰兩京即是臺司舉行諸州府即元無條例者凡棺椁不計有官品並不得于棺椁上雕鏤畫飾施户忩欄檻等至四品已上使方相七品已上使魌頭四目𤣥衣朱裳執戈揚盾如常制七品已下及無官品者勿用凡明器等三品已上不得過九十事五品已上不得過六十事九品已上不得過四十事當廣地軸誕馳馬及執役人髙不得過一尺其餘音聲隊馬威儀之屬各准平生品秩所用仍以木瓦為之不得過七尺及别加畫飾諸纛今謂之鵞毛五纛五品已上竿長七尺五品已下長五尺無官品者勿用諸三品已上引披鐸翣挽歌六行每行六人五品已上二引二披四鐸四翣挽歌四行每行四人九品已上二翣無官者勿用諸車轝三品已上油幰朱絲絡網施襈兩廂畫龍虎幰竿末埀六旒蘇今之纓帶也七品已上油幰襈兩廂畫雲氣垂四旒蘇九品已上無旒蘇車轝上有結絡者三品已上及將相有鳯䑓自諸官品及郡守升朝者羚羊山華餘並平幰百姓䘮葬祇合使鱉甲車無幰襈畫飾並無已前儀禮部格物凡官人百姓送葬競為奢僭不依禮式宜令所司切加糾察如物色等數目大小有違條式及輒飾以金銀者杖六十奉􅃯今後文武両班及諸司官吏并諸道經商客旅凡有䘮亡即准䑓司所奏故事施行其街坊百姓及軍人之家每有死䘮或所役使厮男妮子因依瞑行投井自縊非理自致身命者據䑓司状委府縣及両廂軍廵差人檢勘竊慮前件事故之家或所居隘窄兼阻暑毒之月尸靈難乆停㽞若待申報官司檢勘縱無邀難須經時日今仰本户可便唤四隣看驗如無他故便任本主遂殯仍具結罪保明文状報官若是枉有傷害致死隣人妄有保明本户並保人勘責不虚各量罪科斷兼聞諸州縣府士庶之家或有死䘮亦是須候分廵院檢勘頗致淹留既拂人情甚傷風教亦仰約以在京事理條例處分其庶人䘮葬所設車轝儀注格例據稱近日庶流多有違越䑓司又難将孝子盡决嚴刑祇以供人例行書罰添助夲司支費據此懲罰名目且非至正憲經自今以後所有各計品秩之殊及庶人喪葬宜令御史䑓委両廵御史㸃檢假賃行人須依條例如有違越據所犯重輕臨時科斷䑓司不得妄有攪擾二年六月三十日御史中丞盧文紀奏奉六月十四日勅䘮葬之儀本防踰僭若容錦繡難抑奢豪但人情皆重於送終格令當存於通理宜令御史䑓除錦繡之外并庶人葬更檢詳前後勅格仔細一一條件分析奏聞兾合人情永著常令者今䑓司再舉令文及故實條件如後凡銘旌三品以上長九尺五品以上長八尺六品以上長七尺諸輀車三品已上許使油幰施襈两廂盡龍虎七品已上祇許使油幰施襈両扇畫雲氣男子幰襈旒蘇皆使素婦人使彩諸官五品以上許使三梁六柱轝車轝上有結絡三品已上帶将相者有鳯䑓目諸品官及郡守升朝官者羚羊山華餘平幰諸棺槨不得雕鏤彩畫施户牕欄檻棺内不得有金寶珠玉諸喪葬不得條理者貴得同賤賤不得同貴准元和六年十二月刑部兼京兆尹鄭元状奏條流文武官及庶人䘮葬三品以上明器九十事四神十二時在内不得過二尺五寸餘人物並不得過一尺園宅方五尺下帳髙方五尺共置三十舁輓歌三十六人輀車使閙轍車油幰朱絲絡􅃠両廂畫龍虎幰竿朱末垂旒蘇幃襯幕及額𢃄等其幰竿長二丈六尺帶五重旒蘇十八道並不得使綾羅錦繡泥銀帖金彩畫及結鳥獸香囊等物四引四披六鐸六翣輓歌並練布深衣輴車誌石任畫雲氣不得置幰竿額帶等方相車載方相外及魂車除幰網裙簾外皆不得更别加装飾並使合轍車纛竿長九尺不得安大朱帖金銀立鳥獸旗旛等五品以上明器六十事四神十二時在内園宅方四尺下帳髙方三尺共置三十舁减誌石車輀車幰竿咸四尺長二丈二尺旒蘇减二道使十六道帶减一重使四重披引鐸翣各减二使四輓歌一十六人並無朱絲網絡方相使魌頭車纛竿减一尺使八尺幃額魂車准前九品已上明器四十事四神十二時在内園宅方三尺共置二十舁减輀車幰竿减三尺使一丈九尺旒蘇减二道使十四道披引鐸翣各减二使二帶减一重使三重輓歌一十六人纛竿减一尺使七尺其幃額魌頭魂車准前明器並使瓦木為之四神不得過一尺餘人物等不得過七寸並不得用金銀雕鏤帖毛髪装飾内侍省品秩髙者各隨本品秩未有章服者紫同三品緋同五品已上緑及應官並同九品已上命婦及文武母妻並邑號命婦各准本品如夫子官髙聽從夫子無邑號者各准夫子品秩輀車准令合使緑及紫色有品廕家子孫永有官者三品以上降三等五品以上降二等八品以上降一等九品不降所使品䕃並須以祖父官為升降内外官同庶人明器一十五事並置三舁䘮車使合轍車幰竿减三尺使一丈六尺木珠减十道使三十七道帶减一重使二重幃額魂車准前輓歌鐸翣四神十二時下帳並請不置所造明器合使瓦木不過七寸若仵作工匠之徒輒敢踰越捉獲之後自合准前後勅文科斷所由不得更主孝䘮之家若衢路捉獲只坐工人亦不得拘留行李令過時日工商諸色人吏無官者諸人無職掌者䘮車幃額魂車並無合轍車不使油幰旒蘇等飾兼不得以繪綵結絡及金銀装飾其輓歌鐸翣並不得置並車之前不得以鞍馬為儀其明器任業以瓦木為之不得過二十五事四神十二時並在内每事不得過七寸舁止十人准唐長慶三年十二月浙西觀察使李徳裕奏應百姓厚葬及于道途盛陳祭奠兼設音樂等閭里編甿罕知教義生無孝養可紀沒以厚葬相矜器仗僭差祭奠奢靡仍以音樂榮其送終或結社相資或息利自辦生産儲蓄為之皆空習以為常不敢自廢人户貧破抑此之由今百姓等喪葬祭奠並請不許以金銀錦綉為飾其陳設樂音者其葬物稍涉僭越者並勒毁除結社之類任充死亡喪服糧食等用使如有人犯者並准法律科罪其官吏已上不能糾察請加懲責仍請委出使郎官御史察訪臺司伏請令文及故實不載者令更條驗檢校官令文不載今請檢校官一品二品請同五品三品已下請並同九品如有曽任正官依本官品第儀則其准勅試官亦同九品儀如升朝官者請據本官品第升降則例凡䘮皆有品第恐或無知之人妄稱官秩自今後除升朝及見任官亡歿外餘官去事前五日須將告誥或勅牒於本巡使呈過判押文状行人方可供應佐命殊功當朝立名傳逺邇特勅優者准㑹要例本品數十分加三分不得别為華飾右具本朝舊本例如前今後令両巡使祇據官品秩級與判状其餘一物已上不得增加兼勒驅使官與金吾司并門司同力鈐轄如有大段踰越即請據罪科斷行人兼不得追領䘮葬之家别有勘責奉勅如過制度不計尺寸事數其假賃行人徒二年䘮葬之家即不問罪仍付所司長興元年十月十九日勅太常禮院例凡賻匹帛言段不言端匹每二丈為段四丈為匹五丈為端近日三司支遣每段全支端匹此後凡交賻贈匹帛祇言合支多少段庫司臨時併蹙尺丈給付不得剩有支破二年四月勅朝臣君䘮終制委御史臺具姓名申奏諸道賔從除䘮後合宜行恩命州縣官纔授新命及到任一考前丁憂者服闋日除官其月五日中書門下後奏尚書都官員外郎知制誥張昭逺丁母憂伏以大臣枕凷有弔祭之恩羣寮寝苫無慰問之例髙下之位君臣之事無偏况卿士之家正多有父母者極少因子孝道上軫聖懷張昭逺既量與恩賜自此朝臣或有丁憂亦乞須齎其状尋已印出今具官員等第所定支給數目如後文班左右常侍諫議給事舎人諸部尚書太子賔客諸寺大卿監御史中丞國子監祭酒詹事左右丞諸部侍郎絹三十疋布二十疋粟麥各二十五石起居補闕拾遺侍御史殿中監察御史左右庶子諸寺少卿國子監司業河南少尹左右諭徳諸部郎中員外郎太常博士絹二十匹布一十五匹粟麥各一十五石國子博士五經博士両縣令著作郎太常宗正殿中丞諸局奉御大理寺太子中允洗馬左右賛善太子中舎司天五官正絹布各一十五匹粟麥各一十石左右諸衛大將軍絹二十匹布一十五匹粟麥各一十五石左右率府副帥絹布各一十五匹粟麥一十石奉􅃯宜依其張昭逺所支絹布粟麥仍依所定官資頒給五代㑹要卷八
