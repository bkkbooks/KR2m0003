body:
  text: 五代㑹要卷二十六宋王溥撰街巷後唐同光二年八月初在京應有空閒地任諸色人請射蓋造藩方侯伯内外臣寮於京邑之中無安居之所亦可請射各自修營其空閒有主之地仍限半年本主須自修蓋如過限不見屋宇亦許他人占射其月􅃯諸道觀察防禦團練等使刺史出司土宇入覲朝廷將壯宸居須崇甲第宜於洛京修宅一區長興二年六月八日據左右軍巡使奏諸廂界内多有人户侵占官街及坊曲内田地蓋造屋舍又不經官申判押憑據廂界不敢懸便止絶竊恐久後别有人户更于街坊占射轉有侵占不惟窄狹兼恐久後别有人户及至人户爭競近日人户係税田地多被軍人百姓作空閒田地便立封疆修築牆壁占射又無判押憑據及本主或有文契典賣兼云占射年深或有税額及無税空閒攔恡不令修蓋以此致有爭競廂界難以止絶者其在京諸坊曲應有空閒田地先降勅命許人户請射蓋造及見種蒔公私田地如是本主自有力便令蓋造舍屋若無力即許人請射修蓋自後相次諸色人陳狀委河南府勘逐如實是閒田不侵占官街然後指揮擘畫交付今所稱諸色人侵占街坊於見有主稅地内占射蓋造必慮有妨車牛過往及恐百姓互爭有論須定規繩各令禦守京城應大街内有人户見蓋造得屋宇外此後並不得更有蓋造其諸坊巷道兩邊常須通得牛車如有小街巷亦須通得車馬來往此外並不得輒有侵占應諸街坊通車牛外即日或有越衆迥然出頭牽蓋舍屋棚閣等并須盡時毁拆仍據樽截外具留街道闊狹尺丈一一分析申奏此後或更敢侵占不計多少宜委地分官司量罪科斷其街道内除水渠外不得穿掘取土若已有穿掘各勒逐地分人户速速填平京城内諸坊曲除見定園林池亭外其餘種蒔及充菜園并空閒田地除本主量力自要修造外並許人收買見定已有居人諸坊曲内有空閒田地及種蒔并菜園等如是臨街堪蓋店處田地每一間破明間七椽其每間地價宜委河南府估價收買除堪蓋店外其餘若是連店田地每畝宜定價錢七千更以次五千其未曾有蓋造處宜令御史臺兩街使河南府依已前街坊田地分擘畫出大街及逐坊界分各立坊門兼掛名額先定街巷闊狹尺丈後其坊内空閒及見種田苗并充菜園等田地亦據本主自要量力修蓋外並許諸色人收買修蓋舍屋地宅如是臨街堪蓋店處田地每一間破明間七椽其每間地價亦委河南府估價准前收買除堪蓋店外其餘連店田地每畝宜定價錢七千以次近外每畝五千更以次三千未有人買處且勒仍舊逺僻處或欲置菜園任取穏便兼應本主所留諸色人置到田地等並限三個月内修築蓋造須見次第仍不得兩處收買田地其地祗許修造宅院并其間小小栽植竹木外不得廣作園囿及種植田苗仍令御史臺常加覺察如有故違仰具姓名申奏當行嚴斷其所置田地如是本主種田苗及見菜園候收刈及冬藏畢方許交割據交割日限後修蓋其已買地内所有苗税等宜令據畝數出除其所買田地除本主白要修蓋外有合賣數目如妄記形勢輒有逗留分外邀求有心占恡者許買地人經䑓論訴勘逐不虚所犯之人當行重斷其地仍准價例盡時交與所買之人其所買賣田地仍令御史臺委本處巡按御史旋給與公憑仍免税契右宜令御史臺兩街使河南府專切依次第擘畫曉示或有利便亦可臨時詳奪奏聞其月􅃯京城坊市人户菜園許人收買竊慮本主占押年多以鬻蔬為業固多貧窶豈辦蓋造恐資豪滑轉傷貧民若是有力人户及形勢職掌曹司等已有居地外於别處及連宅買菜園令人主把或典賃於人並准前􅃯價例如貧窮之人買得菜園自賣菜供衣食者即等第特添價直仍賣者不得多恡田土買者不得廣占田地各量事力須議修營周顯德三年六月詔輦轂之下謂之浩穰萬國駿奔四方繁㑹此地比為藩翰近建京都人物喧闐閭巷隘陿雨雪則有泥濘之患風旱則多火燭之憂每遇炎熱相蒸易生疾沴近者開廣都邑展引街坊雖然暫勞終成大利朕自淮上回及京師周覽康衢更思通濟千門萬户得遂安逸之心盛暑隆冬倍減寒燠之苦其京城内街道闊五十步者許兩邊人户各於五步内取便種樹掘井修蓋凉棚其三十步已下至二十五步者各與三步其次有差橋梁晉天福六年二月置浮梁橋於得勝渡闗梁開平元年七月􅃯建國遷都俾新其制况山河之險表裏為防今二京俱在闗東為内仍以潼闗𨽻陜州其月􅃯改武牢闗為軍仍置虎牢闗軍使市後唐天成元年十一月二十一日􅃯在京市肆凡是絲絹斛斗柴炭一物已上皆有牙人百姓將財物貨賣致時物騰貴百姓困窮今後宜令河南府一切禁斷如是産業人口畜乗須憑牙保此外並不得輒置仍委兩軍巡使覺察切加捉獲如違並當嚴斷周廣順二年十二月開封府奏商賈及諸色人訴稱被牙人店主引領百姓賒買財貨違限不還其亦有將物去後便與牙人設計公然𨼆没及莊宅牙人等亦多與有物業人通情重叠將産宅立契典當或虚指别人産業及浮造屋舍偽稱祖父所置更有卑幼骨肉不問家長衷私典賣及將倚當取債或是骨肉物業自已不合有分倚强凌弱公行典賣牙人錢主通同䝉昧致有爭訟起今後欲乞明降指揮應有諸色牙人店主人引致買賣並須錢物交相分付或還錢未足祗仰牙行人店主明立期限勒定文字逓相委保如數内有人前却及違限别無抵當便仰連署契人同力填還如諸色人牙行人内有貧窮無信行者恐已後悞累即却衆扶集出如是客旅自與人商量交易其店主人牙行人並不得邀難遮占稱須依行店事例引致如有此色人亦加深罪其有典質倚當物業仰官牙人業主及四隣同署文契委不是曾將物業印税之時於税務内納契白一本務司㸃檢須有官牙人鄰人押署處及委不是重叠倚當方得與印如有故違闗連人押行科斷仍徵還錢物如業主别無抵當仰同署契行保鄰人物分代納如是卑幼不問家長便將物業典賣倚當或雖是骨肉物色自已不合有分輒敢契賣倚當者所犯人重行科斷其牙人錢主並當深罪所有物業請准格律指揮如有典賣莊宅准例房親隣人合得承當若是親人不要及著價不及方得别處商量不得虚抬價例䝉昧公私有發覺已任親人論理勘責不虚業主牙保人並行重斷仍改正物業或親鄰人不收買妄有遮恡阻滯交易者亦當深罪從之城郭後唐天成元年四月勅京都之内右無郡城本朝多事已來諸侯握兵自保張全義土功斯設李罕之砦地猶存時以廓清固宜除剗若特差夫役又恐擾人宜令河南府先分擘出舊日街巷其城壕許占射平填便任蓋屋宇其城基内舊有巷道處便為巷道不得徇情妄有侵射仍請射後限一月如無力平剗許有力人户占射平填周廣順二年正月詔開封府修補京師羅城率畿内丁夫五萬五千版築旬日而罷顯德二年四月詔曰惟王建國實曰京師度地居民固有前則東京車馬輻輳水陸㑹通時向隆平日增繁盛而都城因舊制度未恢諸衛軍營或多窄狹百司公署無處興修加以坊市之中邸店有限工商外至億兆無窮僦賃之資增添不定貧乏之户供辦實難而又屋宇交連街衢湫隘入夏有暑濕之苦居常多煙火之憂將便公私須廣都邑宜令所司於京城四面别築羅城先立標識候將來冬末春初農務開時即量差近甸人夫漸次修築春作纔動便令放散或土功未畢即次年修築今後凡有營𦵏及興窑竈并草市並須立標識七里外其標識内候官中擘畫定軍營街巷倉塲諸司公廨院務了即任百姓營造至三年正月發畿内及滑曹鄭之丁夫十餘萬築新羅城仍使曹州節度使韓通充部署大使館驛晉天福五年九月改東京上源驛為都亭驛周廣順二年十二月勅諸道所差知館驛人不得於州縣别差人户貼助致擾貧民顯德四年四月改赤倉驛為通吳驛初世宗始議圖南命於赤倉置驛至是以其名識之五年五月以城東新驛為懐信驛待江南二使也鹽後唐同光三年二月􅃯魏府每年所徵隨絲鹽錢每兩與減放五文逐年俵賣蠶鹽食鹽夫鹽甜次冷鹽每斗與減五十欒鹽與減三十天成元年四月􅃯諸州府百姓合散蠶鹽今後每年抵二月内一度俵散依夏税限納錢晉天福元年十一月赦節文洛京管内逐年所配人户食鹽起來年每斗減放十文七年十一月宣㫖下三司應有往來鹽貨悉稅之過税每斤七文住税每斤十文其諸道應有係屬州府鹽務並令省司差人勾當先是諸州府除俵散蠶鹽徵錢外每年米鹽界分塲務約糶錢一十七萬貫有餘言事者稱雖得此錢百姓多犯鹽法請將上件食鹽錢於諸道州府計户每户一貫至二百為五等配之然後任人逐便興販既不虧官又益百姓朝廷行之諸處塲務且仍舊俄而鹽貨頓賤去出鹽諸處州縣每斤不過二十掌事者又稱驟改其法奏請重置税焉蓋欲絶興販歸利於官塲院糶鹽雖多人户鹽錢又不放免民甚苦之周廣順二年三月勅青白池務素有定規祇自近年頗乖循守北來青鹽一石抽税錢八百鹽一斗白鹽一石抽税錢五百鹽五升訪聞改法已來不便商販宜令慶州𣙜鹽務今後每青鹽一石依舊抽税八百八十五陌鹽一斗白鹽一石抽税錢五百八十五陌鹽五升此外更不得别有邀求青白鹽池在鹽州北唐朝元營四池曰烏池白池瓦窑池紐頂池今出税置吏惟有青白二池三年二月勅諸州府并外縣鎮城内其居人屋税鹽今後不俵其鹽錢亦不徵納所有鄉村人户合請蠶鹽所在州縣城鎮嚴切檢校不得放入城門顯德元年十二月上謂侍臣曰朕覽食末鹽州郡犯私鹽多於顆鹽界分蓋卑濕之地易於刮鹹煎造豈惟違我𣙜法兼又汚我好鹽况末鹽煎煉搬運費用倍於顆鹽今宜分割十餘州令食顆鹽不唯輦運省力兼又少人犯禁自是曹宋已西十餘州皆食顆鹽三年十月勅漳河以北州府管界是官塲糶鹽今後除城郭草市内仍舊禁法其鄉村並不鹽貨通商逐處有鹽滷之地一任人户煎煉興販但不得踰越漳河入不過商界麴梁開平三年十一月􅃯聴諸道州府百姓自造麴官中不禁後唐天成三年七月十三日􅃯應三京鄴都諸道州府鄉村人户自今年七月後於夏秋田苗上畝納麴錢五文足陌一任百姓造麴醖酒供家其錢隨夏秋徴納並不折色其京都及諸道州府縣鎮坊界及闗城草市内應逐年買官麴酒户便許自造麴醖酒貨賣仍取天成二年正月至年終一年逐户計筭都買麴錢數内十分祗納二分以充𣙜酒錢便從今年七月後管數徵納𣙜酒户外餘諸色人亦許私造酒麴供家即不得衷私賣酒如有故違便仰糾察勒依中等酒户納𣙜其村坊一任估賣不在納𣙜之限其麴􅃯命到後任便踏造如賣麴酒户中有去年曾買官麴今年因事不便買麴任開店者則與出落如觀新勅有情愿開店投𣙜者則不計舊户新户便令依見納錢等户例出𣙜此估酒户中有無力開店賣酒者亦許隨處陳狀其舊納錢並宜停廢應諸處亦仰十分減八分價錢出賣不得更請官本踏造長興二年三月􅃯節文諸道州府人户每秋苗一畝上元徴麴錢五文今後特放二一作三文仍徴三一作二文勅應三京諸道州府苗畝上所徴麴錢便從今年夏並放其麴官中自造委逐州減舊價一半於在城撲斷貨賣除在城居人不得私造外鄉村人户或要供家一任自造􅃯既下人甚便之其年七月三司奏諸道州府申論先有勅命許百姓造麴不來官塲收買伏慮課額不迨請准前麴法百姓與在城條法一例指揮從之仍據百姓已造到麴務令送納入官量支還麥本周顯德四年七月勅諸道州府麴務今後往例官中禁法賣麴逐處先置都務處候到日並仰停罷據見在麴數准備貨賣兼據年計合使麴數依時踏造候人户將到價錢據數給麴不得賖賣抑配與人其外塲酒務一切仍舊應鄉村人户今後並許自造米醋及賣糟造醋供食仍許於本州縣界就精美處沽賣其酒麴條法依舊施行先是晉漢已來諸道州府皆㩁計麴額置都務以沽酒民間酒醋皆漓薄上知其弊故命改法鐵後唐長興二年十二月􅃯今後不計農器燒器動使諸物並許百姓遂便自鑄造諸道監治除當年定數鑄辦供軍熟鐵并器物外祗管出生鐵比已前價各隨逐處現定高低每斤一例減十文貨賣雜使熟鐵亦任百姓自煉巡檢節級勾當賣鐵場官并鋪户一切並廢鄉村百姓祗於係省夏秋苗畝内納農器錢一文五分足隨夏秋税二時送納晉天福六年八月􅃯節文諸道鐵冶三司先條流百姓農具破者須於官塲中賣鑄時却於官塲中買鐵今後並許百姓取便鑄造買賣所在場院不得禁止攪擾鹽鐵雜條上後唐長興四年五月七日諸道鹽鐵轉運使奏諸道州府鹽法條流元末大槩定奪謹具如後一應食顆鹽州府省司各置𣙜糶折博場院應是鄉村並通私商興販所有折博每年人户蠶鹽並不許挾帶一斤一兩入城侵奪𣙜糶課利如違犯者一兩以上至一斤賣買人各杖六十一斤以上至三斤買賣人各杖七十三斤以上至五斤買賣人各杖八十五斤以上至十斤買賣人各徒三年十斤以上不計多少買賣人各决脊杖二十處死所有犯鹽人隨行錢騾畜等並納入官所有元本家業莊田如是全家逃走者即行㸃納仍許搬載脚户經過店主并御下人力等糾告等第支與優給如知情不告與賣鹽人同罪其犯鹽人經過處地分門司廂界巡檢節級所由并諸色闗連人等不專覺察委本州臨特斷訖散省如是門司闗津口鋪捉獲私鹽即依下項等第支給一半賣錢十斤以上至五十斤支賞錢二十千五十斤以上至一百斤支賞錢三十千一百斤以上支賞錢五十千應食末鹽地界州府縣鎮所有𣙜糶場院人内外禁法即末鹽一概條流應刮醎煎醎不計多少斤兩並處極法并許四鄰及諸色人等陳告等第支給賞錢欲指揮此後犯一兩以上至一斤買賣人各杖六十一斤以上至二斤買賣人各杖七十二斤以上至三斤買賣人各徒一年三斤以上至五斤買賣人各徒二年五斤以上買賣人各决脊杖處死如是收到醎土鹽水即委本處煎煉鹽數准條科斷或有已曾違犯不至死刑經斷後公然不懼條流再犯者不計斤兩多少所犯人並處極法其𣙜糶塲院員寮節級人力煎醎池各竈户搬鹽舡網押綱軍將衙官梢工等具知鹽法如有公然偷盜官鹽或將貨賣其買賣人及過鹽主人知情不告並依前項刮鹹例五斤以上處死其諸色闗連人等首告支賞錢即准洛京邢鎮條流事例指揮顆末青白等鹽元不許界分叅雜其顆鹽先許通商之時指揮不得將帶入末鹽地界如有違犯一斤一兩並處極法所隨行物色除鹽外一半納官一半與捉事充賞其餘鹽色未有畫一條流其洛京并鎮定邢州管内多有北京末鹽入界捉獲并依洛京條流科斷欲指揮此後但是顆末青白諸色鹽侵界叅雜捉獲並准洛京條流施行慶州青白𣙜税院元有透税條流所有隨行驢物色一半祗與捉事人充賞其餘一半并鹽並納入官欲並且依舊一斗以上至三斗杖七十三斗以上至五斗徒一年五斗以上處死安色解縣兩池𣙜鹽院河中節度使兼判之時申到畫一事件條流等准勅牒兩地所出鹽舊日若無文榜如擅將一斤八兩准元勅條並處極法其犯鹽人應有錢物並與捉事人充賞者切以兩池禁棘峻阻不通行人四面各置塲門弓射分擘鹽池地分居住並在棘圍裡面更不别有差遣祗令巡䕶鹽池如此後有人偷盗官鹽一斤一兩出池其犯鹽人並准元勅條流處分應有隨行錢物並納入官其捉事人依下項定支授給若是廵檢弓射池塲門子自不專切廵察致有透漏到棘圍外被别人捉獲及有糾告兼同行反告官中更不坐罪陳告人亦依捉事人支賞應有知情偷盗官鹽之人亦依犯鹽人一例處斷其不知情闗連人臨時酌情定罪所有透漏地分官射及池塲門子如是透漏出鹽二十斤以下徒一年半十斤以上至二十斤支賞錢二十千二十斤以上至五十斤支賞錢二十千五十斤以上至一百斤支賞錢三十千一百斤以上支賞錢五十千前項所定奪到鹽法條流其應屬州府捉獲抵犯之人便委本府州檢條流科斷訖申奏别報省司其屬省院捉到犯鹽之人干死刑者即勘情罪由犯上候省司指揮不至極刑者便委務司准條流决放訖申報從之五代㑹要卷二十六
