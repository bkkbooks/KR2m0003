body:
  text: 五代㑹要卷二十三宋王溥撰緣舉雜錄梁開平元年七月􅃯近年舉人當秋薦之時不親試者號為拔解今後且止絶四月十一日兵部尚書姚洎知貢舉奏近代設文科選冑子所以綱維名教崇樹邦本也今在公卿親應將相子孫如有文行可取者請許所在州府薦送以廣疏才之路從之乾化三年十二月以尚書左僕射楊涉知禮部貢舉非常例也前代自武德正觀之後但以考功員外郎掌之至開元二十五年員外郎李昂為貢士李涯所詆毁由是中書奏請以禮部侍郎専焉間或以他官頌多用中書舍人及諸司亦檢四品清資官惟㑹昌中命太常卿王起主貢舉時校僕射後唐同光二年十月中書奏請停舉選一年􅃯舉選二門國朝之重事但要精確難議權停宜准常例處分天成元年八月勅應三京諸道今年貢舉人可依常年例取解仍令隨處量事送赴闕三年七月四日尚書工部侍郎任贊奏今後伏請宣示諸州府所有諸色舉人不是家在逺方水陸隔越者逐處選賔從官僚中藝學精博一人各於本貫一例分明比試如非通贍不許妄給文解勅宜令今後諸色人委逐道觀察使慎擇其詞藝及通經官員各據所業考試及格者即與給解仍具所試詩賦帖經通粗數一一申省未及格者不得徇私發解兼承前諸道舉人多於京兆府寄應例以洪固鄉貴胄里為户一時失實事久難明自此各于本道請解具言本州縣某鄉某里為户如或寄應須具本貫入狀不得效洪固貴胄之例文解到省後據所稱貫屬州府户籍内如無名本人并給解處官吏必行重責京百司給解就試准前指揮兼下貢院其本朝舊格諸色舉人每年各放幾人及第到日續更詳酌處分其年十月三日􅃯訪聞每年及第舉人牒送吏部闗試判題雖有判語全無祇見各書未詳仍或正身不至如斯乖繆須議去除此後應開送舉人委南曹官吏准格考試如是進士并經學及第人曾親筆研其判語即須緝搆文章辨明治道如是無文章許直書其事不得祗書未詳如開試時正身不到又無請假字即牒貢院申奏停落四年七月中書門下奏今年及第人先曾守攝職官者宜所司於守攝文書内豎出應舉及第年月日或改名不改名分各印押其中曾受正官銜署并佐幕者仍約前任資序與除一任官如自中興以來請科第人曾受職官並令所司追納文書及到日准今年及第人例處分已受官者不在此限兼􅃯貢院將來舉人納家狀内各分析曾為官及不曾為官改名不改名其曾為職官者先納歴任文書及第准例指揮從之其年七月勅今嵗應新及第人給春闗並於敷政門外宣賜慮所司邀頡故也其年十月一日中書門下條流貢舉人事件如後一應諸道州府解送諸色舉人須准元勅差有才萟公正官考試及格然後給解仍具所試詩賦義目帖由送省如逐州府解内不􅆆書前件指揮事節所司不在引試之限禮部貢院考試諸色帖經舉人今後據所業經書對義之時逐經須將生卷與熟卷中半考試不得依往例祗將熟卷試問今後主司不受内外官寮書題薦託舉人及安排考官如或實語知有才學精博者任具奏聞若受書題囑託致有屈人其主司與發書人並加黜責其所舉人别行朝典三銓南曹亦不得受諸色官員薦託選人如違並准前指揮應諸色落第人此後所司具所落事由别張文牓分明曉示除諸州府解送舉人外餘有於河南府寄應及宗正寺國子監生等並須准上指揮其中有依託朝臣者於解内具言在某官姓名門館考試及第後並據姓名覆試諸色舉人至入試之時前照日内據所納到試紙本司印署訖送中書門下取中書省印印過却赴所司給散逐人就試貢院合請考官試官今後選學業精通廉慎有守者充如在朝臣門人不得奏請奉勅宜依長興元年六月中書門下奏此後賔貢每年祗請放一人兼及第舉人放榜時並須據才萟高低從上依資安排不得以隻科取鼎島嶽斗之名兼不得呼春官為恩門師門不得自稱門生除賜宴外不得輒有率斂别謀歡㑹曾赴舉落第人不得改名將來舉人並依選人例據地里逺近於十月中納文解如違不在受納之限從之二年正月勅今後落第舉人所司已納家狀者次年便赴貢院就試並勉再取文解兼下納文解之時不在拘三旬但十月内到者並與收納其年十二月三十日禮部貢院奏准㑹要長夀二年十月十日左拾遺劉承慶上疏曰伏見比年以來天下諸州府所貢物已至元日皆陳在御前唯貢人獨於朝堂列拜伏請貢人至元日列在貢物之前以備充庭之禮制曰可近年直至臨鏁院前赴應天門外朝見今後請令舉人復赴正仗仍緣今嵗已晩貢士來齊欲具見到人㸃引牒送四方館至元日請令通事舍人一員引伸朝賀列於貢物之前或以人數不少即請祗取諸科解頭一人就列其餘續到者候齊日别令朝見如䝉俞允當司祗於都省㸃引習儀奉􅃯宜准元勅處分餘宜依四年二月十六日禮部貢院奏今後試舉人日請令皇城司公幹人於省門外聴察呌呼稱屈及知貢院有倖門者引付皇城司勘問如使的實虚妄請嚴加科斷兼今年放榜後及第人有畢使綴行五鳯樓前列行舞蹈謝恩訖赴國學謝先師然後與知貢舉官相識期集祗候勅命兼過堂及過樞密院又舊例侵晨張榜後知貢院官及考試官已下便出請今年張榜後知貢舉官並考試官至晩出奉勅宜令勅下後於朝堂謝恩即赴國學其試舉人日宜令御史臺差人聴其放榜日知貢舉官出自此永為定制及第舉人過樞密院宜不施行清泰二年九月禮部貢院奏奉長興元年勅進士五經九經明經五科童子外諸色科目並停緣由有明算道舉人今欲施行又奉長興三年正月􅃯每落第舉人免取文解今後欲依元勅格諸色再取解十月十五日到省畢違限不收又奉天成四年勅諸色舉人入試前五日納試紙用中書印印訖付貢院司緣五科所試塲數極多旋印紙鏁宿内中書往來不便請祇用當司印從之童子晉天福五年禮部侍郎張元奏童子一科伏請停廢從之開運元年八月復童子科周廣順三年正月户部侍郎權知貢舉趙上交奏童子元念書二十四道今欲添念書通前五十道念及三十道者放及第從之顯德二年五月禮部侍郎知貢舉竇儀奏其童子請依晉天福元年勅停罷任改就别科赴舉從之明法後唐長興二年七月一日勅其明法科今後宜與開元禮科同其選數兼赴舉之時委貢院别奏請㑹法試官依格例考試晉天福六年五月十五日勅明法一科今後令五選集合格注官日優與處分周廣順三年正月户部侍郎權知貢舉趙上交奏明法元帖律令各十五帖對義二十道今欲罷帖律令試墨義六十道從之至其年八月刑部侍郎權知貢舉徐台符奏却准元格帖律令各十五帖對墨義二十道從之科目雜錄後唐同光四年正月五科舉人許維徽一作嶽等一百人進狀伏見新格文三禮三傳每科祗放兩人方今三傳一科五十餘人三禮三十餘人三史學究一十人若每年祇放兩人及一人逐年又添初舉伏見咸通長慶年放舉人元無定式又同光元年春榜亦是一十三人請依元年例放人勅從之天成二年正月二十七日尚書禮部貢院奏五經考試官先在吏部日長定格合請兩員數屬貢院准新定格文祗令奏請一員兼充考試伏縁今年科目人數轉多却欲依舊請考試官各一員如䝉允許續具所請官名銜申奏奉勅宜依三年二月十日禮部貢院奏當司據鄉貢九經劉英甫經中書陳狀請對經義九十道以代舊格帖經奉堂判令詳狀處分者當司伏准格文九經祇帖九經書各一十帖并對春秋禮記口義各一十道今准往例並不曾有應排科講義九經若便據送到引試排科講義即恐有格例者奉勅劉英甫請以講義便代帖經既能鼓篋而來必有撞鐘之應宜令禮部貢院考試其年七月十三日􅃯應將來三傳三禮三史開元禮學究等考試本業畢後引試對策時宜令主司於時務中採取要當策題精加考較不必拘於對属須有文章但能詞理周通文字典切即放及第如不及此格雖本業粗通亦須出落應九經五經明經帖書文格後引試對義時宜令主司於大義汎出經問義五道於簾下書試祗令隔簾解説但不失註疏義理通二通三然後便令念疏如是熟卷並須全通仍無失錯如得入簾亦須於時務中選策題精加考較如粗於筆硯留意者則任以四六對仍須理有指歸言闗體要如不曾於筆硯致功即許直書其事申明利害不得錯使文字其義問念疏對策逐件須有去留長興四年二月十六日禮部貢舉奏新立條件如後一九經五經明經呈帖由之時試官書通不後或不及格者唱落後請置筆硯將所納帖由分明却令自閲或是試官錯書通不當予改正如懐疑者便許請本經當面檢對如實錯即便於帖由上書名而退一五科常年駮榜出多稱屈塞今年並明書所對經書墨義云第幾道不通第幾道粗第幾道通任將本經書疏照証如考試官去留不當許將狀陳訴再加考較如合出落妄有披述當行嚴斷一今年舉人有抱屈落第者許將狀被訴於貢院官與重試如貢院不理即詣御史臺論訴請自試舉人日令御史臺差人受舉人訴屈文狀并引本身勘問所論事件或知貢舉之官及考試之官者已下敢有受貨賂升擢親朋屈抑萟能隂從請託及不依格去留一事有違請行朝典一懐挾書策舊例禁止請自今後入省門搜得文書者不計多少准例扶出殿將來兩舉一遙口受人迴換試處及義題帖書時諸般相救准例扶出殿將來三舉一萟業未精准格落下恥見同人妄扇屈聲擬為將來基址及他人帖對過塲數多者便生誣玷或羅織毆罵者並當收禁牒送御史臺請賜勘鞫如知貢舉及考試官事涉私徇屈塞萟士請行朝典若虚妄者嚴行科斷牒送本道重處色設仍永不得入舉塲同保人亦連坐各殿三舉奉勅宜依周廣順二年二月禮部侍郎趙上交奏貢院諸科今欲不試汎義口義其五十道改試墨義共十道處分從之三年正月户部侍郎權知貢舉趙上交奏九經舉人元帖經一百二十道墨義二十道今欲罷帖經於諸經墨義對一百五十道五經元帖經八十帖墨義二十道今欲罷帖經令對墨義一百道學究原念書二十道對義五十道從之至其年八月刑部侍郎權知貢舉徐台符又奏九經請都對墨義六十道其帖經對策依元格五經亦請對墨義六十道帖經對策依元格從之五代㑹要卷二十三
