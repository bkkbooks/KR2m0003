body:
  text: 五代㑹要卷二十五宋王溥撰幕府後唐同光二年八月八日中書門下奏諸道除節度使及兩使判官除受外職其餘職員并軍事判官伏以翹車著詠戔帛垂文式重弓旌以光罇爼由是副知己之薦成接士之榮必當備悉行藏習知才行允奉幕中之畫以稱席上之珍爰自偽梁頗乖斯義皆從除授以佐藩宣因緣多事之秋慮爽得人之選將期推擇式示更張今後諸道除節度副使判官兩使除授外其餘職員并諸州軍事判官等並任本道本州各當辟舉其軍事判官仍不在奏官之限天成元年八月十一日勅諸道開置幕府皆有舊規奏薦官寮亦著前式茍或隳紊難正澆訛從前諸道奏請判官若遇移鎮便合隨去若無除授亦隨府罷近年流例有異從來使府雖過除移判官元守舊職今後若朝廷除授者即不繫使府除移如是自請充職者便須隨去如遇府罷其職亦罷又往例藩鎮帶平章事奏請判官殿中已上許奏紫不帶平章事亦同帶平章事例處分如是防禦團練使奏請判官自員外郎已下不在奏緋之限其所奏判官州縣官並須將前任告赤隨奏到京若是未曾有官須假職銜者亦須奏狀内言並未有官如是節度觀察留後及權知軍州事並不在奏請判官之限如刺史要奏州縣官並須申本道請發表章不在自奏之限今日諸道奏請從事本無官序要結虚銜不計職位高卑多是兼請朱紫不唯紊亂實啟倖求深蠧彞章須行釐革宜令諸道州府仍下管内知州准勅命處分四年六月勅諸道節度行軍司馬名位雖高或帥臣不在其軍州事節度副使權知長興元年五月十六日勅去年相次有諸道前資掌書記已下賔從到京求官人數極多或自述行止或得替節度使論薦兼有已于郊天行事者即日朝班中無員闕安排前件官等皆隨府罷職相次到京當奏辟之時慎選盡由門館及替閒之後安排須告朝廷若不特議區分即恐久令淹滯宜令于諸道掌書記已下據有員闕處各除授一員仍自此凡是朝官及諸州府判官得替一周年後得求官擢才特勅不在此限其年十二月十九日大常丞孔知邵奏諸道行軍副使兩使判官及防禦團練軍事判官並請依考限欲滿一月前本處聞奏朝廷除替從之兼上佐令錄判司主簿亦准此指揮或有丁憂及不赴任因事停官身死並具月日申如不依指揮罪本處官判官二年二月中書門下奏准天成四年六月二十日勅刺史准舊例以三年為限其少尹上佐官以二十五月為限府縣官准長定格以三十月為限其行軍副使兩使判官已下賔僚及防禦團練副使判官推官軍事判官並宜以三十箇月為限如是隨府不在此限其年十二月勅今後兩使判官罷任後一年外與比擬書記支使防禦團練判官等二年外推巡防禦團練推官軍事判官等並三年與比擬仍每遇除授量與改轉官資或階勛職次若文學智術超羣倫者不拘月日之限才器卑陋階緣得事者即于州縣官中比擬若州縣官中有文學雄奥識畧優深者亦於班行諸道判官中比擬任使清泰二年七月中書門下奏自今年三月後諸州刺史奏軍判官九人行之有碍新勅慮在外未知勅軍判官宜令本州刺史自選擇舉奏且初除本職未得與官或與刺史連任相隨顯有勞能許本州刺史以聞量事奬擢仍不得枉有論薦其三月後九人且與施行晉天福二年二月勅前任諸道行軍副使等今後替罷一年後方得赴闕其先替在京者宜令中書門下據見有闕員除授仍勅諸道知四年七月勅今後防禦團練刺史所奏從事無名官者不在申薦漢乾祐元年正月勅其諸道行軍副使兩使判官今後不得行奏薦委中書門下選帶使相節度使許奏節度掌書記觀察支使節度推官不帶使相節度使只許奏節度掌書記節推官其防禦團練判官等聴奏薦仍須精擇才能其奏薦州縣官帶使相許薦三人不帶使相許薦二人防禦團練刺史許薦一人仍舉唐朝晉朝勅永為規則周廣順元年三月勅副留守節度副使行軍兩京少尹留守判官兩使判官共許差定當直人力不得過十五人諸府少尹掌書記支使防禦團練副使不得過一十人節度推官防禦團練軍事判官不得過七人並取本㕔舊當直人力充若數少不及新定數目祗仰舊人數差定仍令逐處係帳收管此外如不遵條制額外占差人户本官當行朝典顯德二年六月詔兩京諸道州府留守判官兩使判官少尹防禦團練軍事判官今後並不得奏薦如隨郡已歴前件官職任者不在此限其防禦團練刺史各置推官一員租税後唐同光三年二月勅魏府小菉豆税每畝减放三升城内店宅園囿比來無税頃因偽命遂有配徵後來以所徵物色添助軍裝衣賜將令通濟宜示矜蠲今據𦂳慢去處于見輸税絲上每兩作三等酌量納錢貴與充本迴圖收市軍裝衣賜其絲仍與除放其年閏十二月吏部尚書李琪上疏曰臣聞古人有言榖者人之司命地者榖之所生人者君之所理有其榖則國力備定其地則人食足察其人則徭役均知此三者為國之急務也軒黄已前不可詳記自堯堙洪水禹作司空于是九等之田收什一之税其時户口一千三百餘萬定墾田約九百二十萬頃為太平之盛及殷革夏命重立田制畝税田十畝種公田一畝水旱同之亦什一之義也洎周室立井田之法大約百里之國提封萬井出車千乗戎馬四千匹畿内兵車萬乗馬四萬匹如以田法論之亦什一之制也故當成康之世比堯舜之朝户口更增二丅餘萬非他術也蓋三代之前皆量入以為出計農以為軍雖逢水旱之災而有凶荒之備降及秦漢重税工商急闗市之征倍舟車之筭人口既以減耗古制猶復兼行按此時户口尚有千二百餘萬墾田亦一千八百萬餘頃至乎三國並興兩晉之後則農夫少于軍衆戰馬多于畊牛供軍須奪于農糧秣馬必侵于牛草於是天下户口止有二百四千餘萬洎隋文之代與漢比崇及煬帝之年又三分去二唐太宗文皇帝以四方初定百姓未豐延訪羣臣各陳所見唯魏徵獨勸文皇帝力行王道由是輕徭薄賦不奪農時進賢良悦忠直天下斗粟直兩錢自正觀至于開元將及九百萬户五千二百萬口墾田一千四百萬頃比之近古又多增加是知救人瘼者以重斂為病源料兵食者以惠能為軍政仲尼云百姓足君孰與不足臣之此言是魏徵所以勸文皇也伏維深留宸鑒如以六軍方闕未可輕徭兩税之餘猶須重斂則但不以折納為事一切以本色輸官又不以紐配為名止以正税加納天下幸甚勅本朝徵科唯配有兩税至於折納彼不施為宜依李琪所論應逐税合納錢物斛斗鹽錢等宜令租庸司指揮並准元徵本色輸納不得更改若合有移改即須具事由聞奏天成元年四月赦節文應納夏秋税子先有省耗每斗一升今後止納正税數不量省耗四年五月五日户部奏三京鄴都諸道州府逐年所徵夏秋税租兼鹽麴折徵諸般錢榖等起徵餘流如後四十七處節候常早大小麥麯麥豌豆五月十五日起徵八月一日納足正税匹帛錢鞋地頭𣙜麴蠶鹽及諸色折科六月五日起至八月二十日納足河南府華州耀陜絳鄭孟懐陳齊棣延兖沂涂宿汝申安滑濮澶襄均房雍許邢洺磁唐隋郢蔡同鄆魏汴潁復鄜宋亳蒲等州二十三處節候差晩隨本處與立兩等期限二十三處州郡未見一十六處較晩大小麥麫麥豌豆六月一日起徵至八月十五日納足正税匹帛錢鞋地頭𣙜麴蠶鹽及諸色折科六月十一日起徵至八月二十五日納足幽定鎮滄晉隰慈密青鄧淄萊邠寧慶衍等七處節候尤晩大小麥豌豆六月十日起徵至九月納足正税匹帛錢鞋𣙜麴錢等六月二十日起徵至九月納足并潞澤應威塞軍大同軍振武軍等其月勅百姓今年夏苗委人户自通供手狀具頃畝多少五家為保委無𨼆漏攢連狀本州具狀送省州縣不得迭差人檢括如人户𨼆欺許令陳告其田倍令并徵長興二年六月勅委諸道觀察使屬縣于每村定有力人户充村長與村人議有力人户出剰田苗補貧下不迨頃苖自肯者即具狀徴收有力者即排段檢括自今年起為定額有經災沴及逐年逋處不在此限三年十二月三司奏請諸道上供税物充兵士衣賜不足其天下所納斛斗及錢除支贍外請依時估折納綾羅絹帛從之晉天福四年正月勅應諸道節度刺史不得擅加賦役及於縣邑别立監徵所納田租委人户自量自槩周顯德三年十月宣三司指揮諸道州府今後夏税以六月一日起徵秋税至十月一日止徵永為定置五年七月詔曰朕以寰宇雖安烝民未泰當一夜觀書之際校前賢阜俗之方近覧元稹長慶集見在同州時所上均田表較當時之利病曲盡其情俾一境之生靈咸受其賜傳於方册可得披尋因令製素成圗直書其事庶王公觀覽觸目警心利國便民無亂條制背經合道盡繫變通但要適宜所冀濟務繫乃勛舊共庇黎元今賜元稹所奏均田圗一面至可領也是時上將均定天下民租故先以均田圖遍賜諸侯其年十月賜諸道均田詔曰朕以干戈既弭寰海漸寧言念地征罕臻萟極須議並行均定所冀永適重輕卿受任方隅深究治本必能副寡昧平分之意察鄉閭致病之源明示條章用分寄任竚令集事允屬推公今差使臣往彼撿括餘從别勅乃命左散騎常侍艾穎等三十四人下諸州檢定民租雜錄後唐長興元年三月十三日勅天下州府受納稈草每束納錢一文足一百束納拘子四莖充積年供使棗鐵一莖充稕塲院其草并柴蒿一束納錢一文其納絹布綾羅每疋納錢一十二文足絲綿納綿麻皮等每一十兩納耗半兩鞋每量納錢一文足見錢每貫納七文足省庫收納上件前物元條流見錢每貫納二文足絲綿紬子每一百兩納耗一兩其諸色匹段並無加耗二年閏五月勅今後諸州店所納稈草每二十束别加耗一束充塲司耗折其每來上舊納盤纒錢一文仰官典同共易豎一一分明上厯至納遣了絶已來公使不輒將出外周廣順元年三月二十八日勅諸道州府牛皮今後犯一張本犯人徒三年刺配重處色役本管節級所由杖九十兩張以上本人處死本管節級所由徒二年半刺配重處色役告事人賞錢五十千其人户有牛死者其本户告報本地方所由節級鄰保人仰當日内同檢驗過令本主盡時剥皮及申報本處官吏限十日内須送納畢其筋骨不得𨼆落二年十二月勅應天下人所納牛皮今將逐年所納數三分内減收三分其一分于人户苗畝上配定每秋夏苗共十頃納連角牛皮一張其黄牛納乾筋四兩水牛半斤犢牸皮不在納限其皮人户自詣本州送納所司不得邀難所有牛馬驢騾皮筋骨今後官中更不禁斷並許私家共便買賣祗不得將至敵疆興販仍仰闗津界首仔細覺察捕捉所犯人必加深罪其州縣先置巡檢牛皮節級及朝廷先降條法一切停廢顯德三年五月勅應天下今後公私織造凡絹帛紬布綾羅錦綺及諸色匹帛其幅尺斤兩並須合向來制度不得輕弱假偽罔冒取價如有物色已上等限一百日内並須破貨了絶如限外敢有違犯織造貨買者仰所在節級所由撿捉送官其年十月勅舊制織絁絹布綾羅錦綺紗縠等幅濶二尺起來年後公私織造並須及二尺五分不得夾帶粉藥宜令諸道州府嚴切指揮來年所納官絹每疋須及一十二兩河北諸州并萊登沂密州須及一十二兩絁紬止要夾密停匀不定斤両絁紬絹長依舊四十二尺四年二月六日勅節文諸道州府所管屬縣每年秋夏徵科了畢後多是却追縣典上州㑹來文鈔因兹科配斂掠宜令今後秋夏徵科了足日仰本州府但取倉塲庫務納欠文鈔如無異同不在更追官典諸道州府管内縣内鎮每有追攝公事自前多差衙前使院職員及散從步奏官今後如是常程追攝公事祗令府望知後承受逓送不得更差專人若要切公事及軍期不在此限五年六月四日勅諸道州府應有商賈興販牛畜不計黄水牛凡經過處並不得抽税如是貨賣處祗仰據賣價每一千抽税錢二十不得别有邀難團貎周顯德五年十月詔諸道州府令團并鄉村大率以百户為一團選三大户為耆長凡民家之有姦盜者三大户察之民田之有耗登者三大户均之仍每及三載帳籍梁開平三年三月尚書户部奏請詔天下州府准舊章申送户口帳籍從之晉天福九年八月勅天下諸州各以係省錢榖秋夏徵科為帳籍一季一奏一年賦税及限其藩侯郡守吏委在任一年次年又不逋欠聴三周年為滿三年皆辦别議遷陟逃户後唐天成三年十二月十日殿中監李延範奏請指揮諸道州府每逃户歸業後委州司各與公憑二年内放免兩税差科如有違許州論詳勘責若州縣官總得五百户以上元等第奬酬從之長興三年七月二十七日勅應諸處凡有今年為經水澇逃户在園屋舍桑棗一物已上並可指揮州縣散下鄉村委逐村節級鄰保人分明文簿各管現在不得輒令毁拆房舍斬伐樹木及散失動使什物等俟本户歸業日却依元數責令交付訖具無欠少罪結狀申本州縣如元數内稱有物欠少許歸業户陳狀訴論所犯節級并鄉鄰保人等並科違勅之罪仍勒倍償或至來年春入務後有逃户未歸者其桑土即許鄰保人請佃供輸租稅種後本主歸來亦准上指揮至秋收後還之周顯德二年五月二十五日勅應自前及今後有逃户莊田許人請射承佃供納租税如三周年後本户歸來業者其桑土不論荒熟并莊田交還一分應已上承佃户如是自出力别蓋造到屋舍及栽種到樹木園圃並不在交還之限如五周年外歸業者莊田除本户墳塋外不在交付如有荒廢桑土承佃户自來無力佃蒔祗仰交割與歸業人户佃蒔一近北諸州自契丹離亂鄉村人户多被邊軍打掠向北近來多有百姓自番界回來其莊田已被别户請射無處歸託今後如有五周年内其本主還來識認不以桑土荒熟并莊園三分中交還二分十周年内來者交還一半十五年内來者三分中交還一分應上項承佃户如是自出力别蓋造到屋舍及栽種到樹木園圃並不在給還之限如十五周年外歸業者其莊田除本户墳塋外不在給還如有荒廢桑土承佃户自來無力佃蒔祗仰交割與歸業人户佃蒔一應有坐罪家破逃人户其户下物業並許别户陳告請射承佃供納租税充為承業不限年嵗不在論認之限所有本户及鄉村節級重行斷决一諸州應有冒佃逃户物業不納租税者其本户歸業之時不計年限並許論認仰本縣立差人檢勘交割與本户為主如本户不來歸業亦許别户請射為主所有冒佃人户及本縣節級重行科斷如冒佃人户自來陳首承認租税者特與免罪一顯德二年正月二十五日已前應有逃户抛下莊田自來全段無人承佃曾經省司指揮開闢租税者宜令本州縣招㩦人户歸業及許别户請射為主與免一年差税色役至第二年已後據見在桑木及租蒔到見苗詣實供通輸納租税雜錄後天成元一作二年十二月三日勅率土黎甿並輸王税逐年上計祗在春時深虞所在之方或有無知之人不自增修産業輒便攪擾鄉鄰既撓公門須嚴定制宜自今後凡闗論認桑土二月後州縣不得受狀十月後間方許論對仍令逐處官吏准前後條格據理斷割周顯德四年七月勅起今後應有人論訴物業婚姻自十一月一日後許承狀至二月三十日權停自二月三十日已前如有陳訴至權停日公事未了絶者仰本處州縣亦與盡理勘逐須見定奪了絶其本處官吏如敢違慢並當重責其三月一日後至十月三十日前如有婚田詞訟者州縣不得與理若是交相侵奪情理妨害不可停滯者不拘此例奴婢後唐同光二年二月赦應有百姓婦女俘掠他處為婢妾者不得占留一任骨肉識認天成元年十月三日勅京城諸道若不是正口不得私書契券輒使良人周顯德五年七月新定刑統該誘良口勾引逃亡奴婢與貨賣所有資裝者其私誘勾引之人伏請處死良口奴婢並准律格處分如是居停主人元不是勾引之人請行重斷其或分受贓物至三疋已上者處死如有將良口于畨界貨賣者居停主人明知賣與畨界不告官者亦請處死道路後唐天成三年二月興元府奏修斜谷開道二千八百餘里四月洋州奏重開入蜀舊路比今官路近二十五里五月夔州奏開新路至房州長興二年八月勅准儀制令道路街巷賤避貴少避長輕避重去避來宜令三京諸道州府各遍下縣鎮准舊儀制于道路分明刻牌于要㑹坊門及諸橋柱曉示路人委本界所由官司共相巡察有違犯者科違勅之罪四年正月西京留守王思同進擬開駱谷路圖上指山險謂侍臣曰如此之險何以開通左右奏曰據興元闗内兵戎交畨及轉餉大散修開斜谷路迂迴校五百里如從駱谷自雍京直抵興元糧戍稍便然此路險阻尤甚以此竭力開通將來霖雨亦煩修葺上俛從其奏竟無成功而止五代㑹要卷二十五
