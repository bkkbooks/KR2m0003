body:
  text: 五代㑹要卷二十宋王溥撰縣令晉天福五年六月二十日詳定院奏准刑法統類大中二年正月三日敕天下州縣官吏犯贓皆遞相䝉蔽不肯發明縱有申聞百無一二自今後管內縣令有犯贓事發州府不舉者連坐刺史刺史有犯贓事發觀察使不舉連坐廉使又准大中二年二月十七日刑部起請今後縣令有贓犯録事參軍不舉録事參軍有贓犯刺史不舉刺史贓犯觀察使不舉其所司奏聽敕旨臣等參詳設縣司本典知情並同罪告事人放三年租稅差徭仍將放免數却配蓋藏罪其録事參軍不舉者請減縣令所犯罪二等敕起今後如有縣令犯贓録事參軍知而不舉者宜准敕文處分不知者不在此限八年三月初八日敕諸道州府令佐在任招攜户口比初到任交領數目外如出得百户以上量添得租稅者縣令加一階主簿減一選出二百户以上及添得租稅者縣令加二階主簿減兩選出三百户以上及添得租稅者縣令加兩階減兩選别與轉官主簿加兩階減一選出四百户至五百户以上及添得租稅者縣令加朝散大夫階超轉官資罷後許非時參選仍録名送中書如已授朝散大夫及已出選門者即别議奬酬主簿加三階其出剩不及一百户者據户口及添租稅數縣加一階參選日超一資注官主簿加一階如是一鄉收到三十或五十户以上一村收到三户以上者其本鄉村節級等與免本户二年諸雜差使料配如使一鄉收到一百户以上一村收十户以上本鄉村節級等與免本户三年諸雜差徭如願且充節級所由未得差替如願歸農便與免放仍仰本縣准敕令明給與憑據自灾沴以來户口流散如歸業者切在撫安其浮寄人户有桑土者仍收為正户其歸業户天福五年以前逃移者放一年秋夏租稅並二年諸雜差遣天福七年已前逃移者放一年秋夏一半租稅並放一年雜差遣其創收户如先有租稅即依原額輸納如先無租稅即據所營地畝且收半稅並放二年差徭如鄉村妄創户及坐家破逃者許人糾告勘責不虛其本府與鄉村所由各決脊杖八十刺面配本處牢城執役縣司本典知情並同罪告事人放三年租稅差役仍將放免數却配蓋藏創户及坐家破逃户本鄉所由均分輸納今後天下州縣所收新添户口租稅限十二月二十日以前申送户部㸃檢如違限本處判官録事參軍罰五十直仍削一級孔目官勾押官本案人吏杖七十降一資周廣順元年二月敕今後應諸道州府録事參軍判司縣令主簿等宜令本州府以到任月日旋具申奏及報吏部此後中書及銓司以到任月日用闕永為定制其見在州縣官限敕到仰便具先到月日一齊分申及報吏部其有諸色事故及丁憂並請假十旬滿闕亦仰旋具申奏兼報吏部其新授官准令式給程限外如不到任參上致本處無憑申奏到任月日便仰吏部同違程不上收闕使用其諸色見闕亦不得差官權攝輒便𨼆留如違敕條罪在本官録事參軍孔目官以下其年八月敕起今後秋夏徴賦省限滿後十分係缺三分者縣令主簿罰一百直勒停録事參軍本曹官罰七十直殿兩選孔目官罰七十直降職次本孔目官勾押官典決停本判官罰七十直若係缺三分以上奏取進止係缺三分以下者等第科斷殿罰其州縣徴科節級所由委本州重行決責其本判官録事參軍本曹官孔目勾押官典即取一州上比較縣令主簿即取本縣都徴上比較分數應州縣令録佐官在任徴科依限了畢者至參選日四選以上者減一選不及四選者即與轉官其年九月敕應州縣官所招添到户口課績自今日以前罷任者並准晉天福八年三月十日敕施行其漢乾祐三月十日敕施行其漢乾祐三年七月二十五日敕不行起今後罷任縣令主簿招添到户口其一千戶以下縣每增添滿二百户者減一選三千户以上縣每三百戶減一選四千戶以下縣每四百户減一選萬户以下縣每五百户減一選並所有增添户口及租稅並須分明於厯子解由內録都數若是減及三選以上更有增添及户數者縣令與改服色已賜緋者與轉官其主簿與加階轉官顯德五年十月詔淮南諸縣令仍舊兼知鎮事從江南之舊制也簿尉後唐長興四年五月敕諸道馬步判官不得差攝官如闕人須于前資正官判司簿尉中選性行平允者補授中外加減官梁開平元年四月敕開封府録事參軍及六曹掾屬宜各置一員兩畿赤縣置令簿尉各一員二年十月省諸道府州六曹掾屬存户曹參軍一員通判六曹後唐同光元年十一月中書門下奏諸寺監各請只置大卿監少卿監祭酒司業各一員博士兩員其餘官屬並請權停唯太常寺事關大禮大理寺事關刑法除太常博士外許更置丞一員其王府及東宫官屬司天五官正奉御之類凡不急司存並請未議除授其諸司郎中員外郎應有雙曹處且置一員左右散騎常侍諫議大夫給事中起居郎起居舍人補闕拾遺各置一半三院御史中丞條理申奏即日停罷朝官仍各録名銜具罷任月日留在中書候見任滿二十五月並據資品却與除官從之二年三月敕其先減省員官除已别授官外左散騎常侍李文矩等三十人宜却後舊官太子詹事石戩等五人宜以本官致仕將作少監岑保嗣等一十四人候續敕處分其年四月三銓奏准本朝故事州府官員府有司録參軍外置工曹倉曹户曹法曹兵曹士曹六員州有録事參軍外亦置六曹縣置令丞主簿各一員尉三員分判公事自後除兩京外都督府及諸州各置户曹一員餘四員並省縣置主簿各一員丞尉並省除合格選人外有郊天行事人數倍多況州縣事簡椽曹請依舊只置兩員縣局務繁請添佐官一員其間有尉無簿者請添置主簿一員其赤縣次赤縣畿縣次畿縣並准此除四京外其判司只置司户司法兩員從之四年三月敕三川涇鳳秦隴等州縣官置數目絶多其上佐官自少尹以下依本朝舊制各具在任員闕申奏其州准近敕置録事參軍司户參軍各一員縣置縣令主簿各一員外録事官並停其除替選任一准三銓常式時初平僞蜀故也周顯德五年十一月敕兩京五府少尹司録參軍先各置兩員今後只置一員六曹判司內只置户曹法曹各一員其餘曹官及諸州觀察支使兩藩判官並宜省廢量户口定州府等第周廣順三年十一月敕天下縣邑素有等差年代既深增損不一其中有户口雖衆地望則卑地望雖高户口至少每至調集不便銓衡宜正成規庶協公共應天下州府及縣除赤縣畿縣次赤次畿外其餘三千户以上為望縣二千户以上為緊縣一千户以上為上縣五百户以上為中縣不滿五百户為中下縣選人資叙合入下縣者許入中下縣宜令所司據今年天下縣户口數定望緊上中下次第聞奏吏部格式據户部今年諸州府所管縣户數目合定為望縣者六十四緊縣七十上縣一百二十四中縣六十五下縣九十七欲依所定移報銓曹從之州縣望京兆府醴泉縣後唐長興元年五月敕京兆府醴泉縣依舊為次赤縣雲縣富平縣三原縣後唐天成二年七月敕富平等三縣比屬西畿並是次赤縣後因置耀州割元屬邑降為望縣宜依舊為次赤且屬耀州河南府新安縣後唐天成二年二月升為次赤縣以奉莊宗雍陵應州金城縣雁門縣混源縣寰清縣後唐天成四年九月敕升應州為望州金城雁門為望縣混源為上縣寰清為次縣以明宗潛龍鄉里故也曹州濟隂縣後唐天成四年十一月升為次赤以奉景宗陵涇州平涼縣慶州同川縣安州吉陽縣晉天福二年正月尚書吏部奏自清泰三年創改以上三縣欲編八十道圖皆未有地望敕以吉陽平凉並為中縣同川為下縣鄭州管城縣周顯德六年八月升為次赤以奉世宗陵新鄭縣周顯德元年八月升為次赤以奉太祖嵩陵後唐天成三年十二月敕真定府屬縣准河中鳳翔例升為次畿真定縣升為次赤晉天福二年正月敕應京畿及諸州縣舊有唐朝諸帝陵並真源等縣並不為次赤却以畿甸緊望為定其逐縣令不得以陵臺結銜考滿日仍依舊出選門官例處分隔任後却據資品准格例施行開運二年六月吏部奏其四輔州鄭汝州仍舊為輔州同華州准敕既廢雍州不合為輔州欲定為望州滑州曹州比類近京欲升為輔州從之州縣分道改置後唐長興三年四月中書門下奏據十道圖舊制以王者所都之地為上本朝都長安遂以關內道為上今宗廟宫闕皆在洛陽請以河南道為上關內道第二河東道第三河北道第四劒南道第五江南道第六淮南道第七山南道第八隴右道第九嶺南道第十從之河南道滑州酸棗縣長垣縣梁開平三年二月割𨽻汴州後唐同光二年二月酸棗縣却𨽻滑州長垣縣却改為匡城縣晉天福三年十月酸棗縣却各𨽻開封府鄭州中牟縣陽武縣梁開平三年二月割𨽻汴州後唐同光二年二月敕中牟縣却𨽻鄭州晉天福三年十月中牟縣却割屬開封府宋州襄邑縣梁開平三年二月割𨽻汴州後唐同光二年二月却𨽻宋州晉天福三年十月復割𨽻開封府曹州戴邑縣梁開平三年二月割𨽻州後唐同光二年二月復為考城縣許州扶溝縣梁開平三年二月割𨽻汴州後唐同光二年二月鄢陵縣却𨽻許州天成元年九月扶溝縣却𨽻許州晉天福三年十月並割屬開封府陳州太康縣梁開平三年二月割𨽻汴州後唐同光二年二月復𨽻陳州晉天福三年十月却屬開封府單州楚丘縣梁開平四年四月割𨽻宋州碭山縣後唐同光二年二月敕碭山縣僞梁創為輝州並單州後理所于輝州今宜却屬單州其輝州依舊為碭山縣汝州葉縣襄城縣後唐同光二年十二月租庸使奏二縣原屬汝州今𨽻許州伏緣最鄰京畿户口全少伏乞却割𨽻汝州從之臨汝縣周顯德三年二月廢密州輔唐縣梁開平二年八月改為安丘縣後唐同光元年十月復為輔唐縣晉天福七年七月改為膠西縣避國諱也濟州周廣順二年九月以鄆州巨野升為州其地望為上割兖州任城中都單州金鄉等縣𨽻之至其年十二月乂割鄆州鄆城縣𨽻之中都縣却𨽻鄆州濱州周顯德三年六月以贍上國軍升為州其地望為直屬京割𨽻州渤海蒲臺兩縣𨽻之關內道京兆府奉先縣梁開平三年二月割𨽻同州後唐同光三年二月却𨽻京兆府武功縣好畤縣後唐長興元年五月敕併臨等四鄉却𨽻京兆府渭南縣周顯德三年四月割屬華州同官縣梁開平三年三月割𨽻司州後唐同光三年七月割𨽻耀州羑原縣後唐同光三年七月割𨽻耀州華州洛南縣後唐同光三年六月河中府奏韓城郃陽澄城縣為梁割屬當府其澄城縣今請却屬同州韓城郃陽縣且屬當府從之天成元年七月敕韓城郃陽二縣却割𨽻同州隴州汧陽縣汧源縣吳山縣後唐長興元年五月依舊割𨽻隴州涇州平凉縣後唐清泰三年正月涇州奏平凉縣自吐番陷渭州權于平凉縣為渭州理所遂罷平凉縣又有安國耀武兩鎮兼屬平凉其賦租即日並無縣管今却置平凉縣管安國耀武兩鎮别户從之臨涇縣後唐清泰三年二月原州刺史翟建奏本府自陷吐番權于臨涇縣為理所臨涇元屬涇州刺史只管捕盜其人户即涇州管州既無縣刺舉何施伏乞割臨涇屬當州從之鄜城縣昭化縣梁開平元年四月改為昭化縣後唐同光元年十月復為鄜城縣咸寧縣周顯德三年三月十日廢威州晉天福四年五月敕靈州方渠鎮宜升為威州𨽻靈武仍割寧州本波馬嶺二鎮𨽻之周廣順二年三月改為環州顯德四年九月降為通逺軍衍州周顯德五年六月廢為定平鎮𨽻邠州武州周顯德五年六月廢為藩源縣𨽻渭州河東道絳州梁開平四年四月割𨽻晉州後唐同光二年六月却割屬河中府慈州隰州後唐同光二年六月割𨽻晉州儀州梁開平三年閏八月敕兖州管內已有沂州其儀州改為遼州晉天福五年三月并沁州割𨽻潞州六年七月并沁州却𨽻太原解州漢乾祐元年九月升解縣為州割河中府聞喜安邑解三縣為屬邑河中府稷山縣後唐同光二年正月割𨽻絳州慈州仵城縣吕香縣周顯德三年三月降河北道鎮州後唐同光元年四月改為北京至十一月却復為成德縣幽州北平縣後唐長興三年八月改為燕平縣滄州長蘆縣乾符縣周顯德三年十月併入清池縣無棣縣周顯德五年改為保順軍弓高縣周顯德六年二月併入東光縣博州武水縣周顯德三年十月併入聊城深州博野縣周顯德四年五月割𨽻定州澤州梁開平元年六月割𨽻河陽四年二月𨽻潞州德州晉天福五年十一月移就長河縣為理所泰州後唐天成三年二月升奉化軍為泰州以清苑縣為理所至晉開運二年九月移就滿城縣至周廣順二年二月廢州其滿城縣割𨽻易州雄州霸州周顯德六年五月以瓦橋關為雄州割容城歸義二縣𨽻之益津關為霸州割文安大城二縣𨽻之地望並為中州時初平關南故也劒南道蜀州唐興縣梁開平二年八月改為陶胡縣後唐同光元年十月復為唐興縣彭州唐昌縣梁開平二年八月改為歸化縣後唐同光元年十月復為唐昌縣江南道杭州臨安縣梁開平二年正月改為安國縣福州閩清縣梁乾化元年十月移就梅溪場置蘇州吳江縣梁開平三年閏八月兩浙奏於吳松江置縣明州望海縣梁開平三年閏八月兩浙奏置處州松陽縣梁開平四年五月改為長松縣秀州晉天福三年十月兩浙錢元瓘奏以杭州嘉興縣置州全州晋天福四年四月湖南馬希範奏以湘川縣置州仍置湘川縣併割雚陽縣𨽻之淮南道壽州周顯德四年移于頴州下蔡縣仍以下蔡縣為倚郭以舊壽為壽春縣盛唐縣梁開平二年八月改為灊山縣後唐同光元年十月復為盛唐山南道復州梁乾化二年十月割𨽻荆南後唐天成二年五月却𨽻襄州天福五年七月直屬京升為防禦果州後唐天成二年五月𨽻利州唐州慈丘縣周顯德三年三月廢鄧州臨湍縣漢乾祐元年正月改為瀨縣避廟諱也菊潭縣向城縣周顯德三年三月廢商州乾元縣漢乾祐二年六月改為乾祐縣割𨽻京兆襄州樂鄉縣周顯德六年二月併入宣城隴右道泰州天水縣隴城縣後唐長興三年二月泰州奏見管長道成紀清水三縣外有十一鎮徴科並係鎮將今請以歸化怨水五龍黃土四鎮就歸赤化鎮復置舊龍城縣赤砂染坊夕陽南冶鐵務五鎮就砂鎮復置舊天水縣其白石大澤良恭三鎮割屬長道縣從之成州同谷縣栗亭縣後唐清泰三年六月泰州奏階州元管將利福建兩縣並無巡鎮成州元管同谷縣餘並是鎮便係徴科今欲取成州西南近便鎮分併入同谷縣其東界四鎮别創一縣者州西南有府城長豐魏平三鎮其地東至泥陽鎮界二十五里北至黃竹路金砂鎮界五十里南至興州界三十里西至白石鎮界一百一十里西南至舊階州界砂地嶺四十五里其三嶺管界併入同谷縣廢其鎮額州東界有勝仙泥陽金砂栗亭四鎮東至鳳州姜瞻鎮界十五里南至界州界二十里北至髙橋三十五里西至同谷界三十五里北至秦州界六十七里欲併其四鎮地於栗亭縣其徴科委縣司捕盜委鎮司從之嶺南道潘州茂縣梁開平元年五月改為越裳縣至後唐同光元年十月改為茂明縣桂州純化縣梁開平元年五月改為歸化縣縣後唐同光元年十月復為純化雍州晉天福七年七月改為誠州避廟諱溥州晉開運三年三月升桂州全義縣馬州仍改全義縣為德昌縣併割桂州臨川廣明義寧等三縣𨽻之從湖南馬希範奏也選事上後唐同光二年八月中書門下奏吏部三銓下省南曹廢置甲庫格式流外銓等司公事並繫長定格循資格十道圖等前件格文本朝創立檢制姦濫倫叙官資頗謂精詳久同遵守自亂離之後巧僞滋多兼同光元年八月車駕在東京權荆南曹工部員外郎盧重本司起請一卷並以興復之始務切懷來凡有條流多失根本以至冬集赴選人並南郊行事官及陪位宗子共一千三百餘人銓曹檢勘之時互有援引去留之際不絶爭論若又依違必長訛濫望差權判尚書省銓左丞崔沂吏部郎崔貽孫給事中鄭韜光李光序吏部員外郎盧損等同詳定舊長定格循資格十道圖務令簡要可久施行從之天成二年二月二十四日銓司奏據南曹駁放選人纍經銓及經中書門下論訴准堂判具新舊過格年限分析申上者狀以選人或有出身或因除授各拘常例方赴調集多因逺地兵戈兼以私門事故遂致過格固非願為新條標在七年舊格容于十載臣等參詳其選人過格年限伏請且依舊格不問𨼆憂停集本數過格十年外不在赴選之限從之其年十二月二十九日中書門下條流應諸道選人等選人中有過格年深無門𠫭選者准天成二年十月二十三日德音並要吏部南曹磨勘如實曽阻兵戈者許令注擬如或詐稱不在此限者凡是選人專思合格不肯過踰選限自滯身名縱阻兵戈須在州縣有應過格人等仰吏部南曹子細磨勘曽阻兵戈州府去處或曽假攝即有隨處文牒一一指實即便送銓司亦須參詳先授告身攝牒及審年貌方可注擬參銓注擬自有常規從前或有宰臣占著好州縣官員缺不令銓曹主授今年應是元闕並送銓曹候移省之時若有好闕尚在必議勘尋其請托及受囑人等當行黜責選人之內族類甚多歷任之中資考備在應南曹判成入等仰三銓各據逐人出身入仕文書一一比驗年貌灼然不謬方與注官據長定格選人中有𨼆憂者殿五選伏以人倫之貴孝道為先既有負于尊親定不公于州縣有傷風教須峻條章今後諸色官員內有𨼆憂冒榮者勘責不虛終身不齒所有入仕已來告敕并付所司焚毁從之五代㑹要卷二十
