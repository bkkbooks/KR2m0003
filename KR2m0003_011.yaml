body:
  text: 五代會要卷十一宋王溥撰五星凌犯梁乾化二年五月壬戌夜熒惑犯心大星去心四度順行司天奏大星為帝王之星宜修德以答天譴其年六月五日太祖殂正明四年十二月癸亥鎮星犯文昌上將唐天祐十五年也是月與唐兵大戰於胡栁坡唐幽州節度使周德威歿於陳後唐同光三年九月己亥熒惑在江東犯第一星是年天下大水長興四年八月己未夜五鼓三籌熒惑近天髙星嵗星近司怪太白近軒轅大星是年十二月二十六日明宗崩清泰三年五月丙申夜熒惑嵗星犯軒轅又犯大星其年降制除晉髙祖為鄆州莭度使晉祖不受詔晉開運元年十月壬戌夜熒惑犯哭星司天監趙延義奏元枵鬼方隂之所治司命哭位生乎火猛而代其徴也急齊地將有覆敗破家伏法而死其年十二月青州叛帥楊光逺子承勛斬其同謀逆人邱濤等以城降光逺尋亦被誅漢乾祐二年十一月辛亥夜鎮星始出太微之左掖門自戊辰嵗八月己丑鎮星入太微垣犯上將左右執法內屏謁者勾已往來凡四百四十三日方出左掖周顯德六年六月十八日熒惑與心大星合度光芒相射其月十九日世宗崩先熒惑勾已於房心間凡數月至上臨崩之前一夕與心大星合度是夜順行星聚後唐同光二年八月甲申嵗星熒惑合在翼十四度天成三年九月庚辰鎮星嵗星合於箕辛巳太白熒惑合於軫晉天福三年四月癸巳夜五鼓三點後太白與鎮星合太白在鎮星北一寸光芒相接鎮星在婁宿二度順行黃道內一度太白在婁宿二度順行黃道內一度宿度在徐魯之分日辰在荆楚之分漢天福十二年六月鎮星太白嵗星熒惑聚於張宿占云有帝王興於周者漢髙祖起義兵自平陽趨洛以應之及隱帝將嗣位又封周王暨周太祖登位以姬姓之後復繼宗周天人之符乃有所屬流星梁乾化元年十二月甲辰夜東方有流星如數升器出畢宿口受光三丈餘有聲如雷後唐同光三年六月庚寅夜一鼓西南有流星約七十餘皆有尾迹西南流其年九月正簡皇太后崩長興二年九月丙戌夜二鼓初東北方有小星流入北斗魁滅至五鼓初西北方次北有流星狀如半升器前小後大速流入奎滅尾迹凝天屈曲如雲而散光明燭地又東北有流星如大桃出下台星向西北速流至斗柄苐三星旁滅五鼓以後至明中天及四方有小流星百餘流注交橫清泰元年九月辛丑夜五更初有大星如五斗器西南流尾迹長數丈色赤移時盤屈如龍形蹙縮如二鏵相鬪而散又一星稍小東流有尾迹凝成白氣食頃方散晉天福三年三月壬申夜四鼓後東方有大流星狀如三升器其色白尾迹長二尺餘屈曲流出河鼓星東三尺東流丈餘滅周顯德三年正月癸亥五鼓後有大星出南斗傃東北流丈餘滅山摧後唐長興三年七月夔州奏赤甲山崩水溢梁開平四年青宋冀亳水詔令本州以省倉粟麥等賑貸後唐同光二年十二月中書門下奏今年秋天下州府例有水災百姓所納秋稅請特放加耗從之三年六月至九月大雨江河決壞民田七月洛水泛漲壞天津橋漂近河盧舍艤舟為渡覆沒者日有之鄴都奏御河漲於石灰窰口開故河道以分水勢鞏縣河決沖住倉厫八月敕如聞天津橋未通往來百官以舟船濟渡因茲傾覆兼踣泥塗自今文武百官可三日一趨朝宰臣即每日中書視事四年正月敕自京以東幅貟千里水潦為沴流亡漸多宜自今月三日後避正殿減膳撤樂省費以答天譴應去年絰水決處鄉村有不逮及逃移人户差科夏秋兩稅及諸折科委逐處長吏切加點檢並與放免仍一年內不得雜差遣應在京及諸縣有停住斛斗並令減價出糶以濟公私如在遵守仰具奏聞長興三年七月諸州大水宋亳潁尤甚宰臣奏曰今秋宋州管界水災最甚人户流亡粟價暴貴臣等商量請於本州出斛斗依時價出糶以救貧民兼大水之後頗且宿麥窮民不辦種子亦望本州據人户等第支借麥種自十石至三石候來年收麥據原數却令收納從之清泰元年九月連雨害稼詔曰久雨不止禮有祈禳禜都城門三日不止仍祈山川告宗廟社稷宜令太子賓客李延範等禜諸城門太常卿李懌等告宗廟社稷晉天福四年七月西京大水伊洛瀍澗皆溢壞天津橋八月河決博平甘陵大水六年九月河決於滑州一溉東流居民登邱冡為水所隔詔所在發舟船以救之兖州濮州界皆為水所漂溺命鴻臚少卿魏玭將作少監霍廷讓右領衛將軍安璿右統衛將軍田畯于滑濮澶鄆四州檢河水所害稼并撫問遭水百姓兖州又奏河水東流濶七十里水勢南流入沓河及揚州河至七年三月命宋州節度使安彥威率丁夫塞之河平建碑立廟於河決之所七年四月詔曰近年已來大河頻決漂蕩户口妨廢農桑言念蒸民用茲凋弊凡居牧守皆委山河既在封圻所宜専切今後宜令􅜲河廣晉府開封府尹逐處觀察坊禦使刺吏等並兼河堤使名額任便差選職員分擘勾當有堤堰怯薄水勢沖注處預先計整不得臨時失於防護開運元年六月黃河洛河泛溢壞堤堰鄭州原武滎澤縣界河決周廣順三年七月暴風雨京師水深二尺壞墻屋不可勝計諸州皆奏大雨所在河渠泛害稼三年六月諸州大水襄州漢江泛溢壞羊馬城大城內水深一大五尺倉庫漂盡居人溺者甚衆火後唐天成四年十一月汝州火燒羽林軍營五百餘間先是司天奏熒惑入羽林請京師偹火至是應之長興二年四月汴州封禪寺門上忽有火起沿燒近寺廬舍相次黎福縣亦火三年十二月懷州軍營內三處火光自起人至即滅不焚廬舍晉天福三年十一月襄州奏火焚居民千餘家周顯德五年四月吳越王錢宏俶奏十日夜杭州火焚燒府署殆盡上命中使賫䛇恤問蝗梁開平元年六月許陳汝蔡潁五州蝝生有野禽羣飛蔽空食之皆盡後唐同光三年九月鎮州奏飛煌害稼晉天福七年四月山東河南關西諸郡蝗害稼至八年四月天下諸道州飛蝗􅊣稼食草木葉皆盡䛇州縣長吏捕蝗華州節度使楊彥珣雍州節度使趙榮命百姓捕蝗一斗以祿粟二斗賞之時蝗旱相繼人民流遷飢者盈路關西餓莩尤甚死者十有七八朝廷以軍食不充分命使臣諸道括借粟麥晉氏自此衰矣漢乾祐元年七月青鄆襄齊濮沂密邢曹皆言蝝生開封府奏陽武雍邱襄邑等縣蝗開封尹侯益遣人以酒肴致祭尋為鸜鵒食之皆盡敕禁羅弋鸜鵒以其有吞蝗之異也二年五月博州奏有蝝生化為蝶飛去宋州奏蝗一夕抱草而死差官祭之復命尚書吏部侍郎段希堯祭東嶽太府卿劉皥祭中嶽皆慮蟲螟故也木氷漢天福十二年十一月二日旦天大昏霧木有氷至十一日霜露著草皆為氷時魏府杜重威叛命車駕親征駐蹕城下其月二十七日杜重威乞降至來年正月二十七日髙祖崩周廣順三年十一月一日雨大氷其月命宰臣馮道奉迎太廟神主赴東京新廟是日上親迎神主于西郊至來年正月十七日太祖崩雜災變後唐同光三年九月丁未夜遍天隂雲北方有聲如雷雉皆雊俗呼曰天狗墜天成二年二月己酉日中有黑氣狀如雞卵其年十二月壬辰酉時西南方有赤氣如火焰約二千里占者云不出二年其下當有大兵應順元年四月九日白虹貫日是日愍帝遇弒于衛州清泰元年十月辛未已時有雉金色自南飛入中書止于政事堂屋脊上吏驅之不去良久北飛于民家得之其月僕射平章事李愚罷相守本官吏部尚書劉昫罷相守右僕射三年三月有蛇鼠鬥于獅子門外鼠殺蛇其年晉髙祖起義兵于太原晉天福二年正月二日夜初北方有赤氣西及亥地東北至丑地南北濶三丈狀如火光赤氣內見紫微宫及北斗諸星至三點後內有白氣數條次行至西夜半子時方散開運元年正月乙未大霧中有紅白相偶占者云海淫所興其將有戰時車駕在溫州與契丹相守其年七月一日改元開運是夜大雷雨明德門內井有石槽槽有龍首其夕漂川十數步而龍首斷焉占者云石國姓也而龍首斷焉大不吉之象晉祚果絶于開運開運二年正月東京封邱門外石壕內有文若大樹花葉芬敷之狀相連數十株宛若圖畫唐景福中盧彥威鎮滄州壕水如此時有髙泥謂州人曰時將不安宜速避之至光化元年果有幽州為劉仁恭所陷漢乾祐元年三月中書門衛厨釜鳴者七是月中書侍郎平章事李濤罷免勒歸私第三年正月有狐去明德門樓獲之比常狐毛長腹剩二尺其年閏五月癸巳京師西北風暴雨至戴委門外壞營舍凡幾吹鄭門門扉起十餘步落拔大樹數十震死者六七人平地水深尺餘其年十一月帝與左右郭永明等同謀大臣楊邠王章史宏肇等至其月二十一日隱帝遇害周廣順三年六月河南河北諸州旬日無鳥既而聚澤潞之間山谷中集于林木壓樹枝折是年人疾疫者甚衆至顯德元年河東劉崇為周師所敗伏尸流血故先萌其兆顯德元年三月潞州髙平有鵲巢于縣郭之南平地巢中七八雛六年二月癸巳有一人敝衣冠闌入中書升政事堂吏叱之曰爾何人據牀而坐何人遣爾至此其人曰宋州官家教我來此吏具其事白于宰臣宰臣密令遣之尋不知所適其年六月十九日世宗崩明年正月四日大宋受命其年六月辛卯辰巳間京師天地晦冥澍雨驟降雨中有腥氣是日世宗崩雜録後唐同光二年九月司天奏請禁天下造私厯者從之周廣順三年八月敕自今後元象器物天文圖書讖記七曜厯太一雷公式法等私家不得有及衷私傳習有者並須焚毁司天臺翰林院本司職員不得以前代所禁文書出入借人傳寫其諸時日五行占筮之書不在禁限每年厯日須候夲司再造算奏定方得雕印本司不得衷私示外如是準律科罪顯德三年八月敕應諸色隂陽占卜書宜令司天臺翰林院集官詳定其書如是曾經前代聖賢行用合正道者只可存留其有淺近妖妄不依典據者並可毁廢功臣梁開平三年十月詔曰太保韓建每月旦十五日入閣稱賀即令赴朝參餘時弗入見示優禮也乾化元年正月敕許昌雄鎮太保韓建朕用之布政民耕盜止久居其位庶可勝殘矣宜令中書門下不計年月勿議替移後唐同光三年八月內詔册吳越王錢鏐其印宜以吳越之天成四年六月敕故平盧軍節度使霍彥威勳名顯著宅兆已營爰遵定諡之規俾議送終之制宜以三公禮葬長興二年四月詔曰周崇呂望有尚父之榮漢重蕭何有不名之禮錢鏐冠公侯之位疏吳越之封宜示異恩俾當縟禮其錢鏐宜賜不名其年六月以唐文正公魏徴八代孫韶為涇州安定縣主簿晉天福二年七月以唐忠武公李晟五代孫楫為將仕郎耀州司尸參軍封建梁開平元年四月封河南節度使馬殷為楚王五月封河南尹張全義為魏王兩浙節度使錢鏐為吳越王皇兄全昱為廣王依舊守太師政任皇從子友謙為冀王友諒為衡王友能為惠王友誨為邵王二年正月追封皇從子友寧為安王友倫為密王五月封滄州節度使劉守文為大彭郡王幽州節度使劉守光為河間郡王許州節度使馮行襲為長樂郡王三年二月追封靈武節度使韓遜為潁州郡王四月追封易定節度使王處直為北平王福建節度使王審知為閩王唐州節度使劉隱為南平王同州節度使劉知俊為大彭郡王山東南道節度使楊師厚為宏農郡王追封故河中節度使王重榮為晉王七月進封幽州節度使劉守光為燕王四年四月進封廣州節度使劉隱為南海王追封皇兄存為朗王六月追封皇伯義方為潁王皇叔義談為韶王乾化元年五月進封延州節度使髙萬興為渤海郡王二年二月追封故魏博節度使羅宏敬為趙王後唐同光元年十一月進封延州節度使髙萬興為北平王二年二月改封河南尹判六軍諸衛事張全義為齊王三月進封荆南節度使髙季興為南平王四月封夏州節度使李仁福為朔方王天成二年五月封福建節度使王延鈞為琅琊王六月封湖南節度使馬殷為楚國王三年七月追封偽蜀主王衍為順正公以諸侯禮葬追封福建節度使王延鈞為閩王長興四年二月封東西兩川節度使孟知祥為蜀王五月封皇從子從溫為兗王從敏為涇王從敏為涇王追封故夏州節度使李仁福為虢王七月進封兩浙節度使錢元瓘為吳王應順元年五月封荆南節度使髙從誨為南平王湖南節度使馬希範為楚王追封兩浙節度使錢元瓘為吳王清泰二年六月封幽州節度使趙德均為北平王青州節度使房知溫為東平王七月封鳳翔節度使李從曮為西平王晉天福元年十二月追封故東丹王李贊華為燕王二年五月封魏博節度使范延光為臨清王青州節度使王建立為臨淄王封鳳翔節度使李從為岐王十一月進封兩浙節度使錢元瓘為吳王追封故隴西王李嗣昭為韓王三年四月進封鳳翔節度使李從為秦王青州節度使王建立為東平王八月進封鄆州節度使范延光為髙平郡王五年三月進封昭義節度使王建立為韓王九月進封青州節度使楊光遠為東平王十一月進封福建節度使王延羲為閩國王六年正月追封皇弟敬為通王十一月封兩浙節度使錢宏俶為吳越國王七年正月追封皇弟德為福王殷為通王八年二月追封淄青節度使楊光遠為壽王漢天福十二年七月封湖南節度使馬希廣為楚王十月封魏博節度使髙行周為鄴王七月追封故韓王王建立為秦王二年十一月封兩浙節度使錢宏俶母吳氏為順德夫人三年十二月追封故順德太夫人吳氏為恭懿夫人其年八月封兩浙節度使錢宏俶為嗣吳越國王周廣順元年正月進封鄆州節度使髙行周為齊王封山南東道節度使安審琦為南陽王淄青節度使符彥卿為淮陽王夏州節度使李彛殷為隴西郡王荆南節度使髙保融為渤海郡王靈武節度使馮暉為陳留郡王追封故樞密使楊邠為宏農郡王故三司使王章為琅琊郡王故侍衛親軍馬步軍都指揮使史宏肇為鄭王四月追封故許州節度使劉信為蔡王二年六月追封故靈武節度使馮暉為衛王八月追封故齊王髙行周為秦王顯德元年正月追封山南東道節度使南陽王安審琦為陳王淮南王符彥卿為衛王渤海郡王髙保融為南平王隴西郡王李彛殷為西平王四月追封故中書令馮道為瀛王七月進封衛王符彥卿為魏王六年二月追封故陳王安審琦為齊王雜録後唐天成元年七月中書門下奏湖南節度使馬殷封楚國王禮文不載國王之制請約三公之儀用竹册從之封嶽瀆梁開平元年九月封鎮東軍神祠為崇福侯從兩浙奏也其年十一月封福州閩縣玷琦里石廟為昭福祠從福建奏也後唐長興二年七月封故閩越王無諸為富義王從福建節度使王延鈞奏也四年七月封泰山三郎為威雄大將軍時上不豫劉遂清引泰山僧進風藥用之小康其僧請封泰山三郎遂從之時以為妖惑之甚清泰元年六月封吳嶽成德公為靈應王初廢帝在鳯翔將謀入纂大位潛令人禱吳嶽冀獲資助及即尊位乃詔有司别議尊崇中書門下奏唐天寶十載正月封吳山為成德公與沂山會稽醫巫閭同封至至德二年十二月改吳山為嶽祠享官屬一同五嶽今國家以祈禱靈應宜示殊禮臣等商量請為靈應王從之其年十一月敕杭州護國廟故封崇德王城隍神改封順義保寧王銅官廟改封福善通靈王湖州城隍神封阜俗安城王越州城隍封興德保閩王從兩浙節度使錢元瓘奏也晉天福二年五月敕青草湖廟安流侯改封廣利公洞庭湖廟改封靈濟公磊石廟昭靈侯改封威顯公黃陵二妃懿節廟改封昭烈廟從湖南節度使馬希範奏也其年八月敕唐魏國公李靖宜封靈顯王按史傳鄭州東坡田後魏孝文皇帝賜僕射李仲顯俗因呼為僕射陂仍立祠廟宇祀綿逺時俗誤傳為李靖祠明宗征朱守殷經過制贈太保遣左散騎常侍蕭希甫就行册命仍立石記於廟因為唐衛公李靖之祠暨今封王蓋傳習之誤也七年十月封襄州利市廟為顯正王漢乾祐三年八月封蒙州城隍神為靈感王從湖南節度使馬希範奏也五代會要卷十一
