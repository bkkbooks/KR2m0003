body:
  text: 五代會要卷九宋王溥撰喪葬下後唐長興二年十二月二十六日御史臺奏先奉敕前守亳州譙縣主簿盧茂謙進䇿內已事竊見京城內偶遭凶喪者身不居於爵祿葬有礙於條疏須使鱉甲車殯送者事雖該於往制敕已著於前文或值炎鬱所拘偶緣留駐利便須期於時日貧窮旋俟於告投停日既多塋園又遠伏乞特付所司别令詳定權免鱉甲車送葬者奉敕送葬之儀雖防越制令文之設亦許便時其或候歷炎天喪從遠日停留既久遷送有期車中便苦於撼搖陌上可量於凶穢人情所病物議僉同宜在酌中庶成惻隱應喪葬自五品以下至庶人自春夏秋宜並許第等置輿其餘儀或一切仍舊兼喪車亦不全廢如要令陳於室輿之前其輿大小制度及結絡遮蔽所使匹帛顔色並擎舁人數次第仍令御史臺詳核據品秩等級士庶髙低各定規制施行兼定城內舊制比無居人近日許人户逐便居止或有喪死旋須遷送其出時並舁遣次第亦可穩便制置務在得宜者今臺司準敕追到兩市葬作行人白望李溫等四十七人責得狀稱一件於梁開平年中應京城海例不以髙例及庶人使錦繡車輿並是行人自將狀於臺巡判押一件於同光三年中有敕著斷錦繡祗使常式素車輿其輿稍有力百姓之家十二人至八人魂車虛喪車小輿子不定人數或是貧下四人至兩人廽使素紫白絹帶額遮幛輿上使白粉楴木珠節子上使白絲其引魂車小輿子使結麻網幕後至天成三年中有敕條流庶人斷使輿祗令别制造鱉甲車載亦是紫曲素物至今令內見使者今臺司按葬作行人李溫等通到狀并於令內及天成四年六月敕內詳穩便喪置定例五品至八品升朝官六品至九品不升朝官等及庶人喪葬儀制謹具逐件如後五品至六品升朝官使二十人舁輿車竿髙七尺長一丈三尺濶五尺以白絹全幅為幃額婦人以紫絹為帶額並畫雲氣周廽遮蔽上安白粉掃木珠節子二十道魂車一小香輿子一並使結麻網幕魌頭車一挽歌八人練布深衣披引鐸翣各一不得著錦繡明器三十事四神十二時在內四神不得過一尺餘不得過七寸園宅一方三尺其明器物不得以金銀毛髮裝飾共置八輿內許兩箇纑蘿已上並不得使結絡錦繡裝飾如事力不辦任自取便七品至八品升朝官使一十六人舁輿車竿髙七尺長一丈三尺濶五尺以白絹全幅為帶額婦人以紫絹全幅為帶額周廽遮蔽上安白粉掃木珠節子二十道魂車香輿子各一並使結麻網幕魌頭車一明器二十事以木為之四神十二時在內四神不得過一尺餘不得過七寸及不得使金銀鏤雕帖毛髮裝飾園宅一方二尺五寸共置六舁挽歌一十六人練衣深衣披引鐸翣各一已上並不得著錦繡結絡裝飾如事力不辦任從所便六品至九品不升朝官使一十二人舁輿車竿髙六尺長一丈一尺濶四尺以白絹全幅為帶額婦人以紫絹為帶額周廽遮蔽上安白粉掃木為珠節子一十六道魂車一香輿子一並使麻網幕明器以一十五事並不得過七寸以木為之並不得使金銀雕鏤帖毛髮裝飾共置五輿挽歌四人練布深衣鐸翣各一不得著錦繡及别有結絡裝飾如事力不辦任自取便檢校兼試官並依此例庶人使八人舁輿車竿髙五尺五寸長一丈濶四尺男子以白絹半幅為帶額婦人以紫絹半幅為帶額周廽遮蔽魂車一香輿子一使結麻網幕明器一十四事以木為之不得過五寸共置五輿車不得使紗籠金銀帖毛髮裝飾除此外已上不得使結絡錦繡等物色如人户事力不辦八人以上任自取便其喪輿車已準敕不全廢任陳靈輿之前者已上每有喪葬行人具所供行李單狀申知臺巡不使别給判狀如所供賃不依狀內及踰越制度仍委兩巡御史敕驅使官與金吾司并門司所由同知覺察如有違犯追勘行人請依天成二年六月三十日敕文行人徒二年喪葬之家即不問罪者皇城之內近已降敕命指揮每有喪葬以色服蓋身出城外任自隨便如廽來不得立引魂幡子却著孝衣入皇城內者今請再降敕命指揮皇城內此後每有人户喪葬令至晚靜後取便出門不得取內外諸色趨朝官右謹具定到五品至八品升朝官六品至九品不升朝官及檢校兼試官并庶人喪葬儀制如右奉敕宜依四年三月二十五日御史中丞龍敏奏京城士庶喪葬近有起請條流臣等參詳恐未允當伏見天成二年敕內品節分明凡有喪葬行人須凜定規據其官秩髙卑合使人數物色先經本巡使判狀自後别有更改不令巡使判狀祗遣行人具其則例申臺巡今欲却勒行人依舊先經兩巡使判狀其品秩物色定制不得輒違别欲指揮行人於喪葬之家除已得本分工價錢外保無內邀準乞覔文狀送到臺巡如有改違必加懲責敕從之廣順元年三月敕今後藩侯帶平章事以上薨謝者差官撰神道碑文宣示未帶平章事及刺史準令式合立碑者其文任自製撰不在奏聞限以故忠武軍節度使孟額男道右上章乞立其文碑故有是敕清泰二年十月中書門下奏奉長興二年四月五日敕朝臣居喪終制委御史臺具名申奏諸道幕府職事除喪後宜行恩命州縣官才使授官及到任一考前丁憂服闋並與除授依常定格自有節文應州縣官新授及到任一考後丁憂服闋準格取文解南曹磨勘申中書門下當與除授不得經堂陳狀從之周廣順三年十一月敕應內外文武臣寮幕職州縣官舉選人等今後有父母亡殁未經遷葬其主家之長不得輒求仕進所由司亦不得申舉解送如是卑幼在下者不在此限其合赴舉選者或是葬事禮畢或是卑幼在下勒於所納家狀內具言不得調冒宜令御史臺巡及逐處長吏本司長官所由司覺察糾舉犯者必行典法如是不切覺察縱任進冒罪在糾舉之司其中有兵革阻縮或是朝廷特恩除拜起復追徴及內外管軍職員並不拘此例所有敕前現任職官及今年舉選人不在糾舉之限奪情後唐應順元年閏正月十六日敕凡在苴麻並須終制比緣金革遂有奪情示以移忠藉其陳力其內諸司使副帶西班正官者宜候過卒哭起復授官不帶正官者及供奉官殿直承旨等宜過卒哭休日赴職其有帶承班官者祗以檢校官充職服闋日加授前職定格令梁開平三年十月敕太常卿李燕御史司憲肅頃中書舍人張衮尚書户部侍郎崔沂大理寺卿王鄯尚書刑部郎中崔誥共刪定律令格式至四年十二月中書門下奏新刪定令三十卷式二十卷格一十卷律并目録一十三卷律疏三十卷共一百三卷請目為大梁新定格式律令頒下施行從之後唐同光三年六月刑部尚書盧質上新集同光刑律統類十三卷天成元年九月二十八日御史大夫李琪奏奉八月二十八日敕以大理寺所奏管見四部法書內有開元格一卷開成格一十一卷故大理卿楊遘所奏行偽梁格并目録一十一卷與開成格微有舛誤未審祗依楊遘先奏施行為復别頒聖旨令臣等重加商較刋定奏聞者今莫若廢偽梁之新格行本朝之舊章遵而守之違者抵罪至其年十月二十一日御史臺刑部大理寺奏奉九月二十八日敕宜依李琪所奏廢偽梁格施行本朝格令者伏詳敕命未該律令伏以開元朝與開成隔越七帝年代既深法制多異且有重輕律旡二等若將兩朝格文並行伏慮重疊舛誤况法者天下之大理非一人之法天下之法也故為一代不變之制又準敕立後格合破前格若將開元格與開成格並行實難檢舉又有太和格五十二卷刑法要録一十卷格式律令事類四十卷大中刑法格後敕六十卷共一百六十一卷久不檢舉伏請定其豫奪奉敕宜令御史臺刑部大理寺同詳定一件格施行者今集衆商量開元格多定條流公事開成格關於刑獄今欲且使開成格從之長興四年六月敕御史中丞龍敏給事中張鵬中書舍人盧道尚書刑部侍郎任贊大理卿李延範等詳定大中統類清泰二年四月御史中丞盧撰等進清泰元年以前十一年內制敕可久逺施行者凡三百九十四道編為三十卷其不中選者各令本司封閉不得行用敕付御史臺頒行晉天福二一作三年六月中書門下奏伏覩天福元年十月敕節文唐明宗朝敕命法制仰所在遵行不得改易今諸司每有公事現執清泰元年十月十四日編敕施行稱明宗朝敕除編集外並已封鎖不行臣等商量望差官將編集及封鎖前後敕文並再詳定其經久可行條件刪録奏聞從之遂差左諫議大夫薛融祕書監丞呂琦尚書駕部員外郎知雜事劉皥尚書刑部郎中司徒詡大理正張仁瑑同參詳至四年七月薛融等上所詳定編敕三百六十八道分為三一作一十一卷敕令有司刪録與格式參用周廣順元年六月命侍御史盧億等以晉漢及國初事關刑法敕條一十六件編為二卷目為大周續編敕顯德四年五月二十四日中書門下奏準宣法書行用多時文意古質條目煩細使人難會兼前後敕格差謬重疊亦難詳究宜令中書門下並行刪定務從簡要所貴天下易為頒行者伏以刑法者御人之銜勒救弊之斧斤故鞭撲不可一日弛於家刑罰不可一日廢於國雖堯舜淳古之代亦不能舍此而致理矣命奏制書刪律令之書求救弊之本經聖賢之損益為今古之章程歷代以來謂之彛典朝廷之所行用者律一十二卷律疏三十卷式二十卷令三十卷開成格一十卷大中統類一十二卷及皇朝制敕等折獄定刑無出於此律令則文辭古質看覽者難以詳明格敕則條目煩多檢閲者或有疑誤加以邊逺之地貪猾之徒緣此為姦寖以成弊方屬聖明之運宜申畫一之規所兾民不陷刑官知所守臣等商量望準聖旨施行仍差侍御史知雜事張湜太子右庶子劇可久殿中侍御史率汀職方郎中劉守中倉部郎中王營司封員外郎賈玼太常博士趙礪國子博士李光贊大理寺正蘇曉太子中允王伸等十人編集新律勒成簿帙律令之有難解者就文訓釋敕格之有煩雜者隨事刪除止要諳理省文兼且直書易會其中有輕重未便當於古而不便於今矛盾相攻可於此而不可於彼盡宜改正無或牽拘候編集畢日委御史臺尚書省四品已上官及兩省五品已上官參詳可否送中書門下議定奏進取止從之至五年七月七日中書門下及兵部尚書張昭逺等奏所編集勒成一部别有目録凡二十一卷目之為大周刑統伏請頒行天下與律疏令式通行其刑罰法統類開成編敕等採掇既盡不在法司行使之限自來自宣令指揮公事三司臨時條法州縣見今施行不在編集之數應該京百司公事各有見行條件望令本司刪集送中書門下詳議奏聞者奉敕宜依議刑輕重後唐天成二年二月十五日御史臺刑部大理寺奏奉天成元年十二月一十日敕越訴之條本防虛妄須行懲斷以絶效尤如或實抱深寃無門上訴其越訴律內不載杖數仍令大理寺别具奏聞者寺司準名例律諸斷罪而無正條若或不經臺省何得復讐事在酌中理難執律其應出律者則舉重以明輕其應入罪者則舉輕以明重疏云斷罪而無條謂一部律內犯無罪名者準雜律不應得為而為者笞四十謂律令無條理不可為者事理重者杖八十疏云雖犯輕重觸雜𢎞多金科玉條包羅難盡其有在律在令無有正條若不輕重相明無文可以比附臨時處斷量情為罪庶補遺闕故立此條其情輕者笞四十理重者杖八十奉敕宜依其年七月洺州平恩縣百姓髙宏超其父暉為鄉人王感所殺宏超挾刃殺感携其首自陳大理寺以故殺論尚書刑部員外郎李恩夢覆曰伏以挾刃殺人按律處死投獄自首降罪垂文髙宏超既遂報讐固不逃法戴天罔愧視死如歸歷代以來事多貸命長慶六年有康買得父憲為力人張蒞乘醉拉憲氣息將絶買得年十四以木鍤擊蒞後三日致死敕旨康買得尚在童年能知子道雖殺人當死而為父可哀若從償命之科恐失度情之義宜減死罪處分又元和六年富平人梁悅殺父之仇投縣請罪敕旨復仇殺人固有彞典以其伸寃請罪自詣公門發於天性本無求生寧失不經特宜減死方今明時有此孝子其髙宏超若使須歸極法實慮未契鴻慈奉敕忠孝之道乃治國之大柄典刑之要本誅惡之深文差若毫釐繫之理道昔紀信替主赴難尚青史之永刪今髙宏超為父復仇即刑書之不尚人倫闕法網宜矜可減死一等長興二年四月大理寺劇可久奏準開成格應盜賊須得本贓然後科罪如有推勘因而致死者以故殺論臣請起今以後若因而致死無故即請減一等别增病症而死者從辜限正賊減本罪五等中書門下復奏今後凡關賊徒若推勘因而致死者有故以故殺論無故減一等如拷決因增疾患候驗分明如無他故雖辜內致死亦以減一等論從之至晉天福六年五月十五日尚書刑部員外郎李象奏據刑法統類節文云盜賊未見本贓推勘因而致死者有故者以故殺論其無故者減一等又云今後或有故者以故殺論或無故者其影迹顯然支證不謬堅持姦惡不招本情以此致死者減故殺罪三等其或妄被舉引終是平人以此致死者減故殺罪一等臣按上文云有故殺者以故殺論即此是矣其無故殺者亦坐減一等罪即恐未當假如官司或有判獄未見本情不可全不詰問託言有故者則是曽行拷掠及違令式或粗大勘捧強相抑壓以此致死者並屬有故無故者即是推勘之司不曾拷掠又不違法律亦不堅有抑壓此則並屬無故不坐罪假若有犯事人舊患病疾推勘之際卒暴身亡不可以坐推司減等之罪又據斷獄律云若依法使杖依數拷決而邂逅致死者勿論邂逅謂不期致死而死且彼言拷決尚許勿論此云無故却令坐罪事實相背理有未通請今後推勘之時致死者若實情無故請依邂逅勿論之義詳定院奏臣等參詳若違法拷掠即非關托故挾情以致其死但有情故者依故殺論若雖不依法拷掠即非托故挾情以致其死而無情故者請減故殺一等若本無情故又依法拷掠或未拷掠或依詰問未詰問及不抑壓因他故致死並屬邂逅勿論之罪從之晉天福三年八月大理寺奏左街韓延嗣為百姓李延暉衝者本街使連喝不住毆擊致死準律鬪毆者原無殺心因相鬪毆而殺人者依故殺人者斬其韓延嗣準律合斬準刑法統類節文絞刑決重杖一百處死敕法寺定刑比不因鬪毆故傷人辜內死者以殺人論蓋微相類且非本條罪有可疑法當在宥徒二年半刺面馳華州發運務收管定贓後唐長興四年六月十四日準敕枉法贓十五匹絞準格加至二十匹乃自喪亂以來亷恥者少舉律行令戒人逺財國家常切好生上下頗能知禁犯既漸寡法亦宜輕起今後犯枉法贓者宜準格文處分贓名條內有以準加減及同字者并倍贓纍贓並宜準律令格式處分凡有告事者除鹽麴條流外宜據輕重依理施行不在格賞之限清泰元年九月大理寺奏所用法書竊盜條準建中年贓滿三匹以上決殺不及三匹量情決杖本條量情之文不定詔御史中丞龍敏等議贓滿三匹準舊法一匹以上決徒二年半一匹以下量罪以杖大理寺丞又以量罪之文不定申奏集寺重取今議定贓滿一匹徒二年半不及一匹徒一年半不得財杖七十從之二年五月中書門下奏刺史位列公侯縣令為人父母祇合倍加乳哺豈可自致瘡痍一昨張宗允胥吏訟論合當極典法司援律罪止徒流臣聞立法稍嚴則人不敢犯其見行法律望下所司更加斟酌御史臺刑部大理寺同議奏準律枉法贓十五匹絞天寶元載加至二十匹請今後枉法贓十五匹準律絞不枉法贓準三十匹加徒流受所監臨贓五十匹流二千里今請依統類不枉法贓過三十匹受所監臨贓過五十匹從之晉天福五年十月敕今後竊盜贓滿五匹者處死三匹以上決杖配流以盜論者依律文處分漢天福十二年八月敕應天下凡關強盜捉獲不計贓物多少按驗不虛並宜處死周廣順三年二月中書門下奏今後應犯竊盜贓及和姦者並依晉天福元年以前條制施行應諸處犯罪人等除反逆外其餘罪並不得籍沒家産及誅骨月一依格令處分請再下明敕頒示天下乃下詔曰赦書節文明有釐革竊慮邉城逺郡未得審詳宜使更明免至舛誤其盜賊若強盜並準向來格條斷遣其犯竊盜者計贓絹滿三匹者並準律決殺其絹以本處上估價為定不滿三匹者第等決斷應有夫婦人被強姦者男子決殺婦人不坐其犯和姦者男子婦人並準律科斷罪不至死其餘姦私準格律處分論赦宥晉天福三年二月任散騎常侍張允進駁赦論曰臣聞管子曰赦者小利而大害久則不勝其禍不赦者小害而大利久則不勝其福又漢紀云吳漢病篤帝問所欲言對曰願陛下無為赦旨竊觀自古帝王皆以水旱則降德音而宥過開狴牢而放囚兾感天心以赦救災者非也假有二人訟一人有罪一人無罪有罪者見赦則喜無罪者銜寃銜寃者何疏乎見赦者何親乎如此則是致災之道非救災之術也小民遇天災則喜皆勸為惡曰國家好行赦必赦我以救災如此則赦者教民為惡也且天道福善禍淫若以赦為惡之人而變災為福則是天助惡民也故曰天降之災警誡人主豈以濫捨有罪而能救其災乎是知赦不可行也明矣上深納之徒流人後唐清泰三年三月尚書刑部郎中孝元龜奏準開成格應斷天下徒流人到所流處本管畫時申御史臺候年月滿日申奏得放還本貫近年凡徒流人所管雖奏不申御史臺報大理寺所以不知放還年月望依格律處分從之斷屠釣梁乾化二年四月敕近者星辰失度方在修禳宜令兩京及宋州魏州取此月至五月禁斷屠宰後唐同光元年十二月十一日敕下凡軍人百姓將牛驢及馬宰殺貨賣今後切要斷除如敢故違即擒捉不問單分髙低所在處斬訖奏其本軍指揮使若不切鈐轄致軍內有人違犯别處捉獲亦當取斷天成二年三月敕訪聞京城坊市軍營有故犯條流殺牛賣肉者仰府縣軍巡嚴加糾察如得所犯人準條科斷如有死牛即令貨賣每斤不得過五文鄉村死牛但報本村節級然後準例納皮曉示天下以此處分長興二年九月敕其五方見在鷹隼之類並宜就山林解放此後諸色人不得輒有進獻仰閣門使有此色貢奉表章不得引進三年五月一日敕凡羅網彈射并諸弋獵之具比至冬初並宜止絶若有犯者隨處官吏科違禁之罪起今後每二月敕便作此敕曉諭中外五代會要卷九
