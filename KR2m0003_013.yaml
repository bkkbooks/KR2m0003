body:
  text: 五代㑹要卷十三宋王溥撰中書門下起請雜條附梁開平五年二月勅食人之食者憂人之事况丞相尊位參决大政而堂封未給且無餐錢勝甚媿之宜令曰食萬錢之半乾化二年十月加宰相俸至二百千命豐徳庫逐月以見錢給之後唐天成四年八月勅朝廷遇有将相恩命准徃例諸道節度使帶平章事兼侍中中書令並列銜于勅牒後側書使字今兩浙節度使錢鏐是元帥尚父與使相名殊承前列銜久未改正湖南節度使馬殷先兼中書令之時理宜齒于相位今守太師尚書令是南省官資不合列署勅尾今後每署將相勅牒宜落下錢鏐馬殷官位仍永為常式長興四年九月勅馬贇有經邦之茂業宜進位于公台但緣平章事犯其父名不欲斥其家諱可改同平章事爲同中書門下二品清泰元年五月宰臣劉昫奏中書以近勅祠祭行事官致齋内惟祀事得行其餘悉斷又宰臣行事致齋内不押班不赴内殿起居不知印臣緣判三司公事其祀事國忌行香伏乞特免從之二年三月宰臣張延朗奏臣判三司事每日内殿祗候其合綴前班押班伏乞特免從之晉天福四年八月勅皇圗革故庶政維新宜設規程以諧公共其中書知印祗委上位宰臣一員五年二月升中書門下平章事爲正二品其年三月勅中書門下五品以上官於兩省上事宰臣押角之禮宜廢之起請雜録後唐同光二年五月中書門下奏凡有進狀乞官及應諸州府奏請判官薦舉前資自詣中書求官等所稱頭銜多有逾越中書既無舊案除授何以爲慿起今後凡有諸色前資若合命官者除近曾任朝官及有科第歴清資官爲衆所知外並須進到前任告赤中書㸃檢方可進擬從之長興元年五月中書門下奏今後凡是在京及諸州府判官得替一年後則得求官擢才特勅勿以爲例從之清泰二年八月中書門下上言前大卿監五品升朝官西班將軍皆在任許滿二十五月如衝替已經二十月即别任用少卿監舊例三任四任方入大卿監五品三任四任方入少卿監今後並祗三任逐任須月限滿無殿責者使入此官西班將軍罷任一年許求官舊例三任四任方入大將軍今祗以三任爲限三任大將軍方入上將軍並須逐任滿月限無殿責或曽任金吾將軍街使藩鎮刺史特勅並不拘此例諸道除兩使判官外書記已下任自辟請應朝官除外任罷任後一年方許陳乞諸道賓席未曾升朝者若官兼三院御史即除中下縣令若兼大夫中丞秘書少監郎中員外郎與清資初任升朝官檢校官至尙書常侍秘書監庻子升朝便與少卿監諸州防禦團練判官推官並請本州辟請中書不便除授應出選門官帶三院御史供奉裏行及省銜罷任後周年許陳乞諸州别駕不除令録仍守本官月限替後一年許陳乞長史司馬因攝奏正比未有官者送名從之三年五月勅近以内外臣僚出入迭處稍均勞逸免滯轉遷應兩使判官畿赤令長取郎中員外郎補闕拾遺三丞五博並聽官僚選擇擢任一則俾藩方侯伯别耀賓階次則致朝列人臣備諳時政令後或偶缺員依此施行晉天福二年正月勅令後應朝臣中有藉才特除外任者秩滿無遺闕將來擬官之時在外一任同在朝一任其陳乞外職及不是特勅不在此限門下省後唐天成元年九月二十五日門下中書兩省狀准舊例檢校官合納本省禮錢伏見尙書省檢校官禮錢近降勅命除翊衛勛庸藩垣將佐外其餘不帶平章事節度使及防禦團練刺史諸道副使郎中已下並三司職掌監院官縣令録事参軍判官等凡關此例並可徴收者伏緣省司舊例别無錢物祗徴禮錢以充公廨破使盖值離亂致失規繩節目縱有檢校官未奉勅命許令依舊徴理其檢校左右散騎常侍乞依尙書省除翊衛勛庸藩垣將佐外並許徴收所兾朝廷故事免失於根原省閤舊儀長存於規制謹具本朝元徴舊例錢數乞奏聞者中書約本省舊徴禮錢及蠲减錢數如左防禦團練刺史諸道郎官三司職掌檢校左右散騎常侍舊例各納錢一十五千今减外各納錢五千兩府及次府少尹左右司馬别駕長史舊例各納錢十千减外各納錢四千諸道將校舊例納錢五千减外各納錢三千都押衙至大將各納錢五千减外各納錢二千五百進奏官各納錢二千其餘都頭指揮使已下並與免放右奉勅宜令門下中書兩省准此逐月具數申中書門下長興元年十一月給事中崔衍奏當省給納諸州銅魚勘問本行令史將狀稱内庫每州銅魚一隻長留在内一隻在本州庫逐季申報平安左魚五隻皆鐫次第字號每新除刺史到郡後遣人到省請合左魚當司覆奏内庫次第出給左魚一隻到州集官吏取州庫右魚契合却差人送左魚納省如别除刺史班司又請次第左魚周而復始臣以州司差人徃來須有煩費今後所除刺史在京受命或經過都城者可令自牒當省請左魚本州契合後差人納省從之周顯徳六年三月勅諸道牧守每遇除移特降制書何假符契其請納銅魚宜廢之晉天福七年五月詔應諸色進䇿人等皆抱才能方來贄獻宜加明試俾盡臧謀今後應進䇿中書奏覆勅下委門下省試䇿三道仍定上中下三等如元進䇿内有施行者其所試䇿或上或中者委門下省給與减選或出身優牒合格選日其試䇿上者委銓司超一資注擬如所試䇿或上或中元進䇿内不曾施行所試䇿下元進䇿内曾有施行便仰曉示發遣不得再有投進餘准前後勅處分中書省後唐天成元年十二月二十三日中書奏伏准故事應諸道節度使凡帶平章事宜於中書都堂上事禮絶百寮等威無異刋石紀壁以列姓名事係殊恩慶垂後裔舊例赴鎮後合納禮錢一千貫充中書及兩省公使伏自近年全隳徃例今皇綱再振墜典咸修合舉成規兾將集事臣等商量今請諸道藩鎮帶平章事處各納禮錢五百千中書建立石亭子一所鐫紀宰臣使相爵位姓名授上年月其所納錢請充中書修建公署及添置都堂内鋪陳什物勅從之四年四月二十一日勅諸道節度使帶平章事兼侍中中書令在京則中書差直省一員引接及赴鎮擬合追還緣使相在京百官請諸須差直省引接兼侍衛出入或恐朝列誤冲及到本道自有客司通引官引接其從榮從厚雖爲皇子職本侯王王建立孔循曾掌樞衡見居藩鎮况諸道使相無直省者甚多其列東青許州先將去直省並宜追還中書清泰二年二月中書奏近日除官制書未下多已漏洩此後除改候畫下所司以正勅冩官告進納如畫黄未下請不催素勅節度防禦團練使刺史行軍副使等事關急切除授官告若待畫下給賜即恐滯留勅樞密院凡經由處不得漏洩其尋常除命依中書所奏門下侍郎晉天福五年二月勅以門下侍郎爲清望正三品七年二月勅門下侍郎班位宜在左右散騎常侍之下其俸給考限依左右散騎常侍例中書侍郎晉天福五年二月勅以中書侍郎為清望正三品中書舍人後唐清㤗二年十一月勅中書舍人所撰誥詞當以其人揚厯功效分明訓奬以代王言晉天福五年九月詔曰六典云中書舍人掌侍奉進奏参議表章凡詔㫖制勅璽書䇿命皆按故事起草進畫既下則署而行之其禁有四一曰漏洩二曰稽緩三曰違失四曰忘誤所以重王命也古昔已來典實斯在爰從近代别創新名今運屬興王事宜師古俾仍舊貫以耀前規其翰林學士院公事宜並歸中書舍人開運元年六月詔依舊置翰林學士院其中書舍人公事准舊日施行諫議大夫晉天福五年二月以左右諌議大夫為清望正四品周顯徳五年六月勅諌議大夫宜依舊正五品上仍班位在給事中之下按唐典諌議大夫四員正五品上皆除門下省班在給事中之下至㑹昌二年十二月中書門下奏升為正四品下仍分為左右以備兩省四品之闕故其班亦升在給事中之上近朝自諌議大夫拜給事者官雖序遷位則䧏等至是以其遷不倫故改正之起居郎起居舍人後唐天成四年十二月尚書比部員外郎崔税奏請自今後毎遇起居令左右史随宰臣上殿各齎紙筆分侍冕旒或階下發一徳音宰臣陳一時政事無大小皆令編緑季終即送史館左右史古官也唐朝改為起居舊制毎視朝即左右史兩員以短卷牋紙執筆趨立于聼政殿之螭首下或聞君之言動美惡必書之洎莊宗中與月朔入朝左右史夾香案對立但不持紙筆自後雖名其官故事皆廢長興二年八月勅准故事應朝廷凡行制勅並宜令起居院抄録闗送史館周廣順二年十一月詔逐月給紙五百幅付起居院符寳郎晉天福三年六月中書門下奏准勅製皇帝受命寳今按唐貞觀十六年太宗文皇帝刻之元璽白玉為螭首其文曰皇帝景命有徳者昌勅宜以受天明命惟徳允昌為文刻之周廣順三年二月内司製國寳兩坐詔太常具制度以聞有司奏按唐六典符寳郎掌天子八寳其一曰神寳其二曰受命寳其神寳方六寸高四寸六分厚一寸七分螭龍紐文與傳國寳同傳國寳秦始皇帝以藍田玉刻之李斯篆文方四寸靣文曰受命于天既夀永昌紐蟠五龍二寳厯代相傳以為神器又别有六寳一曰皇帝行璽二曰皇帝之璽三曰皇帝信璽四曰天子行璽五曰天子之璽六曰天子信璽此六寳因文為名並白玉螭虎紐厯代相傳亡則補之北朝鑄之以金至則天朝以璽字涉嫌改之為寳貞觀十六年别製元璽一坐其文曰皇天景命有徳者昌白玉螭虎紐同光中製寳一坐文曰皇帝受命之寳晉天福四年製寳一坐文曰皇帝神寳其同光天福二寳内司製造不見紐象并尺寸制度勅令製寳兩坐宜用白玉方六寸螭虎紐詔馮道書寳文其一以皇帝承天受命之寳為文其一以皇帝神寳為文按傳國寳自秦始皇後厯代傳受至唐末帝自燔之際以寳随身焚焉晉高祖受命特製寳一坐開運末北戎犯闕少帝遣其子延煦送于戎王戎王訝其非真少帝上表具述其事及戎王北歸齎以入蕃漢朝二帝未暇别製至是始創為之城門郎梁開平元年五月改城門郎為局郎至後唐同光元年十一月却改為城門郎金鑾殿學士梁開平三年正月改思政殿為金鑾殿至乾化元年五月置大學士一員始命崇政院使敬翔為之前朝因金鑾坡以為門名與翰林院相接故為學士省稱金鑾以美之今以金鑾為名非典也大學士與三館大學士同端明殿學士後唐天成元年五月勅翰林學士尚書户部侍郎知制誥馮道翰林學士中書舍人趙鳳俱以本官充端明殿學士非舊制也上初登位以四方書奏多令樞宻使安重誨讀之不暁文義于是孔循獻議因唐室侍讀之號即創端明殿學士之名命馮道等為之二年正月勅端明殿學士宜令班在翰林學士上今後如有轉改祗于翰林學士内選任初置端明殿學士名目如三館之制職在官下及趙鳳轉侍郎遣人諷任園移職在官上至今為例翰林院梁開平三年十二月以前進士鄭致雍為翰林學士非常例也後唐同光元年四月置䕶鑾書制學士以尚書倉部員外郎趙鳳為之時荘宗初建號故特立此名非故事也二年七月以侍省内給事楊彦珞充學士院使其年八月賜翰林學士承㫖戸部尚書盧質論思匡佐功臣非常例也天成三年八月二十九日勅掌綸之任擢才以居或自初命而升或自顯秩而授葢重厥職靡繫其官雖事任皆同而行綴或異誠由徃日未有定制議官位則上下不常論職次則後先未當宜行顯命以正近班今後翰林學士入院並以先後為定惟承㫖一員出自朕意不計官資先後在學士之上仍編入翰林志其年十二月二日學士院記事樞密院近送到權知高麗國諸軍事王建表令賜詔書者其高麗國未曽有人使到闕院中並無彼國詔書式様未審呼卿呼汝兼使何色紙書冩及封王事例伏請特賜叅酌詳定報院者中書帖太常禮院體析由堂據狀申謹按本朝太宗皇帝親平其國後不立嗣是以祗書新羅國請約賜新羅國王書詔體様修冩奉勅賜高麗國書詔宜依賜新羅渤海兩藩書詔體様修冩長興元年三月翰林學士劉昫奏臣伏見本院舊例學士入院除中書舍人内不試餘官皆先試麻制答蕃批答各一道詩賦各一道號曰五題所試並于當日内了便具呈納從前雖有召試之名無考校之實每遇召試新學士日或有援者皆預出五題潛令宿搆無援者旋令起草罕能成功去留皆係于梯媒得失盡歸于偏黨今後凡本院召試新學士欲請權停試詩賦祗試麻制答共三道仍請内賜題目兼定字數付本院召試從之晉天福二年四月中書奏准翰林志凡赦書徳音立后建儲行大誅討拜免三公宰相命將制書並使白麻紙不使印雙日起草候開門鑰入而後進呈至之日百寮立班于宣政殿樞宻使引案自東上閤門出若拜免宰相即便付通事舍人餘付中書門下並通事舍人宣示若機務急速亦使雙日甚速者雖休假亦追班宣示勸據翰林志言立后不言立妃言儲君不言親王公主兼三師位在三公之上文並不載今後立妃及拜免三師三公宰相命將封親王公主並䧏制命餘從今式其年十一月勅新除翰林學士張昭逺早踐綸闈久司史筆曽居憲府累陟貳卿今既擢在禁林所宜别宣班序其立位宜次崔税五年九月勅廢翰林學士院其公事並歸中書舍人開運元年六月勅翰林學士與中書舍人舊分為兩制各置六員偶自近年權停内署况司詔命必在深嚴將使從宜却仍舊貫宜復置翰林學士院至三年正月賜翰林學士院詔書金印一靣周顯徳三年八月宣翰林學士院今後凡與諸侯王詔書除本名外其文詞内有與其名同者宜改避之五年十一月詔曰翰林學士職係禁庭地居親近與班行而既異在朝請以宜殊起今後當直下直學士並宜令逐日起居其當直學士仍起晩朝五代㑹要卷十三
