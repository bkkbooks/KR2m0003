body:
  text: 五代㑹要卷五宋王溥撰待制宫後唐天成元年七月御史臺奏伏惟故事每月百官入門百司排儀仗金吾勘契入後百官待制次對入閤舉論夲司公事左右起居分記言動以付史館編錄此大朝經乆之道也近奉勅㫖百官除常朝外依宰臣每五日一度入内起居拜訖便退縱有公事亦宜倦行因此廢待制次對之官今後伏乞毎月朔望兩度出後文明殿排入閤之儀諸司依前轉對奏論本司公事兼乞因宰臣五日一度延英之際百官要奏事者臨到並許引入如或以山陵日近朔望不坐即取次日亦合舊規候過山陵却復前制勅其五日一度起居之際班行内要奏事者便出班奏對自後又奏請五日入内起居之際令百官次第轉對從之三年十月尚書吏部員外郎趙熈奏百官待制每讀奏於殿廷慮洩機事請許封章奏聞從之其年十二月十日中書門下奏朝官每遇待制不計度數具三代名諱奏聞伏以臣子之道資忠孝以為先祖考之名形翰墨而非異初升朝者不可有缺乆在諜者何必更然日日赴朝不處疎逺之地時時待制忍煩嚬蹙而書况屢瀆於天聰且無益於時政宜更往例别示明規今後除外任除授朝官者仰具三代名諱一度聞奏仍付所司其乆在班者每遇待制不令更通三代名諱從之長興二年八月𠡠今後宰臣文武百官每五日内殿起居仍舊其輪次轉對宜停若有所見許非時上表其朔望入閤待制候對不依舊規晉天福七年三月勅今後百官每五日一度内殿起居日輪差兩員官具所見實封以聞漢乾祐三年八月給事中陶穀奏乞停内殿五日轉對朝臣中或有所見許非時詣闕門拜章論奏從之周顯徳四年五月詔今後每遇入閤其待制官候對官及文武臣寮非時所上章疏並須直書其事其事不得隱情但云某人有武某人能理人某處所官吏因循某州縣刑獄寃濫某事利於國而未舉某事害於民而未除經營四方者術策何施禆贊萬幾者闕遺何補何人讜正之士何人詐偽之端當極言之朕自詳覽其待制候對官今後於文班内輪次充不在祇取刑法官祥瑞後唐同光二年三月唐州奏淮瀆廣潤王廟前有兩樹東西相去七尺五寸其樹各出地七尺五寸両樹相向連理畫圖以進其年九月萊州奏即墨縣人柱上生芝草両夲畫圖以進上宴樂於嘉慶殿諸道貢物稱賀三年三月修東京月陂堤至立徳坊南古岸得玉璽一紐文曰皇帝行寶都部署朱守殷表上之命中書門下宣示百官宰相豆盧革等騐其篆文曰皇帝行寳方圍八寸厚二寸背紐立龍光瑩精妙莫知湮墜之由自秦漢以來天子之璽有六文曰皇帝之璽皇帝信璽皇帝行璽天子之璽天𤣥信璽天子行璽至唐𤣥宗時改名國璽漢末董卓遷獻帝於長安袁術將孫堅攻卓収洛陽營於城南見甄宫井有五色氣命掘之得漢傳國寶文曰受命於天既壽永昌方圍四寸紐交五龍一角小缺議者意張讓刧帝出奔掌璽者投之甄井故也今之所得即六璽之一也守殷又於積善坊得古文錢四百五十六文文曰得一元寶背曰順天元寳天成二年五月懷州進白鵲至六月兖州進三足烏四年七月遂州進嘉禾一莖九穗百官稱賀勅付史館編錄長興三年十月萊州奏即墨縣人王及家生芝草一夲三枝分両岐或三岐上漸相向成片而圓色紫葉莖一色其表白髙尺餘上命出宫中舊進芝草四夲色莖皆同晉天福八年三月有白烏棲於作坊廂樹開運二年十一月鄧州奏穰縣和平坊竹合歡圖進之至三年六月登州文登縣地内掘出金銅佛像四甆佛像十漢乾祐三年五月賴州進白鹿至三年五月太原進白烏白兎周顯徳元年河陽奏氾水縣民家生紫芝數莖進之至三年潁州進白兎翰林學士尚書兵部侍郎頌知制誥陶穀進紫芝白兎雜錄周廣順元年正月五日制書節文帝王之道徳化為先崇飾虚名朕所不取茍致理之未洽雖多瑞以奚為今後諸道所有祥瑞不得輒有奏獻行幸晉天福二年十一月中書門下奏准新令車駕巡幸所在州縣官人見在官所祇承者賜會並同京官從之周廣順二年五月車駕親征兖州御札宣示沿路側近節度防禦團練使刺史不得離本州府來赴朝覲其隨駕一行供頓並取係省錢物准備差使臣勾當仍預告報一路州縣並不得别有排比其隨從臣寮外内諸司官中已有供給州縣亦不得别有破費祇供其要載動用什物等亦已指揮備辦如缺少之時候見宣命即供應祇不得預前排比如衷私有人小小取索並不得應付或軍部及諸色人於路途店肆買酒食物先還價錢両京留司百官祇於逓中附表起居時熱不用差官至行在沿路所指揮事件車駕回日亦依此施行追賞周顯徳五年九月賜宰臣樞密使翰林學士中書舍人宴於玉津園張教坊樂先是上以前代有賜百官觀稼之事復以是嵗秋成念内臣之勞倦故有是命節日後唐同光四年四月十九日明宗𠡠㫖應中外臣僚及三京諸道州府如是謝賀并節序並可據有無量力進奉不得因兹掊斂傷耗生靈至於竒巧珍玩飛放搏噬之物並不得轉將進奉天成二年三月五日門下侍郎兼工部尚書平章事判三司任圜奏三京留守諸道節度觀察諸道州防禦使刺史每年應聖節及正至等節貢奉或恩命改轉或討伐勝㨗各進獻馬伏見本朝舊事雖以獻馬為名多将綾絹金銀折充馬價葢跋渉之際䕶養稍難因此羣方俱為定制自今後伏乞除蕃部進駝馬外諸州所進馬許依天福三年以前事例隨其土産折進價値冀貢輸之稍易又誠敬之獲伸兼欲於諸處揀孳生馬准舊制分置監牧仍委三司使别具制置奏聞清泰二年正月中書門下奏每遇聖誕節辰凡刑獄公事奏覆候次月施行今後伏請重繫者即候次月輕繫者節前奏覆决遣從之晉天福四年九月勑每年寒食七夕重陽及十月暖帳内外臣僚進獻並宜停了六年正月𠡠今後冬正寒食端午天和節及諸色謝賀無屬州錢處不得進奉周廣順三年七月勅内外文武臣僚遇永夀節辰皆於寺觀起置道塲便為齋供訪聞皆是飲醵所宜減損以足公私今後中書門下與文武百官等共設一齋樞宻使與内諸司副使等共設一齋侍衛親軍馬歩軍都指揮使已下共設一齋其餘前任官員及諸司職掌並不得更開置道塲及設齋獻俘後唐天成四年二月定州行營招討使王晏球來獻逆人王都首級并俘馘上御咸安樓立仗百官就列尚書兵部宣露布於樓前宣訖尚書刑部侍郎張文寳奏曰逆賊王都首級請付所司大理卿蕭希甫受之以出獻於郊社其王都男並蕃將禿餒等命磔於開封橋百官稱賀晋天福七年正月鎮州行營招討使杜重威奏曰二日收復鎮州傳逆人安重榮首級來獻上御乾明樓仗衛如儀宣露布訖大理卿受俘馘付市徇之百官稱賀命漆其首送於契丹其年九月襄州行營都部署髙行周等執逆賊安從進男宏受判官王鼎李光圖等四十四人來獻上御乾明門受俘宣露布訖百官稱賀命徇於市漢乾祐二年七月西南行營都部署露布獻河中府所獲逆賊李守正首級并俘馘等上御明徳門樓受俘羣臣稱賀三年正月鳯翔節度使趙暉奏請供奉官張銖押逆賊王景崇首級同惡周㻮至闕下獻俘命徇於六街磔於兩市大内梁開平元年四月改正衙殿為崇元殿東殿為𤣥徳殿内殿為金祥殿萬嵗堂為萬嵗殿門如殿名大内正門為元化門皇城南門為建國門滴漏門為啟運門下馬門為昇龍門𤣥徳殿前門為崇明門正殿東門為金烏門西門為玉兎門正衙東門為崇禮門東偏門為銀臺門晏堂門為徳陽門天王門為賓天門皇城東門為寛仁門浚儀門為厚載門皇城西門為神獸門望京門為金鳯門三年十一月以乾文院為文思院行從殿為興安殿毬塲為興安毬塲弓箭庫為宣威殿晉天福二年八月改𤣥徳殿為廣政殿門為廣政門四年改明徳殿為滋徳殿以宫城南門同名故改之周廣順元年六月𠡠以薫風等門為京城門明徳等門為皇城門啟運門等為宫城門昇龍等門為宫門崇元等門為殿門右已上東京梁開平二年正月改正觀殿為文明殿含元殿為朝元殿三年十月改左右章善門為左右銀臺門其左右銀臺門為左右興善門後唐同光二年正月朝元殿却改為含元殿崇勲殿改為中興殿應順門改為永曜門太平門為萬春門通政門為廣政門鳯鳴門為韶和門萬春門為中興門解慍殿為明瑞殿其年九月以内園新殿為長春殿右已上西京晉天福六年改皇城南應天門為乾明門北門為𤣥徳門西門為千秋門東門為萬春門七年三月改宣明門為來鳯門武徳殿為視政殿文思殿為崇徳殿畫堂為天清殿寢殿為乾福殿門如殿名右已上鄴都太寧宫晉天福二年五月御史臺奏汴州在梁室朱氏稱制之年有京都之號及唐莊宗平定河南復廢為宣武軍至明宗行幸之時掌事者因縁修葺衙門城遂挂梁室時宫殿門牌額當時識者咸竊非之一時車駕省方暫居梁苑臣觀衙城内齋閣牌額一如明宗行幸之時無都號而有殿名恐非依據臣等竊惟秦漢以來寰海之内鑾輿所至多立宫名近代隋室於揚州立江都宫太原立汾陽宫岐州立仁壽宫唐朝於太原立晉陽宫同州立長春宫岐州立九成宫宫中殿閣皆題署牌額以類皇居請准故事於汴州衙城門權挂一宫門牌額則其餘齋閣並可取便為名勅行闕宜以太寜宫為名三年十月𠡠汴州升為東京其太寕宫門楼宜以顯徳為名長春宫梁開平元年五月中書門下奏請廢同州長春宫使從之後唐同光元年十一月復置長春宫使額晉天福四年四月𠡠其同州長春宫使額宜停沿宫職務委州司制置華清宫晉天福四年五月廢為靈泉觀諸宫梁開平元年五月以水北宅為大昌宫後唐天成元年六月中書門下奏請以洛京潛龍舊宅為至徳宫北京舊宅為積慶宫從之晉天福三年十一月中書門下奏請以洛京潛龍舊宅為廣徳宫北京舊宅為興義宫北京舊莊為慶昌宫仍改鄉為龍飛鄉里為神光里雜錄梁開平元年八月勅諸道所有軍事申奏令直至右銀臺門委客省使畫時引進㝷常公事依前四方館収接乾化元年五月勅左右銀臺門朝叅諸司使軍使已下不得帯從人出入親王許一二人執條沐手簡餘悉止闌入者抵律閽守不禁與所犯同受朝賀後唐天成三年十月二十一日中書奏冬至日文武百僚詣東上閣門拜表稱賀儀注前一日所司於閣門外量地之宜設中書令捧表位禮部郎中押表按位及文武常叅官位如常儀其日文武百僚依時刻俱詣閣門外列班如式次通事舍人賛引中書門下入就位立定典儀曰再拜應在位官俱再拜訖禮官通事舍人引中書令詣捧表位禮部郎中取表授中書令跪受復置於案其案禮部令史二人對舁前導至位中書令搢笏捧表跪授閤門使跪捧表側立候中書令退歸夲班立定典儀曰再拜應在位官俱再拜舞蹈三稱萬嵗又再拜訖門門使捧表以進次門門使宣答出詣中書門下班前有勅典儀曰再拜應在位官俱再拜宣曰履長之慶與卿等同之宣訖典儀曰再拜在位官俱再拜舞蹈三稱萬嵗又再拜訖相次退如常式右太常禮院狀准禮例修撰如前按開元八年中書奏冬至一陽生萬物潜動所以自古聖帝明王皆此日朝萬國觀雲物禮之大者莫踰是時其曰視圜丘皆令攝官行事質明既畢日出視朝有國已來更無改易若親拜南郊受朝須改因勅自今以後冬至受朝永為常式周廣順五年七月勅内外文武臣僚遇永夀節辰皆于寺觀起置道場便為齋供訪聞皆是醵金所宜減損以足公私令後中書門下與文武百官等共設一齋樞宻使與内諸司副使等共設一齋侍衛親軍馬歩軍督指揮使已下共設一齋其餘前任官員及諸司職掌並不得更開置道場及設齋獻俘後唐天成四年二月定州行營招討使王宴球來獻逆人王都首級並俘馘上御咸安樓立仗百官就列尚書兵部宣露布于樓前宣訖尚書刑部侍郎張文寳奏曰逆賊王都首級請付所司大理卿蕭希甫受之以出獻于郊社其王都男並蕃將禿餒等命磔于開封橋百官稱賀晉天福七年正月鎮州行營招討使杜重威奏曰二日收復鎮州傳逆人安重榮首級來獻上御乾明樓仗衛如儀宣露布訖大理卿受俘馘付市徇之百官稱賀命漆其首送于契丹其年九月襄州行營都部署髙行周等執逆賊安從進男宏受判官王鼎李光圗等四十四人來獻上御乾明門受俘傳宣露布訖百官稱賀命徇于市漢乾祐二年七月西南行營都部署露布獻河中府所獲逆復請比例行之勅日出御殿與祀事無妨宜依常例施行二年十二月太常禮院奏來年正月元日合御明堂受朝賀其日上辛祀昊天上帝于南郊依禮大祀不坐勅祀事在質明前儀仗在日出後事不相干宜依常年受朝晉天福四年十二月太常禮院申奏勅約開元禮重正定冬朝㑹按開元禮三品已上升殿羣官在慶請沿近禮依内晏列坐據開元禮稱賀後皇帝戴通天冠服絳紗袍百官朝服侍坐解劍履於樂府之西北今京邑新造殿庭隘狹請皇帝冠烏紗巾服赭黄袍百寮具公服俟朝堂宏獻即舉擕儀二舞鼓吹熊羆之樂工師樂噐等事因乆廢不可猝備且設九部樂用教坊伶人詔曰三品之官尚書方得升殿餘依所奏二王三恪梁開平二年三月以唐宗子鴻臚卿李嵸封萊國公為二王後四月中書門下奏萊國公李嵸合於西都選地建立三廟以備四仲祠祀毎祭仍令度支供給祭料從之其年十二日禮儀使奏謹按唐朝以魏元氏子孫封韓國公為三恪以周宇文氏子孫封介國公隋楊氏子孫封酅國公為二王後今者國家受禪封唐李氏宗子李嵸為萊國公今請以介國公為三恪􅈶國公萊國公為二王後從之晉天福二年正月勅周以杞宋封夏殷之後為二王後兼封舜之後為三恪唐以周隋之後封公為二王後又封魏之後為三恪宜於唐朝宗屬中取一人封公世襲兼隋之􅈶國公為二王後以後周介國公備三恪其主祀及赴大朝㑹委所司具典禮申奏其唐朝宗屬中舊在朝及諸道為官者各據資歴考満日從品秩序遷已有出身任令叅選四年九月勅周受龍圖立夏殷之祀唐膺鳯厯開􅈶介之封乃睠前朝載稽舊典宜開土宇俾奉宗祧宜以郇國食三千户封唐許王李從益為郇國公奉唐之祀服色旌旗宜依舊制以西京至徳宫為廟牲幣噐祭服悉從官給朔望朝叅梁開平元年十月中書門下奏請毎月初八日望日延英聼政永為常式從之後唐天成元年五月三日勅今後宰臣文武百官除常朝外毎五日一度入内起居其中書非時有急切公事請開延英不在此限晉天福二年十一月中書門下奏准唐正元年九月五日勅文官充翰林學士及皇太子諸王侍讀武官充將軍職事並不常朝叅其在三館諸寺諸職事官並朝叅訖各歸所務者自累朝已來文武在内庭充職兼判三司或帶職額及六軍判官等例不赴常朝先無正勅准近勅文武職事官未升朝者按舊制並赴朔望朝叅其翰林學士侍讀三館諸職事官望准元𠡠處分其諸在内庭諸司使等每受正官之時來赴正衙謝後不常朝三司職官免常朝唯赴大朝㑹其京師未升朝官祇赴朔望朝叅帶諸司職掌者不准此例文官除端明殿翰林院學士樞密院學士中書省知制誥外有兼官兼職者仍各發遣本司公事從之其月中書門下奏應供奉官常叅官朔望朝叅按六典凡京百司有常叅官謂五品已上職事官八品已上供奉官員外郎監察御史太常博士諸司長官謂三品已上若勑喚諸司長官及賜物者太子賔客尚書左右丞諸司侍郎中書門下五品已上官御史中丞並同長官例若别賜物中書門下正三品准二品四品准三品五品准四品同中書門下平章事並同中書門下正三品官按㑹要侍中舊是正三品大厯二年改為正二品中書令同今中書門下平章事望同中書門下正二品按六典禮部凡京百司文武職事九品已上每朔望朝叅五品已上及供奉官員外郎監察御史太常博士每日朝叅從之入閤儀司天進時刻牌閤門進班齊牌皇帝自内着袍衫穿靴乘輦至常朝殿門駐輦受樞密使已下起居訖引駕至正朝殿皇帝坐定捲簾殿上添香喝控鶴官拜次鷄官叫次閤門勘契次閤門承㫖喚仗次閤門使引金吾将軍南班拜訖分引至位對揖次細仗相次入次執文武班簿至位對揖次宰臣南班拜訖分引至位對揖次金吾將軍奏平安次文武百官入通事舍人揖殿靸靴入沙墀両拜立定次引宰臣及両省官金吾将軍合班立定閤門使喝拜搢笏舞蹈三拜奏聖躬萬福又引宰臣班首一人至近前跪奏又両拜舞蹈三拜引至位對揖通事舍人引宰臣於東西踏道下立次文武百官出次兩省官南班揖殿出次翰林學士南班揖殿出次執文武班簿南班揖殿出次金吾將軍南班揖殿出次細仗出次引宰臣香案前奏事訖宣徽使喝好去南班揖殿出次閤門使引待制官到位兩拜引近前奏事訖却歸位罄折宣徽使宣所奏知又両拜舞蹈三拜舍人喝好去南班揖殿出次刑法官奏事准上次監察御史南班揖殿出次起居郎南班揖殿出次閤門承旨放仗次閤門使奏衙内無事次喝控鶴官門外祇便次下簾皇帝上輦歸内五代會要卷五
