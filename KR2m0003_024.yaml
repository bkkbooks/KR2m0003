body:
  text: 五代會要卷二十四宋王溥撰樞密使梁開平元年五月改樞密院為崇政院始以敬翔為院使仍判官一人自後不置判官置副使一人二年十一月置崇政院直學士二員選有政術文學者為之始以尚書吏部郎中吳藹尚書兵部郎中李珽充選其後又改為直崇政院後唐同光元年十月崇政院依舊為樞密院命宰臣郭崇韜兼樞密使亦置院使一人晉天福四年四月以樞密副使張從恩為宣徽使權廢樞密院故也先是上以宰臣桑維翰兼樞密懇求免職祗在中書遂以宣徽使劉處讓代之每有奏議多不稱旨又處讓丁內憂乃以樞密院付中書門下故有是釐革開運元年一月依舊置樞密院其見在中書元係樞密院職司人吏各勒仍舊應合行公事委本院奏取指揮以宰臣桑維翰兼樞密院使從中書門下奏請也周顯德六年六月命司徒平章事范質禮部尚書平章事王溥並參知樞密院事建昌宫使梁開平元年四月置建昌院以博士王友文判院事以太祖神武元聖孝皇帝在藩時四鎮所管兵車稅賦諸色課利按舊部籍施行仍置院以領之其五年中書門下奏請以判建昌院事為建昌宫使仍以太祖舊潛龍宅為宫二年三月以侍中韓建判建昌院事至十月以尚書兵部侍郎李皎為建昌宫副使三年九月以門下侍郎平章事薛貽矩判建昌宫事至四年十二月以李振為建昌宫副使乾化二年五月以門下侍郎平章事于競判建昌宫其年六月廢建昌宫以河南尹魏王張宗奭為計使凡天下金榖兵式舊𨽻建昌宫者悉主之至後唐同光四年二月以吏部尚書李琪為國計使按實録自後廢其名額不置後唐同光二年正月敕鹽鐵度支户部三司凡關錢物委租庸使管轄其年三月左諫議大夫竇專上疏曰臣伏見天下諸色錢穀比屬户部度支金部倉部各有郎中員外支計分擘自後以租賦殷繁添置司額自唐天寶中安史作亂民户流亡征賦不時經費多闕唯江淮嶺表郡縣完全總三司貨財發一使征賦在處勘覆目曰租庸才收京城尋廢職務廣明中黃巢充斥僖宗省方依前以江淮征賦又置租庸使催征及至車輅還京旋亦停廢偽梁不知故事將四鎮節制徵輸置宫使名目管係既廢宫後改置租庸雜以掊斂相兼加之出放生利况户口什一之稅是太平之日規繩租庸總三司追科因喪亂之時制置在京無此名目乃是出使權宜若要委一官之能何妨總三司合判伏請敕郡縣重集户口計定租稅令鹽鐵却歸三司收其征賦務使仍舊會計到京且使上供何須直進既户口不失則增賦倍多致海內有久逺之安示天下為一家之治事雖不行然有識者甚韙之天成元年四月敕停廢租庸院名額依舊為鹽鐵户部度支三司委宰臣一人專判仍廢租庸院大程官及放豬羊柴炭户其括田竿尺一依偽梁制度仍委節度使通行三司不得更差使檢括州使公廨錢先被租庸管係者一切却還州府長興元年八月敕會計之司國朝重務總其使額以委近臣貴便一時寧循往例張延朗可充三司使班位在宣徽使之下唐朝以户部度支掌泉貨鹽鐵則特置使其名户部度支則尚書省本司侍郎郎中判事天寶中楊慎矜王鉷楊國忠雖承恩顧皆守夲官别帶使額下及劉晏苐五琦亦如舊制自後又以宰臣各判一司不帶使額乾符之後天下兵興隨置租庸使以掌調發兵罷停偽梁不間典故乃置租庸使總天下征賦莊宗亦踵其事既今上登位削去使名命重臣一人專判曰判三司至是延朗自許州入掌國計自于樞密使請置三司使宣下中書門下宰臣以非故事擬受延朗充諸道鹽鐵轉運使令兼判户部度支上不從故特降是命三司置使名自延朗始也四年正月三司使奏當省有諸道鹽鐵轉運使額職員極多見有左右都押衙及客司通引今欲從正押衙設省職為轉遷之序正押衙同押衙衙前兵馬使討擊副使衙前虞候衙前子弟者敕衙前兵馬使已下名目皆是軍職不合係於省司其正押衙同押衙衙前虞候衙前子弟宜依宣徽使梁開平元年五月宣旨下徽院收管供奉宫殿前受旨官宣左右內直等後唐清泰元年七月殿直都知趙處願承旨都知蔣德鄰謝恩令具襴笏晉天福六年七月敕宣徽院供奉官殿直人數不少今後諸道行運副使不得奏諸宣補骨肉皇城使梁開平三年七月敕內皇城諸門宜各差控鶴官兩人守把其諸司使并諸司諸色人並敕于左右銀臺門外下馬不得將帶人入門逐日諸道進奉客省使于千秋門外排當訖勒控鶴官擡至內門前令董門殿直已下舁進其章善門仍令扄鎖不用逐日擅自開閉乾化元年五月詔曰闈是正門也宜以時開閉用達陽氣委皇城使準例檢校啓門車駕出則闔扉元帥後唐長興四年以秦王從榮為天下兵馬大元帥其年九月中書門下奏秦王加天下兵馬大元帥自歷朝以來無天下兵馬大元帥公事儀注或專一面之權或總諸道之司其儀注規程公事條目載詳故實未見明文臣等謹沿近事伏見招討使總管兼受副使已下鞬庭禮今望令諸道節度使已下凡帶兵權者見元帥階下具軍禮參見皆申公狀其使相者初相見亦以軍禮一度已後客禮相見應天下諸軍務公事元帥府行指揮其判六軍諸衛事其行公牒往來其元帥府所置官屬補授軍職則委元帥奏請從之諸道節度使軍額滑州唐光啓二年四月改為宣義軍節度至後唐同光元年十月復為義成軍許州梁開平二年改為匡國軍後唐同光元年十月復為忠武軍陜州梁開平二年四月改為鎮國軍節度至後唐同光三年二月復為保義軍邢州梁開平二年六月建為保義軍節度割洺惠二州𨽻之至後唐同光元年改為安國軍宋州梁開平三年五月升為宣武軍節度割亳德軍輝潁三州𨽻之至後唐同光元年改為歸鄧州梁開平三年五月升為宣化軍節度割泌隨復郢四州𨽻之與襄州分江心為界至後唐同光元年改為威勝軍周廣順二年三月改為武勝軍避諱也晉州梁開平四年四月升為定昌軍節度以絳沁二州𨽻之至後唐同光元年改為建雄軍滄州梁乾化二年三月改為順化軍節度以張萬進歸順故也至後唐同光元年改為橫海軍華州初為感化軍至後唐同光元年改為鎮國軍至顯德元年八月降為刺史直屬京耀州梁正明元年十二月改為崇州升為靜勝軍節度至後唐同光元年改為順義軍至二年三月降為團練州至周顯德二年降為刺史直屬京潞州梁龍德三年改為昭義軍節度以李繼韜歸故也後唐同光元年復為安義軍至長興元年三月復舊名昭義軍安州後唐同光元年改為安逺軍節度至晉天福五年七月降為防禦使所管新州割𨽻許州以李金全叛命故也至漢天福十二年六月復為安懷軍節度至周顯德元年十月又降為防禦州新州後唐同光二年七月升為威塞軍節度以媯儒武三州𨽻之應州後唐天成元年七月升為彰國軍節度以興唐軍為寰州以𨽻之雲州後唐同光二年七月復為大同軍節度以應州𨽻之陳州晉開運二年十月升為鎮安軍節度至漢天福十二年六月降為刺史周廣順元年正月升為防禦州二年七月復升為鎮安軍節度以潁州𨽻之曹州晉開運二年十月升為成信軍節度至漢天福十二年六月降為刺史至周廣順二年七月復升彰信軍節度以鄆州𨽻之襄州晉天福七年降為防禦州直屬京所管均房二州割𨽻鄧州以安從進叛命初平故也至漢天福十二年六月復舊為山南東道使青州晉開運元年十二月降為防禦州與登萊淄三州並屬京以楊光逺叛命初平故也至漢天福十二年六月復舊為平盧軍節度貝州晉天福三年十二月升為永清軍節度以博冀二州𨽻之至周顯德元年十月降為防禦州相州梁正明元年三月魏博節度使楊師厚薨乃割相州建節度尋軍亂以地歸使唐莊宗改為屬郡𨽻魏州至天福三年十月復升為彰德軍節度以澶衛二州𨽻之兖州周廣順二年五月降為防禦州以慕容彥超叛命初平故也澶州晉天福三年十一月初升為防禦𨽻相州移理所於德勝軍至九年八月升為節度號鎮寧以濮州𨽻之鎮州晉天福七年正月改為順國軍節度改常山為掌州郡應軍額館馹帶當山名者並改為常山以安重榮叛命初平故也至漢天福十二年八月却並復為成德軍府州漢天福十二年升為永安軍節度至乾祐三年四月降為團練州至顯德元年五月復舊軍額代州周顯德元年升為靜塞軍節度以初歸降故也汾州顯德元年五月升為寧化軍節度以初歸降故也夔州後唐天成二年七月升為寧江軍節度楚州後唐天成三年閏八月升為順化軍節度夀州後唐天成三年十月升為中正軍節度閬州後唐天成四年十月升為保寧軍節度虔州後唐長興二年八月升為昭信軍節度洮州後唐長興四年十一月升為保順軍節度溫州晉天福四年八月升為靜海軍節度內出錢元瓘奏也金州晉天福四年五月升為懷德軍節度至漢天福十二年復降為防禦州湖州周顯德六年二月升為宣德軍節度從兩浙錢宏俶奏也雜録後唐天成九年十一月敕雄武軍節度使官銜內宜兼押蕃落使二年七月敕頃用本朝親王遙領方鎮其在鎮者遂云副大使知節度事但年代已深相沿未改今天下侯伯並正節旄惟東西兩川未落副大使字宜令今後祗書節度使親王遙領節度使後唐清泰元年六月以皇子重吉遙領成德軍節度鎮冀深趙等州觀察處置北面水陸轉運制置等使兼河南尹判六軍諸衛事晉天福八年以皇弟重睿為開封尹充管內河堤使時重睿以年幼未出閣命左散騎常侍邊蔚權知府事逐月支錢七十千米麵傔千人馬十匹草萊别支公用米二十石麥五十石羊二千口每年麵三千斤錢四百千開運二年五月又遙領雄武軍節度秦階成等州觀察處置押蕃落管內營田制置等使至三年正月改領武軍節度許申等州觀察處置使三年三月以皇子延照遙領鎮寧軍節度澶濮等州觀察處置管內河堤等使至其年十一月改領保義軍節度陜虢等州觀察處置等使梁乾祐元年六月以皇弟勛領山南西道節度管內觀察處置等使興元尹宰相遙領節度使後唐同光元年十月以侍中監修國史郭崇韜兼領成德軍節度鎮冀深趙等觀察處置等州使真定尹都護府後唐長興三年四月中書門下奏據十道圖有大都護除單于北庭等府久不置外今具員內節度使中見有兩員外守安北都護安東都護今請祇以四大都護為定額仍以安東大都護為首奉敕宜依其安南大都護安西大都護安北大都護次之軍梁開平元年十二月于輝州碭山縣置崇德軍太祖榆社凡在碭山置使以領之始命朱彥讓為軍使晉天福四年五月改舊威州為清逺軍六年八月改澶州頓邱鎮為德清軍鎮使為軍使其年九月以新修胡梁渡為大通軍初置浮橋故也七年四月降雄州為昌化軍警州為威肅軍其軍使委令本道差補周顯德元年十月以萊蕪監為廣利軍從前監使張崇謙奏請也至六年十一月復廢為萊蕪治二年三月以李晏口為靜安軍李晏口當契丹入侵之路築城屯軍為邊防人甚賴之其年六月廢景州為定逺軍所管東光弓高兩縣𨽻滄州安陵縣𨽻德州其年七月廢環州為通逺軍三年五月以渦口鎮為鎮淮軍五年六月以鄂州漢陽縣為漢陽軍時初平淮南之地以江為界六年十一月以鳯州固鎮為雄勝軍諸使雜録梁朝諸使司名目有崇政院使租庸使宣徽院使客省使天驥使飛龍使莊宅使大和庫使量德使儀鸞使乾文院使文思院使五坊如京使尚食使司膳使洛苑使教坊使東上閣門使西上閣門使內園栽接使弓箭庫使大內皇牆使武備庫使引進使左藏庫使西京大內皇牆使間廏使宫院使翰林使梁開平元年五月改御食使為司膳使小馬坊使為天驥使文思院使為乾文院使同和院使為儀鸞使至三年十一月乾文院却置使其年九月敕近年文武諸道奉使皆分外停留今後兩浙福建廣州安南雍容等道使到發許住一月湖南洪鄂黔桂住二十日荆襄同雍鎮定青滄許住十日其餘近輔歇泊三五日如是往來道路據里數日行兩驛若遇疾患及江河阻隔委所在長史具事由聞奏仍仰御史臺覺察三年十月置左右軍巡使以段明逺為左軍巡使鄧闕為右軍巡使時以遷都之始也其河南尹侍衛諸軍雖合差人巡警京都往往濫發分曹異識多擾于民乃置左軍巡管水北右軍巡管水南各置巡院罷諸軍巡檢人員仍令判六軍朱衛張忠奭都管轄乾化元年十月以大理卿玉膳為安南送旌節官告使舊制巡撫黜陟册命賑恤弔賜入蕃等使選朝臣為之其宣慰加官送旌節即以中官為之今以三品送旌節新例也後唐同光二年二月中書門下奏今後大鎮節度使管三州已上者每年許奏管內官三人管三州已下者許奏二人仍須是考績尤異如止于徵科及限檢損無瑕祗得書考不得奏薦其防禦使每年許奏一人刺史無奏薦之例更有將前資官請他處除授者謂之橫薦亦宜止絶如有違越中書不在施行之限從之其年三月中書門下奏儀仗法物使李肅是偽梁制此使額使令主持又無考限况主持法物各有本司請準舊停廢從天成元年九月以尚書都官郎中庾傳美為三州搜圗籍使其月北京奏準宣命于係省賣麴錢上每貫割留二伯充本府公使初朱守殷為河南尹官兼平章事與執貴要交歡屢有宴會及告安重誨司府無利潤支費遂議割麯錢奏後之諸府因以為例二年三月二十一日敕諸道州府所有專差人持禮往來皆具申奏况列蕃交聘諸侯結歡乃自古之通規亦明朝之舊事近日皆章奏稟命朝廷既旌敦好之風兼表睦鄰之好且道非越境何勞上聞宜令遍降敕命指揮諸道州府自今後應是諸道差人持禮來去並令不要申奏四年五月敕今後諸州諸使凡於廨署並須專功增修不得信任摧毁凡所制辦亦令勒具年月編于帳籍受代之際分明交領不得因此接便擾人其年六月敕州侯伯所請賔從及主事元隨並令奏具名姓或參佐道虧各令加罪其年七月敕諸道州府不得奏薦將校職員乞行恩命如顯有功效即列奏以聞長興元年五月敕今後凡有除移準宣詔遣差外其餘須候人到彼點檢交割軍州公事了日即可發離本處仍令逐道觀察使散管內諸州準此二年五月敕今後應內外臣寮不計在朝出使並不得輒發書題妄行請託于諸處安排公人宜令三司及諸道州府節使防禦團練使刺史等或有人不畏條敕猶躡舊蹤者並仰立具姓名聞奏發薦者貶所任府官求薦者配于邊逺州縣常知所在如逐處長吏自徇人情顯違敕命祗被替本人詣闕上訴勘問不虛長吏罰兩月俸發薦人比前例更加一等被替人却令依舊仍從再勾當後三年內除别顆一作顯有罪名外不得妄有替移其長興一年五月一日已前所犯不在上訴之限兼敕到後但是州府並于鋪驛及顯要處粉壁具録敕命曉諭常令申舉永使聞知况蒙國爵待人惟賢是舉稍開俊乂必命奬升其有端士正人雄文大學言可以經綸王道行可以規矩人倫但當顯陳表章明具薦論名始得正功不棄材所期絶彼幸人豈可滯諸賢者其年七月敕諸道奏薦州縣官各定員數今宜增益以廣搜揚帶使相節度使每年許薦三今加至五人不帶使相節度使許薦二人今加至三人直屬京防禦團練使許薦一人今加至二人即不得薦新罷任及過格之人如未曾有官者當别比擬清泰元年八月敕凡關差使須示均平今後文武百官充使者宜令依輪羞中書置簿不得重疊其內降宣諭不拘此例若當使自緣有事或不欲行注簿便當一依長興三年正月後已曾奉使者便著為簿首已後差使次第注之晉天福二年二月敕今後中外臣寮或因差使出入不得薦囑人于藩鎮希求事任如有犯者準長興三年敕條處分其月敕諸道馬步都虞候今後朝廷更不差補委逐州府于衙前大將中選久歷事任曉會刑獄者充仍以三年為限不得于元隨職員中差補其今月已前見在任者如無罪犯宜令終其月限候將來得替仰本道于衙前收管不得赴闕五年六月敕承旨者承時君之旨非近侍重臣無以稟命是以大朝會則以宰臣承旨草詔書則以學士承旨若無區别何表等威除翰林學士承旨外殿前承旨改為殿直樞密院承旨改為承宣御史臺三司閣門容省承旨並令别定其名其年七月二日敕應內外讀使諸司及請州府凡有諸色公道事須是奏聞今後不得白狀及劄子記事申覆如事關機密即準元降宣命實封斜角不題事目通下其合由中書及中書勘會公事所申狀亦須是本司及逐處官員印署不得將白狀及記事劄子兼令司局抄劄子申宜令御史臺及宣徽院三司侍衛司諸道州府準此漢乾祐三年五月敕諸防禦團練州申奏公事除朝廷以軍期應副則不及開于廉使如尋常公事不得自專須先申本官斟酌以聞今後州府不得違越其月敕諸道州府宜差散從官大府五百人下州二百人宜量户多少差團集本處管係立節級點檢教習警備州城至周廣順元年三月敕其諸州府所差散從官親事官並放歸農自去年四月已前州縣元管係人數一切仍舊其遞鋪如已前招召到者且仰仍舊今後更不得招召其諸處場院並不得影庇兩稅人户所有河北諸州有及澤潞晉絳慈隰解等州於先差散從親事官內選弓箭手祗且留住本州管係其餘放差先是漢隱帝命諸州於百姓內差散從官親事官又差力及人户充遞鋪文下三司諸場務召人户替占役兵皆不便於民故放之其年七月敕應諸道州府鎮務祗差補鎮符一員都虞候一員餘並除廢因尚書都官郎中曹謙言上章故降是敕周廣順元年五月敕今後諸州府不得奏薦無前資及無官并無出身人如有竒才異行亦許具名以聞便可隨表赴闕當令有司考試朕當親覽顯德五年四月六日敕應諸道州府進奏逐月合請俸料及紙筆等錢宜令今後於本州公使錢內支給不得分配人户及州縣門户如本州公使錢少不使支給處祗不要置進奏官仰于衙前差有名糧職員充進奏聞院副知仍二周年替罷本州優與安排五代會要卷二十四
