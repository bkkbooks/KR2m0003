body:
  text: 五代㑹要卷二十二宋王溥撰吏曹裁製後唐長興二年七月吏部南曹奏前守鄆州盧縣令季玭曽兩任祕書丞一任國子毛詩博士雖前任有朝官今任合准格五選集敕應州縣官有曽在朝行及曽佐幕罷任後准前資朝官賓從例處分其帶省銜以上并內供奉裏行及諸色出選門官或降授令録者罷任日並依出選門例處分不在更赴常調便與除官兼州縣官其間書得十六考者准格叙加朝散階例自此准出選門例處分如不書得十六考雖過朝散階不在此例周顯德三一作五年閏七月吏部南曹狀申所行事件畫一如後一每年十月一日入選限判曹員外郎准例免常朝一新起請十月一日鎖曹磨勘選至開曹日使具判成名銜榜示及申中書門下申銓并牒門下省一鎖內內有違礙選人准久例至開曹日曉示駿放及申堂申銓牒臺判者課績官准敕經曹投狀不缺選限及磨勘無違礙者申送中書門下減選諸色選人成資考丁憂及過三年已上准敕經曹投狀磨勘無違礙申中書門下除官一每年及第舉人自於官誥院納官錢一千買綾紙五張并縹軸于當曹寫印縫縫給于官誥院却每人牒送硃膠錢二百到曹支備銓中及當司公使一官誥院牒送到硃膠錢一千內抽二百文刺送到都省充抽貫錢一每年及第舉人于省內試判二道後具判申堂及具成狀申銓團奏請定冬集一齊郎挽郎請定冬集者當曹試判二道後申堂及申銓請團奏一外州府縣牒到亡沒官姓名當曹使牒取官誥文書等批注亡沒年月一准格主掌逐年選人歷任家狀一本以備他年磨勘一出給逐年三旬選人赴任厯子各一道判曹員外郎印署判銓侍郎通押後當曹使印繳連新舊告身文書等當曹出給特敕除官厯子據本官納到厯任家狀及新舊告身㸃檢同祇是判員外郎印押一鎖宿內具判成選人細銜申銓及牒門下省當曹司勘銓司院寫録團奏選人黃甲無差誤即判曹員外郎署名及使印背縫一磨勘三旬選人及非時投狀人等並准例詳驗正身及取有官三人保明識官司使印文武及勾當人狀如有疾病于成狀內收竪申送雜處置後唐天成三年八月中書舍人劉贊奏請令選人依舊試判從之其年十二月敕選門官吏濫進者多自今以後並令各録三代家狀鄉里在朝骨肉先于南曹印署納吏部中書門下三庫各一本候得判印狀即許所司給付新籖告兼本任處及鄉里亦具一本納逐處州縣四年十月敕其諸道選人宜令三銓官員都在省仔細磨勘無違礙後印具格同商量注擬連署申奏仍不得准前于私第注官不分三銓注官自此始也其年十二月敕三銓公事宜准近敕指揮仍祇使吏部尚書門下封送禮部權收管記奏長興元年三月敕其判成諸色選人黃甲下後將厯任文書告身連粘宜令吏部南曹逐縫使印都于後面粘紙具前後厯任文書都記多少紙數兼具年月判成授官去處繳尾訖給付本人慮分假于人故也其年十月中書奏吏部流外銓諸色選先條流試判兩節並以優劣等第申奏文優者宜超一資注擬次者依資又其次者與同類官中比擬仍准元敕業文者任徴引今古不業文者但據公理判斷可否不當罪在有司兼選人或有元通家狀內鄉貫不實候將來赴選並令改正一一本屬鄉縣及有無出身一奏一除官等宜並不加選限從之其年十一月吏部南曹閲試今年及第進士李飛等七十九人內三禮劉瑩李詵李守文明算宗一作宋延美等五人所試判語皆同尋勘狀稱晚逼試偶拾得判草寫淨實不知判語不合一般者敕貢院擢科考詳所業南曹試判激勸授官劉瑩等既不攻文合直書其事豈得相傳藁草侮瀆公場載考情由實為忝冒及至定期覆試果聞自擅私歸且令所司落下其所給春關仍追納放罪許後放舉自此南曹凡有及第人試判之時更效此者准例處分二年五月敕舉選之衆例自艱辛曽因兵火之餘多無敕甲不有詳延之路永為遷棄之人其失墜告身者先取本人狀當授官之日何人判銓與何人同官上任與何人交代仍勘厯任處州縣如實即刻取命官人三人保明施行三年五月敕今後合格選人厯任無違礙者並仰吏部南曹判成如文解差謬不合式樣罪在發解官吏其年十二月二日敕准近敕應前資朝官及諸道節度觀察判官罷任一周年後許求官其出選門官雖准格例送名未定别與除官年限自此應除選門官等罷任後亦宜一周年後許更除授仍令于所司投狀磨勘申送中書門下晉天福二年十月敕選人試判二道三年敕今後選舉人文解差謬過在發解州府官吏其選人舉人亦准格處分五年三月詔令四時聽選吏部三銓擬官旋奏不在團甲之限漢乾祐二年八月敕今後諸色選人年及七十者宜注優散官年少未厯資考者不得任注縣令三年七月敕吏部南曹今後及已前應有令佐招添㸃檢出戶口據數須本處合徴稅賦錢物數目於解由厯子內一一開坐批書方得准天福八年三月十日敕條施行如不合前後敕例不在施行之限周廣順元年十月敕選部公事比置三銓所有闕員選人分為二處每至注擬之際資叙難得相當況在今年選人不多三銓公事併為一處委本司長官同共判置施行甲庫周顯德五年閏七月吏部甲庫奏見行公事甲庫先有専知官一人於長興二年停廢後來于令史內選差一人承受主掌諸雜制敕及逐季抄録關報史館所有選人受官黃甲備録關牒送吏部出給告身及具名銜關牒送格式收附員闕准格出給新授令録判司主簿籖符本官每官納硃膠錢一百二十依除內每貫二百刺送都省除外供應三銓及本司公使廢置准敕格應內外官員亡父追贈及逐年南曹駁放選人准長定格節文牒吏部選差五考已上諳事令史五人共行詳斷及州縣官名犯廟諱御名並准格例改正制舉周顯德四年十月詔曰制䇿懸科前朝盛事莫不訪賢良于側陋求讜正于針規殿庭之間帝王親試其或禆于國政有益于時機則必待以優恩縻之好爵拔奇取異無尚於兹得士者昌於是乎在爰從近代久廢此科懷才抱器者鬱而不伸𨼆耀韜光者晦而不出遂使翹翹之楚多致于棄捐皎皎之駒莫就于縻縶遺才滯用罪孰甚焉應天下諸色人中有賢良方正能直言極諫經學優深可為師法詳間吏理達於教化者不限前資見任職官黃衣草澤並許應詔其逐處州府依每年貢舉人式例差官考試解送尚書吏部仍量試䇿論三道共三千字已上當日內取文理具優人物爽秀方得解送取來年十月集上都其登朝官亦許表自舉先是兵部尚書張昭上章請設制科故有此詔宏詞拔萃後唐天成二年四月二日中書奏尚書禮部貢院申當司奉今月六日敕吏部流內銓狀申據白院狀申當司先准禮部貢院牒稱據成德軍解送到前進士王蟾狀請罷設深州司公參軍應宏詞舉前件人准格例應重科合在吏部其王蟾并解送牒吏部請准例指縱者當司隨具狀申堂奉判送吏部分析近年事例如何者伏緣近年别無事例今檢登科録內于僞梁開平三年應宏詞登科二人前進士余渥承旨舍人李遇考官二人司勳郎中崔景員外郎張昭憲再具狀申堂奉判送吏部准例指揮其前進士王蟾請宏詞伏自近年已來無人請應今詳格例合差應考官二人又緣祇有王蟾一人請應銓司未敢奏請差官者奉中書門下牒奉敕宜令禮部貢院就五科舉人考試者伏以舉選公事皆有格條准新定格節文宏詞拔萃准長慶二年格吏部差考試官二人與知銓尚書侍郎同考聞奏又准格節文內准太和元年十月二十三日敕應禮部諸色貢舉人及吏部諸色科目選人凡無出身及未有官祗合于禮部應舉有官方于吏部赴科目選其請應宏詞舉前進士王蟾當年放第後尋已聞過吏部訖若應宏詞侍南曹判成即是科選之人以理合歸吏部況緣五科考試官祗考學業難于同考宏詞者奉敕王蟾宜令吏部准往例差官考試長興元年八月三日尚書吏部據禮部貢院牒稱送到附試請應書判拔萃前虢州盧氏縣主簿張岫對六節判四通二粗准例入第五等上其所試判令録奏聞奉敕宜付附所司今後吏部所應宏詞拔萃宜並權罷其貢院據見應進士九經並五科童子外諸色科名亦宜停罷進士梁開平三年四月敕賜劉斤同進士及第仍編入今年榜內第八人其年五月敕禮部所放進士薛均是左司侍郎薛延圭男方持省轄固合避嫌其薛均宜令所司落下後唐同光三年三月敕今年新及第進士符蒙正等宜令翰林學士承旨盧質就本院覆試仍令學士使楊彥璐監試其月敕禮部所放進士符蒙正等四人既慊羣情實干浮議詩賦果有疵瑕若便去留慮乖激勸倘無升降即昧甄明況王激體物可嘉屬詞甚妙桑維翰差無紕繆稍有詞華其王激升為第一桑維翰第二符蒙正第三成僚第四禮部侍郎裴皥放今後應禮部每年所試舉人雜文䇿等候過堂日委中書門下子細詳覆奏聞天成二年十二月敕新及第進士有聞喜宴今後逐年賜錢四百貫五年正月二十五日禮部貢院奏當司准天成三年十二月十八日敕文內准近敕自此進士試雜文後據所習本經一一考試須帖得過三已上者即放及第者奉敕進士帖經本朝舊制蓋欲明先王之旨趨閲多士之文章近代以來此道稍墜今且上從元輔下及庶僚雖百藝者極多能明經者甚少恐此一節或滯羣才既求備以斯難庶觀光而甚廣今年凡應進士舉人所試文䇿及格帖經或不及通三與放及第來年秋賦詞人所習一本經許令對義目多少次第仍委所司條例聞奏其今年本經內對義義目五道考試通二通三准帖經例放入䇿其將來秋賦諸寺監及諸州府所解選進士第亦准去年十月一日敕考具詩賦義目帖由等並解送赴省如或不依此解送當司准近敕並不引送試奉敕宜依五年二月九日敕近年文士輕視格條就試時踈于帖經登第後恥于赴選宜絶躁求之路别開奬勸之門其進士科已及第者計選數年滿日許令就中書陳狀于都堂前各試本業詩賦判文等其中才藝灼然可取者便與除官如或事業不甚精者自許准添選長興二年二月敕其進士並令掛年齊入就試至閉門試畢內有先了者上厯某時旋令先出其入䇿亦須晝試應諸科第對䇿並依此例其餘惟准前敕處分清泰二年九月禮部貢院奏奉長興二年二月敕進士引試早入晚出令請依舊例進士試雜文并㸃門入省經宿就試從之周廣順三年正月戶部侍郎權知貢舉趙交泰奏進士見試詩賦各一首帖經二十帖對義五道今欲罷帖經對義别試雜文二首試䇿一道從之至其年八月刑部侍郎權知貢舉徐台符奏請試雜文二首外其帖經對義亦依元格從之顯德二年三月敕禮部貢院奏今年新及第進士李覃嚴說何儼武允成王紛閭丘舜卿楊微之任惟吉趙鄰幾周度張慎微王翥馬文劉選程浩然李震等一十六人所試詩賦文論䇿文等國家設貢舉之司求俊彥之士務詢文行以中科名比聞近年以來多有濫進或以年勞而得第或因謀勢以出身今歲所貢舉人試令看詳果見紕繆須有去留其李覃何儼楊微之趙鄰幾等四人宜放及第其嚴說武允成王紛閭丘舜卿任惟吉周度張慎微王翥馬文劉選程浩然李震等共十二人藝學未精並宜斥落且令苦學以俟再求禮部侍郎劉溫叟失于選士頗屬因循據其過尤再行譴謫尚示寬恕特與矜容劉溫叟放罪將來貢舉公事仍令所司具條例聞奏其年三月尚書禮部侍郎知貢舉竇儀奏其進士請今後省卷限納五卷已上于中須有詩賦論各一卷餘外雜文歌篇並許同納祇不得有神道碑志文之類其帖經對義並須實考通三已上為合格將來却覆書試候考試終場其不及人以文藝優劣定為五等取文字乖舛詞理紕繆最甚者為第五等殿五舉其次者為第四等殿三等以次者稍優為第三等第一等並許次年赴舉其所殿舉數並于所試卷子上朱書封送中書門下請行指揮及罪發解試官監官等其諸科舉人若合解不解不合解而解者監試官為首罪勒停見任舉選長官聞奏取裁監試官如受賂及今後進士如有倩人述作文字應舉者許人訐告送本處色役永不進任同保人知者殿四舉不知者殿兩舉受情者如見在官停任選人殿三選舉人殿五舉諸色人量事科罪從之五年三月詔曰比者以近年貢舉頗是因循頻詔有司精加試練所冀去留無濫優劣昭然昨貢舉院奏今年新及第進士等所試文書或有臧否爰命詞臣再加考核庶涇渭之不雜免玉石之相參其劉坦單貽慶李徐緯張覲等詩賦稍優宜放及第王紛據其文辭未至精致念以頃曽剝落時與成名熊若谷陳保衡皆是逺人深可嗟念亦放及第郭峻趙保雍楊舟安元度張助董咸則杜思道等未甚精者並從退落更宜修進以俟將來知貢舉右諫議大夫劉濤選人不當有失用心可責授右贊善大夫俾令省過以戒當官先是濤于東京放榜之後率及第進士劉坦已下一十五人來赴行在且以所試詩賦進呈上以其詞多紕繆命翰林學士李昉覆試故有是命五代㑹要卷二十二
