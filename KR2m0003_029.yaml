body:
  text: 五代㑹要卷二十九宋王溥撰契丹契丹本鮮卑之種也居遼澤之中潢水之南遼澤去榆關一千一百二十里榆關去幽州七百十四里其地東南接海東際遼河西北包冷陘北界松陘山川東西三千里地多松栁澤饒蒲葦其族本姓達呼哩後分為八部一曰達爾扎部二曰伊斯琿部三曰舍琿部四曰諾爾威部五曰頗摩部六曰訥古濟部七曰濟勒勤部八曰實衮部營縣四十一每部有刺史每縣有令酋長號契丹王唐制兼松漠府都督幽州置松漠府長史一人監之其後諸姓不常唐㑹昌中幽州節度使張仲武表其王齊蘇請賜印篆為奉國契丹之印朝廷從之其八族長皆號曰大人稱刺史內推一人為王建旗鼓以尊之每三年第其名以代之唐末有耶律安巴堅者怙强好勇不受諸族之代吞侵鄰部兵力漸盛嘗與後唐太祖㑹盟於雲州結為兄弟其後僣稱帝號以妻舒嚕氏為皇后燕人韓延徽為宰相法令嚴明諸部皆畏伏之梁開平元年四月遣其首領袍笏美楞等來貢方物至二年二月其王安巴堅又遣使來貢良馬五月又遣使嘉哩貢納馬十匹金花鞍轡貂鼠皮裘并冠男口一年十嵗名曰蘇女口一年十二嵗名曰譬其妻舒嚕氏貢朝霞錦前國王欽德并其大臣皆有貢獻太祖命司農卿渾持石千牛衛將軍郎公逺充使就本國宣諭三年閏八月又遣首領格爾來貢方物太祖御文明殿召格爾等五十人張宴賜金帛等有差至五年四月又遣使實拉美楞來朝貢後唐同光二年三月安巴堅率所部入寇新城其年七月又率兵東攻渤海國至九月為鄰部室韋女真回鶻所侵十二月又入寇嵐州三年二月復入寇幽州為王師所敗俘其首領竒嚕等其年五月又遣使伊喇孟等來貢方物四年正月安巴堅將復寇渤海國又遣梅老轄哩以下三十七人貢馬三十匹詐修和好天成元年七月攻渤海國扶餘城下之命其長子托雲為國主號東丹王其月二十七日安巴堅得疾而死第二子元帥太子德光嗣立德光本名耀庫濟慕中國之名故改為德光初安巴堅有三子長號人皇王次號元帥太子次曰安圗少君及安巴堅死其妻舒嚕氏令第二元帥太子德光勾當兵馬令少子安圗少君往渤海國代托雲將立為嗣而元帥太子素為部族所敬又其母舒嚕氏亦常鍾愛故因而立之僞稱天顯元年尋葬安巴堅于西樓畨中地名僞諡大聖皇帝其年十月遣使實古訥來告哀明宗輟其月十九日朝參以禮之其月僞平州守時領幽州節度使盧乂進率户口兵馬車帳來降至二年十一月又遣使美楞等二十餘人朝貢兼申和好之意明宗命飛勝指揮使安念德齎錦綺綾羅及金花銀器寶裝酒器等賜之又賜其母舒嚕氏繡被一張并寶裝瓔珞至三年正月復入攻陷平州而去至其年五月定州節度使王都叛命潜相連搆其王德光遣首領托諾率部衆數千騎入定州至七月又遣首領特哩衮率七千餘騎來援尋為行營招討使王晏球等逆戰破之𠞰戮甚衆餘黨復為幽州節度使趙德鈞襲之殺獲殆盡擒其首領特哩衮其月王晏球又獲契丹絹書二封來進明宗命宣示羣臣莫有識其文字者契丹本無文記唯刻木為信漢人陷畨者以𨽻書之半就加增减撰為番書同光之後稍稍有之其年八月幽州部送所獲番將特哩衮下兵百餘人至京師明宗皆赦之選其尤壯健者立為契丹直其首領皆賜姓吉時言事者以為邊人悻戾不可置於君側俄而有首領吉昭蘇自京遁歸奪船過河至深州捕獲斬之至其年閏八月僞平州刺史張希崇來降四年三月定州行營招討使王晏球擒托諾等二十餘人獻于闕下悉命戮之長興元年十一月契丹渤海因東丹王托雲率番官四十餘人馬百匹自登州泛海內附明宗御文明殿召對及其部曲慰勞久之賜以衣冠金玉帶鞍馬綿綵器物等托雲進本國印三面命宣示宰臣其年十二月中書門下奏契丹國東丹王托雲逺泛滄溟來歸皇化請賜姓名仍准番官入朝例安排謹按四裔入朝番官有懷德懷化歸德歸化等將軍中郎將名號又本朝賜新羅渤海兩番國王官初自檢校司空至太保今托雲是安巴堅之子請比新羅渤海王例施行敕渤海國王人皇王托雲契丹先收渤海國改為東丹其托雲宜賜姓東丹名慕華授光祿大夫檢校太保安東都護兼御史大夫上柱國渤海郡開國公食邑一千五百户充懷化軍節度瑞慎等州觀察處置押番落等使二年九月復姓李名贊華三年五月授滑州節度為廢帝所殺至二年其契丹主母舒嚕氏以其子托雲歸國遣使朝貢明宗深慰納之至三年三月禮賔使梁進德自契丹報聘回稱其王請放策稜錫里還本國䇿稜亦定州所獲番將也又謂去年十二月其王帳前有大星晝隕聲若雷震其月又遣使特哩衮羅卿進馬三十匹亦求策稜歸國故也五月特哩衮羅卿回明宗欲放䇿稜等令歸大臣爭之未决㑹幽州節度使趙德鈞上表論奏及易州刺史楊檀皆言不可遣其事乃止仍遣䇿古錫里隨其使歸不欲全阻其請也其年七月又遣使都督實魯進馬三十匹清泰三年五月晉高祖起義於太原九月官軍集于城下晉乃間道發使召德光為援是月德光率部落五萬餘騎至太原城下尋敗招討使張敬德楊光逺之兵降晉安大寨晉天福元年十一月高祖踐位以德光有援助之力㰱血為盟結為父子仍約嵗輸絹十三萬匹割雁門以北及幽州所屬縣並𨽻番界德光又率兵迓髙祖於潞州縶幽州節度使趙德鈞并其子趙延夀而回三年二月德光遣使子嘉哩錫里美楞來聘三年十月又遣使來上尊號曰英武闕義晉髙祖繼命宰臣馮道趙瑩劉昫等齎貨珍幣嵗時進貢不絶德光亦遣名王以下來至六年六月節度使安重榮執契丹使伊喇等以輕騎掠幽州之南界高祖纍遣中使齎詔開諭以契丹有助立之功不欲負其宿約而重榮奸險肆志竟誅伊喇等馳檄天下言契丹之罪惡與襄州節度使安從進連謀不軌高祖命杜重威率兵討之至貝州宗城縣相遇重榮之衆大敗至七年正月二日收復鎮州斬重榮首漆之送於契丹至其年四月高祖不豫少帝嗣立正月遣使隆鄂特來致弔兼獻衣服鞍馬等至十月又遣使大卿以下二十六人來聘以高祖山陵有日致祭故也至九年正月德光遣趙延夀趙延昭等率兵五萬入寇貝州少帝發兵屯守澶州初青州節度使楊光逺搆逆謀乃繕治城隍蓄聚芻粟為跋扈之計屬嵗不稔餓莩相繼朝廷以廪帑虛竭軍用不給乃發使郡縣括借民家資財斛斗海內嗷嗷不堪其命光逺遂以重利誘德光入寇又以趙延夀等皆中原人士常有思歸之意冀羣雄盜國晉祚不濟則大福在已其月德光自河間率諸部兵入犯甘陵陷之巡檢使吳巒投井而死河北大擾少帝駐驆澶州命宋州節度使高行周等將兵以禦之三月德光自領部衆十餘萬來攻戚城官軍拒之而退又以趙延夀行魏博節度使改封魏王以延夀門人髙融為節度副使統步奚及燕軍數萬營于南庸四月又陷德州博州其年十二月德光又率衆南下攻圍鎮州諸邑皆陷之開運二年二月前鋒至邢州鎮州節度使杜重威差人間道告急少帝欲親率大軍渡河决戰乃命鄆州節度使張從恩等將兵合諸將之師屯於邢州時德光之衆以及魏府建牙于元氏從恩等引軍而退其月又陷祁州刺史沈斌死之至三月德光退杜重威等率兵攻契丹之泰州下之回及易州為德光精騎所圍諸將等力攻死戰德光大敗至三年八月契丹所部瀛州刺史僞言納欵少帝復命杜重威等率大軍迎降至十一月回及鎮州之東垣渡與番相遇十二月六日遣前鋒奪橋為番軍所敗其月十日杜重威等以軍降于德光命相州節度使張彥澤率漢騎闕二千先入京城至明年正月一日德光自將大軍至京北百僚素服班於野次匍伏請罪皆命釋之尋降授少帝檢校太尉負義侯令挈其族及將相近臣等于契丹黃龍府安置二月德光降僞赦改國號大遼稱㑹同十年升鎮州為中京以燕王趙延夀為大丞相中京留守三月德光自京率衆北歸至四月十八日死于欒城其年五月宣遺制以永康王烏雲襲其僞位永康王者東丹王托雲之長子烏雲自以猶子不當嗣立且不奉祖母之命其諸部首領素畏舒嚕氏之酷法復以安巴堅死於渤海國被殺者百人今德光沒于漢地慮必獲罪如前同謀以其月二十一日領部族歸國舒嚕氏歸于石橋畨中地名其衆悉降于烏雲命送舒嚕氏于安巴堅明殿以幽之安巴堅陵寢謂之明殿僞改㑹同十年為天祿元年自稱天授皇帝漢乾祐三年十一月烏雲率騎數萬南寇陷邢州之內丘縣深州之就陽縣周廣順元年正月太祖命左千牛衛將軍朱憲往修和好烏雲亦遣使尼古察報命獻良馬四匹太祖復命尚書左丞田敏供奉官蔣光遂銜命往聘至其年四月田敏等回烏雲遣使實魯獻碧玉金鍍銀裹鞍轡并馬四十匹其月太祖又命左金吾將軍姚漢英右神武將軍華光裔往使至其年九月烏雲為部下太寧王偉王子燕王舍音所殺舒嚕王子德光之子勒所部兵誅太寧王舍音而舒嚕自立號天順皇帝改名燝稱應厯元年顯德元年春太原劉崇將圖南寇舒嚕氏番將楊衮率驍騎萬餘以助之三月世宗親征與崇戰于潞州高平縣之西原崇軍大敗番衆棄甲而逃二年三月命許州節度使王彥超皆築壘于李晏口與番兵數千騎戰于安平縣之南敗之黨項羌黨項羌古析枝之地漢西羌之别種其地東至枀州南接春桑迷桑諸羌北通吐谷渾處山谷間亘三千餘里種有數姓自為部落一姓之中復分為小部落有細封氏費聽氏析利氏野辭氏房當氏米禽氏拓拔最為強族俗皆土著居有棟宇織毛罽以覆之其人多夀或至百五六十嵗不事生業好為盜竊前世或來朝貢自唐寶應正元之役皆率部族內附居慶州號平貢部落㑹昌初命三使以統之在寧延州界者命侍御史崔彥邠曽主之在夏州者命侍御史李主之在靈武麟勝州者命侍御史鄭賀主之後唐同光二年二月遣使朝貢十二月其首領簿備香來貢良馬天成二年九月河西羌項如連山等來朝共進馬四十匹四年四月敕沿邊置場買馬不許番部至闕下自上御極以來黨項之衆競赴都下賣馬常賜食於禁廷醉則連袂歌其土風凡將到馬無駑良並云上進國家雖約其價直以給之然計其館給賜賚每年不下五六十萬貫大臣以為耗蠧中原無甚于此因降敕止之雖有是命竟不能行其年九月首領折遇明等來貢方物十月首領來有行來朝進馬四十匹上御中興殿閲所進馬樞密使安重誨奏曰吐渾黨項近日相次進馬皆給價直對見之時别賜繒帛計其所費不啻價倍請止之上以為國家常苦馬不足每差綱收市今畨言自來何費之有外番朝貢中國錫賜朝廷常事不可以自止番部羊馬不絶于路長興元年正月其首領來朝貢授萬德懷化司戈其年十二月以黨項折家族五顛都知兵馬使折之正為檢校尚書右僕射薄備家族都督簿備撒羅檢校工部尚書二年正月首領折七移等進駝馬其年十二月又遣首領來進所奪得契丹旗號并馬等三年正月以西路黨項部族劫掠使臣及外域進奉命邠州節度使樂彥稠靈武節度使康福等率步騎七千往方渠顛已來討其叛命者其年二月行營邠州節度使樂彥稠等奏誅黨項阿埋三族常悉裒勤彊賴埋厮骨尾屈悉保等十七族七百餘人又率兵自牛兒族入白魚谷追及背叛黨項白馬慮家六旅客户三族獲大首領連香入薩玉都統悉那埋摩侍御乞埋嵬悉逋等六人兼黨項二十餘人獲持馬牛羊數千計至晚師還野次其地無水軍士方渴俄有風雲自東而起是夜初更降雪一尺軍中以為神助上令造捷使之方山軍諭軍中所獲牛羊等物各令士卒自取勿得收斂以進奉為名周廣順二年六月以府州黨項泥也六族防禦使歸化將軍泥香王子又泥也六首領拓拔山並為歸德將軍三年二月慶州刺史郭彥欽奏黨項野雞族掠奪商旅請出兵討之時彥欽黷貨嗜其利以州北野雞族多羊馬作法擾之番情獷悍屢不從順乃誣奏之太祖遣中使齎詔撫部族既苦彥欽虐政不時報命遂詔邠州節度使折從阮合寧州刺史張建武進兵討之建武勇於立功徑趨野雞族追擊殺數十百人有喜王族折思族殺牛族彼無猜二聞官軍討伐競來餉饋官軍利其貨財皆劫掠之諸族乃相聚官軍至包山峻險之地逆戰敗之投崖谷死者甚衆折從阮保兵而退太祖怒彥欽勒歸私第左遷建武為率府率命前解州刺史鄭元昭為慶州刺史以招撫之于闐于闐在京師西九千九百餘里西南帶慈嶺與婆羅門相接去三千餘里南與吐番接西北至疏勒國二千餘里國城之東有白玉河西有緑玉河次西有烏玉河其源同出于崑岡山去于闐西一千三百餘里每嵗至七八月小水之後取玉于河謂之撈玉官取之後方許私取禁令甚嚴地多蒲萄醖而為酒味極醇美其俗好事祅神唐貞觀中其王伏闐信來朝復遣子入宿衛其後亦時來朝貢晉天福三年九月其王李聖文遣使馬繼榮進白玉白㲲犛牛尾紅鹽鬱金磠砂大鵬砂玉裝鞦轡等物其年十月冊聖文王大寶于闐因王命供奉官張鄴為國信使仍授入朝使馬繼榮為鎮國大將軍扶風郡開國公食邑二千户副使黃門將軍張國載通試衛尉卿殿頭承㫖通事舍人吳順規試將作步監漢乾祐元年五月復遣使朝貢六月以入朝使王知鐸為檢校司空副使張文達判官秦元寶為檢校左右僕射監使劉行立檢校兵部尚書突厥突厥之始前書載之備矣自號可汗猶古之單于妻號可賀敦猶古之閼氏也子弟謂之特敕别部領兵者皆謂之設其大官屈律啜次阿婆次頡利法次吐屯次俟斤並代居其官而無員數父兄死則子弟襲其位北番之中最為强盛至唐室之末為諸番所侵部旅微弱亦嘗來朝貢後唐天成二年正月其首領張慕晉朝貢長興二年正月其首領杜阿熱來朝貢晉天福六年七月其首領遣使薛同海以下一十七人來朝貢五代㑹要卷二十九
