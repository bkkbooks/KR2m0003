body:
  text: 五代㑹要卷三十宋王溥撰吐番吐番在長安西八千里本漢西羌之地其種落莫知所出或云南凉禿髪利鹿孤之後其子孫以禿髪為國號語訛託謂之吐番國人號其主為賛普置大論小論以統理國事無文紀刻木為約其國王與臣下一年一小盟三年一大盟其俗隨畜牧不常其居然亦有城郭都城號邏㱔城屋皆平頭貴人處于大毡帳謂之排廬不知節候以麥熟為嵗首唐貞觀中嘗來朝貢自後吞併諸番兵力日盛屢為邊患河西隴右之地悉為所取至大中初其國亂朝廷復得六闗之地至唐室末又為侵據唐分天下為十道河西隴右三十三州凉州最為大鎮土地沃壤人物繁庶開元天寳中置八監牧馬三十萬雜畜稱是其西復置安西都護府距長安八千里羈縻西番三十國軍鎮監務大小三百餘戍守之兵皆取凉州節度及安祿山犯闗肅宗在靈武盡召河西戍卒收復兩京吐番乗虚遂襲取凉隴華人百萬陷於邊外開成之際朝廷遣使還番過凉肅𤓰沙城邑如故華人見漢旌使齊夾迎泣訴問皇帝還念陷番生靈否當時已經再世雖語言小訛而衣服未改至今凉州漢户猶稱上代是鄆州戍卒每帥守闗則請命于朝廷梁開平二年正月遣使朝貢二月以吐番入朝使嗢末首領杜論悉伽社論心為左領軍衛將軍同正嗢末蘇論乞祿為右領軍衛將軍同正乾化元年十一月又遣使來朝召對于朝元殿賜金帛等遣之後唐天成二年十二月遣使野利延孫等入貢并畨僧四人持畨書二封人莫識其字三年正月以入朝使野利延孫等六人並為歸德將軍其年九月又遣使朝貢以入朝使閻薛羅等三人並為歸德司戈十二月又以入朝使薛謁薛王子撥邅為歸德郎將首領十人並為歸化司戈四年九月西凉府番官揆心等來朝十月首領掇里忙布藺邅等來朝並授歸德司戈長興三年二月又遣使朝貢三月以朝貢使北廂首領野利閭心為歸德大將軍右廂首領籛心為歸化郎將軍中廂首領季讀等並為歸德司候重云都督對兒六突兒難等並為歸德司陛其年七月復遣使入朝引對于端明殿間本番牙帳去京師逺近對曰在涇州西二千里四年十一月遣使來貢召對于内殿賜以金帛仍各賜虎皮一張晉天福四年十月罷延族大首領聶褒郎彞磨標昌訶尤羅祗褒等率其屬朝貢周廣順二年九月河西節度使申師摩一作厚奏吐番首領折通支等請加恩命其月勅以吐畨左廂押番副使折通支右廂崔虎心並授銀青光祿大夫檢校工部尚書楊妃谷大首領沈念般授懐化大將軍左廂大首領籛于閔篤為歸德大將軍沒林葛于疑盧伴邅折通窮羅並為懐化大將軍右廂大首領鹿悉迦阿羅兵騷奴並為歸德大將軍沈念般粃與龍文温元積並為懐化大將軍中廂首領岳阿西安九十並為懐化大將軍又奏自涇州安國鎮至西涼府沿路三處控扼各立州各欲補大首領為刺史又管蕃界部落大首領三十餘人各賜空名告身並從之高麗高麗本扶餘之别種其國都平壤城即漢樂浪郡之故地在京師東五千一百里東渡海至于新羅西北渡遼水至于營州南渡海至于百濟北至靺鞨東西三千一百里南北一千里其官大者號大對盧比一品總知國事三年一代若稱職者不拘年限對盧以下官總十二級置外州縣六十餘大城置傉薩一人比都督小城置通使一人比刺史其下各有僚佐分曹掌事其王以白羅為冠白皮小帶咸以金飾其俗多淫祀事靈星可汗箕子等神國城東有大隧名曰隧神常以十月王自祭之俗好經書至于庶賤之家各于衢路造大屋謂之局堂子孫晝夜讀書習射前王姓高氏世通中國常遣朝貢後唐同光三年十一月遣使廣評侍郎上柱國韓申一副使春部少卿朴巖來貢方物至四年正月授韓申一朝散大夫試殿中監朴巖朝散郎試秘書郎天成四年八月復遣廣平侍郎張翂等五十二人來朝貢銀香獅子銀爐金裝版鏤雲星刀劒烏突金銀鷹縧鞲白紵白毡頭髮人參香油銀鏤剪刀鉗鈸松子等長興三年二月復遣使大相王儒來朝其年六月權知國事王建為特進檢校太保使持節元莬州都督充大義軍使兼御史大夫上柱國高麗國王七月又以其妻栁氏為河東郡夫人清泰三年十二月遣使禮賔卿邢順等來朝貢三年三月以入朝使禮賔卿邢順試將作少監副使崔逺試少府監主簿其年又遣使王子大相王規等來貢方物以大相王規為檢校尚書右僕射副使廣評侍郎崔禹試將作監其隨行節級等三十餘人並授司戈司陛等職晉天福三年八月清州奏高麗國宿衛質子王仁翟乞放歸鄉里從之四年九月復遣廣評侍郎邢順等七十二人來貢方物六年八月其國王復遣廣評侍郎闕其國王建為開府儀同三司檢校太師使持節元莬州都督充大義軍使高麗國王命國子博士謝攀持節就冊之八年復遣王子大相王申等來開運元年正月以入朝使王子大相守倉部令上柱國賜紫金魚袋王申一為檢校尚書右僕射正朝守廣評侍郎柱國丹金魚袋栁迥訓檢校禮部尚書守廣評郎中韓李康試少衙卿守廣評郎中朴立信試大府少卿守兵部主事韋安試將作監主簿以進奉賀登極使丕朝前守廣評侍郎柱國丹金魚袋金仁逢可檢校工部尚書副使禮賔卿柱國丹金魚袋金裕可試大府卿判官兵部郎中張規可試衛尉少卿二年其國主王建卒其子武嗣位十月遣使廣評侍郎朝立珪副使前禮賔卿金廉等一十八人來朝十二月以權知髙麗國事王武為特進檢校太保使持節元莬州都督充大義軍使兼御史大夫高麗國王仍命光祿卿范光政太子洗馬張李凝就行册命王武者王建之子本國中大族國人推而為主有智勇兵力日盛以兵併三韓百濟之地東方君長最為雄盛漢乾祐末王武死其子王昭代立周廣順元年正月遣廣評侍郎徐逄等九十七人來朝貢二月以權知高麗國事王昭為特進檢校太保使持節元莬州都督充大義軍使兼御史大夫髙麗國王仍命衛尉卿劉通事舍人顧彦浦持節冊之劉尋卒于路顧彦浦溺海而死二年九月復以太僕少卿王演借衛尉卿充高麗國冊禮使右衛率府吕繼贇借將作少監充副使顯德三年十月復遣使王子大相王融來貢方物又遣廣評侍郎荀質來賀登極其年十二月授其國王王昭開府儀同三司檢校太師髙麗國王五年六月命尚書水部員外郎韓彦卿尚輦奉御金彦英使于髙麗因命賫帛數千疋就彼市銅以備鑄錢之用六年正月又遣其臣王子佐丞王兢佐伊皇甫魏光等貢名馬織成衣襖弓劍等其年八月遣使進别序孝經一卷越王孝經新義八卷皇靈孝經一卷孝經雌圖三卷别序者記孔子所生及弟子從學之事新義者以越王為問同以什疏文之是非皇靈者止説延年辟灾之事及志符文乃道書也雌圖者止説月之環暈星之彗孛災異之應乃䜟緯之書也其年十一月遣使貢銅五萬斤紫白水精各二千顆渤海渤海靺鞨本髙麗種唐總章中髙宗平髙麗徙其人㪚居中國置州縣于遼外就平壤城置安東都護府以統之至萬歳通天中契丹李萬榮反攻陷營府冇髙麗别種大舍利乞乞仲象大姓舍利官乞乞仲象名也與靺鞨反人乞四比羽走保遼東分王髙麗故地則天封乞四比羽許國公大舍利乞乞仲象震國公乞四比羽不受命則天命将軍李楷固臨陣斬之時乞乞仲象已死其子大祚榮繼立併有比羽之衆勝兵下户四千餘保據挹婁故地至聖歴中稱臣朝貢中宗命侍御史張行岌就往宣慰號其都為忽汗州以祚榮為忽汗州都督封渤海郡王國自稱渤海其俗呼其王為可毒失對面呼聖王牋表呼基下父母老王曰大妃妻曰貴妃長子曰副王諸子曰王子氏以為大酋長唐室朝貢不絶梁開平元年五月其王大諲譔遣王子大昭順來貢方物至二年又遣殿中少令崔禮光來朝三年三月遣其相大誠諤來朝兼貢女口乾化二年五月又遣王子大光賛來朝貢方物太祖厚有錫賜後唐同光二年正月遣王子大禹謨来朝五月又遣王子大元讓来朝荘宗賜金綵以遣之八月又遣學堂親衛大元謙試國子監丞三年二月又遣使裴璆貢方物進細女口五月以入朝使政堂省守和部少卿賜紫金魚袋裴璆為右賛善大夫天成元年四月遣使大陳林等一百十六人来朝貢進兒一作男口女口各三人并人参昆布白附子等其年七月遣使大照佐等六人朝貢先是契丹大首領邪律阿保機兵力雄盛東北諸番多臣屬之以渤海國土地相接常有併吞之志是嵗率諸番部落攻渤海國扶餘城下之改扶餘為東丹府命其子突欲留兵鎮之未幾阿保機死渤海王命其弟率兵攻扶餘城不能克保衆而退四年五月又遣髙正詞入朝貢方物七月以正詞為太子洗馬長興二年十二月遣使成文角来朝三年正月又遣使来朝貢四年七月以先入朝使成文角為朝散大夫右神武軍長史奏事右録事試大理評事髙保乂為朝散郎右驍衛長史並賜金紫清泰二年十二月遣使列周道等入朝貢方物三年二月以入朝使南海府都督列周道為檢校工部尚書政堂省工部卿烏濟顯試光禄卿周顯徳元年七月渤海國雀鳥一作崔烏斯多等三十人歸化新羅新羅弁韓之苗裔其國在漢樂浪郡之地南東俱限大海西接百濟南隣髙麗東西千里南北三千里有城邑村落其王所居曰金城周七八里衛兵三千人文武官凡十七等風俗刑法與髙麗同而朝服尚白人多金朴兩姓俗重元日相慶賀以是日拜日月之神婦人以髮繞頭用綵及珠為飾髮甚鬒美其王金貞唐武徳四年封樂浪郡王龍朔三年又以其國為鷄林州授其王鷄林州都督世以金氏為酋長朝貢不絶後唐同光元年十一月其王金朴英遣倉部侍郎金樂錄事參軍金㓜卿來朝貢二年六月又遣使朝散大夫倉部侍郎賜紫金岳來朝貢授金岳朝議大夫試衛尉卿天成六年二月遣使張芬等來朝其年五一作三月以新羅國權知康州事王逢規為懐化大將軍新羅國前登州都督府長史張希巖新羅金州知後官本國金州司馬李彦謨並檢校右散騎常侍其月又以入朝使中散大夫兵部侍郎兼賜紫金魚袋張芬為檢校工部尚書副使兵部郎中朴述宏兼御史中丞判官倉部員外郎李忠式兼御史其年四月新羅國康州遣使林彦來朝貢召對於中興殿賜物有差四年二月青州奏于登州岸獲新羅國船一隻進其寳貨長興二年四月權知國事金簿遣使金朏來貢方物清泰二年二月以入朝使執事侍郎金朏為檢校工部尚書副使司賔大卿李孺一作儒試将作少監黑水靺鞨靺鞨蓋肅慎之地後魏為勿吉在京師東北六千餘里東至于海西接突厥南界高麗北隣室韋其國凡為數十部各有渠帥而黒水靺鞨最處北方尤矜勁健性凶悍無憂戚貴壯而賤老俗無文字兵器有角弓楛矢唐開元十年三月安東郡都督醉泰請于黑水靺鞨内置黑水軍以最大部落為黑水府以其首領為都督仍置黑水府長史一員部落兼領之後唐同光二年九月遣使烏嚕來朝以烏嚕為懐化中郎將遣還番三年五月黑水部多羅遣使朝貢天成四年八月遣使庫濟來朝兼貢方物以庫濟為歸德司戈遣還番長興元年三月其首領烏嚕復遣使朝貢二年五月青州奏黑水烏拉部至登州賣馬三年二月青州奏黑水達喇哈狀申父呼圗哩卒所有勅賜朱鈐記未敢行使南詔蠻南詔蠻本烏蠻之别種在漢永昌之東姚州之西蠻俗謂王曰詔其先渠帥有六故號六詔各有君長不相統攝在唐時亦時來朝貢後唐同光三年閏十一月魏王繼岌奏遣使賫書招諭南詔蠻時初平蜀川乃募曾使南詔者有泰州副使徐藹請雲南苴咩城路且云唐中和年僖宗在蜀命嗣王龜年使雲南藹季父為副使藹為判官時不到苴咩城私達善闡迴約為甥舅許降安化公主雲南使來迎公主使次服收復長安黄巢東走乃託以他嵗而止天成元年十月供奉官李彦楷高品李光裕雲南使迴山後兩林百蠻都鬼王右武衛大將軍李卑晚差大鬼主傳能阿花等來朝貢明宗御文明殿引對百官稱賀李卑晚為寧逺將軍大渡河南山前卭川六姓都鬼王懐安定王勿定摽莎為定逺將軍二年七月以左金吾衛將軍烏昭逺為左衛上將軍入蠻國信使其年九月西川奏據黎州狀申雲南使趙和于大渡河南起舍一間留信物十五籠并雜詩一卷逓至闕下初郭崇韜平蜀之後得王衍等獲俘數千以天子命令使人入其部被止于界上唯國信與蠻俘得往續有轉牒稱都督爽大和長國宰相布燮等一大人唐皇帝男奏疏一封自鸛拓歴闕幾闕白闕爽等又人弄揀演習自鸚鵡郡膳裔爽等又入平蠻新安寧逺標莎差人轉送黎州其緘厚硬如皮筆力尤健有詔本後有督爽强著忍爽爽寳督彌勒君爽董德義督爽長垣忍爽緯楊布燮等所署有彩牋一軸轉韻詩一章章三韻其一聨有類擊筑詞頗有思本朝姻親之意理亦不遜其籠中即返其國信舊封猶存復命左衛上將軍烏昭逺往皆不能去䍧牱蠻䍧牱蠻其地北至兖州一百五十里東至辰州二千四百里南至交州一千五百里西至昆明九百里無城郭散居村落多霖雨稻皆再熟無徭役唯戰征之時乃相屯聚刻木為契其法劫盜者三倍還賦殺人者出牛馬三十頭乃得贖死首領姓謝氏唐室頻遣使朝貢後唐天成二年八月䍧牱青州八郡刺史守朝化等一百五十人來朝貢進草豆榖二萬顆硃砂五百兩黄蠟二百斤各賜官誥金帛遣之昆明國昆明部落在黔州西南三千里山路險阻住止高欄亦有羊馬其俗椎髻跣足渠長披虎皮下者披毡後唐天成二年八月昆明大鬼主羅殿王普露静王九部落各差使者隨䍧牱來朝貢占城國占城國在中國西南其地東西一百里南北三千里東暨海西暨雲南南暨真臘國北暨驩州界東北至兩浙海行一月程其衣服制度大畧與大食國同所乗皆象馬粒食稻米肉食水兕山羊之類獸之竒者有犀牛鳥之珍者有孔雀前世多不與中國通周顯德五年九月其國主因德漫遣其臣甫阿散等來貢方物中有灑衣蔷薇水一十五瓶言出自西域凡水之霑衣者香而不黦又貢猛火油一十四琉璃瓶引對于内殿賜以冠帶衣服等其表文以貝多葉檢以香木函其年十一月入朝使甫阿散金姿叵羅辭各賜繒帛有差仍命齎金銀器一千兩繒綵一千匹細甲名馬銀鞍勒等就賜其國王雜錄後唐天成元年六月十日御史臺奏伏覩今月二日入閤班退後方引對朝貢番客竊觀近制頗失常儀且月華門是宰相两省近侍官常朝來往之所外國番國朝見不合出在此門而又殿庭班序先退北者列其百辟示彼四裔俾觀多士之羽儀以顯九重之嚴重豈可衆官退後番客方来合自正門直趨丹殿此是向來事例今辰忽有更張竊以方屬中興宜循舊典伏乞宣付中書門下重令叅詳永為定制奉勅宜令太常禮院撿舊例申奏者右太常禮院奏臣謹按開元禮以賔禮待番客有六一番國王來朝二戒番王見日三番王奉見四受番使表及幣五宴番國王六讌番國使從開元定禮之後本朝故事對諸番客又並于内殿引對其殿名曰參殿事在禮賔使客省使不下外諸司見今施行不一近制唯迴鶻番使則正殿引對况迴鶻見居甘州其地尤屬河西道凉州所管每遣使進表幣待以賔禮皇帝御正殿列百辟陳盛儀酌禮沿情事恐太重伏請今後准諸番客例祗于内殿引對不臨正朝兼免乖越又符故事謹具詳酌如前奉勅四裔來王歴代故事前後各因強弱撫制互有典儀大番頒示于威容則於正衙引對小番但推其恩信乃于内殿撫懐憲司奏論禮院詳酌皆徴故事咸有明文正衙威容未可全廢内殿恩澤且宜常行若遇大番入朝即准舊儀于正殿排比鋪陳立仗百官排班於正門引入對見四年二月勅沿邊置塲買馬不許番部至闕下周廣順三年三月詔禁沿邊州城兵仗于諸番部五代㑹要卷三十
