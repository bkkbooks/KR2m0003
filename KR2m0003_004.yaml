body:
  text: 五代會要卷四宋王溥撰緣祀裁製梁開平三年九月詔曰國之大事唯祀與戎須委元臣以專重務今後在京大小祀及諸色祠祭並委宰臣薛貽矩專判後唐同光三年三月十日祠部奏本朝舊儀太微宫每年五薦獻其南郊壇每年四祠祭吏部申奏請差中書門下攝太尉行事其太廟及諸郊壇並吏部差三品以上攝太尉行事從之至其年七月中書門下奏據尚書祠部狀每年太微宫五薦獻南郊壇四祠祭並宰相攝太尉行事唯太廟時祭獨遣庶寮雖為舊規慮成闕禮臣等商量今後太廟祠祭亦望差宰臣行事從之三年十二一作一月禮儀使奏伏準禮經喪三年不祭惟天地鬼神社稷為越紼行事此古制也爰自漢文益尊神器徇至公絶私之義行以日易月之制事久相沿禮從順變今園陵已畢祥練既除宗廟不可以乏享神祇不可以廢祀宜從禮意式展孝思伏請自正簡太后升祔禮畢應宗廟使樂及群祀並準舊施行從之天成四年九月太常寺奏伏見大祠則差宰臣行事中祠則差諸寺卿監小祠則差太祝奉禮今後凡小祠請差五品官行事從之其年十月二十七日中書門下奏太微宫太廟南郊壇宰臣行事宿齋百官皆入伏以奉命行事精誠宿齋既遍見於朝官不涉處於祠祭今後宰臣行事文武兩班望令並不得到宿齋處者勑宜依其年十二月中書門下奏今後宰臣致齋內請不押班不知印不赴內殿起居或遇國忌應行事官受誓戒後並宜不赴行香并不奏覆刑殺公事及大祠致齋內請不開宴從之長興二年五月尚書左丞崔居儉奏大祠中祠差官行事皇帝雖不與祭其日亦不視朝伏見車駕其日或出於禮不便今後請每遇大祠中祠車駕不出從之四年二月太常博士路航奏比來小祠已上公卿皆著祭服行事近日惟郊廟太微宫具祭服五郊迎氣日月諸祠並祇常服行事兼本司執事人等皆著隨身衣裝狼籍鞋屨便隨公卿升降於壇墠按祠部令中祠已上應齋郎等升壇行事者並入給潔服事畢收納今後中祠已上公卿請具祭服行事執事升壇人並著履具緋衣幘子又臣檢禮閣新儀太微宫請卯時行事近年依諸郊廟例五更行事今後請依舊以卯時從之清泰元年五月中書門下奏據太常禮院申明宗今月二十日祔廟太尉合差宰臣攝行現緣在假李愚十八日私忌在致齋內今劉昫又奏見判三司事煩請免祠事今與禮官參酌諸私忌日遇大朝會入閣宣召尚赴朝參今祔享事大忌日屬私致齋日請比大朝會宣召例差李愚行事從之晉天福七年十一日敕天地宗廟社稷及諸祠事等訪問自前所司承祀多不精潔宜令三司預支一年諸司合請祠祭禮料物色等於太廟置庫仍差宗正丞石載仁專主掌監察御史宋彥升監庫兼差供奉官陳審璘往洛京於太廟內穩便處修蓋庫屋五間俟畢日催促所支物色監送入庫交收訖取收領文狀歸閣每有祠祭諸司合請禮料至時委監庫御史宋彥升宗正丞石載仁旋令給付其大祠中祠兼令監察祭使檢點饌造小祠即令行事官檢點如致慢易本司當準格科罪其祭器未有者修製已有者更仰雅飾開運三年六月西京留司監祭使奏以祠祭所定行事官臨日或遇疾病或奉詔赴闕留司稟敕已遲乞以留司吏部郎中一人主判有缺便依次第定名庶無缺事從之周廣順三年九月南郊禮儀使奏郊廟祝文按禮例云方者文字皆書於册唐初悉用祝版惟陵廟用玉册玄宗朝祭郊廟用玉為册德宗朝博士陸淳議準禮用祝版祭祀訖燔之乃從其議正元七一作六年親祭又用竹册今詳酌禮例用竹版為宜從之顯德五年閏七月一日御史臺奏見行事件諸司寺監逐季請到祠祭禮料幣帛腳錢等於宗正寺監祭使與本寺官同掌候至日供應逐季所祭享郊壇祠廟並是禮部差官具名銜牒報監祭使大祠前七日赴尚書省受誓戒如其日有官不到具名銜中奏申堂前三日致齋前二日請道引赴祠所中祠不受誓戒前二日致齋前一日請道引赴祠所小祠不受誓戒候吏部牒到獻官名銜監察使檢點封記印禮料并諸司祇應人等發牒差驅使官管押赴所交割逐祠祭諸司赴郊壇等至午時與公卿行事官立班告潔省牲點饌畢給付大官令監厨造饌至來日五更於壇所食饌畢行事點檢有食饌祭器不精應奉有缺其本司人吏量罪責罰郊壇太廟宰臣攝太尉行事至受誓戒及赴祠廟日監祭使具録公卿行事官名御申班狀應行事官未受誓戒前牒陳有故請假並是吏部别差官行事如受誓戒後及致齋之內有官陳牒有故請假監祭使差次官通攝行事祠齋前一日本寺按閲申堂如至行事日音律樂官祇應前却監祭使量罪區分太廟夾室行祫享之禮所差行事公卿等並聼别敕指揮諸祠祭有同日享祀監祭使具狀申御史中丞請差官祀若是無官可差監祭使牒太常博士通攝如缺太常博士監祭使通攝祠祭行事公卿官員職掌等每至冬寒請柴炭太常禮院差禮生請給監祭使監散親謁陵後唐末帝清泰三年九月車駕將北幸太常博士段顒奏河陽路當徽陵今車駕經由合親朝謁於是至陵所朝拜周世宗顯德元年六月車駕征太原回親拜嵩陵望陵號慟至陵所俯伏哀泣感於左右再拜訖祭奠而退賜奉陵將吏及近郊人户帛有差公卿巡陵後唐清泰二年正月宗正寺奏北京永興長寧建極三陵應州遂衍奕三陵準曹州溫陵例下本州府官朝拜雍坤和徽四陵太常宗正卿朝拜從之晉開運三年七月中書門下奏太常禮院狀得宗正寺牒今年八月擇日朝拜諸陵今太卜署擇用八月十二日庚午告北京義惠康昌四陵準天福二年七月敕宜就昌陵都朝拜其朝拜官以本府上佐官等行事禮料亦準上供備皇后陵後唐同光三年十月正簡皇太后葬於坤陵初上欲祔於代州太祖園陵中書門下奏議曰伏以人君以四海為家不當其南北洛陽是帝王之宅四時朝拜理須便近不能逺幸代州今漢朝諸陵皆近秦雍國朝陵寢布列京畿後魏文帝自代遷洛後之園陵皆在河南兼敕應勳臣之家不許北葬今魏氏諸陵尚在京畿祔葬代州理未為允從之雜録後唐二年三月以尚書工部郎中李途為長安兩路檢視諸陵使其年五月二十四日敕宗正寺嚴切指揮諸陵臺令丞不得輒令影占人户其諸陵舊制合破巡人仍仰酌量額定數目自本州縣於中等人户內差遣交付陵所切不得自招影占人户攪擾鄉村致妨縣司差遣色役便仰密具本官姓名申奏當行朝典仍具條約曉示諸陵臺及本州縣訖聞奏其年八月中書門下奏諸陵臺令丞並請停廢以本縣令兼知陵臺事從之二年六月敕關內諸陵頃因喪亂例遭穿廢多未掩修其下宫殿宇法物等各令奉陵州縣府據所管陵園修製仍四時各依例薦享逐陵各差近陵百姓二十戶放雜差役充陵户以備灑掃其壽陵等一十陵亦一例修掩量差陵户仍授尚書工部郎中李途京兆少尹充奉修諸陵使廣順元年五月宗正寺奏準故事諸陵有令丞各一員近令丞不置便委本縣令兼之今緣河南洛陽是京邑恐兼令丞不便伏候敕旨敕特置令丞各一員周廣順元年正月敕文唐莊宗明宗晉髙祖宜各置守陵十户以近陵人户充忌日後唐天成三年又八月九日敕尚書工部郎中蕭願奏每遇宗廟不樂之辰宰臣到寺百官立班是日降使賜香準案禁樂斷屠止刑罰者帝忌后忌之辰舊制皆有齋會蓋由追逺以表奉先多難已來此事久廢今後每遇大忌宜設僧道齋一百人列聖忌日齋僧道共五十人忌日既不視朝固難舉樂所奏止刑罰斷屠宰宜依兼河南府向來送酒宰臣自此止絶天下州府至國忌日並令不舉樂止刑罰斷屠宰餘且依舊四年十二月中書門下奏今後大忌前一日請不坐朝從之晉天福五年正月御史中丞竇正固奏每遇國忌行香宰臣跪爐僧人表讃文武百官儼然列坐今後伏請宰臣跪爐百官依常位立班從之仍令行香之後齋僧一百人永為定制諱後唐天成元年六月十二日敕朕聞古者酌禮以製名懼廢於物取其難犯而易避貴便於時况徴在二名抑有前例恭以太宗皇帝自登寶位不改舊稱時則臣有世南官以民部靡聞曲避止禁連呼朕以眇躬托於人上冀遵聖範非敢有廢文書內所有二字但不連稱並不得回避如是臣下之名不欲與君親同字者任自更改務從所便庶體豫懷三年正月詔曰本朝列聖及親追四廟諱近日章奏偏傍文字皆闕點畫凡當出諱止避正呼若回避於偏傍則虧缺於文字宜從朴素庶便公私此後凡廟諱但避正文其偏傍文字不得減少點畫其年八月詔曰凡有姓犯廟諱者改以本望為姓清泰二年五月中書門下奏御名上一字與諸王相連按太宗玄宗朝故事人臣諸王合避相連字改從單名從之晉天福三年二月中書門下奏禮經云禮不諱嫌名二名不偏諱注云嫌名謂聲音相近若禹與雨丘與蓲也二名不偏諱孔子之母名徴在言在不稱徴言徴不稱在此古禮也唐太宗玄宗二名皆諱人姓與國音聲相近是嫌名者亦改姓氏與古禮有異若廟諱平聲字即不諱餘例若諱側字即不諱平聲所諱字正文乃偏傍皆闕點畫望令依令式施行敕朝廷之制今古相沿道在人𢎞禮非天降况以方開厯數虔奉祖宗雖逾孔子之文爽周公之訓冀崇孝行永載簡編所為二名及嫌名事依唐朝施行册命梁開平元年八月敕朝廷之儀封册為重用報勳烈以隆恩榮固令親式況舊章久缺自我復行今後每册封大臣宜令有司備臨軒之禮後唐同光二年三月太常禮院奏準制尚書令秦王李茂正備禮册命檢詳舊儀無不帶節度使封册之命宜準故襄州節度使趙匡凝封楚國例施行秦王受册自備革輅一乘載册犢車一乘并本品鹵簿鼓吹如儀從之三年六月太常禮院奏吳越國王錢鏐將行册命按禮文合用竹簡敕宜令有司修製玉册俾稱元勳議者以玉册帝王所用不合假令人臣蓋當樞密院承旨假回受錢鏐之賂曲遂其請樞密使郭崇韜不詳典禮故也天成三年十一月十八日中書奏舊制凡降册命至尊臨軒伏自陛下纂襲繼有崇封但申節度之儀尚缺臨軒之禮今後或册封請御正衙雖勞萬乘之尊冀重九天之命如此則行之時禮備受之者感深寧惟轉耀於皇猷亦永標於青史清泰元年六月中書門下奏據太常禮院申册拜王公如在京城所司備鹵簿車輅法物皇帝臨軒行册禮如在外鎮正衙命使押册赴本道行禮車輅法物故事不出都城禮無明文今奉制命幽州趙德鈞封北平王青州房知溫封東平王皆備禮册命其合用車輅法物在兵部太常太僕寺請載往本州行禮後送納本司從之舉人自代後唐清泰元年正月尚書吏部員外郎劉匡鼎奏臣伏覩建中元年正月敕中外文武臣寮授官上任後三日舉一人自代事下中書如除用選人所薦多者擬議多事已來此勑久廢今後重乞舉行從之漢乾祐元年正月赦節文應內外常參官宜準唐建中故事上任後三日表舉一人自代後唐天成二年六月户部尚書李麟奏應升朝官四品以上各許薦令録兩人五品六品官各許薦簿尉兩人敕所舉人除官後仍於官告內坐舉官姓名赴任之後或有不公連坐舉主兼三品以上有舊諳行止堪充兩使判官者各具才業上聞周顯德二年正月二十一日御札應在朝文資官翰林學士兩省官內有曽歷藩郡賓職州縣官者宜各舉堪為令録者一人務在強明清慎公平勤恪其中有已曽任令録亦許稱舉並當擢用不拘選限資序雖姻族近親亦無妨嫌祇須舉狀內具言除官之日仍署舉主姓名若在官貪濁不公懦弱不治職業廢缺處斷乖違並量事狀輕重連坐仍令御史臺催提本官旋具奏聞限兩月舉狀齊足如出使在外者侯回日準此指揮四年六月敕應在朝文資官各令再舉一人堪充令録及兩使防禦團練軍事判官者自前或因公過微有殿犯者亦許稱舉餘準顯德二年正月二十一日御札處分其年八月詔應在朝上將軍統軍大將率府副率等宜令各舉有武勇膽力騎射趫捷堪為軍職者三仍具年嵗及歷職去處聞奏如已在禁軍者不在稱舉候舉到日並當比試騎射看驗人材雖是姻親亦宜公舉但如狀內具言如應任用之後不副所舉即量事狀輕重坐舉主五年五月詔在朝文資官各令再舉堪為幕職令録者一人所舉幕職州縣官罷任後便與除官仍並許赴闕皇太子親王見三師禮後唐長興四年七月二日太常寺奏奉敕詳定太子親王見師傅禮如左一準開元禮皇太子與師傅保相見前一日尉衛設次於宫門外道西南向伶官展軒懸於庭其日諸衛所部屯門列仗典謁設師傅保位於西階之西東向三少位次之少退俱東向北上師傅保及三少至宫門通事舍人引師傅保就次左庶子奏中嚴伶官帥工人入就位通事舍人引師傅保及三少立于正殿門西差退俱東向左庶子奏外辦皇太子著從省服以出侍衛如常承和樂作至東階下西向立樂止通事舍人引師傅保及三少樂作就位樂止皇太子再拜師傅以下答拜若三少見時則三少先拜通事舍人引師傅以下出樂作出門樂止左庶子跪奏稱臣某言禮畢一又準禮閣新儀皇太子受册後前二日尚舍設次于崇明門外南向又設師傅保中書門下文武百官東西相向以北為上宫臣及皇親陪其後次左庶子奏外備中官褰簾皇太子常服出次南向立侍如常儀次中書門下就北向位冉拜訖禮官贊皇太子再拜訖中書門下班首一人前進賀訖復位再拜皇太子答賀訖又再拜皇太子揖中書門下訖相次退通事舍人禮官贊皇太子再拜師傅等少避位訖師傅為班首者一人進賀訖復位再拜皇太子答賀訖又再拜皇太子揖師傅退出內侍奉引皇太子就座南向座訖通事舍人引文武宫臣三品以下入就北向重行異位立定奉禮曰再拜訖左庶子一人進跪奏具官臣某等言賀訖復位皆再拜各分班東西序立奉禮曰再拜在位官皆再拜訖左庶子少前跪奏具官臣某言禮畢近侍垂簾皇太子降座宫臣侍衛仗散如儀一準會要貞觀十七年上謂房玄齡曰太子三師以德導人者也若師禮卑則太子無所取則於是詔令撰三師儀注太子出殿門迎先拜三師三師答拜每門讓三師坐太子乃坐與三師書前名惶恐後名惶恐再拜右據太常禮院狀謹檢開元故事禮閣新儀及會要分析如前其師傅見親王不同皇太子見師傅臣請師傅親王對拜揖各退奉敕宜依鄉飲後唐清泰二年九月中書門下帖太常以長興三年敕諸舉人常年薦送先令行鄉飲酒之禮宜令太常草定儀注頒下諸州預前肄習解送舉人之時便行此禮其儀速具奏聞初長興中宰臣李愚好古奏行此禮纍年不暇至是愚復奏及觀禮官所定無緒禮官孫知訓以古禮無次序不可施行博士或言梁朝時青州曽行一度遂令青州訪舊簿書以聞竟不能行講武梁開平元年十月駕幸繁臺講武至二年七月改為講武臺按地理志夲西漢梁孝王所築謂之吹臺其後有繁氏居其側故里人呼之繁臺箋表例後唐同光二年八月敕四京并諸道州府及京百司應申奏諸色公事奏狀等先曽指揮並須實封斜角其常呈奏狀於斜封上明題所為公事或干軍機言不題事直至御前開封進呈事宜指揮四京及諸道令散下管內諸州依元宣旨處分其在京百司仍令御史臺各録敕文曉告天成元年七月勑三京諸道節度團練使防禦使刺使史文武將吏州縣職員皆進月旦起居表其四孟月旦並可止絶三年七月二十一日敕今後天下諸州刺史及係屬節鎮團練防禦使除應聖節冬至端午外謝上及每月起居慶賀章表並付本道封進其餘公事準往例節度觀察使謄覆奏聞長興元年五月太常禮院奏皇后今月十四日受册準舊儀外命婦並合赴皇后受册正殿門外就次俟受册訖司賔引入就位奉賀今未有命婦院請準例上表賀中書門下奏其諸道節度使上表賀皇帝其在朝外命婦所上皇后表章進呈訖不下令報答自此不更進表皇子妻駙馬公主及近密親舊或有慶賀及進起居章表內中委人主掌進呈後祇宣示來使並不下令從之其月太常禮院奏按儀制令百官上疏於皇后曰皇后殿下中外臣寮外命婦慶賀祇呼殿下不言皇后中書覆奏據太常禮院狀若祇呼殿下恐未合宜至如舊制皇太子亦呼殿下若無分别何顯尊卑凡上皇后章表請呼皇后殿下若不形文字尋常並呼皇后從之二年五月樞密院條疏諸道報軍機表狀於斜封上不得言為何事宜二字晉天福二年十月中書門下奏按禮閣新儀正元二年十月七日御史臺奏每月慶賀及諸上表並合上公行之制可今後凡有謝賀上表望並準一元敕上公行之如三公闕令僕已下行之中書門下别貢表章從之五代會要卷四
