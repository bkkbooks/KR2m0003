body:
  text: 五代㑹要卷十宋王溥撰刑法雜録後唐同光三年六月二十一日大理寺奏准獄律諸立春已後秋分已前不得奏决死刑違者徒一年今寺司相次有案牘若准律文候秋分後申奏必慮刑獄延留者詔曰刑以秋冬雖關惻隱罪多連纍翻慮淹延若或十人之中止於一夫抵死豈可以輕附重禁錮逾時言念哀矜又難全廢其諸司囚徒罪無輕重並宜各委本司據罪詳斷輕者即時疏理重者候過立春至秋分然後行法如關係軍機須行嚴令或謀為逆惡或藴蓄奸邪或行劫殺人難於留滯並不在此限其年閏十二月二十五日大理少卿魏逅奏此後伏請指揮天下州府應所禁囚徒不計州縣府巡大小刑獄委觀察使刺史填送清强判官一員於本㕔每月二十六日兩衙引問明置獄狀細述事端大則盡理推尋小則立限决遣其外縣鎮禁人三日外具事節申本州府仍勘問指揮奉敕宜依天成元年十一月六日敕應天下刑獄公事訪聞近日多有寃滯自今後每捉到正賊但見贓驗便行正斷不得更追關連祗證人宿食去處二年六月十二日大理少卿王爵奏伏惟正觀五年八月二十一日敕極刑雖令即决仍三覆奏在京五覆奏决前三奏决日兩奏准犯惡逆者一覆奏著於格令又准建中三年十一月十四日敕應决大辟罪在京者宜令行决之司三覆奏决前兩奏决日一奏謹按斷獄諸死罪囚不待覆奏報下而决者流二千里即奏報應决者聽三日乃行刑若限未滿而行刑者徒一年伏以人命至重死不再生近年以來全不覆奏或䝉赦宥已被誅夷伏乞敕下所司應在京有犯極刑者令决前决日各一覆奏聽進止有凶逆犯軍令者亦許臨時一覆奏應諸州府乞别降敕命指揮奉敕宜依二年七月十七日敕節文今後指揮諸道州府凡有推鞫囚獄案成後逐處委觀察防禦團練軍事判官引所勘囚人面前録問如有異同即移司别勘若見本情其前推勘官吏量罪科責如無異同即于案後别連一狀云所録問囚人無疑案同轉上本處觀察團練使刺史有案牘未經録問不得便令詳斷如防禦團練刺史州有合申節使公案亦仰本處録問過即得申送其年八月十五日少府少監申著瑀奏伏乞指揮諸道州府此後或顯犯憲章者候文案畢任依格法斷懲如未明事理不得行責情杖從之其年閏八月敕古者賞以春夏刑以秋冬將賞為之加膳將刑為之不舉樂今朕切于禁暴樂在勸能其或秋後有功不可待氷冸而行賞春時有罪不可候霜降而加刑漸向太平方行古道況賞不僣與則立功者轉多刑不濫施則犯法者漸少其在京或遇行極法日宜不舉樂朕減常膳諸州使遇行極法日亦禁聲樂長興二年四月二日敕諸道州府各置病囚院仍委隨處長吏專加經心或有病囚當時差人診候療理後據所犯輕重决斷如敢故違致病囚負屈身死本官吏並加嚴斷兼每年自夏初至八月未立秋每五日一次差人洗刷枷杻其年閏五月敕應律令格式六典准舊制令百司各於其間録出本局公事巨細一一抄寫不得漏落纎毫集成卷軸兼粉壁書在公㕔若未有廨署者其文書委官主掌仍每有新授官到令自寫録一本披尋或因領問之時須知次第仍令御史臺告諭限兩月內抄録及粉壁書寫須畢其間或有未可便行及曾釐革事件委逐司旋申中書四年六月大理正張仁瑑奏伏見諸道州府刑殺罪人雖有骨肉尋時不容改瘞皆給喪葬行人載於城外或殘害尸髮多致邀求准獄官令諸大辟罪官給酒食聽親故辭訣宣告犯狀日未後行刑注云决之經宿所司即為埋瘞若有親故亦任收葬又條諸囚死無親故者官給棺於官地埋瘞置磚銘於壙內立牌於冢上書姓名請依令指揮從之其年七月前潞州屯留縣主簿李光鼎獻時務凡當道推刑獄請令於本判官㕔前當面責勘據遞到疑狀判官與本司官典同對練候勘鞫了日即將印縫分付本典結案從之應順元年三月十三日敕令後應三京及諸道州府凡有刑獄並須據罪斷遣除准初勘鞫及合奏覆外其餘不得便將案奏擬聞晉天福三年八月二十六日敕下刑部大理寺御史臺及三京諸道州府今後或有繫囚染病者並令逐處醫工看候於公廨錢內量支藥價或事輕者仍許家人看候所有罪犯合處杖責者仍候痊復日科决四年九月相州奏管內所獲賊人從來籍沒財産云是鄴都舊例格律未見明文敕今後凡有賊人准格定罪不得沒納家資天下諸州准此五年三月十日敕𠢐耳稱寃人准大中六年十二月十五日敕若有犯者决杖流配訴雖有理不在申明今後所陳與為勘斷𠢐耳之罪准律别科六年五月十五日尚書刑部員外郎李象奏請今後凡是散官不計髙低若犯罪不得當贖亦不得上請詳定院覆應內外文武官有品官者自依品官法無品官有散試官者應內外帶職廷臣賓從有功將校等並請同九品官例其京都軍巡使及諸道州府衙前職員內外雜任鎮將等並請准律不得上請當贖其巡司馬步司判官雖有曽歷品官者亦請同流外職准律杖罪已下依决罰例徒罪已上仍依當贖法周顯德五年七月新定刑統今後定罪諸道行軍司馬節度副使副留守准從五品例諸道兩使判官防禦團練副使准從六品官例節度掌書記防團判官兩藩營田等判官准從七品官例諸道推巡及軍事判官准從八品官例諸軍將校內諸司副供奉官殿直臨時奏聽聖㫖七年十一月二十九日敕宜令四京及諸道州府遇大祭祀正冬寒食立春立夏雨雪未晴已上曰並不得行極法如有已斷下文案可取次日及雨雪定後施行開運三年十二月十三日詳定院奏今後在京及諸道州府如有准敕决笞杖者差一員公幹清強官監視從之周廣順元年正月五日赦節文今後應諸色犯罪除反逆罪外並不得沒籍家資誅及骨肉一依格令處分三年二月中書門下奏起今後應天下諸道州府斷遣死罪者候斷遣訖録原案聞奏仍分明録推司官典及詳斷檢法官姓名具檢用法條朱書不得漏落顯德元年十月敕應諸司賊盜冝委本府州節度防禦團練等使刺史専切斷除其部內凡有賊盜及逃走軍健諸色亡命之人並須覺察設計差人收拿不計逺近以獲為限應有婚姻鬭競賊盜公事仰逐月長吏躬親鞫問仍令本判官不時提舉疾速區分庶敕命凡有大辟罪斷訖其公案申奏今後仰抄録要當事節兼于前面朱書罪人入禁至斷了日數奏聞二年四月五日敕應諸道見禁罪人無家人供給乞食者每人逐日散官米二升不得任信獄子節給減消罪人口食仍令不住供給水漿灑掃獄內每五日一度洗刷枷杻如有病疾者晝時差人看驗醫療五年七月七日敕州縣自官已下因公事行責情杖量其罪輕重用不得過臀十五杖因責情杖致死者具事由聞奏又敕諸盜經斷後仍更行盜前後三犯並曽經官司推問服罪不問赦前後贓多少並取决殺厯逐朝厯名黃帝起用辛卯厯顓頊用乙卯厯虞用戊午厯夏用丙寅厯商用甲寅厯周用丁巳厯魯用庚子厯秦用乙卯厯漢用太初厯四分厯三統厯用三本魏用黃初厯景初厯用二本宋用大明厯元嘉厯用二本齊用天保厯同章厯正象厯用三本後魏用興和厯正光厯正元厯用三本梁用大同厯乾象厯永昌厯三本後周用天和厯丙寅厯明元厯三本隋用甲子厯開皇厯皇極厯大業厯三本唐用戊寅厯麟德厯神龍厯大衍厯元和厯元和觀象厯長慶宣明厯寶應厯正元厯景福崇元厯十本晉天福四年八月司天監馬重績奏曰臣聞為國者正一氣之元宣萬邦之命受兹厯象以立章程長慶宣明雖氣朔不渝而星躔罕驗景福崇元縱五麗甚正而年差一日今以宣明氣朔崇元星緯二厯相參方得符合况自古諸厯皆以天正十一月為歲首循太古甲子為上元積嵗彌多差濶之甚臣改定元朔為新厯一部一十一卷七章上下經二卷算草二卷立成十二卷取天寶十四年乙未立為近元以雨水正月朔為歲首其所撰新厯謹詣閣門上進遂命司天少監趙仁錡張文皓秋官正徐皓文參謀趙延義杜崇黽等以新厯與宣明崇元考核得失敕賜號調元厯仍令翰林學士承㫖和凝撰序周顯德三年八月端明殿學士左散騎常侍權知開封府事王朴奏曰臣聞聖人之作厯也在乎知天人之變者也人情之動則可以言知之天道之動則當以數知之數之為用也聖人以之觀天道焉歲月日時由斯而成隂陽寒暑由斯而節四方之政由斯而行夫為國家者履端立極必體其元布政考績必同其歲禮動樂舉必正其朔三農百工必授其時五刑九伐必順其氣庶務有為必從其日六籍宗之為大典百王執之為要道是以聖人受命必治厯數故得五紀有常受庶徴有常應正朔行之於天下也自唐而下凡歷數朝亂日失天垂將百載天之厯數汨陳而已今陛下順效古道寅畏上天咨詢庶官振舉墜典以臣薄游曲藝嘗涉舊史遂降述作之命俾究迎推之要雖非能者敢不奉詔是以包萬象以立法齊七政以立元則圭箭以候氣審朓朒以定朔明九道以步日校遲疾以推星考黃道之邪正辨天勢之升降而交蝕詳焉立天之道曰隂與陽各有數合則化成矣陽之䇿三十六隂之䇿二十四竒偶相合兩陽三隂同得七十二則隂陽之數合七十二者化成之數也化成則謂之五行之數五之得竒之數過則謂之氣盈不及謂之朔虛至於應變分明而無所不通所謂包萬象矣故以七十二為經法經者常也常用之法也百者數之節也隨法進退不失舊位故謂之通法以通法進統法得七千二百謂之統法自元入經先用此法統厯之諸法也以通法進統法得七十二萬氣朔之下收分必盡謂之全率以通法進全率得七千二百萬謂之大率而元統生焉元者歲日月時皆甲子日月五星合在子正之宿當盈縮先後之中所謂七政齊也古之植圭於陽城者以其近洛故也蓋尚慊其中乃在洛之東偏開元十二年遣使天下候影南距林邑國北距橫野軍中得浚儀之嶽臺應南北弦居地之中皇家建國定都于梁今樹圭置箭測嶽臺晷漏以為中數晷漏正則日之所至氣之所應得之矣日月皆有盈縮日盈月縮則後中而朔月盈日縮則先中而朔自古朓朒之法率皆平行之數入厯既有前後而又衰稍不倫皇極舊術則迂廽而難用降及諸厯則疏遠而多失今以月離朓朒隨厯較定日躔朓朒臨用加减所得者入離定日也一日之中分為九限逐限損益衰稍有倫朓朒之法所謂審矣赤道者天之紘帶也其數圓而平紀宿度之常數焉黃道者日軌也其半在赤道內半在赤道外去赤道極逺二十四度當與赤道近則其勢斜當去赤道逺則其勢直當斜則日行宜遲當直則日行宜速故二分前後加其度二至前後减其度九道者月軌也其半在黃道內半在黃道外去黃道極遠六度出黃道謂之正交入黃道謂之中交若正交在秋分之宿中交在春分之宿則比黃道益斜若正交在春分之宿中交在秋分之宿則比黃道反直若正交中交在二至之宿則其勢差斜故較去二至二分逺近以考斜正乃得加减之數自古雖有九道之說蓋亦知而未詳空有祖述之文全無推步之用今以黃道一周分為八節一節之中分為九道盡七十二道而復使日月二軌無所隱其斜正之勢焉九道之法可謂明矣星之行也遠日而遲近日而速去日極逺勢盡而留自古諸厯分段失實隂陽無准今日行分尚多次日便留自留而退唯用平行仍以入段行度為入厯之數皆非本理遂至乖戾今較定逐日行分積逐日行分以為變段於是自疾而漸遲勢盡而留自留而行亦積微而後多别立諸段變厯以推變差俾諸段變差際㑹相合星之遲疾可得而知之矣自古相傳皆謂去交十五度以下則日月有蝕殊不知日月之相掩與暗虛之相射其理有異焉今以日月徑度之大小校去交之逺近以黃道之斜正天勢之升降度仰視旁視之分數則交虧得其實矣乃以一篇步日一篇步月一篇步星以卦候沒滅為之下篇都四篇為厯經一卷厯十一卷草三卷顯德三年七政細行厯一卷臣檢討先代圖籍今古厯書皆無蝕神首尾之文蓋天竺胡僧之妖說也近自司天卜祝小術不能舉其大體遂為等接之法蓋從假用以求徑捷于是乎交有逆行之數後學者不能詳知便言厯有九曜以為注厯之常式今並削而去之昔在唐堯欽若昊天陛下親降聖謨考厯象日月星辰唐堯之道也其厯謹以顯德欽天為名天道元逺非微臣之所盡知但竭兩端以奉明詔踈略乖謬甘俟罪戾世宗覽之親為製序仍付司天監行用以來年正旦為始自前諸厯皆廢渾天儀後唐清泰三年十一月遣司天少監趙仁錡往汴州取渾天儀先是梁朝曽造自梁亡留在汴州故司天監何果奏取竟以舊渾天儀損折不能施用漏刻晉天福三年二月司天臺奏臣等准漏刻經云漏刻之制起自軒轅所以上揆天時下著人事是故日行有南北晷漏有長短以黃道去極之度而求漏刻自移之變夫中星晝夜一百刻分為十二時每時有八刻三分之一假令符天以六十分為一刻一時有八刻二十分四刻十分為正前十分四刻為正後二十分為中必為時正上古已來皆依此法自唐室將季黃巢犯京既失舊經漏刻無准伏以見行漏刻自午初四刻元稱巳時已入未時猶打午正若不改更終成錯誤今欲每時初打一刻至四刻後正時正牌打八刻終一時後一時却從初起即上同往古下驗將來奉敕宜依令本司集寮屬討定奏聞者臣等據諸家厯數及太霄論漏刻等經皆以晝夜時百刻分為十二時每時有八刻三分之一凡一時以打一刻起于時初八刻終于時正近取到水稱較驗方知見行漏刻差誤假令以午時為例從午時五刻上行作午時一刻浸至未時四刻始滿八刻方終午時此則午未兩時中各取半合為一時也自日出後至日入以來時刻皆如此例相侵伏乞改正從時初打一刻至四刻後進正牌八刻終為一時後時却從初起時辰自正晷漏無差從之地震後唐莊宗同光二年十一月鎮州地震三年十一月二十五日魏府徐泗地大震明宗天成二年七月鄭州地大震殺二人長興二年六月太原地震自二十五日未時至二十七日申時二十餘度左補闕李祥上疏曰臣聞天地之道以簡易示人鬼神之情以禍福為務王者祥瑞至而不喜灾異見而必驚罔不寅畏上元思答天譴臣聞北京地震日數稍多臣曽覽國書伏見髙宗時晉州地震時侍中張行成奏曰天陽也地隂也君陽象臣隂象君宜轉運臣宜安靜今晉州地震彌旬不休將恐女謁用事臣下隂謀且晉州是陛下本封今地震為尤彰其應伏願深思逺慮以杜未萌又開元中泰州地震又差官宣慰兼降使致祭山川所損之家委量事制宜奏聞伏惟陛下中興唐祚起自晉陽地數震于帝鄉理合思于天誡况聖明御宇于今六年嵗稔時康人安俗阜臣慮陛下忘創業艱難之時有成功矜滿之意伏望特委親信兼選勛賢且往北京安慰密令巡察問黎民之疾苦嚴山川之祭祀然後鑒前朝得失之本探歷代聖哲之規崇不諱之風罷不急之務上深嘉之賜以四品之章服日蝕梁太祖一開平五年正月丙戌朔太史言案前史漢髙祖末年日蝕于嵗首上甚惡之於是素服避正殿命百官各守本司降敕赦宥罪以答天譴少帝一龍德三年十月辛未朔日蝕後唐莊宗一同光二年四月癸亥朔日司天奏日蝕在卯主嵗大旱明宗五天成元年八月乙酉朔二年八月乙卯朔三年五月丁丑朔其日隂雲不見百官稱賀長興元年六月癸己朔其日隂冥不見至夕大雨二年十一月甲申朔先是司天計朔日合食二分伏緣所食微少太陽光影相鑠伏恐不辨虧缺其日不入閣百官不守司從之晉髙祖四天福二年正月乙卯朔先是司天奏正月二日太陽虧蝕宜避正殿開諸門蓋藏兵器是日太陽虧十分內蝕三分在危室十七度日出東方已帶蝕三分漸生至卯時復滿三年正月戊申朔司天先奏其日日蝕至日不蝕內外稱賀四年七月庚子朔中書門下奏謹案舊禮日有變天子素服避殿太史以所司救日于社陳五兵五鼓五麾東㦸南矛西弩北楯中央置鼓服從其位百職廢務素服守司重列于廷每等異位向日而立明復而止今所司法物咸不能具去嵗正旦日蝕惟謹藏兵仗皇帝避正殿素服百官守司今且欲依舊禮施行從之七年四月甲寅朔是日百官守司太陽不食上表稱賀少帝四天福八年四月戊中朔開運元年九月庚午朔二年八月甲子朔三年二月壬戌朔漢隱帝三乾祐元年六月戊寅朔二年六月癸酉朔三年十一月甲子朔周太祖一廣順二年四月丙戌朔月蝕梁太祖一開平四年十一月十四日夜先是司天奏是日月蝕不宜用兵時王景仁方總大軍北伐追之不及至五年正月二日果為唐莊宗大敗于柏鄉後唐莊宗二同光三年五月戊申其年九月甲辰明宗三天成三年十二月乙卯四年六月癸丑望其年十二月庚戌少帝二開運元年三月戊子其年六月丙戊蝕漢髙祖一天福十二年十二月乙未周世宗二顯德三年正月戊申五年十一月辛未彗孛梁乾化二年四月甲戌夜彗見于靈臺之西五月以彗星謫見降赦宥罪以答天譴後唐天成三年十月庚午夕西南有孛長丈餘東南指在宿五度三夕不見清泰三年九月己丑彗出虛危長尺餘形細微經天壘哭星其年十一月廢帝遇難于洛陽晉髙祖登極晉天福六年九月有彗星見丈餘安重榮建謀舉兵向闕敗于宗城縣八年十月庚戌夜有彗星見于東方西指尾長一丈在角九度其年十二月青州楊光逺叛命周顯德三年正月壬戌夜有星孛于參宿其芒指于東南五代㑹要卷十
