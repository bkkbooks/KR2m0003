body:
  text: 五代㑹要卷二十一宋王溥撰選事下後唐天成三年正月十七日吏部格式司申當司先准敕及堂帖指揮應焚毁告身勘同及墜失文書等請重給告身仍先檢敕甲如無敕甲即取同敕甲告身勘驗同即與出給若是本朝授官及同光元年後授官勘驗同即與告身如是僞朝授官勘驗不虛亦與出給公憑便同告身例處分者伏以再給文書實為難重有司考驗務在周防當司近曽申堂請出給告身公驗旋具選人出身歷任行止牒甲庫永為證明奉判申其所進取到選人授官敕甲或同敕甲告身勘驗既同須准前指揮出給見有敕甲者便須注出給事由年月日若不批注慮恐選人却為失墜告身參選刺檢敕甲文書浩大所司難為一一考驗如是引驗同敕甲人告身出給又慮他後却將前來失墜告身赴選甲庫無憑應驗其同敕甲人告身欲於後面粘紙亦須使印批注仍牒報南曹以憑將來檢勘者仍令具出給告身公驗聞奏其年五月敕先准同光二年十二月敕北京及河北諸道攝官內有御署一任簡牒分明前銜先有正官告身者便與據正官資叙依資授一任官其無正官告赤者與黃衣初任官與兩任以上簡牒分明兼有正官告赤者特與超資授一任官其無正官告赤亦只有兩任三任簡牒者與據從黃衣第二任宜各令取近罷攝任處州府文解任許非時超選者前件攝官等當任使之際共副憂勤及開泰之期豈宜升降凡有先皇帝御署兼朕署攝簡牒每一任同一任官赴任日依資注擬宜令諸道州府知委餘准元敕處分四年五月十五日敕今後應前資州縣官有出身及兩除官可依常調赴選兼有莊宗並朕御署亦准近敕赴選其一任除官未入選調若無定制難以進身宜約所守官資序髙卑許令同有出身人合格年限求官赴京日仍須本道申送其解由考牒罷任年月分明别與除第二任官兩除後便准常調選人例如藉才升擢不在此限長興元年五月敕應除授州縣官引見磨勘須台命官三員為保然後奏擬於告身內豎保官名銜據本官所通三代並出身無出身歷任告赤逐任考數若是本朝及僞朝所授者祇於將來新告身內一一收竪如告赤文書自中興以來或有失墜即須於失處州縣投狀具三代名諱及出身歷任請公憑赴京勘㑹甲庫同即重與出給如或公然拆破印縫不計與人不與人將來事並合焚毁其本人當行極典自兹凡授新命並依此例施行其見內外文武朝臣及諸司職守諸州府判官并軍州職員有曽改名所授本朝及僞署官告敕牒歷任文書亦須送納入官祇以中興以來文書叙理其見任州縣及諸色前資官等所有歷任文書亦仰速便送納委所司照勘無違礙則准前收竪給與公憑聽來求事參選其秦王茂正墨制官員並須得本道覆驗具歷職申奏所司㸃勘不虛亦給與公憑將來降資授官仍限一周年內改正其興元已西曹受僞蜀爵命緣地里遙逺許敕到後一周年為限仍各於本罷任處州府投狀具三代名諱出身歷任一一分析申奏到日㸃勘准前指揮如出限外縱有申送文書並不叙理兼諸道亦不得以此身名奏薦如違罪在本判官其本人别加嚴斷二年正月敕吏部南曹奏前齊州臨邑縣令趙謹一作禋等十人納到歷任文書合給公憑者其公憑仰所司以綾紙修寫取本行尚書侍郎列署出給者候將來赴選依此重給其年五月二十六日中書奏吏部南曹狀申准敕換給諸色官員告身公憑伏緣㸃檢選人歷任文書中其間多有違礙事節若旋具姓名申覆竊恐人數繁多互有陳論遂成壅滯當曹不敢施行者中書據南曹所申逐件條流如後一據申選人納到今任文書多於解由及厯子內批書考第准天成四年四月二十一日敕新格已前即許施行自新格已後多有解由厯子內批竪考數本處元不給到考牒格前特許施行甚為優假格後更聞違越須重條流今日已前有此色選人宜且與收竪此後選人如有解由及批得厯子無考牒者殿一選有批得厯子無解由考牒殿兩選如祇有解由考牒不批得厯子殿三選如無前項三件文書并同有過停官一據申諸色選新格下後批厯子後時及五年者不在磨勘之限今有格前罷任及新格下後罷任者格下經六年七年方批入仕厯子或有全不批厯子祇給到公憑今日已前有如此者特與磨勘施行此後才罷任一月內須批給得解由厯子違過一月殿一選過三月不批給得者亦同有過停官一據申應諸色承出身及童子及第例是擡年限一作陷嵗兼幼補身名引驗之時多有差異者今日以前有此色人並須引驗辨認及召保官委是正身别無妄謬則與改正詣實年幾施行此後更有此色身名並同謬濫處分一據申河北諸色官員納到告赤文書例稱本據元不較考祇有解由河東河北及鳳翔已西不如選格須明告諭仍令吏部南曹各寫一本解由厯子考牒解狀式樣遍下處此後並須文書周備如今後公然違犯並准前殿選今日已前不在此例一據申諸色前資官員告身今任入厯厯子或批到上任月日或是有名假故多無觀察使及刺史具銜押署祇有録事參軍批署者選處長吏自此後並須依格文押署違者本人殿兩選其今日已前違程式者宜特與磨勘收豎一據申諸色官員厯官兩任至五任文書備足內有一任至兩任失墜前任解由或考牒厯子又無公憑及稱元不給得既别有公據自此後祇認中興以來所授告身為定其已前或有厯任稱失墜如是𫝊受他人有人糾告其所司㸃勘彰露並准纍行敕命科罪今日已前失墜考牒解由厯子如有公憑者亦與收竪如無公憑將來選時特降資注官自此後選人更有失墜則須却於本處具所失因由重具批給如違准前殿選一據申選人有今任文書備足秖厯子內批到上任月日不批得替罷任月日即别有解由或公據文書證據分明今日已前並准前項指揮收竪此後更有此色人並同有過停官右奉敕宜依吏部南曹其此分明曉諭及遍下諸道州府應是選人各令知悉如守官滿日未給得解由厯子等文書隨等不得便令辭謝如逐處州府輒有邀難不便須至出給罪在本判官並録事參軍其年九月敕應進䇿人等若是選人所進內一事可行與減兩選兩事減四選三事已上依資與官如無選可減及所缺選數則少可行事多件則據等第更優豫恩奬其諸色舉人不在進䇿之限四年二月中書門下奏諸道州府縣官甚有闕員前資官皆資考限所宜振滯以示推恩若缺一選者無選可減親公事成資考者宜優與恩命未有資考者准格施行兩選三選者減一選四選五選者減兩選六選七選者減三選八選九選者減四選十選十一選者減五選十二選減六選千牛進馬童子齊郎等即宜准元和格處分逾年後竟以選人煩多喧訛相接乃追罷此敕四年五月中書奏准長興元年二月二十一日南郊赦書准長定格應經學出身又在任日雪得寃獄許非時參選超資注官仍賜章服今詳敕允平寃獄者所司推鞫定罪不平回曲作直已成案牘或經長吏慮問或是家訴寃重經推訊始見情實回死為生始名雪寃仍須元推官與招伏情罪平處檢案牘事即給與公據便為考牒內豎出候本官滿日便准近敕非時參選若活得一人超一資注官二人已上加章服已有章服加檢校官如在任除寃雪獄外限內徴科了絶減得一選已上或招添户口以上並許酬奬如加至三品以上許奏聽敕旨如雖雪得寃獄徴科違限合殿選者亦待殿選滿月與叙雪寃之賞或逃却户口亦降等叙官如本司小小刑獄未經别司縱能處斷不得援例從之應順元年閏正月中書門下奏准天成二年十二月敕節文准長定格應經學出身一任三考許入下縣令下州録事參軍亦入中州録事參軍兩任四考許入中下縣令中州録事參軍兩任六考許入上縣令緊州録事參軍凡為進取皆有緣因或少年便受好官或暮齒不離卑任況孤舉平士或年四十始得經學及第八年赴調方得一官於一任之中多不成三考再來赴選年已蹉跎有一生不至令録者若不改革何以發揚自此經學出身請一任兩考許入中下縣令州録事參軍敕其經學出身一任兩考元敕入中下縣令下州録事參軍今後更許入中縣令中州下州録事參軍一任三考者於人户多處州縣注擬如於近敕內資叙無相當者即准格循資考入官其兩任四考者准二任五考例入官餘准格條處分晉天福二年四月敕今後諸州前資官州縣等官若是資考已出選門及一任除官未入選門並一考前丁憂及活得寃獄准元敕年限滿日許經中書陳狀當與檢看專理施行此外須令並依前後敕格程限赴吏部參選或有公材異績臨時賞擢不在此限其年九月吏部銓奏奉長興四年二一作五月敕應諸州府馬步判官令於前資簿尉判司正官中選差近日不多遵守今後須於前資正官中任使若滿二周年無遺缺者與減二選仍委本府給與公憑如缺三選已下者仍便給與文解赴選所有自前差攝官充馬步判官已二年無遺缺者亦令本州府給與公憑仍便申奏更四年後給與文解赴選比擬初官過一周年者敕到後宜令本州府别差前正官充替清泰二年三月二十四日敕停廢前資攝正官充馬步判官其敕已封鎖不行敕清泰二年三月已前諸州府所差馬步判官有敕績者宜准元敕赴吏部參選不得於中書陳狀二年十二月敕唐長興二年四月五日節文應州縣官才授新命及到任一考前丁憂服闋日並與除官者此後應一考前丁憂州縣官等服闋後准格赴選不得於中書陳乞開運三年四月吏部侍郎王易簡奏伏見禮部貢院逐年先書板榜高立省門用示舉人俾知狀樣臣欲請選人文解條例各下諸州知委南曹詳定解樣廉備録長定格取解條例各下諸州如禮部貢院板樣書寫立在州院門每遇選人取解之時各准條件遵行仍依板樣給解從之周廣順元年二月吏部三銓奏去年冬南曹判成選人三百八十一人經十一月二十二日兵火散失磨勘了厯任文字或有送納文書未抄及取到南曹失墜公憑銓司若依格例磨勘恐選人訴論今欲祇舉南曹給到失墜公憑便與施行從之其年五月中書門下奏據司勳郎中許懸申權主判吏部格式選人皆稱直去年十一月內失墜告牒雖尋舊式有例檢行竊緣官員上任日祇憑告赤簽符罷秩之時即藉解由厯子既失官牒得以檢其敕甲若無解由難知真僞今後請若無解由厯子考牒者候牒本道州府勘尋有何殿最候回文與陳狀官員事理同即依牒申銓取保再給憑由從之三年五月敕應前後出選門州縣官內有十六考叙朝散大夫階次敕令並厯任中曽升朝及兩使判官五府少尹罷任後一周年與除官曽任兩藩營田判官書記支使防禦團練判官罷任後一周年與除官並許經中書陳狀選期既近不得依常選人例更理減選仍須批書厯子請給解由若是逃失户口降書考第及顯有過犯必行殿降應諸色人過犯三選已上及未成功開宿引納家狀慮成淹滯今後才南曹鎖宿後先榜示選人預納家狀其合保文狀使識官司使印限開曹後兩日內赴銓送納須得齊足如限內不納到家狀保狀試紙人便具姓名落下不在續納之限據納到文狀至十月二十二日已前鎖銓先准格例鎖銓後便榜示引驗正身告赤文書三引共九日如三度引不至者便落下銓司今後鎖銓日便牒示選人至次日引驗正身及告赤文書限三日內三引畢如不到者便落下每年南曹判成選人中多有托故不赴銓引銓司准格例伺候須及三引計九日不至者方始落下今後有此色人逐引不到便據姓名落下先准格諸色人三引畢後齎使印保狀赴銓并合保後今録重引驗合保審其材術者銓司於三引後次日重內引驗令録審其才術及合保如限內不至者據姓名落下銓司引驗後本行准格敕及將銓狀歷任告赤文書限三日內㸃檢無違礙具姓名開報試判注擬所有選人歷任省於未注官已前寫帖送過院選人所合注使員缺鎖銓後便具狀申中書門下乞降指揮應人試判今欲鎖銓內預准敕於中書省請印到逐人試紙候㸃檢畢開報名銜齊足此日便定日試判三場逐場次日申奏後限兩日內供納宣黃次日乞降可否敕命銓司自前注擬諸色選人准格三注每一注內有不伏官者限三日內具狀通退三注共九日者銓司自今後第一第二注榜出後各限次日內具通官文狀便具姓名落下第三注畢日開銓不在開通官之限三注共五日准格銓司逐年二月二十五日送門下省畢三月十五日過官資考丁憂課績無選可減者宜令自於吏部南曹投狀准格磨勘無違礙申送中書門下並與除官其州縣官恐虧損年限資序願歸選門者亦聽自便如曽任推巡軍事判官并諸出選門官並據現任選數叙理取解由赴集依格敕磨勘送中書門下於銓司注擬前先次除官所有諸色尚選人今後不得妄有陳乞及不伏格敕理論功課如違當行舉勘若特恩除受擢才委任不拘此例選限周顯德五年正月十日敕諸道幕府州縣起今日正月一日後所授官並以三周年為限閏月不在其內其每年常調選人及諸色求任人取十月一日以前到京下納文解及陳乞文狀委所司依舊例磨勘注受至十二月上旬中並了畢便令赴官限二月終已前到任若違程本處不得放上且舊官在任如是無故違程依格殿選其有故違程者須分明出給得所在憑由許至前冬赴集今年赴任者不在此限其特敕除授及隨幕判官赴任不拘日限應授官人至滿日替人未到間宜且令守本官至張公事依舊請俸州縣亦不得差置攝官替下如是遭喪停任身故假滿非時缺官之時祇可差前資正官及前有出身人承攝如逐處無正官及有出身人即選請疆官承攝仍依正官例支與俸錢具名聞奏其年閏七月吏部流內銓狀申見行條件公事銓司先准格例南曹十一月未開宿判成選人後先具都數申銓銓司舉狀便榜示選人引納京諸司官使印家狀及試判紙三度榜引得齊足方至十二月上旬內定日鎖銓者銓司若候南曹一月內畢三月三十日進黃移省畢三擬畢後省申案便於格式司逐旋覆闕入官過院修寫省厯至十月十四日已前牒送門下省畢銓司門下省押定牒到取兩日祗候取判過堂次日乞降可否堂帖其黃甲限四日內修寫勾勘印署至十二月六日牒送門下省至十二月九日進黃畢所有衙謝對敡在格限內應行內諸司公事或有干繫申銓取裁銓司便准敕格指揮如銓司難議裁酌即申堂取裁五代㑹要卷二十一
