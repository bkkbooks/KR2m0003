body:
  text: 五代會要卷一宋王溥撰帝號梁太祖神武元聖孝皇帝姓朱氏諱晃追册文穆皇帝第三子母曰文惠皇后王氏唐大中六年十月二十一日生於單州碭山縣以其日為太明節天復元年正月封梁王天祐二年十一月加相國總百揆改封魏王備九錫四年四月十八日受唐禪即位於東都金祥殿改名晃年五十六初名溫又賜名全忠梁開平三年正月上尊號曰睿文聖武廣孝皇帝乾化二年六月五日為其子郢王友圭所弒崩於大內之寢殿年六十一其年十一月十日葬宣陵在洛京伊闕縣諡曰神武元聖孝皇帝廟號太祖哀册文中書侍郎平章事杜曉撰諡册文門下侍郎平章事趙光逢撰諡議太常卿李燕撰年號二開平盡四年乾化盡二年宰相八人韓文建張蔚楊張涉策薛貽矩趙光逢于杜兢曉使相二十七人錢馬鏐殷劉景隱王仁符道昭牛存節馬成賔汭葉廣略張歸霸龎巨昭髙萬興楊師厚張全義李王瓊檀王知鎔劉俊羅紹威李思諫王重師劉守光馮行襲劉守文張仁佶李福髙季昌末帝諱瑱太祖第四子母曰元正皇后張氏唐文德元年九月十二日生於汴州以其日為明聖節梁開平元年封均王乾化三年二月十七日侍衛都將袁象先率禁兵殺郢王於洛京帝即位於汴州改名瑱年二十六初名友正後又改名鍠龍德三年十月八日唐兵入汴州為控鶴將皇甫麟弒於建國樓之廊下年三十六後唐同光元年十月追降為庶人莊宗入汴州詔張全義收罪人首骨藏於大社至晉天福二年安崇阮收葬之年號三自乾化三年至五年改正明正明六年改龍德龍德盡三年宰相八人姚光洎趙逄于鄭兢珏楊蕭涉頃敬李翔琪使相三十一人錢馬鏐竇馬廣殷葉略張全義龎巨昭楊師厚朱友謙牛存莭劉鄩王季檀髙興劉審巖王知張歸霸溫韜髙萬興葛從周賀德倫李繼韜錢傅璟馬綽賀建瓌杜徽孔象勍袁先張萬進李仁福尹懷皓康英韓洙後唐莊宗光聖神閔孝皇帝姓李氏諱存朂追册武皇帝長子母曰正簡皇后曹氏唐光啓元年十二月二十二日生於晉陽宫以其日為萬夀節天祐五年正月嗣晉王位二十年四月二十五日即位於魏州武德殿年三十九同光元年十月平偽梁二年四月上尊號曰昭文睿武至德光孝皇帝四年四月一日京城軍亂崩於絳霄殿之廊下年四十二天成元年七月二十二日葬雍陵在洛京新安縣至晉天福二年正月以犯廟諱改為伊陵諡曰光聖神閔孝皇帝廟號莊宗哀册文中書侍郎平章事韋説撰諡册文門下侍郎平撰章事豆盧革諡議太常卿崔協撰年號一同光盡二年宰相五人豆盧革郭崇韜韋光説趙允盧程使相三十二人李茂正錢鏐馬元殷錢璙張全義錢元球王審知馬希振髙萬興李仁福馬李存髙興馬韓賔洙朱友謙溫韜丁令會朱德李存曮符審孔王繼勍魏岌袁象先李存渥符存習李璋李存霸元行欽郭崇韜夏魯竒孟知祥錢元瓉明宗聖德和武欽孝皇帝追册孝成皇帝長子母曰追册懿皇后劉氏唐咸通八年九月九日生於代北金鳯殿以其日為應聖節同光元年十一月授番漢馬部總管四年四月即位於西宫改名亶年六十初名嗣源長興元年四月上尊號曰聖明神武文德恭孝皇帝其年十一月再上尊號曰聖明神武廣道法天文德恭孝皇帝其年十一月二十六日崩於大內之雍和殿年六十七清泰元年四月二十七日葬徽陵在洛京洛陽縣諡曰聖德和武欽孝皇帝廟號明宗哀册文左僕射平章事李愚撰諡册文吏部尚書平章事劉煦撰諡議太常卿盧文紀撰年號二天成盡四年長興盡二年宰相十人豆盧革馮道韋崔説協鄭建珏王立任趙圜鳯李劉愚昫使相三十八人孟知祥希李仁福守李竇馬振來殷曮元馬安信毛德璋趙鈞符孔習勍霍彥威髙季興安金全錢元璙夏魯竒魯文錢元球安重誨孔趙循鳳房知溫趙廷翰王建立馬希範王從都王延稟髙誨馮贇范延光馬希果姚元素錢元璹康義誠張虔釗朱𢎞昭張延朗閔帝諱從厚明宗第三子母曰昭懿皇后夏氏唐天祐十一年十一月二十八日生於晉陽未有節名長興元年八月封宋王四年十二月一日自魏府入纘皇統即位於柩前年二十一應順元年四月七日廢為鄂王其月九日遇弒於衛州年二十二晉天福元年十二月追諡曰閔帝葬徽陵之封中年號一應順盡元年宰相三人馮愚道劉李昫使相二十三人王思同安元信房知溫馬希果馬希振王建立馬希範范趙光李從曮夀髙從誨趙德鈞錢元球馮虔贇張釗安彥威姚彥章盧文進張延朗康義誠錢元璙朱宏昭末帝諱從珂本姓王氏明宗養為子母曰宣憲皇后魏氏唐光啓元年正月二十三日生於鎮州平山縣之外舍以其日為千秋節長興四年正月封潞王應順元年四月三日自鳯翔入纘皇統六月赴西宫即位於柩前年五十清泰三年閏十一月二十九日遇難崩於後樓年五十二晉天福元年十二月追降為庶人葬徽陵之封中年號一清泰盡二年宰相六人李愚劉昫盧文紀韓昭胤姚胤顗馬孫使相二十二人安元信馬希杲趙在禮盧文進張延朗王建立房知禮馬希振馮彥道姚章范延光馬存李從曮韓昭胤趙德鈞李周鮑君福髙從誨錢元璙錢元球馬希範錢元璹晉髙祖聖文章武明德孝皇帝姓石氏諱敬瑭追册孝元皇帝第二子母追册懿皇后唐景福元年二月二十八日生於太原汾陽里以其日為天和節長興三年十一月授北京留守兼大同振武威塞彰國馬步總管清泰三年閏十一月十二日築壇即位於太原府城之南年四十五其月二十六日至洛陽二十九日受朝於文明殿晉天福三年十月五日契丹遣使上尊號曰英武明義皇帝七年六月十三日崩於鄴都大內之保昌殿年五十一其年十月十日葬顯陵在洛京夀安縣內諡曰聖文章武明德孝皇帝廟號髙祖哀册文中書侍郎平章事和凝撰諡册文中書侍郎平章事和凝撰諡議太常卿崔協撰年號一天福盡七年宰相五人馮翰道李趙嵩瑩和桑維凝使相二十二人馬希範高行周王建立李從溫范延光趙在禮李從周安進李從曮杜重威侯德益李珫楊光逺杜仁塗安審琦桑維翰安彥威鮑君福馬希杲安叔千劉景巗馬全節少帝諱重貴髙宗從子父敬儒母太妃安氏唐天祐十一年六月二十七日生於太原汾陽里以其日為啓聖節天福三年十二月授開封尹封鄭王六年十一月授廣晉尹封齊王七年六月十三日即位於柩前年二十九開運二年十二月契丹犯闕明年正月降封負義侯其月舉族遷於契丹之黃龍府年三十四年號二天福自七年至九年改開運開運盡三年宰相六人馮趙道瑩桑維翰和凝李馮嵩玉使相二十八人髙從誨錢宏佐馬希範王曦朱文進李周李守正景延廣石維贇桑翰楊從逺杜重威張光安叔千李從溫馮道趙德瑩李珫李彝殷安審琦符彥卿皇甫遇馬全節安審信髙行周趙在禮劉景巗漢髙祖睿文聖武昭肅孝皇帝姓劉氏諱皓追册章聖皇帝長子丹追册章懿皇后安氏唐乾寧二年二月四日生於太原以其口為夀節晉天福六年七月授北京留守開運三年四月封北平王四年二月十五日受册於太原府第其年六月十一日至東京受朝於崇元殿改名皓年五十二初名知逺乾祐元年正月二十七日崩於大內萬夀殿年五十四其年十一月二十七日葬睿陵在洛京都城縣諡曰睿聖文武昭肅孝皇帝廟號髙祖哀册文右僕射平章事蘇禹圭撰諡册文右僕射平章事蘇禹圭傳諡議太常卿張昭撰年號一乾祐盡元年宰相四人竇貞固蘇逢吉蘇禹圭李濤使相二十人髙從誨髙行周馬希廣劉信錢宏倧李守正杜重威符彥卿安審琦史宏肇侯容彥益慕超劉叔崇安千李從敏李彝殷劉王銖周白文珂馮暉隱帝諱承祐髙祖第二子母曰皇后李氏長興二年三月九日生於太原以其日為嘉慶節乾祐元年二月一日封周王其日即位於柩前年十八三年十二月二十一日為左右郭允明弒於京北之趙村年二十周廣順元年五月追諡曰隱帝其年八月十二日葬潁陵在許州陽翟縣年號一乾祐盡三年宰相五人竇貞固李濤蘇逄吉楊邠蘇禹圭使相三十三人髙從誨馬希廣錢宏俶馮暉錢宏倧超髙保融慕容彥侯益髙行周李從敏李守正劉崇符彥卿劉銖白文珂王景史宏肇武行德劉侯信章安審琦王晏李彝殷張彥威常思王章趙匡暉史懿髙允權王守恩郭從義孫方諌劉贇周太祖聖神恭肅文武孝皇帝姓郭氏諱威追册章肅皇帝長子母追册章德皇后王氏唐天祐元年七月二十八日生於邢州堯山之舊宅以其日為永夀節漢乾祐三年四月授鄴都留守兼樞密使其年十二月二十七日監國廣順元年正月五日即位於崇元殿年四十八顯德元年正月一日上尊號曰聖明文武仁德皇帝其月十七日崩於大內之滋德殿年五十一其年四月十二日葬嵩陵在鄭州新鄭縣諡曰聖神恭肅文武孝皇帝廟號太祖哀册文中書侍郎平章事王溥撰諡册文右僕射平章事李榖撰諡議太常卿田敏撰年號二廣順盡二年顯德盡元年宰相七人馮范道質竇貞固李榖蘇禹圭王溥王峻使相四十二人髙保融馮暉錢宏俶王峻髙行周李宏義安審琦白文珂符彥彥卿慕容超李彝殷趙暉缺侯章侯匡益史懿武行德李從敏王懷晏薛讓張彥威王繼宏常王思景郭從義劉訓孫方諌郭勳王守恩楊信李福暉何進扈彥珂李洪信折從阮劉言郭曹崇英李彥筠王超鄭仁誨王逵世宗睿武孝文皇帝諱榮太祖養子姓柴氏追册聖穆皇后之姪也唐天祐十八年九月二十四日生於邢州之别墅以其日為天清節廣順三年三月授開封尹封晉王顯德元年正月判內外兵馬事其月二十日即位於柩前年三十四六年六月十九日崩於大內之萬歲殿年三十九其年十一月一日葬慶陵在鄭州管城縣諡曰睿武孝文皇帝廟號世宗哀册文禮部尚書平章事王溥撰諡册文中書侍郎平章事魏仁浦撰諡議翰林學士中書舍撰人判太常寺竇儼年號一元稱顯德盡六年宰相五人范景質範李仁榖魏浦王漙使相三十五人髙保融安審琦錢宏俶符彥卿王文饒白珂李彝殷李宏義趙從暉郭義武行德王守晏孫方諌王恩侯李章暉王繼宏扈彥珂王從景折阮劉訓郭崇郭彥勳李宏信王超李筠楊王信逵鄭仁誨周行逢曹重英李進向永訓張德韓通大將六人今上通韓李重進韓令坤張永德袁彥恭帝諱宗訓世宗後宫所生廣順三年八月四日生於澶州以其日為天夀節顯德六年六月封梁王其月九日即位於柩前年七嵗七年正月禪位於宋其年降封鄭王年八嵗宋開寶六年春崩於房陵其月十日追諡恭帝葬順陵在世宗慶陵之側年號一依舊稱顯德宰相三人范仁質魏浦王溥使相二十人髙保融郭從義錢宏俶向拱符彥卿李宏信武行德郭崇王彥晏王超王李景筠李重進韓通李彝殷張永德周行逄李宏義楊侯信章大將七人今上鐸張李重進石守信韓懷通髙德韓令坤雜録唐清泰元年四月羣臣議明宗諡於南郊太常卿盧文紀請諡曰聖智仁德欽孝皇帝廟號明宗宰臣馮道議曰按諡法發號出令能悅民曰和克定禍亂曰武大行皇帝道契天和功定神武請改聖智仁德四字為聖德和武餘依太常所議從之晉天福六年八月中書門下奏山陵禮儀使狀髙祖尊號諡及廟號伏凖故事將啓殯宫前擇日命太尉率百寮奉諡册告天於圜丘畢奉諡册跪讀於靈前此纍朝之制蓋以天命尊極不可稽留今所上髙祖聖文章武明德孝皇帝尊諡寶册伏緣去洛京地逺寶册難以往來當司詳酌復請祇差官往洛京告奏南郊太廟其日中書門下文武百官立班中書令侍中升靈坐前讀册寶行告諡之禮今從欲牒所司擇日申請官貟行事復請奏聞宣下者追諡皇帝梁肅祖宣元皇帝諱黯舜司徒虎四十二代孫開平元年七月追尊宣元皇帝廟號肅祖葬興極陵在單州碭山縣敬祖光獻皇帝諱茂林宣元皇帝長子母曰宣僖皇后范氏開平元年七月追尊光獻皇帝廟號敬祖葬永安陵在單州碭山縣憲祖昭武皇帝諱信光獻皇帝長子母曰光孝皇后楊氏開平元年七月追尊昭武皇帝廟號憲祖葬光天陵在單州碭山縣烈祖文穆皇帝諱誠昭武皇帝長子母曰昭懿皇后劉氏開平元年七月追尊文穆皇帝廟號烈祖葬咸寧陵在單州碭山縣右已上梁朝追尊四廟後唐懿祖昭烈皇帝諱執宜沙陀府都督拔野之六代孫同光元年閏四月追尊昭烈皇帝廟號懿祖葬永興陵在代州鴈門縣獻祖文皇帝諱國昌昭烈皇帝長子母曰昭烈皇后崔氏同光元年閏四月追尊文皇帝廟號獻祖葬長寧陵在代州鴈門縣太祖武皇帝諱克用文皇帝第一子母曰文景皇后秦氏同光元年閏四月追尊武皇帝廟號太祖葬建極陵右已上後唐莊宗朝追尊三廟按實録並唐髙祖太宗懿宗昭宗共立七廟惠祖孝恭皇帝諱聿天成二年十二月追尊孝恭皇帝廟號惠祖葬遂陵在應州金城縣毅祖孝質皇帝諱敖孝恭皇帝長子母曰昭皇后崔氏天成二年十二月追尊孝質皇帝廟號毅祖葬衍陵在應州金城縣烈祖孝靖皇帝諱琰孝質皇帝長子母曰順皇后張氏天成二年十二月追尊孝靖皇帝廟號烈祖葬奕陵在應州金城縣德祖孝成皇帝諱霓孝靖皇帝長子母曰穆皇后何氏天成二年十二月追尊孝成皇帝廟號德祖葬慶陵在應州金城縣右已上後唐明宗朝追尊四廟晉靖祖孝安皇帝諱璟衛大夫碏之後天福二年五月追尊孝安皇帝廟號靖祖葬義陵肅祖孝簡皇帝諱彬孝安皇帝長子母曰元皇后秦氏天福二年五月追尊孝簡皇帝廟號肅祖葬惠陵睿祖孝平皇帝諱昱孝簡皇帝長子母曰恭皇后安氏天福二年五月追尊孝平皇帝廟號睿祖葬康陵憲祖孝元皇帝諱紹雍孝平皇帝長子母曰獻皇后來氏天福二年五月追尊孝元皇帝廟號憲祖葬昌陵在北京晉陽縣右已上晉朝追尊四廟漢文祖明元皇帝諱湍東漢顯宗第八子淮陽王昞之後天福十二年閏七月追尊明元皇帝廟號文祖葬懿陵無陵所遙申朝拜德祖恭禧皇帝諱昴明元皇帝長子母曰明皇后李氏天福十二年閏七月追尊恭禧皇帝廟號德祖葬沛陵無陵所遙申朝拜翼祖昭獻皇帝諱僎恭禧皇帝長子母曰恭惠皇后楊氏天福十二年閏七月追尊昭獻皇帝廟號翼祖葬威陵北京晉陽縣是其所顯祖章聖皇帝諱琠昭獻皇帝長子母曰昭穆皇后李氏天福十二年閏七月追尊章聖皇帝廟號顯祖葬肅陵右已上漢朝追尊四廟周信祖睿和皇帝諱璟周虢叔之後廣順元年七月追尊睿和皇帝廟號信祖葬溫陵無陵所遙申朝拜僖祖明憲皇帝諱諶睿和皇帝長子母曰睿恭皇后張氏廣順元年七月追尊明憲皇帝廟號僖祖葬齊陵無陵所遙申朝拜義祖翼順皇帝諱藴明憲皇帝長子母曰明孝皇后田氏廣順元年七月追尊翼順皇帝廟號義祖葬節陵無陵所遙申朝拜慶祖章肅皇帝諱簡翼順皇帝長子母曰翼敬皇后韓氏廣順元年七月追尊章肅皇帝廟號慶祖葬欽陵右已上周朝追尊四廟皇后梁太祖皇后張氏早崩開平二年追封賢妃至乾化二年十一月二十三日追册曰元正皇后少帝妃張氏乾化五年九月二十四日册為德妃其夕薨後唐太祖皇后曹氏同光元年四月册為皇太后二年二月敕皇太后所居宫宜名長夀宮至三年七月崩諡曰正簡八月中書門下奏據禮儀使狀準禮及故事太常少卿定諡太常卿署定日告天地宗廟伏準禮文賤不得誄貴子不得爵母后必諡於廟者受成於祖宗今皇太后諡請太常卿署定後集百官連署諡狀訖讀於太祖武皇帝室然後差丞郎一人撰册文别定日命太尉上諡册常於西宫靈座同日差有司告諡於天地太微宫宗廟如告之儀從之至九月中書門下奏大行皇太后諡讀於太廟太祖武皇帝室其日合集兩省御史臺五品以上尚書省四品以上官於太廟序立俟行告禮畢中書班首一人升階詣太祖武皇帝讀諡訖奏聞别擇日上諡册於西宫靈座及奏告天地宗廟從之莊宗皇后劉氏同光二年四月十三日册為皇后莊宗遇內難奔於太原為符彥超所害晉天福五年正月二十八日追諡曰神閔敬皇后明宗皇后夏氏早崩長興四年三月二十八日追諡曰昭懿皇后於太微宫之東建寢廟以安神主皇后曹氏天成三年正月册為淑妃長興元年正月十四日册為皇后應順元年正月册為皇太后至清泰三年又十一月隨末帝崩於後樓晉髙祖使人護葬至晉天福五年正月二十八日追册曰和武顯皇后皇后魏氏初封魯國太夫人清泰二年二月中書門下奏臣聞漢昭帝承祚御厯奉尊諡於雲陽魏明帝繼體守文思外家於甄館而皆追崇徽稱祔饗廟庭克隆敬本之文式叶愛親之道臣等又覽國史竊見玄宗皇帝母曰昭成皇后竇氏代宗皇帝母曰章敬太后吳氏始嬪朱邸俄閟玄宫鴻圖既屬於明君尊號咸追於聖母伏以魯國夫人發祥沙麓貽慶河洲三后最賢周母允承於天統四妃有子唐宫先啓於帝基仰惟當寧之情彌軫寒泉之思久虛殷薦慮損皇猷臣等謹上尊諡曰宣憲皇太后請依昭成皇太后故事擇日備禮册命又臣等伏聞先太后舊陵永祔先祠則都下難崇别業既追尊諡合創閟宫按漢朝故事園寢不在王畿或就陵所更立寢祠今商量上諡後權立廟以申告獻配祔之禮請俟他年從之閔帝皇后孔氏初封魯國夫人應順元年四月為末帝所害晉天福五年正月二十八日追諡哀皇后末帝皇后劉氏清泰元年八月二十八日册為皇后至三年又十一月二十九日與帝遇難同崩于後樓晉髙祖皇后李氏唐明宗第五女天成三年四月封永寧公主長興四年九月進封魏國長公主清泰二年四月改封晉國長公主至天福元年十一月尊為皇后七年六月尊為皇太后開運四年三月與少帝同遷于契丹之黃龍府漢乾祐三年八月二十五日崩于番中之建州少帝皇后張氏天福八年十月追册皇后馮氏開運三年十月册漢髙祖皇后李氏天福十二年四月八日册為皇后至乾祐三年七月册為皇太后周廣順元年正月上尊號曰昭聖皇太后周太祖皇后柴氏漢末遇害顯德四年四月追册曰正惠皇后世宗皇后符氏顯德元年三月册為皇后至三年七月崩追册曰宣懿皇后皇后符氏宣懿皇后之女弟也顯德六年六月册為皇后雜録後唐同光元年四月太常禮院奏準制以此月十三日行皇后册禮今檢詳臨軒命使册皇后舊儀皇后廟見如納后之儀受册後合别定廟見日其日皇后乘重翟車鹵簿鼓吹儀仗前導從之又奏謹按開元禮臨軒册皇后皇后表謝朝皇太后並如納后之儀不載朝謝皇帝之禮準納后儀則皇帝服冕衮降迎於門恐禮太重今詳酌其日常服內御殿皇后首飾褘衣尚衣引入至殿庭階前再拜訖退如常儀從之內職梁太祖昭儀陳氏昭容李氏後唐太祖妃劉氏同光元年四月册為皇太妃魏國夫人陳氏唐乾寧二年册為皇太妃莊宗淑妃韓氏德妃伊氏並同光二年十二月册以宰臣盧革韋説為册使出應天門登輅車鹵簿鼓吹前導至於永福降車入右銀臺門至淑妃宫受册於內文武百官立班稱賀昭儀侯氏封沂國夫人昭容夏氏封虢國夫人昭媛白氏封汧國夫人出使美宣鄧氏封魏國夫人御正楚真張氏封涼國夫人司簿德美周氏封宋國夫人侍直吳氏封延陵郡夫人懿才王氏封太原夫人咸一韓氏封昌黎郡夫人瑶芳張氏封清河郡夫人懿德王氏封太原夫人宣一馬氏封扶風郡夫人並同光二年十一月敕明宗德妃王氏天成三年正月册立長興二年四月進號淑妃應順元年又正月十三日册為太妃至周廣順元年四月追諡賢妃昭儀王氏封齊國夫人昭容葛氏封晉國夫人昭媛劉氏封趙國夫人孫氏封楚國夫人御正張氏封曹國夫人司寶郭氏封魏國夫人司贊于氏封鄭國夫人尚服王氏封衛國司夫人記崔氏封蔡國夫人司膳翟氏封滕國夫人司醞吳氏封莒國夫人媫妤髙氏封渤海郡夫人美人沈氏封太原郡夫人順御朱氏封吳郡夫人司飾聊氏封潁川郡夫人司衣劉氏封彭城郡夫人司藥孟氏封咸陽郡夫人梳箆張氏封清河郡夫人衣服王氏封太原郡夫人梳箆傅氏封潁川郡夫人知客張氏賜號尚書故江氏追封濟陽郡夫人已上皆長興三年九月敕其名號皆中書門下按六典內職倣而行之內人李氏封隴西縣君崔氏封清河縣君李氏封成紀縣君田氏封咸陽縣君白氏封南陽縣君並長興四年二月敕按前代內職皆無封君之禮此一時之制晉髙祖潁川郡夫人蔡氏天福三年八月敕少帝寶省李氏封隴西郡夫人張氏封春宮夫人充皇后宫尚宫並天福八年十一月二日敕前左御正齊國夫人吳氏進封燕國夫人書省魏國夫人崔氏進封梁國夫人前右御正天水郡夫人趙氏封衛國夫人司簿孟氏封汧國夫人前司簿李氏封隴西郡夫人弟子院使齊氏大使郭氏副使賈氏並封本縣君太后宫尚宫陳留郡夫人何氏進封鄭國夫人河南郡夫人元氏進封齊國夫人番知客出使夫人石氏封武威國夫人春宫姚氏常氏焦氏王氏陶氏魏氏趙氏七人並超封郡夫人寶省婉美趙氏封天水郡夫人武氏已下十一人並授春宫天福八年十一月敕清河郡夫人張氏彭城郡夫人劉氏並本宫太后宮司寶南陽郡夫人路氏出使夫人趙氏白氏並充皇后宮司賓開運二年八月敕周太祖貴妃張氏廣順元年二月追册淑妃楊氏廣順元年九月追册德妃董氏廣順元年四月追册尚儀趙氏封汧國夫人尚服蘇氏封岐國夫人尚宫甫氏封汾國夫人司賓髙氏封梁國夫人司賓柴氏封平陽郡夫人司賔茹氏封潁川郡夫人司記丁氏封隴西郡夫人司記劉氏封彭城郡夫人典寶李氏封隴西縣君司寶王氏封琅邪縣君司正李氏封隴西縣君司正王氏封琅邪縣君尚食李氏封隴西縣君尚功曹氏封巨野縣君司衣李氏封隴西縣君司藥林氏封會稽縣君司藥翟氏特封潯陽縣君並廣順元年八月敕出宫人梁開平元年九月敕西宫所有前朝宫人宜放出宫任從所適後唐天成元年四月赦敕後宫內職量留一百人其餘任歸骨肉五代會要卷一
